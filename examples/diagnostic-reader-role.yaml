apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ptah-diagnostic-reader
  namespace: application
rules:
  # Every kind this operator serves. Diagnosis that stops at one family reads
  # half a database's history: the two can share a coordination realm, and the
  # one that refused is not always the one being looked at.
  - apiGroups: ["operator.ptah.run"]
    resources:
      - "ptahschemas"
      - "ptahschemaplans"
      - "ptahschemaapprovals"
      - "ptahmigrations"
      - "ptahmigrationplans"
      - "ptahmigrationapprovals"
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  # Pods, and their logs. A Plan Job's runner seals its plan payload to the
  # manager's own key before writing it, so a Plan Pod's log holds ciphertext,
  # and the runner drops the free-text database error a migration run or a
  # dirty revision carries before it ever reaches the frame. Reading an
  # operation Pod's log is no longer reading a plan or a declared row value;
  # what the controller made of each result is in status, conditions and
  # Events, which this role also reads.
  #
  # Not pods/attach or pods/exec. A live process inside an Observe, Plan or
  # Apply Pod still holds the target database credential in its environment,
  # and attaching or executing into it reaches that credential directly. RBAC
  # cannot grant either to one operation Pod without the others: Pod names are
  # generated per attempt and a rule has no label selector.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ptah-diagnostic-readers
  namespace: application
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ptah-diagnostic-reader
subjects:
  # Replace this placeholder with the on-call group. This role intentionally
  # cannot read Secrets, plan-chunk ConfigMaps or operation Pod logs, and
  # cannot mutate approvals.
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: <diagnostic-reader-group>
