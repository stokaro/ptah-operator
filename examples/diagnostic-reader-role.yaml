apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ptah-diagnostic-reader
  namespace: application
rules:
  # Every kind this operator serves. Diagnosis that stops at one family reads
  # half a database's history: the two can share a coordination realm, and the
  # one that refused is not always the one being looked at.
  - apiGroups: ["operator.ptah.run"]
    resources:
      - "ptahschemas"
      - "ptahschemaplans"
      - "ptahschemaapprovals"
      - "ptahmigrations"
      - "ptahmigrationplans"
      - "ptahmigrationapprovals"
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  # Pods, and not their logs. A Plan Pod hands the whole plan to the controller
  # through its log, row values of declared reference data included, and RBAC
  # cannot grant the log of one operation Pod without the others: Pod names are
  # generated per attempt and a rule has no label selector. Reading operation
  # logs is reading every plan in the namespace, so grant pods/log the way plan
  # access is granted, to the people who may read plans. What the controller
  # made of each result is in status, conditions and Events, which this role
  # reads.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ptah-diagnostic-readers
  namespace: application
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ptah-diagnostic-reader
subjects:
  # Replace this placeholder with the on-call group. This role intentionally
  # cannot read Secrets, plan-chunk ConfigMaps or operation Pod logs, and
  # cannot mutate approvals.
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: <diagnostic-reader-group>
