apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ptah-diagnostic-reader
  namespace: application
rules:
  # Every kind this operator serves but one. Diagnosis that stops at one
  # family reads half a database's history: the two can share a coordination
  # realm, and the one that refused is not always the one being looked at.
  #
  # Not ptahschemaplanchunks. The chunks are a plan's SQL, declared row values
  # included; the plan manifest this role does read carries its digests,
  # statement count and privilege kinds, which is what diagnosis needs. Grant
  # the SQL to reviewers, with examples/approver-plan-reader-role.yaml.
  - apiGroups: ["operator.ptah.run"]
    resources:
      - "ptahschemas"
      - "ptahschemaplans"
      - "ptahschemaapprovals"
      - "ptahmigrations"
      - "ptahmigrationplans"
      - "ptahmigrationapprovals"
      - "ptahmigrationrunacknowledgments"
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  # Pods, and their logs. A Plan Job's runner seals its plan payload to the
  # manager's own key before writing it, so a Plan Pod's log holds ciphertext,
  # and reading an operation Pod's log is not reading a plan: when an Apply fails,
  # text the failed statement also holds is replaced in the one line it writes. It
  # can be reading a row: that line is the database's own sentence, which can name
  # a role, a host and a database and quote values read from a table, for 24 hours
  # after a run a person approved and five minutes after any other. Bind this role
  # as you would grant read access to the data. What the
  # controller made of each result is in status, conditions and Events, which
  # this role also reads and which carry none of that.
  #
  # Not pods/attach or pods/exec. A live process inside an Observe, Plan or
  # Apply Pod still holds the target database credential in its environment,
  # and attaching or executing into it reaches that credential directly. RBAC
  # cannot grant either to one operation Pod without the others: Pod names are
  # generated per attempt and a rule has no label selector.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ptah-diagnostic-readers
  namespace: application
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ptah-diagnostic-reader
subjects:
  # Replace this placeholder with the on-call group. This role intentionally
  # cannot read Secrets, plan chunks or ConfigMaps -- an Apply's plan is
  # projected into ConfigMaps -- and cannot mutate approvals.
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: <diagnostic-reader-group>
