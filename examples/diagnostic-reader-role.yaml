apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ptah-diagnostic-reader
  namespace: application
rules:
  # Every kind this operator serves. Diagnosis that stops at one family reads
  # half a database's history: the two can share a coordination realm, and the
  # one that refused is not always the one being looked at.
  - apiGroups: ["operator.ptah.run"]
    resources:
      - "ptahschemas"
      - "ptahschemaplans"
      - "ptahschemaapprovals"
      - "ptahmigrations"
      - "ptahmigrationplans"
      - "ptahmigrationapprovals"
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ptah-diagnostic-readers
  namespace: application
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ptah-diagnostic-reader
subjects:
  # Replace this placeholder with the on-call group. This role intentionally
  # cannot read Secrets or plan-chunk ConfigMaps and cannot mutate approvals.
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: <diagnostic-reader-group>
