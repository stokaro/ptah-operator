{{- /*
Every file under files/migrations becomes a key named after the file, and an
item that gives the file the same name. A new migration is a new file.
*/ -}}
{{- $files := .Files.Glob "files/migrations/*.sql" -}}
{{- $data := $files.AsConfig -}}
{{- $name := printf "%s-migrations-%s" .Release.Name ($data | sha256sum | trunc 10) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
immutable: true
data:
{{ $data | indent 2 }}
---
apiVersion: operator.ptah.run/v1alpha1
kind: PtahMigration
metadata:
  name: {{ .Release.Name }}-orders
spec:
  target:
    engine: PostgreSQL
    coordinationKey: {{ .Values.migrations.coordinationKey }}
    urlFrom:
      name: {{ .Values.migrations.databaseSecret }}
      key: url
  artifact:
    configMap:
      name: {{ $name }}
      items:
      {{- range $path, $_ := $files }}
        - key: {{ base $path }}
          path: {{ base $path }}
      {{- end }}
