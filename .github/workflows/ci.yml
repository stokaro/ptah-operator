name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer run cancels the older one on every ref, master included. This is
  # the intended policy, not an oversight: do not narrow it back to pull
  # requests, and hack/verify-kubernetes-support.go refuses any value but true.
  #
  # Every push to master starts the complete run -- no job is skipped because
  # the commit is on master -- and the run that counts is the newest commit's.
  # The tip is what the next change builds on and what a release is cut from;
  # an older run proves a tree nobody builds on again, and letting it finish
  # only holds the newer run behind it. Master used to let a started run finish,
  # and the queue that built up held the commit fixing a known failure for hours
  # while the run ahead of it re-proved that failure.
  #
  # The cost is taken on purpose: a commit followed by another merge before its
  # run finishes gets no verdict of its own. A change that needs one goes
  # through a pull request, whose run covers the same three minors.
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  support-matrix:
    name: Build Kubernetes support matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      # The acceptance matrix is every supported minor against every suite in
      # support/e2e-suites.json. The plain matrix keeps its shape, because the
      # release workflow reads it to enumerate the supported minors.
      acceptance: ${{ steps.matrix.outputs.acceptance }}
      ptah_commit: ${{ steps.ptah.outputs.commit }}
      # The image build validates a Kubernetes version and node image like every
      # other harness run, and builds nothing that depends on either. It is
      # handed the newest supported pair rather than a literal, so a minor
      # leaving the support window cannot leave a pin behind here.
      prepare_kubernetes_version: ${{ steps.matrix.outputs.prepare_kubernetes_version }}
      prepare_node_image: ${{ steps.matrix.outputs.prepare_node_image }}
      prepare_kind_version: ${{ steps.matrix.outputs.prepare_kind_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Validate support metadata and export matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(go run ./hack/verify-kubernetes-support.go -output=matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          acceptance="$(go run ./hack/verify-kubernetes-support.go -output=acceptance)"
          echo "acceptance=$acceptance" >> "$GITHUB_OUTPUT"
          printf 'prepare_kubernetes_version=%s\n' \
            "$(jq -er '.[-1].kubernetes_version' <<<"$matrix")" >> "$GITHUB_OUTPUT"
          printf 'prepare_node_image=%s\n' \
            "$(jq -er '.[-1].node_image' <<<"$matrix")" >> "$GITHUB_OUTPUT"
          printf 'prepare_kind_version=%s\n' \
            "$(jq -er '.[-1].kind_version' <<<"$matrix")" >> "$GITHUB_OUTPUT"
      # The lifecycle job needs the tested Ptah commit twice -- to check the
      # source out and to build the executor from it -- and the catalog is
      # where that commit is declared. Exporting it here is what keeps the
      # published compatibility claim and the build that backs it one value;
      # a literal in either place would keep working on the day they diverged.
      - name: Validate the Ptah compatibility catalog and export its pin
        id: ptah
        shell: bash
        run: |
          set -euo pipefail
          commit="$(go run ./hack/verifyptahsupport -output=commit)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify source and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # setup-go caches the module downloads and, on a key miss, whatever build
      # output existed when that job ended. Its key is the Go version and
      # go.sum, so it changes only when a dependency does: every run after the
      # first restores that one snapshot and reports "Cache hit occurred on the
      # primary key, not saving cache", and the compilation this job did is
      # thrown away. The build cache therefore rolls on its own key, newest
      # first, and is saved every run.
      #
      # Per job, because the objects are not interchangeable: a -race build is a
      # different cache than a plain one, and one shared key would have each run
      # evict the other's entries.
      - name: Cache the Go build output
        id: verify-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-verify-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-verify-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-verify-
      - name: Verify Kubernetes support window
        id: verify-support
        shell: bash
        run: go run ./hack/verify-kubernetes-support.go
      - name: Select exact CRD schema history baseline
        id: crd-baseline
        env:
          CURRENT_SHA: ${{ github.sha }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000
          commit_pattern='^[0-9a-f]{40}$'

          [[ "$CURRENT_SHA" =~ $commit_pattern ]]
          checked_out_sha="$(git rev-parse --verify HEAD)"
          [[ "$checked_out_sha" == "$CURRENT_SHA" ]]

          resolve_exact_commit() {
            local reference=$1
            local resolved
            resolved="$(git rev-parse --verify --end-of-options "${reference}^{commit}")"
            [[ "$resolved" =~ $commit_pattern ]]
            printf '%s\n' "$resolved"
          }

          case "$EVENT_NAME" in
            pull_request)
              [[ "$PULL_REQUEST_BASE_SHA" =~ $commit_pattern ]]
              baseline="$(resolve_exact_commit "$PULL_REQUEST_BASE_SHA")"
              [[ "$baseline" == "$PULL_REQUEST_BASE_SHA" ]]
              ;;
            push)
              if [[ "$EVENT_BEFORE_SHA" == "$zero_sha" ]]; then
                baseline="$(resolve_exact_commit "${CURRENT_SHA}^")"
              else
                [[ "$EVENT_BEFORE_SHA" =~ $commit_pattern ]]
                baseline="$(resolve_exact_commit "$EVENT_BEFORE_SHA")"
                [[ "$baseline" == "$EVENT_BEFORE_SHA" ]]
              fi
              ;;
            schedule|workflow_dispatch)
              baseline="$(resolve_exact_commit "${CURRENT_SHA}^")"
              ;;
            *)
              echo "unsupported event for CRD schema history baseline: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          printf 'baseline=%s\n' "$baseline" >> "$GITHUB_OUTPUT"
      # The chart-render tests shell out to Helm. ubuntu-latest carried it
      # until the image stopped doing so, and a job that assumes it fails
      # with "helm: executable file not found" on tests nothing changed.
      - name: Set up Helm
        id: verify-helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v4.3.0
      - name: Install the pinned ShellCheck
        id: shellcheck
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er '.shellcheck.version' support/tools.json)"
          url="$(jq -er '.shellcheck.linuxAmd64Url' support/tools.json)"
          digest="$(jq -er '.shellcheck.linuxAmd64Sha256' support/tools.json)"
          install_dir="$RUNNER_TEMP/shellcheck"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/shellcheck.tar.xz" "$url"
          echo "$digest  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar --extract --xz --file "$RUNNER_TEMP/shellcheck.tar.xz" --directory "$install_dir" --strip-components 1
          chmod 0755 "$install_dir/shellcheck"
          "$install_dir/shellcheck" --version | grep -qx "version: ${version#v}"
          echo "$install_dir" >> "$GITHUB_PATH"
      # The client build configuration, checked where a pull request can see
      # it. A release reads the platforms out of this file, so a file
      # goreleaser refuses is a release that cannot be cut.
      - name: Check the client build configuration
        id: client-build-config
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: check
      - name: Run project verification
        id: project-verify
        env:
          CRD_SCHEMA_BASELINE_REF: ${{ steps.crd-baseline.outputs.baseline }}
          CRD_SCHEMA_REQUIRE_EXPLICIT_BASELINE: "true"
        shell: bash
        run: make verify-source

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        id: race-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        id: race-setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The chart-render tests shell out to Helm. ubuntu-latest carried it
      # until the image stopped doing so, and a job that assumes it fails
      # with "helm: executable file not found" on tests nothing changed.
      - name: Set up Helm
        id: race-helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v4.3.0
      # setup-go caches the module downloads and, on a key miss, whatever build
      # output existed when that job ended. Its key is the Go version and
      # go.sum, so it changes only when a dependency does: every run after the
      # first restores that one snapshot and reports "Cache hit occurred on the
      # primary key, not saving cache", and the compilation this job did is
      # thrown away. The build cache therefore rolls on its own key, newest
      # first, and is saved every run.
      #
      # Per job, because the objects are not interchangeable: a -race build is a
      # different cache than a plain one, and one shared key would have each run
      # evict the other's entries.
      - name: Cache the Go build output
        id: race-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-race-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-race-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-race-
      # A pull request runs the race detector over every package. The four
      # shell mutation suites it skips rewrite fixtures and re-run a static
      # verifier in one goroutine, so the detector finds nothing in them while
      # they take the bulk of the hour; master, the weekly schedule and a
      # manual dispatch still run them.
      - name: Run race coverage without the shell mutation suites
        id: project-race-base
        if: github.event_name == 'pull_request'
        shell: bash
        run: make test-race-base
      - name: Run complete race coverage
        id: project-race
        if: github.event_name != 'pull_request'
        shell: bash
        run: make test-race

  # The four task images do not depend on the Kubernetes minor: the operator, the
  # synthetic next release, the isolated fixture and the Ptah executor are built
  # from one commit and one catalog pin. Building them once and handing the bytes
  # to every lifecycle removes about four and a half minutes from each of three
  # jobs, and is what keeps that cost flat when the matrix grows suites.
  #
  # It runs the same driver the lifecycle runs, stopped at the boundary where the
  # images exist and no cluster does. There is no second build path to drift.
  prepare-images:
    name: Build the shared task images
    needs: [support-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v4.3.0
      - name: Cache the Go build output
        id: prepare-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-prepare-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-prepare-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-prepare-
      - name: Check out pinned Ptah executor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: stokaro/ptah
          ref: ${{ needs.support-matrix.outputs.ptah_commit }}
          path: .e2e/ptah
          fetch-depth: 1
      - name: Stage pinned Ptah source outside the operator build context
        run: |
          mv "$GITHUB_WORKSPACE/.e2e/ptah" "$RUNNER_TEMP/ptah"
          rmdir "$GITHUB_WORKSPACE/.e2e"
      - name: Install kind
        shell: bash
        run: |
          set -euo pipefail
          go install "sigs.k8s.io/kind@${{ needs.support-matrix.outputs.prepare_kind_version }}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install matching kubectl
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/bin"
          mkdir -p "$install_dir"
          base_url="https://dl.k8s.io/release/v${{ needs.support-matrix.outputs.prepare_kubernetes_version }}/bin/linux/amd64"
          curl --fail --location --silent --show-error --output "$install_dir/kubectl" "$base_url/kubectl"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/kubectl.sha256" "$base_url/kubectl.sha256"
          echo "$(<"$RUNNER_TEMP/kubectl.sha256")  $install_dir/kubectl" | sha256sum --check
          chmod 0755 "$install_dir/kubectl"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Configure explicit Docker context
        id: docker-context
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes apache2-utils openssh-server

          ssh_key="$RUNNER_TEMP/ptah-e2e-ssh"
          known_hosts="$RUNNER_TEMP/ptah-e2e-known-hosts"
          install -d -m 0700 "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$ssh_key"
          install -m 0600 "$ssh_key.pub" "$HOME/.ssh/authorized_keys"
          sudo systemctl restart ssh
          ssh-keyscan -H 127.0.0.1 > "$known_hosts"
          {
            printf '%s\n' 'Host ptah-ci-docker'
            printf '%s\n' '  HostName 127.0.0.1'
            printf '  User %s\n' "$USER"
            printf '  IdentityFile %s\n' "$ssh_key"
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$known_hosts"
          } > "$HOME/.ssh/config"
          chmod 0600 "$HOME/.ssh/config"

          context_name="ptah-ci-prepare"
          docker context create "$context_name" --docker host=ssh://ptah-ci-docker
          docker --context "$context_name" info >/dev/null
          printf 'name=%s\n' "$context_name" >> "$GITHUB_OUTPUT"
      - name: Build and export the task images
        id: images
        env:
          DOCKER_CONTEXT: ${{ steps.docker-context.outputs.name }}
          E2E_DIRECT_HOST_ACCESS: "1"
          E2E_IMAGE_EXPORT_DIR: ${{ runner.temp }}/task-images
          E2E_PTAH_REVISION: ${{ needs.support-matrix.outputs.ptah_commit }}
          E2E_PTAH_SOURCE_DIR: ${{ runner.temp }}/ptah
          E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-images
          E2E_STOP_AFTER: images
          E2E_TIMING_CONTEXT: ${{ runner.temp }}/timing-context-images.json
          E2E_TIMING_LEDGER: ${{ runner.temp }}/timings-images.jsonl
          KIND_NODE_IMAGE: ${{ needs.support-matrix.outputs.prepare_node_image }}
          K8S_VERSION: ${{ needs.support-matrix.outputs.prepare_kubernetes_version }}
        shell: bash
        run: make e2e
      - name: Hand the images to the acceptance matrix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-task-images
          path: ${{ runner.temp }}/task-images
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
          overwrite: true
      - name: Publish what the image build spent its time on
        if: always() && steps.images.conclusion != 'skipped'
        shell: bash
        run: |
          set -uo pipefail
          ledger="$RUNNER_TEMP/timings-images.jsonl"
          context="$RUNNER_TEMP/timing-context-images.json"
          if [[ ! -s "$ledger" || ! -s "$context" ]]; then
            printf 'the image build recorded no timings\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          go run ./hack/e2etiming -ledger "$ledger" -context "$context" -summary - \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Remove explicit Docker context
        if: always() && steps.docker-context.outputs.name != ''
        run: docker context rm --force "${{ steps.docker-context.outputs.name }}"

  kubernetes-e2e:
    name: Kubernetes ${{ matrix.minor }} ${{ matrix.suite }}
    needs: [support-matrix, verify, prepare-images]
    runs-on: ubuntu-latest
    # actions: read is what separates waiting for a runner from working on it.
    # The job's own record carries when it was created and when a runner picked
    # it up, and no measurement inside the job can see the difference.
    permissions:
      contents: read
      actions: read
    # Data-plane and fault acceptance already approach 90 minutes on hosted
    # runners. Leave a bounded budget for the subsequent upgrade and uninstall
    # proofs; their individual operation deadlines remain unchanged.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.support-matrix.outputs.acceptance) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v4.3.0
      # Per minor, because the three lifecycle jobs run at once: one shared key
      # would have them race to save the same entry, and the last one to finish
      # would be the only one whose work survived.
      - name: Cache the Go build output
        id: e2e-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-e2e-${{ matrix.minor_slug }}-${{ matrix.suite_slug }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-e2e-${{ matrix.minor_slug }}-${{ matrix.suite_slug }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-e2e-${{ matrix.minor_slug }}-${{ matrix.suite_slug }}-
      # The images arrive built. The harness checks each one against this run's
      # own commit and the catalog's Ptah pin before loading it, so no Ptah
      # source is needed here and none is checked out.
      - name: Collect the shared task images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shared-task-images
          path: ${{ runner.temp }}/task-images
      - name: Install kind
        shell: bash
        run: |
          set -euo pipefail
          go install "sigs.k8s.io/kind@${{ matrix.kind_version }}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install matching kubectl
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/bin"
          mkdir -p "$install_dir"
          base_url="https://dl.k8s.io/release/v${{ matrix.kubernetes_version }}/bin/linux/amd64"
          curl --fail --location --silent --show-error --output "$install_dir/kubectl" "$base_url/kubectl"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/kubectl.sha256" "$base_url/kubectl.sha256"
          echo "$(<"$RUNNER_TEMP/kubectl.sha256")  $install_dir/kubectl" | sha256sum --check
          chmod 0755 "$install_dir/kubectl"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Configure explicit Docker context
        id: docker-context
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes apache2-utils openssh-server

          ssh_key="$RUNNER_TEMP/ptah-e2e-ssh"
          known_hosts="$RUNNER_TEMP/ptah-e2e-known-hosts"
          install -d -m 0700 "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$ssh_key"
          install -m 0600 "$ssh_key.pub" "$HOME/.ssh/authorized_keys"
          sudo systemctl restart ssh
          ssh-keyscan -H 127.0.0.1 > "$known_hosts"
          {
            printf '%s\n' 'Host ptah-ci-docker'
            printf '%s\n' '  HostName 127.0.0.1'
            printf '  User %s\n' "$USER"
            printf '  IdentityFile %s\n' "$ssh_key"
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$known_hosts"
          } > "$HOME/.ssh/config"
          chmod 0600 "$HOME/.ssh/config"

          context_name="ptah-ci-${{ matrix.minor_slug }}-${{ matrix.suite_slug }}"
          docker context create "$context_name" --docker host=ssh://ptah-ci-docker
          docker --context "$context_name" info >/dev/null
          printf 'name=%s\n' "$context_name" >> "$GITHUB_OUTPUT"
      # Samples while the lifecycle runs, so a slow stage can be told from a
      # starved one. The sampler is the same script a local run uses, and
      # killing it is the only thing that stops it.
      - name: Sample the machine while the lifecycle runs
        id: resource-samples
        shell: bash
        run: |
          set -euo pipefail
          samples="$RUNNER_TEMP/resource-samples-${{ matrix.minor_slug }}-${{ matrix.suite_slug }}.csv"
          nohup hack/e2e-resource-samples.sh "$samples" 15 >"$RUNNER_TEMP/sampler.log" 2>&1 &
          printf 'pid=%s\n' "$!" >> "$GITHUB_OUTPUT"
          printf 'path=%s\n' "$samples" >> "$GITHUB_OUTPUT"
      - name: Run complete operator lifecycle
        id: lifecycle
        env:
          DOCKER_CONTEXT: ${{ steps.docker-context.outputs.name }}
          E2E_DIRECT_HOST_ACCESS: "1"
          E2E_PREBUILT_IMAGE_DIR: ${{ runner.temp }}/task-images
          E2E_PTAH_REVISION: ${{ needs.support-matrix.outputs.ptah_commit }}
          E2E_RELEASE_CHART_OUTPUT: ${{ runner.temp }}/ptah-operator-${{ matrix.minor_slug }}.tgz
          E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.minor_slug }}-${{ matrix.suite_slug }}
          E2E_SUITE: ${{ matrix.suite }}
          E2E_TIMING_CONTEXT: ${{ runner.temp }}/timing-context-${{ matrix.minor_slug }}-${{ matrix.suite_slug }}.json
          E2E_TIMING_LEDGER: ${{ runner.temp }}/timings-${{ matrix.minor_slug }}-${{ matrix.suite_slug }}.jsonl
          KIND_NODE_IMAGE: ${{ matrix.node_image }}
          K8S_VERSION: ${{ matrix.kubernetes_version }}
        shell: bash
        run: make e2e
      # One chart per minor, from the suite whose phases are the install, the
      # upgrade and the uninstall. The release workflow reads these by minor.
      - name: Preserve exact installed release chart
        id: release-chart-evidence
        if: ${{ matrix.suite == 'lifecycle' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-release-chart-${{ matrix.minor_slug }}
          path: ${{ runner.temp }}/ptah-operator-${{ matrix.minor_slug }}.tgz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: true
      - name: Stop sampling
        if: always() && steps.resource-samples.outputs.pid != ''
        shell: bash
        run: kill "${{ steps.resource-samples.outputs.pid }}" 2>/dev/null || true
      # Published whether the lifecycle passed or failed: a run that failed
      # halfway is exactly the one whose stage durations explain the failure,
      # and this step reports rather than judges. It cannot turn a failed
      # lifecycle into a successful job -- the lifecycle step already concluded.
      - name: Publish what the lifecycle spent its time on
        id: timings
        if: always() && steps.lifecycle.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          ledger="$RUNNER_TEMP/timings-${{ matrix.minor_slug }}-${{ matrix.suite_slug }}.jsonl"
          context="$RUNNER_TEMP/timing-context-${{ matrix.minor_slug }}-${{ matrix.suite_slug }}.json"
          report="$RUNNER_TEMP/timing-report-${{ matrix.minor_slug }}-${{ matrix.suite_slug }}.json"
          samples="${{ steps.resource-samples.outputs.path }}"
          if [[ ! -s "$ledger" || ! -s "$context" ]]; then
            printf 'the lifecycle recorded no timings; ledger %s, context %s\n' \
              "$ledger" "$context" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jobs_file="$RUNNER_TEMP/workflow-jobs.json"
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100" \
            > "$jobs_file" || rm -f "$jobs_file"
          arguments=(-ledger "$ledger" -context "$context" -output "$report" -summary -)
          [[ -f "$jobs_file" ]] && arguments+=(-jobs "$jobs_file")
          [[ -s "$samples" ]] && arguments+=(-samples "$samples")
          go run ./hack/e2etiming "${arguments[@]}" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the measurements this run took
        if: always() && steps.lifecycle.conclusion != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-timings-${{ matrix.minor_slug }}-${{ matrix.suite_slug }}
          path: |
            ${{ runner.temp }}/timings-${{ matrix.minor_slug }}-${{ matrix.suite_slug }}.jsonl
            ${{ runner.temp }}/timing-context-${{ matrix.minor_slug }}-${{ matrix.suite_slug }}.json
            ${{ runner.temp }}/timing-report-${{ matrix.minor_slug }}-${{ matrix.suite_slug }}.json
            ${{ runner.temp }}/resource-samples-${{ matrix.minor_slug }}-${{ matrix.suite_slug }}.csv
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
      - name: Remove explicit Docker context
        if: always() && steps.docker-context.outputs.name != ''
        run: docker context rm --force "${{ steps.docker-context.outputs.name }}"

  # Observational and deliberately outside the gate: it publishes where the
  # elapsed time went across the whole matrix once every lifecycle has
  # concluded, which is when the job records carry a queue and a duration for
  # each of them. A measurement that could fail the run would be a reason not
  # to measure.
  lifecycle-timings:
    name: Publish lifecycle timings
    if: ${{ !cancelled() }}
    needs: [kubernetes-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Collect what each lifecycle measured
        id: collect
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lifecycle-timings-*
          path: ${{ runner.temp }}/timings
      - name: Publish the elapsed time across the matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          root="$RUNNER_TEMP/timings"
          jobs_file="$RUNNER_TEMP/workflow-jobs.json"
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100" \
            > "$jobs_file" || rm -f "$jobs_file"
          published=0
          for directory in "$root"/lifecycle-timings-*; do
            [[ -d "$directory" ]] || continue
            ledger=$(find "$directory" -name 'timings-*.jsonl' -print -quit)
            context=$(find "$directory" -name 'timing-context-*.json' -print -quit)
            samples=$(find "$directory" -name 'resource-samples-*.csv' -print -quit)
            [[ -s "$ledger" && -s "$context" ]] || continue
            arguments=(-ledger "$ledger" -context "$context" -summary -)
            [[ -n "$samples" && -s "$samples" ]] && arguments+=(-samples "$samples")
            # The runner table belongs to the run rather than to a minor, so it
            # is rendered once, with the first suite that has measurements.
            if [[ "$published" -eq 0 && -f "$jobs_file" ]]; then
              arguments+=(-jobs "$jobs_file")
            fi
            go run ./hack/e2etiming "${arguments[@]}" >> "$GITHUB_STEP_SUMMARY"
            published=$((published + 1))
          done
          if [[ "$published" -eq 0 ]]; then
            printf 'No lifecycle recorded timings in this run.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  kubernetes-support-gate:
    name: Kubernetes support gate
    if: ${{ !cancelled() }}
    needs: [support-matrix, verify, race, prepare-images, kubernetes-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every supported lifecycle
        id: require-results
        env:
          SUPPORT_MATRIX_RESULT: ${{ needs.support-matrix.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          RACE_RESULT: ${{ needs.race.result }}
          PREPARE_IMAGES_RESULT: ${{ needs.prepare-images.result }}
          KUBERNETES_E2E_RESULT: ${{ needs.kubernetes-e2e.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "$SUPPORT_MATRIX_RESULT" \
            "$VERIFY_RESULT" \
            "$RACE_RESULT" \
            "$PREPARE_IMAGES_RESULT" \
            "$KUBERNETES_E2E_RESULT"
          do
            if [[ "$result" != success ]]; then
              echo "required Kubernetes support job concluded: $result" >&2
              exit 1
            fi
          done
