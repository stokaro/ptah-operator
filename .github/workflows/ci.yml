name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request groups by ref, so its newest push supersedes the older one:
  # only the newest is worth three kind clusters. A push to master groups by
  # commit, so nothing supersedes it. Sharing one group per ref is not enough
  # to protect a master run, because GitHub cancels an earlier *pending* run
  # when a new one joins its group whatever cancel-in-progress says, and a run
  # that never starts is always pending. With the account's job limit shared
  # across repositories, master runs queue rather than start, so every merge
  # cancelled the verdict of the one before it: fourteen consecutive master
  # commits went unverified that way, which is how the port race in #37 stayed
  # hidden (#106).
  #
  # The key carries the event as well as the commit because this workflow has
  # four triggers and three of them run on the same sha. A weekly scheduled run
  # starts on the tip of master, so keyed on the commit alone it joins the group
  # of that commit's push run and cancels it while it waits -- the failure above,
  # once a week, where nobody would connect the two. A manual dispatch is in the
  # same position; keyed on the event it supersedes only another dispatch of
  # itself, which is what re-running by hand means.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  # A superseded pull-request run is cancelled once it is running. A push to
  # master is not, and now has no group-mate that could supersede it either.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOFLAGS: -mod=readonly

jobs:
  support-matrix:
    name: Build Kubernetes support matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      ptah_commit: ${{ steps.ptah.outputs.commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Validate support metadata and export matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(go run ./hack/verify-kubernetes-support.go -output=matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      # The lifecycle job needs the tested Ptah commit twice -- to check the
      # source out and to build the executor from it -- and the catalog is
      # where that commit is declared. Exporting it here is what keeps the
      # published compatibility claim and the build that backs it one value;
      # a literal in either place would keep working on the day they diverged.
      - name: Validate the Ptah compatibility catalog and export its pin
        id: ptah
        shell: bash
        run: |
          set -euo pipefail
          commit="$(go run ./hack/verifyptahsupport -output=commit)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify source and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # setup-go caches the module downloads and, on a key miss, whatever build
      # output existed when that job ended. Its key is the Go version and
      # go.sum, so it changes only when a dependency does: every run after the
      # first restores that one snapshot and reports "Cache hit occurred on the
      # primary key, not saving cache", and the compilation this job did is
      # thrown away. The build cache therefore rolls on its own key, newest
      # first, and is saved every run.
      #
      # Per job, because the objects are not interchangeable: a -race build is a
      # different cache than a plain one, and one shared key would have each run
      # evict the other's entries.
      - name: Cache the Go build output
        id: verify-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-verify-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-verify-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-verify-
      - name: Verify Kubernetes support window
        id: verify-support
        shell: bash
        run: go run ./hack/verify-kubernetes-support.go
      - name: Select exact CRD schema history baseline
        id: crd-baseline
        env:
          CURRENT_SHA: ${{ github.sha }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000
          commit_pattern='^[0-9a-f]{40}$'

          [[ "$CURRENT_SHA" =~ $commit_pattern ]]
          checked_out_sha="$(git rev-parse --verify HEAD)"
          [[ "$checked_out_sha" == "$CURRENT_SHA" ]]

          resolve_exact_commit() {
            local reference=$1
            local resolved
            resolved="$(git rev-parse --verify --end-of-options "${reference}^{commit}")"
            [[ "$resolved" =~ $commit_pattern ]]
            printf '%s\n' "$resolved"
          }

          case "$EVENT_NAME" in
            pull_request)
              [[ "$PULL_REQUEST_BASE_SHA" =~ $commit_pattern ]]
              baseline="$(resolve_exact_commit "$PULL_REQUEST_BASE_SHA")"
              [[ "$baseline" == "$PULL_REQUEST_BASE_SHA" ]]
              ;;
            push)
              if [[ "$EVENT_BEFORE_SHA" == "$zero_sha" ]]; then
                baseline="$(resolve_exact_commit "${CURRENT_SHA}^")"
              else
                [[ "$EVENT_BEFORE_SHA" =~ $commit_pattern ]]
                baseline="$(resolve_exact_commit "$EVENT_BEFORE_SHA")"
                [[ "$baseline" == "$EVENT_BEFORE_SHA" ]]
              fi
              ;;
            schedule|workflow_dispatch)
              baseline="$(resolve_exact_commit "${CURRENT_SHA}^")"
              ;;
            *)
              echo "unsupported event for CRD schema history baseline: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          printf 'baseline=%s\n' "$baseline" >> "$GITHUB_OUTPUT"
      # The chart-render tests shell out to Helm. ubuntu-latest carried it
      # until the image stopped doing so, and a job that assumes it fails
      # with "helm: executable file not found" on tests nothing changed.
      - name: Set up Helm
        id: verify-helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v4.2.4
      - name: Install the pinned ShellCheck
        id: shellcheck
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er '.shellcheck.version' support/tools.json)"
          url="$(jq -er '.shellcheck.linuxAmd64Url' support/tools.json)"
          digest="$(jq -er '.shellcheck.linuxAmd64Sha256' support/tools.json)"
          install_dir="$RUNNER_TEMP/shellcheck"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/shellcheck.tar.xz" "$url"
          echo "$digest  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar --extract --xz --file "$RUNNER_TEMP/shellcheck.tar.xz" --directory "$install_dir" --strip-components 1
          chmod 0755 "$install_dir/shellcheck"
          "$install_dir/shellcheck" --version | grep -qx "version: ${version#v}"
          echo "$install_dir" >> "$GITHUB_PATH"
      # The client build configuration, checked where a pull request can see
      # it. A release reads the platforms out of this file, so a file
      # goreleaser refuses is a release that cannot be cut.
      - name: Check the client build configuration
        id: client-build-config
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.15.4
          args: check
      - name: Run project verification
        id: project-verify
        env:
          CRD_SCHEMA_BASELINE_REF: ${{ steps.crd-baseline.outputs.baseline }}
          CRD_SCHEMA_REQUIRE_EXPLICIT_BASELINE: "true"
        shell: bash
        run: make verify-source

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        id: race-checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        id: race-setup-go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The chart-render tests shell out to Helm. ubuntu-latest carried it
      # until the image stopped doing so, and a job that assumes it fails
      # with "helm: executable file not found" on tests nothing changed.
      - name: Set up Helm
        id: race-helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v4.2.4
      # setup-go caches the module downloads and, on a key miss, whatever build
      # output existed when that job ended. Its key is the Go version and
      # go.sum, so it changes only when a dependency does: every run after the
      # first restores that one snapshot and reports "Cache hit occurred on the
      # primary key, not saving cache", and the compilation this job did is
      # thrown away. The build cache therefore rolls on its own key, newest
      # first, and is saved every run.
      #
      # Per job, because the objects are not interchangeable: a -race build is a
      # different cache than a plain one, and one shared key would have each run
      # evict the other's entries.
      - name: Cache the Go build output
        id: race-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-race-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-race-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-race-
      # A pull request runs the race detector over every package. The four
      # shell mutation suites it skips rewrite fixtures and re-run a static
      # verifier in one goroutine, so the detector finds nothing in them while
      # they take the bulk of the hour; master, the weekly schedule and a
      # manual dispatch still run them.
      - name: Run race coverage without the shell mutation suites
        id: project-race-base
        if: github.event_name == 'pull_request'
        shell: bash
        run: make test-race-base
      - name: Run complete race coverage
        id: project-race
        if: github.event_name != 'pull_request'
        shell: bash
        run: make test-race

  kubernetes-e2e:
    name: Kubernetes ${{ matrix.minor }} full lifecycle
    needs: [support-matrix, verify]
    runs-on: ubuntu-latest
    # Data-plane and fault acceptance already approach 90 minutes on hosted
    # runners. Leave a bounded budget for the subsequent upgrade and uninstall
    # proofs; their individual operation deadlines remain unchanged.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.support-matrix.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v4.2.4
      # Per minor, because the three lifecycle jobs run at once: one shared key
      # would have them race to save the same entry, and the last one to finish
      # would be the only one whose work survived.
      - name: Cache the Go build output
        id: e2e-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-e2e-${{ matrix.minor_slug }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-e2e-${{ matrix.minor_slug }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-e2e-${{ matrix.minor_slug }}-
      - name: Check out pinned Ptah executor source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: stokaro/ptah
          ref: ${{ needs.support-matrix.outputs.ptah_commit }}
          path: .e2e/ptah
          fetch-depth: 1
      - name: Stage pinned Ptah source outside the operator build context
        run: |
          mv "$GITHUB_WORKSPACE/.e2e/ptah" "$RUNNER_TEMP/ptah"
          rmdir "$GITHUB_WORKSPACE/.e2e"
      - name: Install kind
        shell: bash
        run: |
          set -euo pipefail
          go install "sigs.k8s.io/kind@${{ matrix.kind_version }}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install matching kubectl
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/bin"
          mkdir -p "$install_dir"
          base_url="https://dl.k8s.io/release/v${{ matrix.kubernetes_version }}/bin/linux/amd64"
          curl --fail --location --silent --show-error --output "$install_dir/kubectl" "$base_url/kubectl"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/kubectl.sha256" "$base_url/kubectl.sha256"
          echo "$(<"$RUNNER_TEMP/kubectl.sha256")  $install_dir/kubectl" | sha256sum --check
          chmod 0755 "$install_dir/kubectl"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Configure explicit Docker context
        id: docker-context
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes apache2-utils openssh-server

          ssh_key="$RUNNER_TEMP/ptah-e2e-ssh"
          known_hosts="$RUNNER_TEMP/ptah-e2e-known-hosts"
          install -d -m 0700 "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$ssh_key"
          install -m 0600 "$ssh_key.pub" "$HOME/.ssh/authorized_keys"
          sudo systemctl restart ssh
          ssh-keyscan -H 127.0.0.1 > "$known_hosts"
          {
            printf '%s\n' 'Host ptah-ci-docker'
            printf '%s\n' '  HostName 127.0.0.1'
            printf '  User %s\n' "$USER"
            printf '  IdentityFile %s\n' "$ssh_key"
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$known_hosts"
          } > "$HOME/.ssh/config"
          chmod 0600 "$HOME/.ssh/config"

          context_name="ptah-ci-${{ matrix.minor_slug }}"
          docker context create "$context_name" --docker host=ssh://ptah-ci-docker
          docker --context "$context_name" info >/dev/null
          printf 'name=%s\n' "$context_name" >> "$GITHUB_OUTPUT"
      - name: Run complete operator lifecycle
        id: lifecycle
        env:
          DOCKER_CONTEXT: ${{ steps.docker-context.outputs.name }}
          E2E_DIRECT_HOST_ACCESS: "1"
          E2E_PTAH_REVISION: ${{ needs.support-matrix.outputs.ptah_commit }}
          E2E_PTAH_SOURCE_DIR: ${{ runner.temp }}/ptah
          E2E_RELEASE_CHART_OUTPUT: ${{ runner.temp }}/ptah-operator-${{ matrix.minor_slug }}.tgz
          E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.minor_slug }}
          KIND_NODE_IMAGE: ${{ matrix.node_image }}
          K8S_VERSION: ${{ matrix.kubernetes_version }}
        shell: bash
        run: make e2e
      - name: Preserve exact installed release chart
        id: release-chart-evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-release-chart-${{ matrix.minor_slug }}
          path: ${{ runner.temp }}/ptah-operator-${{ matrix.minor_slug }}.tgz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: true
      - name: Remove explicit Docker context
        if: always() && steps.docker-context.outputs.name != ''
        run: docker context rm --force "${{ steps.docker-context.outputs.name }}"

  kubernetes-support-gate:
    name: Kubernetes support gate
    if: ${{ !cancelled() }}
    needs: [support-matrix, verify, race, kubernetes-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every supported lifecycle
        id: require-results
        env:
          SUPPORT_MATRIX_RESULT: ${{ needs.support-matrix.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          RACE_RESULT: ${{ needs.race.result }}
          KUBERNETES_E2E_RESULT: ${{ needs.kubernetes-e2e.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "$SUPPORT_MATRIX_RESULT" \
            "$VERIFY_RESULT" \
            "$RACE_RESULT" \
            "$KUBERNETES_E2E_RESULT"
          do
            if [[ "$result" != success ]]; then
              echo "required Kubernetes support job concluded: $result" >&2
              exit 1
            fi
          done
