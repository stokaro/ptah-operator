name: Update Kubernetes support window

on:
  schedule:
    - cron: "43 3 * * 2"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-kubernetes-support
  cancel-in-progress: false

jobs:
  update:
    name: Discover maintained Kubernetes minors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Discover the support window from official release metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./hack/updatekubernetessupport
      - name: Verify the deterministic support contract
        shell: bash
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          go test ./hack ./hack/updatekubernetessupport
          go run ./hack/verify-kubernetes-support.go -now "$today"
          git diff --check
      - name: Detect an update
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            support/kubernetes.json \
            charts/ptah-operator/Chart.yaml \
            docs/kubernetes-support.md; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update the support-window pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          base_branch='${{ github.event.repository.default_branch }}'
          support_branch='automation/kubernetes-support-window'
          title='chore: refresh Kubernetes support window'
          body_file="$RUNNER_TEMP/kubernetes-support-window.md"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          git switch --create "$support_branch"
          git add \
            support/kubernetes.json \
            charts/ptah-operator/Chart.yaml \
            docs/kubernetes-support.md
          git commit --message "$title"

          remote_oid="$(git ls-remote --heads origin "refs/heads/$support_branch" | awk '{print $1}')"
          git push \
            "--force-with-lease=refs/heads/$support_branch:$remote_oid" \
            origin \
            "HEAD:refs/heads/$support_branch"

          {
            echo 'This automated update advances or refreshes the consecutive three-minor Kubernetes support window.'
            echo
            echo 'The manifest was discovered from the official Kubernetes stable release and a single compatible official kind release. All node images remain digest-pinned.'
            echo
            echo 'The complete Kubernetes matrix must pass before merge.'
          } > "$body_file"

          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base "$base_branch" \
            --head "$support_branch" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$base_branch" \
              --head "$support_branch" \
              --title "$title" \
              --body-file "$body_file"
          else
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body-file "$body_file"
          fi

          # GITHUB_TOKEN-generated pushes do not trigger ordinary push workflows.
          # workflow_dispatch is intentionally used so the updated SHA receives CI.
          gh workflow run ci.yml --ref "$support_branch"
