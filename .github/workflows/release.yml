name: Release

on:
  pull_request:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/stokaro/ptah-operator

jobs:
  smoke:
    name: Release contract and multi-architecture build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Helm
        id: setup-helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.21.4
      - name: Verify release metadata
        id: verify-release
        run: go run ./hack/releaseverify
      - name: Lint and reproducibly package chart
        id: chart-reproducibility
        shell: bash
        run: |
          set -euo pipefail
          test_digest="sha256:1111111111111111111111111111111111111111111111111111111111111111"
          helm lint charts/ptah-operator \
            --set-string image.digest="$test_digest" \
            --set-string execution.executorImage="example.invalid/ptah@$test_digest" \
            --set-string execution.runnerImage="example.invalid/operator@$test_digest"
          source_epoch="$(git show -s --format=%ct HEAD)"
          go run ./hack/chartpackage -epoch "$source_epoch" -destination dist-a
          go run ./hack/chartpackage -epoch "$source_epoch" -destination dist-b
          cmp \
            "dist-a/ptah-operator-$(sed -n 's/^version: //p' charts/ptah-operator/Chart.yaml).tgz" \
            "dist-b/ptah-operator-$(sed -n 's/^version: //p' charts/ptah-operator/Chart.yaml).tgz"
      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          version: v0.36.1
          cache-binary: false
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Build both release architectures
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          build-args: |
            VERSION=dev
            REVISION=${{ github.sha }}
            SOURCE=https://github.com/${{ github.repository }}

  publish:
    name: Publish signed image and attested chart
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          version: v0.36.1
          cache-binary: false
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Validate tag and derive release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          go run ./hack/releaseverify -tag "$GITHUB_REF_NAME"
          default_branch='${{ github.event.repository.default_branch }}'
          [[ -n "$default_branch" ]]
          git fetch --no-tags origin \
            "refs/heads/$default_branch:refs/remotes/origin/$default_branch"
          git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$default_branch"
          version="${GITHUB_REF_NAME#v}"
          transaction="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            printf 'version=%s\n' "$version"
            printf 'transaction=%s\n' "$transaction"
            printf 'image-tag=tx-%s-%s\n' "$GITHUB_SHA" "$transaction"
          } >> "$GITHUB_OUTPUT"
      - name: Inspect immutable release transaction
        id: transaction
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          go run ./hack/releaseverify \
            -tag "$GITHUB_REF_NAME" \
            -verify-tag-identity
          mkdir -p dist
          error_file="$RUNNER_TEMP/release-view-error.txt"
          if release_json="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" 2>"$error_file")"; then
            release_state=recover
            if [[ "$(jq -r '.draft' <<<"$release_json")" != true ]]; then
              if [[ "$(jq -r '.immutable' <<<"$release_json")" != true ]]; then
                echo "release $GITHUB_REF_NAME is published but not immutable; refusing recovery" >&2
                exit 1
              fi
              release_state=published
            fi
            jq -j '.body' <<<"$release_json" > dist/release-manifest.txt
            delay=2
            for attempt in {1..8}; do
              if gh attestation verify dist/release-manifest.txt \
                --repo "$GITHUB_REPOSITORY" \
                --source-ref "$GITHUB_REF" \
                --source-digest "$GITHUB_SHA" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
              then
                break
              fi
              if [[ "$attempt" == 8 ]]; then
                exit 1
              fi
              sleep "$delay"
              delay=$((delay < 30 ? delay * 2 : 30))
            done
            go run ./hack/releaseverify \
              -tag "$GITHUB_REF_NAME" \
              -source-sha "$GITHUB_SHA" \
              -manifest dist/release-manifest.txt
            printf 'mode=%s\n' "$release_state" >> "$GITHUB_OUTPUT"
          elif grep -Fq '(HTTP 404)' "$error_file"; then
            printf 'mode=fresh\n' >> "$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            echo 'could not determine release state; refusing to publish' >&2
            exit 1
          fi
      - name: Require immutable release enforcement
        id: immutability-preflight
        env:
          GH_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo 'IMMUTABLE_RELEASES_READ_TOKEN is required' >&2
            exit 1
          fi
          settings="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases")"
          [[ "$(jq -r '.enabled' <<<"$settings")" == true ]]
      - name: Log in to GHCR
        id: registry-login
        if: steps.transaction.outputs.mode != 'published'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image into transaction staging
        id: image
        if: steps.transaction.outputs.mode == 'fresh'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.release.outputs.image-tag }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE=https://github.com/${{ github.repository }}
      - name: Reproducibly package chart
        id: chart-package
        shell: bash
        run: |
          set -euo pipefail
          source_epoch="$(git show -s --format=%ct HEAD)"
          go run ./hack/chartpackage -epoch "$source_epoch" -destination dist
          chart_path="dist/ptah-operator-${{ steps.release.outputs.version }}.tgz"
          test -f "$chart_path"
          printf 'path=%s\n' "$chart_path" >> "$GITHUB_OUTPUT"
      - name: Materialize immutable release assets
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          manifest=dist/release-manifest.txt
          chart_path='${{ steps.chart-package.outputs.path }}'
          if [[ '${{ steps.transaction.outputs.mode }}' == fresh ]]; then
            chart_asset_sha256="$(sha256sum "$chart_path" | awk '{print $1}')"
            {
              printf 'version=%s\n' '${{ steps.release.outputs.version }}'
              printf 'source-repository=%s\n' "$GITHUB_REPOSITORY"
              printf 'source-ref=%s\n' "$GITHUB_REF"
              printf 'source-sha=%s\n' "$GITHUB_SHA"
              printf 'transaction=%s\n' '${{ steps.release.outputs.transaction }}'
              printf 'image=%s@%s\n' "$IMAGE" '${{ steps.image.outputs.digest }}'
              printf 'image-tag=%s:%s\n' "$IMAGE" '${{ steps.release.outputs.image-tag }}'
              printf 'chart-asset=%s\n' "$(basename "$chart_path")"
              printf 'chart-asset-sha256=%s\n' "$chart_asset_sha256"
            } > "$manifest"
          fi
          chart_name="$(basename "$chart_path")"
          (
            cd dist
            sha256sum "$chart_name" release-manifest.txt > SHA256SUMS
          )
          go run ./hack/releaseverify \
            -tag "$GITHUB_REF_NAME" \
            -source-sha "$GITHUB_SHA" \
            -manifest "$manifest" \
            -checksums dist/SHA256SUMS \
            -chart "$chart_path"
          field() {
            sed -n "s/^$1=//p" "$manifest"
          }
          {
            printf 'image-digest=%s\n' "$(field image | sed 's/.*@//')"
            printf 'image-repository=%s\n' "$(field image | sed 's/@sha256:.*//')"
            printf 'image-tag=%s\n' "$(field image-tag)"
          } >> "$GITHUB_OUTPUT"
      - name: Attest release transaction assets
        id: asset-attestation
        if: steps.transaction.outputs.mode == 'fresh'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            ${{ steps.chart-package.outputs.path }}
            dist/release-manifest.txt
            dist/SHA256SUMS
      - name: Create immutable draft transaction
        id: draft
        if: steps.transaction.outputs.mode == 'fresh'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          go run ./hack/releaseverify \
            -tag "$GITHUB_REF_NAME" \
            -verify-tag-identity
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --latest=false \
            --notes-file dist/release-manifest.txt \
            --title "Ptah Operator ${{ steps.release.outputs.version }}"
      - name: Authenticate exact transaction assets
        id: asset-auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            '${{ steps.chart-package.outputs.path }}' \
            dist/release-manifest.txt \
            dist/SHA256SUMS
          do
            delay=2
            for attempt in {1..8}; do
              if gh attestation verify "$asset" \
                --repo "$GITHUB_REPOSITORY" \
                --source-ref "$GITHUB_REF" \
                --source-digest "$GITHUB_SHA" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
              then
                break
              fi
              if [[ "$attempt" == 8 ]]; then
                exit 1
              fi
              sleep "$delay"
              delay=$((delay < 30 ? delay * 2 : 30))
            done
          done
      - name: Synchronize draft assets without replacement
        id: asset-sync
        if: steps.transaction.outputs.mode != 'published'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          expected_names="$(printf '%s\n' \
            "$(basename '${{ steps.chart-package.outputs.path }}')" \
            release-manifest.txt \
            SHA256SUMS | sort)"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
          [[ "$(jq -r '.draft' <<<"$release_json")" == true ]]
          jq -j '.body' <<<"$release_json" > "$RUNNER_TEMP/release-body.txt"
          cmp dist/release-manifest.txt "$RUNNER_TEMP/release-body.txt"
          actual_names="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          duplicate_names="$(jq -r '.assets[].name' <<<"$release_json" | sort | uniq -d)"
          if [[ -n "$duplicate_names" ]]; then
            echo "draft release has duplicate asset names:" >&2
            printf '%s\n' "$duplicate_names" >&2
            exit 1
          fi
          unexpected="$(comm -13 <(printf '%s' "$expected_names") <(printf '%s' "$actual_names"))"
          if [[ -n "$unexpected" ]]; then
            echo "draft release has unexpected assets:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/existing-assets"
          while IFS= read -r name; do
            source="dist/$name"
            if grep -Fxq "$name" <<<"$actual_names"; then
              asset="$(jq -ce --arg name "$name" '[.assets[] | select(.name == $name)] | if length == 1 then .[0] else error("asset name is not unique") end' <<<"$release_json")"
              state="$(jq -r '.state' <<<"$asset")"
              if [[ "$state" == uploaded ]]; then
                gh release download "$GITHUB_REF_NAME" \
                  --pattern "$name" \
                  --dir "$RUNNER_TEMP/existing-assets"
                cmp "$source" "$RUNNER_TEMP/existing-assets/$name"
              elif [[ "$state" == starter ]]; then
                asset_id="$(jq -er '.id | numbers' <<<"$asset")"
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
                gh release upload "$GITHUB_REF_NAME" "$source"
              else
                echo "draft asset $name has unsupported state $state" >&2
                exit 1
              fi
            else
              gh release upload "$GITHUB_REF_NAME" "$source"
            fi
          done <<<"$expected_names"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
          actual_names="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          [[ "$actual_names" == "$expected_names" ]]
          jq -e '[.assets[] | select(.state != "uploaded")] | length == 0' <<<"$release_json" >/dev/null
      - name: Attest final image provenance
        id: image-attestation
        if: steps.transaction.outputs.mode != 'published'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ steps.artifacts.outputs.image-repository }}
          subject-digest: ${{ steps.artifacts.outputs.image-digest }}
          push-to-registry: true
      - name: Install Cosign
        id: setup-cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign exact image digest
        id: image-signature
        if: steps.transaction.outputs.mode != 'published'
        run: cosign sign --yes "${{ steps.artifacts.outputs.image-repository }}@${{ steps.artifacts.outputs.image-digest }}"
      - name: Verify final publication and signatures
        id: final-verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          reference="${{ steps.artifacts.outputs.image-repository }}@${{ steps.artifacts.outputs.image-digest }}"
          delay=2
          for attempt in {1..8}; do
            if cosign verify \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$reference" && \
              gh attestation verify "oci://$reference" \
                --repo "$GITHUB_REPOSITORY" \
                --source-ref "$GITHUB_REF" \
                --source-digest "$GITHUB_SHA" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
            then
              break
            fi
            if [[ "$attempt" == 8 ]]; then
              exit 1
            fi
            sleep "$delay"
            delay=$((delay < 30 ? delay * 2 : 30))
          done
          if [[ '${{ steps.transaction.outputs.mode }}' != published ]]; then
            docker logout ghcr.io
          fi
          image_dir="$RUNNER_TEMP/release-image"
          mkdir -p "$image_dir"
          docker buildx imagetools inspect --raw "$reference" > "$image_dir/index.json"
          index_digest="sha256:$(sha256sum "$image_dir/index.json" | awk '{print $1}')"
          [[ "$index_digest" == '${{ steps.artifacts.outputs.image-digest }}' ]]
          docker buildx imagetools inspect --raw \
            '${{ steps.artifacts.outputs.image-tag }}' > "$image_dir/tag-index.json"
          cmp "$image_dir/index.json" "$image_dir/tag-index.json"

          jq -e '
            .schemaVersion == 2 and
            (.mediaType == "application/vnd.oci.image.index.v1+json" or
             .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json") and
            (.manifests | length == 4) and
            ([.manifests[] |
              select(.platform.os == "linux" and
                     (.platform.architecture == "amd64" or .platform.architecture == "arm64") and
                     .annotations["vnd.docker.reference.type"] != "attestation-manifest")] |
             map(.platform.os + "/" + .platform.architecture) | sort) ==
              ["linux/amd64", "linux/arm64"] and
            ([.manifests[] |
              select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] |
             length) == 2 and
            ([.manifests[] |
              select(.platform.os != "linux" and
                     .annotations["vnd.docker.reference.type"] != "attestation-manifest")] |
             length) == 0
          ' "$image_dir/index.json" >/dev/null

          source="https://github.com/$GITHUB_REPOSITORY"
          version='${{ steps.release.outputs.version }}'
          for platform in linux/amd64 linux/arm64; do
            os="${platform%/*}"
            architecture="${platform#*/}"
            platform_digest="$(jq -er \
              --arg os "$os" --arg architecture "$architecture" \
              '.manifests[] |
               select(.platform.os == $os and .platform.architecture == $architecture and
                      .annotations["vnd.docker.reference.type"] != "attestation-manifest") |
               .digest' "$image_dir/index.json")"
            attestation_digest="$(jq -er --arg digest "$platform_digest" \
              '.manifests[] |
               select(.annotations["vnd.docker.reference.type"] == "attestation-manifest" and
                      .annotations["vnd.docker.reference.digest"] == $digest) |
               .digest' "$image_dir/index.json")"
            docker buildx imagetools inspect \
              "${{ steps.artifacts.outputs.image-repository }}@$platform_digest" \
              --format '{{json .}}' > "$image_dir/${architecture}-image.json"
            jq -e \
              --arg digest "$platform_digest" \
              --arg os "$os" \
              --arg architecture "$architecture" \
              --arg source "$source" \
              --arg revision "$GITHUB_SHA" \
              --arg version "$version" '
                .manifest.digest == $digest and
                .image.os == $os and .image.architecture == $architecture and
                .image.config.Labels["org.opencontainers.image.source"] == $source and
                .image.config.Labels["org.opencontainers.image.revision"] == $revision and
                .image.config.Labels["org.opencontainers.image.version"] == $version
              ' "$image_dir/${architecture}-image.json" >/dev/null
            docker buildx imagetools inspect --raw \
              "${{ steps.artifacts.outputs.image-repository }}@$attestation_digest" \
              > "$image_dir/${architecture}-attestation.json"
            jq -e --arg digest "$platform_digest" '
              .artifactType == "application/vnd.docker.attestation.manifest.v1+json" and
              .subject.digest == $digest and
              ([.layers[] |
                select(.mediaType == "application/vnd.in-toto+json" and
                       .annotations["in-toto.io/predicate-type"] == "https://spdx.dev/Document")] |
               length) >= 1 and
              ([.layers[] |
                select(.mediaType == "application/vnd.in-toto+json" and
                       .annotations["in-toto.io/predicate-type"] == "https://slsa.dev/provenance/v1")] |
               length) == 1
            ' "$image_dir/${architecture}-attestation.json" >/dev/null
          done

          docker buildx imagetools inspect "$reference" \
            --format '{{json .Provenance}}' > "$image_dir/provenance.json"
          jq -e --arg source "$source" --arg revision "$GITHUB_SHA" --arg version "$version" '
            . as $root |
            ["linux/amd64", "linux/arm64"] | all(.[] as $platform;
              $root[$platform].SLSA.buildDefinition.externalParameters.request.args["build-arg:SOURCE"] == $source and
              $root[$platform].SLSA.buildDefinition.externalParameters.request.args["build-arg:REVISION"] == $revision and
              $root[$platform].SLSA.buildDefinition.externalParameters.request.args["build-arg:VERSION"] == $version and
              ($root[$platform].SLSA.buildDefinition.internalParameters.buildConfig.llbDefinition | length) > 0)
          ' "$image_dir/provenance.json" >/dev/null
          while IFS= read -r material_digest; do
            jq -e --arg digest "$material_digest" '
              . as $root |
              ["linux/amd64", "linux/arm64"] | all(.[] as $platform;
                ($root[$platform].SLSA.buildDefinition | tostring | contains($digest)))
            ' "$image_dir/provenance.json" >/dev/null
          done < <(awk '/^FROM / {
            for (field = 1; field <= NF; field++) {
              if ($field ~ /@sha256:/) {
                sub(/^.*@/, "", $field)
                print $field
              }
            }
          }' Dockerfile)
      - name: Publish completed release transaction
        id: publish-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          go run ./hack/releaseverify \
            -tag "$GITHUB_REF_NAME" \
            -verify-tag-identity
          expected_names="$(printf '%s\n' \
            "$(basename '${{ steps.chart-package.outputs.path }}')" \
            release-manifest.txt \
            SHA256SUMS | sort)"
          mode='${{ steps.transaction.outputs.mode }}'
          release_json="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
          if [[ "$mode" == published ]]; then
            [[ "$(jq -r '.draft' <<<"$release_json")" == false ]]
            [[ "$(jq -r '.immutable' <<<"$release_json")" == true ]]
          else
            [[ "$(jq -r '.draft' <<<"$release_json")" == true ]]
          fi
          jq -j '.body' <<<"$release_json" > "$RUNNER_TEMP/publish-gate-body.txt"
          cmp dist/release-manifest.txt "$RUNNER_TEMP/publish-gate-body.txt"
          actual_names="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          [[ "$actual_names" == "$expected_names" ]]
          jq -e '[.assets[] | select(.state != "uploaded")] | length == 0' <<<"$release_json" >/dev/null
          gate_dir="$RUNNER_TEMP/publish-gate-assets"
          mkdir -p "$gate_dir"
          while IFS= read -r name; do
            gh release download "$GITHUB_REF_NAME" --pattern "$name" --dir "$gate_dir"
            cmp "dist/$name" "$gate_dir/$name"
            delay=2
            for attempt in {1..8}; do
              if gh attestation verify "$gate_dir/$name" \
                --repo "$GITHUB_REPOSITORY" \
                --source-ref "$GITHUB_REF" \
                --source-digest "$GITHUB_SHA" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
              then
                break
              fi
              if [[ "$attempt" == 8 ]]; then
                exit 1
              fi
              sleep "$delay"
              delay=$((delay < 30 ? delay * 2 : 30))
            done
          done <<<"$expected_names"
          go run ./hack/releaseverify \
            -tag "$GITHUB_REF_NAME" \
            -source-sha "$GITHUB_SHA" \
            -manifest "$gate_dir/release-manifest.txt" \
            -checksums "$gate_dir/SHA256SUMS" \
            -chart "$gate_dir/ptah-operator-${{ steps.release.outputs.version }}.tgz"
          if [[ "$mode" != published ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
            go run ./hack/releaseverify \
              -tag "$GITHUB_REF_NAME" \
              -verify-tag-identity
          fi
          release_json="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
          [[ "$(jq -r '.draft' <<<"$release_json")" == false ]]
          [[ "$(jq -r '.immutable' <<<"$release_json")" == true ]]
          jq -j '.body' <<<"$release_json" > "$RUNNER_TEMP/published-body.txt"
          cmp dist/release-manifest.txt "$RUNNER_TEMP/published-body.txt"
          actual_names="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          [[ "$actual_names" == "$expected_names" ]]
          verified=false
          error_file="$RUNNER_TEMP/release-verify-error.txt"
          delay=2
          for attempt in {1..8}; do
            if gh release verify "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" 2>"$error_file"; then
              verified=true
              break
            fi
            if [[ "$attempt" == 8 ]]; then
              break
            fi
            sleep "$delay"
            delay=$((delay < 30 ? delay * 2 : 30))
          done
          if [[ "$verified" != true ]]; then
            cat "$error_file" >&2
            exit 1
          fi
          while IFS= read -r name; do
            verified=false
            delay=2
            for attempt in {1..8}; do
              if gh release verify-asset "$GITHUB_REF_NAME" "$gate_dir/$name" \
                --repo "$GITHUB_REPOSITORY" 2>"$error_file"
              then
                verified=true
                break
              fi
              if [[ "$attempt" == 8 ]]; then
                break
              fi
              sleep "$delay"
              delay=$((delay < 30 ? delay * 2 : 30))
            done
            if [[ "$verified" != true ]]; then
              cat "$error_file" >&2
              exit 1
            fi
          done <<<"$expected_names"
