name: Documentation

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  # Same rule as ci.yml, on purpose: a newer run cancels the older one on every
  # ref, master included, because only the newest commit's site is the one that
  # gets built on and published. Do not narrow it back to pull requests.
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  site:
    name: Build and check the documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The compatibility catalog is what the site's version index reconciles
      # against, so the page that publishes it and the file it comes from are
      # checked in one place.
      - name: Verify the compatibility catalog
        run: go run ./hack/verifyptahsupport
      - name: Install site dependencies
        working-directory: docs/site
        run: npm ci
      # Without a browser the checks that drive a page skip, and a skip reads as
      # a pass. CI=1 makes them fail instead, so the browser is installed here.
      - name: Install the browser the page checks drive
        working-directory: docs/site
        run: npx playwright install --with-deps chromium
      # Every gate proves itself before it judges anything. A checker that
      # stopped checking passes over a broken site exactly as it passes over a
      # correct one.
      - name: Self-test the documentation gates
        working-directory: docs/site
        run: |
          set -euo pipefail
          npm run check:links:selftest
          npm run check:heading-anchors:selftest
          npm run check:faq-groups:selftest
          npm run check:faq-page:selftest
          npm run check:navigation:selftest
          npm run check:build-info:selftest
          npm run check:versions:selftest
          npm run check:gen-versions:selftest
          npm run check:values:selftest
          npm run check:demo:selftest
          npm run check:demo-page:selftest
          npm run check:translations:selftest
      - name: The values table matches the chart
        working-directory: docs/site
        run: npm run check:values
      # The README is not a site page, so nothing in the build sees it. This is
      # the step that holds the Japanese README to the English one: the prose is
      # a translation, the commands are the same bytes, and a flag that differs
      # between the two files is a defect rather than a choice.
      - name: The translated README matches the English one
        working-directory: docs/site
        run: npm run check:translations
      # The field reference is generated from the API types, so a field added
      # to a Go type without regenerating leaves a page the API has moved past.
      # This is the step that says so, and it runs on every pull request
      # because this workflow filters no paths.
      - name: The field reference matches the API types
        run: make docs-reference-check
      # The recording the site plays is held against the scenarios it claims to
      # be of, and against its own checks. A run published with a failed check
      # would be a demonstration of something that did not happen.
      - name: The recorded runs match their scenarios
        working-directory: docs/site
        run: npm run check:demo
      # The scenarios parse and state an expectation for every step. This runs
      # without a cluster: what it refuses is a scenario file that could not be
      # recorded, long before a lab is built for it.
      - name: The scenarios are valid
        run: |
          set -euo pipefail
          go test ./demo/...
          go run ./demo/cmd/record -root . -check
      - name: Build the development site
        working-directory: docs/site
        env:
          DOCS_VERSION: edge
          DOCS_SOURCE_REF: master
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Record what this build came from
        working-directory: docs/site
        env:
          DOCS_SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node scripts/write-build-info.mjs \
            --output dist/build-info.json \
            --version edge \
            --source-ref master \
            --source-commit "$DOCS_SOURCE_COMMIT"
      - name: Check the built site
        working-directory: docs/site
        env:
          DOCS_VERSION: edge
          DOCS_SOURCE_REF: master
          DOCS_SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          npm run check:links
          npm run check:navigation
          npm run check:heading-anchors
          npm run check:faq-groups
          npm run check:faq-page
          npm run check:build-info
          npm run check:demo-page
      # A release's pages are built from that release's own revision, so the
      # pull request proves that path too rather than only the one master
      # happens to take. It runs only when a release is declared: until then
      # there is nothing to build and pretending otherwise would invent a
      # version.
      - name: Build the oldest declared release from its own revision
        run: |
          set -euo pipefail
          release="$(
            node -e '
              const fs = require("node:fs");
              const catalog = JSON.parse(fs.readFileSync("support/ptah.json", "utf8"));
              const published = (catalog.releases ?? []).filter((entry) => entry.documentation?.published);
              const releases = published.filter((entry) => entry.operator !== "edge");
              if (releases.length === 0) { process.stdout.write(""); process.exit(0); }
              const oldest = releases[releases.length - 1];
              process.stdout.write(JSON.stringify({
                version: oldest.operator,
                ref: oldest.documentation.fixRevision || oldest.documentation.source,
              }));
            '
          )"
          if [ -z "$release" ]; then
            echo "no release declares a published guide yet; nothing to build from a tag"
            exit 0
          fi
          version="$(printf '%s' "$release" | node -e 'process.stdin.on("data", (d) => process.stdout.write(JSON.parse(d).version))')"
          ref="$(printf '%s' "$release" | node -e 'process.stdin.on("data", (d) => process.stdout.write(JSON.parse(d).ref))')"
          workdir="$(mktemp -d)"
          trap 'git worktree remove --force "$workdir" >/dev/null 2>&1 || true' EXIT
          commit="$(git rev-parse --verify "${ref}^{commit}")"
          git worktree add --force "$workdir" "$commit"
          (
            cd "$workdir/docs/site"
            npm ci
            DOCS_VERSION="$version" DOCS_SOURCE_REF="$ref" ASTRO_TELEMETRY_DISABLED=1 npm run build
            node scripts/write-build-info.mjs \
              --output dist/build-info.json \
              --version "$version" \
              --source-ref "$ref" \
              --source-commit "$commit"
            DOCS_VERSION="$version" npm run check:links
            DOCS_VERSION="$version" DOCS_SOURCE_REF="$ref" DOCS_SOURCE_COMMIT="$commit" npm run check:build-info
          )
