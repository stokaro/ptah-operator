name: Fresh installation

# The published installation guide, executed as a reader runs it.
#
# A fresh kind cluster, the released assets downloaded and verified with the
# commands the release guide prints, the chart installed by digest, and the
# first schema applied, approved and converged. The guide's resource is one
# engine's, so PostgreSQL and MySQL each get a cluster of their own.
# support/qualification/probes/fresh_install.py reads those commands out of the
# documentation at the release commit; what a reader brings -- the database,
# a registry and the schema published with the pinned Ptah release's own
# binary -- is a fixture kept apart from them, and every substitution is in the
# transcript it uploads.
#
# It runs on request against a published release tag. The release has to be
# published first: the guide verifies the immutable release, which a draft is
# not.
#
# With upgrade_from, each cluster first installs that published release through
# its own guide and converges the schema on it, then upgrades to the tag as the
# operations guide describes and requires the runtime on the tag's image with
# the schema still converged, refreshed by the new manager.
#
# A fresh installation also runs the monitoring deployment check on a third
# cluster: the guide's installation with the profile's monitoring values beside
# a Prometheus Operator stack, scraped through the chart's own ServiceMonitor,
# with the lost-view alert and its resolution delivered to a receiver.
# support/qualification/probes/monitoring_check.py says what it requires. It is
# PA-09's evidence that the chart's monitoring works as shipped, which the CI
# alerting suites do not measure: they scrape the managers with a Prometheus
# configuration of their own (#673, #675).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to install, such as v0.2.0
        type: string
        required: true
      upgrade_from:
        description: Published release to install first and upgrade from, such as v0.2.0; empty for a fresh installation
        type: string
        required: false
        default: ''
      architecture:
        description: Native runner architecture
        type: choice
        required: true
        default: amd64
        options: [amd64, arm64]

permissions:
  contents: read

concurrency:
  group: fresh-install-${{ github.ref }}-${{ inputs.architecture }}-${{ inputs.upgrade_from }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  install:
    name: Install ${{ inputs.tag }}${{ inputs.upgrade_from && format(' over {0}', inputs.upgrade_from) || '' }} from the guide on ${{ inputs.architecture }}
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Read the newest supported minor and the verified Ptah release
        id: support
        shell: bash
        run: |
          set -euo pipefail
          newest="$(go run ./hack/verify-kubernetes-support.go -output=matrix | jq -c 'last')"
          for field in kind_version kubernetes_version node_image; do
            printf '%s=%s\n' "$field" "$(jq -er --arg field "$field" '.[$field]' <<<"$newest")" >> "$GITHUB_OUTPUT"
          done
          printf 'ptah_version=%s\n' "$(go run ./hack/verifyptahsupport -output=version)" >> "$GITHUB_OUTPUT"
          # The fixture images are the ones the acceptance suite mirrors, read
          # from the harness so the two cannot name different builds.
          for name in POSTGRES MYSQL; do
            image="$(sed -n "s/^E2E_${name}_SOURCE_IMAGE=\${E2E_${name}_SOURCE_IMAGE:-\(.*\)}$/\1/p" hack/e2e-kind.sh)"
            [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]]
            printf '%s_image=%s\n' "${name,,}" "$image" >> "$GITHUB_OUTPUT"
          done
          # shellcheck disable=SC2016 # the pattern matches the harness's literal ${...}.
          image="$(sed -n 's/^E2E_REGISTRY_IMAGE=${E2E_REGISTRY_IMAGE:-\(.*\)}$/\1/p' hack/e2e-kind.sh)"
          [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]]
          printf 'registry_image=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v4.3.0
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Install kind and the matching kubectl
        shell: bash
        run: |
          set -euo pipefail
          go install "sigs.k8s.io/kind@${{ steps.support.outputs.kind_version }}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          install_dir="$RUNNER_TEMP/bin"
          mkdir -p "$install_dir"
          base_url="https://dl.k8s.io/release/v${{ steps.support.outputs.kubernetes_version }}/bin/linux/$(go env GOHOSTARCH)"
          curl --fail --location --silent --show-error --output "$install_dir/kubectl" "$base_url/kubectl"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/kubectl.sha256" "$base_url/kubectl.sha256"
          echo "$(<"$RUNNER_TEMP/kubectl.sha256")  $install_dir/kubectl" | sha256sum --check
          chmod 0755 "$install_dir/kubectl"
          echo "$install_dir" >> "$GITHUB_PATH"
      # A reader publishes with the Ptah release the executor image is, so the
      # binary is that release's own, checked against the checksums it published.
      - name: Download the Ptah release a reader publishes with
        env:
          PTAH_VERSION: ${{ steps.support.outputs.ptah_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PTAH_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${PTAH_VERSION#v}"
          archive="ptah_${version}_linux_$(go env GOHOSTARCH).tar.gz"
          release="https://github.com/stokaro/ptah/releases/download/$PTAH_VERSION"
          download="$RUNNER_TEMP/ptah-download"
          mkdir -p "$download"
          curl --fail --location --silent --show-error --output "$download/$archive" "$release/$archive"
          curl --fail --location --silent --show-error --output "$download/checksums.txt" "$release/checksums.txt"
          (cd "$download" && grep -E "  ${archive}\$" checksums.txt | sha256sum --check --strict)
          tar -xzf "$download/$archive" -C "$download" ptah
          install -m 0755 "$download/ptah" "$RUNNER_TEMP/bin/ptah"
          "$RUNNER_TEMP/bin/ptah" --version
      - name: Install on a fresh cluster and converge a PostgreSQL schema
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUIDE_TAG: ${{ inputs.tag }}
          UPGRADE_FROM: ${{ inputs.upgrade_from }}
          GUIDE_POSTGRES_IMAGE: ${{ steps.support.outputs.postgres_image }}
          GUIDE_REGISTRY_IMAGE: ${{ steps.support.outputs.registry_image }}
          NODE_IMAGE: ${{ steps.support.outputs.node_image }}
        shell: bash
        run: |
          set -euo pipefail
          kind create cluster --name ptah-guide-postgresql --image "$NODE_IMAGE" --wait 5m
          kubectl get nodes -o wide
          upgrade=()
          if [[ -n "$UPGRADE_FROM" ]]; then upgrade=(--upgrade-from "$UPGRADE_FROM"); fi
          GUIDE_BIN="$RUNNER_TEMP/bin" python3 support/qualification/probes/fresh_install.py \
            --tag "$GUIDE_TAG" --engine postgresql "${upgrade[@]}" \
            --work "$RUNNER_TEMP/guide-postgresql" \
            --evidence "$RUNNER_TEMP/guide-evidence/postgresql"
          kind delete cluster --name ptah-guide-postgresql
      # MySQL runs whether or not PostgreSQL passed, so one engine's failure
      # cannot hide the other's result.
      - name: Install on a fresh cluster and converge a MySQL schema
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUIDE_TAG: ${{ inputs.tag }}
          UPGRADE_FROM: ${{ inputs.upgrade_from }}
          GUIDE_MYSQL_IMAGE: ${{ steps.support.outputs.mysql_image }}
          GUIDE_REGISTRY_IMAGE: ${{ steps.support.outputs.registry_image }}
          NODE_IMAGE: ${{ steps.support.outputs.node_image }}
        shell: bash
        run: |
          set -euo pipefail
          kind delete cluster --name ptah-guide-postgresql
          kind create cluster --name ptah-guide-mysql --image "$NODE_IMAGE" --wait 5m
          kubectl get nodes -o wide
          upgrade=()
          if [[ -n "$UPGRADE_FROM" ]]; then upgrade=(--upgrade-from "$UPGRADE_FROM"); fi
          GUIDE_BIN="$RUNNER_TEMP/bin" python3 support/qualification/probes/fresh_install.py \
            --tag "$GUIDE_TAG" --engine mysql "${upgrade[@]}" \
            --work "$RUNNER_TEMP/guide-mysql" \
            --evidence "$RUNNER_TEMP/guide-evidence/mysql"
      # The check installs no database, so it runs whether or not either
      # engine passed. An upgrade run leaves it to the fresh run of the tag.
      - name: Install with the chart's monitoring and deliver the lost-view alert
        if: ${{ !cancelled() && inputs.upgrade_from == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUIDE_TAG: ${{ inputs.tag }}
          NODE_IMAGE: ${{ steps.support.outputs.node_image }}
        shell: bash
        run: |
          set -euo pipefail
          kind delete cluster --name ptah-guide-postgresql
          kind delete cluster --name ptah-guide-mysql
          kind create cluster --name ptah-guide-monitoring --image "$NODE_IMAGE" --wait 5m
          kubectl get nodes -o wide
          GUIDE_BIN="$RUNNER_TEMP/bin" python3 support/qualification/probes/monitoring_check.py \
            --tag "$GUIDE_TAG" \
            --work "$RUNNER_TEMP/guide-monitoring" \
            --evidence "$RUNNER_TEMP/guide-evidence/monitoring"
      - name: Preserve the transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fresh-install-${{ inputs.architecture }}${{ inputs.upgrade_from && format('-from-{0}', inputs.upgrade_from) || '' }}
          path: ${{ runner.temp }}/guide-evidence
          if-no-files-found: warn
          retention-days: 90
      - name: Remove the clusters
        if: always()
        run: |
          kind delete cluster --name ptah-guide-postgresql
          kind delete cluster --name ptah-guide-mysql
          kind delete cluster --name ptah-guide-monitoring
