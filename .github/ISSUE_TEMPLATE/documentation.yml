name: Documentation
description: A page is wrong, missing, out of date, or hard to follow.
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Write a short title in plain English that names the problem or intended
        result. Avoid internal names and unexplained acronyms.

  - type: textarea
    id: detail
    attributes:
      label: Problem summary
      description: >-
        In a short paragraph, usually two to four sentences, explain what is
        wrong, missing, or hard to follow and how it affects the reader.
        Use plain English. After the introduction, quote the relevant sentence
        where you can. If you measured the behavior, say what you ran and got.
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Which page
      description: The URL, or the path under `docs/`.
      placeholder: "https://operator.ptah.run/use/approvals/"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What is wrong with it
      options:
        - It states something that is not true
        - It is out of date
        - It is missing something a reader needs
        - It is accurate but hard to follow
        - A link, an example, or a command does not work
    validations:
      required: true
