<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ptah's stacked mark, enclosed. The three bars are the schema Ptah
       builds; the ring around them is the cluster this operator converges it
       in, which is the whole of what the operator adds. -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 5"/>
  <rect x="26" y="20" width="12" height="7" rx="2" fill="#f59e0b"/>
  <rect x="22" y="29" width="20" height="7" rx="2" fill="#38bdf8"/>
  <rect x="18" y="38" width="28" height="7" rx="2" fill="#38bdf8"/>
</svg>
