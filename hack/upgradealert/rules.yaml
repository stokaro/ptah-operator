groups:
  - name: ptah-upgrade-observer
    interval: 5s
    rules:
      - alert: PtahOperatorUpgradeFailed
        expr: |
          (max by (operator_namespace, release) (ptah_operator_upgrade_pending) == 1)
          and on (operator_namespace, release)
          (
            (max by (operator_namespace, release) (ptah_operator_upgrade_failed) == 1)
            or (time() >= min by (operator_namespace, release) (ptah_operator_upgrade_deadline_seconds))
            or (max by (operator_namespace, release) (ptah_operator_upgrade_history_lost) == 1)
          )
        labels:
          severity: critical
        annotations:
          summary: 'Upgrade of {{ $labels.operator_namespace }}/{{ $labels.release }} has failed or has not reached verified recovery'
          runbook_url: 'https://operator.ptah.run/use/operations/#retry-upgrade'
      - alert: PtahOperatorUpgradeObserverUnavailable
        expr: |
          (up{job="ptah-upgrade-observer"} == 0)
          or absent(up{job="ptah-upgrade-observer"})
          or (
            (up{job="ptah-upgrade-observer"} == 1)
            unless on (job, instance)
            (ptah_operator_upgrade_observer_ready{job="ptah-upgrade-observer"} == 1)
          )
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: 'The external Ptah upgrade observer is unavailable; upgrade evidence is incomplete'
          runbook_url: 'https://operator.ptah.run/use/operations/#retry-upgrade'
