{{- define "ptah-operator.validateAdmissionConvergenceMarker" -}}
{{- $root := .root -}}
{{- $marker := .marker -}}
{{- $sequence := .sequence -}}
{{- $managerImage := .managerImage -}}
{{- $metadata := default (dict) $marker.metadata -}}
{{- $annotations := default (dict) $metadata.annotations -}}
{{- $labels := default (dict) $metadata.labels -}}
{{- $data := default (dict) $marker.data -}}
{{- $inventory := default "" (index $data "predecessor-retirement-inventory") -}}
{{- $sealed := and (default false $marker.immutable) (eq (len $data) 3) (regexMatch `^\{"version":"1","entries":\[.+\]\}$` $inventory) -}}
{{- $unsealed := and (not (default false $marker.immutable)) (eq (len $data) 2) (not (hasKey $data "predecessor-retirement-inventory")) -}}
{{- $attempt := printf "%s\n%s\n%s\n%s" $root.Release.Namespace $root.Release.Name $sequence $managerImage | sha256sum -}}
{{- $cleanupBase := include "ptah-operator.fullname" $root | trunc 24 | trimSuffix "-" -}}
{{- $cleanupServiceAccount := printf "%s-cleanup-v%s-%s" $cleanupBase $sequence ($attempt | trunc 12) -}}
{{- if or
      (ne (default "" $marker.apiVersion) "v1")
      (ne (default "" $marker.kind) "ConfigMap")
      (ne (default "" $metadata.name) .name)
      (ne (default "" $metadata.namespace) $root.Release.Namespace)
      (ne (default "" $metadata.generateName) "")
      (eq (default "" $metadata.uid) "")
      (eq (default "" $metadata.resourceVersion) "")
      (not (empty $metadata.deletionTimestamp))
      (not (empty $metadata.deletionGracePeriodSeconds))
      (ne (len $annotations) 10)
      (ne (default "" (index $annotations "helm.sh/hook")) "pre-install,pre-upgrade")
      (ne (default "" (index $annotations "helm.sh/hook-weight")) "-165")
      (ne (default "" (index $annotations "helm.sh/resource-policy")) "keep")
      (ne (default "" (index $annotations "operator.ptah.run/admission-convergence-version")) "1")
      (ne (default "" (index $annotations "operator.ptah.run/predecessor-retirement-inventory-version")) "1")
      (ne (default "" (index $annotations "operator.ptah.run/admission-convergence-cleanup-service-account")) $cleanupServiceAccount)
      (ne (default "" (index $annotations "operator.ptah.run/manager-image")) $managerImage)
      (ne (default "" (index $annotations "operator.ptah.run/release-name")) $root.Release.Name)
      (ne (default "" (index $annotations "operator.ptah.run/release-namespace")) $root.Release.Namespace)
      (ne (default "" (index $annotations "operator.ptah.run/release-sequence")) $sequence)
      (ne (len $labels) 3)
      (ne (default "" (index $labels "app.kubernetes.io/managed-by")) "ptah-operator")
      (ne (default "" (index $labels "app.kubernetes.io/instance")) $root.Release.Name)
      (ne (default "" (index $labels "app.kubernetes.io/component")) "admission-convergence")
      (ne (default "" (index $data "expected-active-release-sequence")) $sequence)
      (ne (default "" (index $data "release-attempt")) $attempt)
      (not (or $unsealed $sealed))
      (and .requireSealed (not $sealed))
      (ne (len (default (dict) $marker.binaryData)) 0)
      (ne (len (default (list) $metadata.ownerReferences)) 0)
      (ne (len (default (list) $metadata.finalizers)) 0) -}}
{{- fail (printf "retained admission convergence marker %s has foreign, malformed, or different attempt identity" .name) -}}
{{- end -}}
{{- end -}}

{{- define "ptah-operator.validateAdmissionConvergenceInventoryMarker" -}}
{{- $marker := .marker -}}
{{- $name := .name -}}
{{- $itemSequence := .itemSequence -}}
{{- $itemAnnotations := default (dict) $marker.metadata.annotations -}}
{{- $itemManagerImage := default "" (index $itemAnnotations "operator.ptah.run/manager-image") -}}
{{- if not (regexMatch `^[^[:space:]@]+@sha256:[0-9a-f]{64}$` $itemManagerImage) -}}
{{- fail (printf "retained admission convergence marker %s has an invalid manager identity" $name) -}}
{{- end -}}
{{- $contractManagerImage := $itemManagerImage -}}
{{- if eq $itemSequence .currentSequence -}}
{{- if ne $itemManagerImage .currentManagerImage -}}
{{- fail (printf "retained admission convergence marker %s belongs to a different current release attempt" $name) -}}
{{- end -}}
{{- $contractManagerImage = .currentManagerImage -}}
{{- end -}}
{{- include "ptah-operator.validateAdmissionConvergenceMarker" (dict "root" .root "marker" $marker "name" $name "sequence" $itemSequence "managerImage" $contractManagerImage "requireSealed" .requireSealed) -}}
{{- end -}}

{{- /* The sequence-keyed admission marker. The reconcile hook seals it with the
      exact admission inventory this release installed, and the next release's
      hook reads that inventory back to retire it. */ -}}
{{- $markerName := include "ptah-operator.admissionConvergenceMarkerName" . -}}
{{- $sequence := include "ptah-operator.releaseSequence" . -}}
{{- $previousSequence := include "ptah-operator.predecessorReleaseSequence" . -}}
{{- $managerImage := include "ptah-operator.managerImage" . -}}
{{- $attempt := include "ptah-operator.hookIdentityDigest" . -}}
{{- $cleanupServiceAccount := include "ptah-operator.teardownServiceAccountName" . -}}
{{- $releaseDigest := printf "%s\n%s" .Release.Namespace .Release.Name | sha256sum | trunc 12 -}}
{{- $markerPrefix := "ptah-admission-convergence-v1-" -}}
{{- $markerSuffix := printf "-%s" $releaseDigest -}}
{{- $markerInventory := lookup "v1" "ConfigMap" .Release.Namespace "" -}}
{{- $activationForMarkerInventory := lookup "v1" "ConfigMap" .Release.Namespace "ptah-operator-release-activation" -}}
{{- $activeMarkerSequence := dig "data" "active-release-sequence" "0" $activationForMarkerInventory -}}
{{- $markers := dict -}}
{{- range $item := dig "items" (list) $markerInventory -}}
{{- $name := default "" $item.metadata.name -}}
{{- if and (hasPrefix $markerPrefix $name) (hasSuffix $markerSuffix $name) -}}
{{- $itemSequence := trimSuffix $markerSuffix (trimPrefix $markerPrefix $name) -}}
{{- if not (regexMatch `^[1-9][0-9]*$` $itemSequence) -}}
{{- fail (printf "retained admission convergence marker %s has a malformed release sequence" $name) -}}
{{- end -}}
{{- if not (or (eq $itemSequence $sequence) (and (ne $previousSequence "0") (eq $itemSequence $previousSequence))) -}}
{{- fail (printf "retained admission convergence marker %s is stale, future, or creates a release-sequence gap" $name) -}}
{{- end -}}
{{- $requireSealed := or (and (ne $previousSequence "0") (eq $itemSequence $previousSequence)) (eq $itemSequence $activeMarkerSequence) -}}
{{- include "ptah-operator.validateAdmissionConvergenceInventoryMarker" (dict "root" $ "marker" $item "name" $name "itemSequence" $itemSequence "currentSequence" $sequence "currentManagerImage" $managerImage "requireSealed" $requireSealed) -}}
{{- $_ := set $markers $itemSequence $item -}}
{{- end -}}
{{- end -}}
{{- if gt (len $markers) 2 -}}
{{- fail "retained admission convergence marker inventory exceeds the active/candidate bound" -}}
{{- end -}}
{{- $marker := default (dict) (index $markers $sequence) -}}
{{- if not $marker }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $markerName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-165"
    helm.sh/resource-policy: keep
    operator.ptah.run/admission-convergence-version: "1"
    operator.ptah.run/predecessor-retirement-inventory-version: "1"
    operator.ptah.run/admission-convergence-cleanup-service-account: {{ $cleanupServiceAccount | quote }}
    operator.ptah.run/release-name: {{ .Release.Name | quote }}
    operator.ptah.run/release-namespace: {{ .Release.Namespace | quote }}
    operator.ptah.run/release-sequence: {{ $sequence | quote }}
    operator.ptah.run/manager-image: {{ $managerImage | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: admission-convergence
data:
  expected-active-release-sequence: {{ $sequence | quote }}
  release-attempt: {{ $attempt | quote }}
{{- end }}
