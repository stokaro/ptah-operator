{{- if and .Values.certificateRotation.enabled (not .Values.webhook.existingSecret) .Values.certificateRotation.recreateMissingSecret }}
{{- $rotatorName := include "ptah-operator.certRotatorServiceAccountName" . -}}
{{- $secretName := include "ptah-operator.webhookSecretName" . -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $rotatorName }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
        scope: Namespaced
  matchConditions:
    - name: exact-certificate-rotator-service-account
      expression: {{ printf `request.userInfo.username == 'system:serviceaccount:%s:%s'` .Release.Namespace $rotatorName | quote }}
  validations:
    - expression: {{ printf `object.metadata.name == '%s' && object.metadata.namespace == '%s' && (!has(object.metadata.generateName) || object.metadata.generateName == '') && has(object.metadata.labels) && object.metadata.labels == {'operator.ptah.run/generated-webhook-certificate': 'true', 'app.kubernetes.io/managed-by': 'Helm'} && has(object.metadata.annotations) && object.metadata.annotations == {'meta.helm.sh/release-name': '%s', 'meta.helm.sh/release-namespace': '%s'} && (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0) && (!has(object.metadata.finalizers) || object.metadata.finalizers.size() == 0) && object.type == 'kubernetes.io/tls' && !has(object.immutable) && (!has(object.stringData) || object.stringData.size() == 0) && object.data.size() == 4 && 'ca.crt' in object.data && object.data['ca.crt'].size() > 0 && 'ca.key' in object.data && object.data['ca.key'].size() > 0 && 'tls.crt' in object.data && object.data['tls.crt'].size() > 0 && 'tls.key' in object.data && object.data['tls.key'].size() > 0` $secretName .Release.Namespace .Release.Name .Release.Namespace | quote }}
      message: "certificate rotator Secret CREATE is outside its exact recovery contract"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $rotatorName }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
spec:
  policyName: {{ $rotatorName }}
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
  validationActions: [Deny]
{{- end }}
