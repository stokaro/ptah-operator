apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "ptah-operator.jobOrphanDeletionGuardPolicyName" . }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: job-orphan-deletion-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["*"]
        operations: ["DELETE"]
        resources: ["jobs"]
        scope: Namespaced
  matchConditions:
    - name: operation-job
      expression: {{ `has(oldObject.metadata.labels) && "app.kubernetes.io/managed-by" in oldObject.metadata.labels && oldObject.metadata.labels["app.kubernetes.io/managed-by"] == "ptah-operator" && "app.kubernetes.io/component" in oldObject.metadata.labels && oldObject.metadata.labels["app.kubernetes.io/component"] in ["schema-operation", "migration-operation"]` | quote }}
  variables:
    - name: orphanRequested
      expression: {{ `has(request.options.orphanDependents) ? request.options.orphanDependents : has(request.options.propagationPolicy) && request.options.propagationPolicy == "Orphan"` | quote }}
    - name: propagationNamed
      expression: "has(request.options.orphanDependents) || has(request.options.propagationPolicy)"
    - name: foregroundFinalizer
      expression: {{ `has(oldObject.metadata.finalizers) && "foregroundDeletion" in oldObject.metadata.finalizers` | quote }}
  validations:
    - expression: "!variables.orphanRequested"
      message: "An operation Job's deletion cannot orphan its Pods: the garbage collector would have to take the Job's owner reference off each Pod, which the Pod intent webhook refuses because the manager finds an Apply's executor through the Pods its Job owns, so the Job would stay Terminating. Delete it with kubectl's default propagation, Background, and save the Pod log with kubectl logs before you do if you need it"
      reason: Forbidden
    - expression: "variables.propagationNamed || variables.foregroundFinalizer"
      message: "A Job deletion that names no propagation orphans the Job's Pods, by the batch/v1 default or the orphan finalizer the Job carries, and an operation Job's Pods cannot be orphaned, so the Job would stay Terminating. Name propagationPolicy: Background, which kubectl delete sends by default"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "ptah-operator.jobOrphanDeletionGuardPolicyName" . }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: job-orphan-deletion-guard
spec:
  policyName: {{ include "ptah-operator.jobOrphanDeletionGuardPolicyName" . }}
  matchResources:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["*"]
        operations: ["DELETE"]
        resources: ["jobs"]
        scope: Namespaced
  validationActions: [Deny]
