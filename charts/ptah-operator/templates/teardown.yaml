{{- include "ptah-operator.validateLifecycleResourceIdentities" . -}}
{{- $hookServiceAccountName := include "ptah-operator.crdManagerServiceAccountName" . -}}
{{- $quiesceName := include "ptah-operator.teardownQuiesceJobName" . -}}
{{- $controllerName := include "ptah-operator.fullname" . -}}
{{- $certificateName := include "ptah-operator.certRotatorServiceAccountName" . -}}
{{- $certificateRuntimeEnabled := and .Values.certificateRotation.enabled (not .Values.webhook.existingSecret) -}}
{{- $stagingSecretName := include "ptah-operator.certRotationStagingSecretName" . -}}
{{- $stagingSecretGuardName := include "ptah-operator.stagingSecretGuardPolicyName" . -}}
{{- $activationName := "ptah-operator-release-activation" -}}
{{- $probeObjectName := include "ptah-operator.hookIdentityProbeObjectName" . -}}
{{- $rolloutGuardName := include "ptah-operator.rolloutGuardPolicyName" . -}}
{{- $runtimeGuardName := include "ptah-operator.runtimeGuardPolicyName" . -}}
{{- $runtimePodGuardName := include "ptah-operator.runtimePodGuardPolicyName" . -}}
{{- $hookIdentityGuardName := include "ptah-operator.hookIdentityGuardPolicyName" . -}}
{{- $hookProbeGuardName := include "ptah-operator.hookIdentityProbeGuardPolicyName" . -}}
{{- $activationGuardName := include "ptah-operator.releaseActivationGuardPolicyName" . -}}
{{- $admissionConvergenceMarkerName := include "ptah-operator.admissionConvergenceMarkerName" . -}}
{{- $serviceAccountOriginGuardName := include "ptah-operator.serviceAccountOriginGuardPolicyName" . -}}
{{- $controllerWriteGuardName := include "ptah-operator.controllerWriteGuardPolicyName" . -}}
{{- $controllerJobWriteGuardName := include "ptah-operator.controllerJobWriteGuardPolicyName" . -}}
{{- $controllerChunkWriteGuardName := include "ptah-operator.controllerChunkWriteGuardPolicyName" . -}}
{{- $controllerPlanWriteGuardName := include "ptah-operator.controllerPlanWriteGuardPolicyName" . -}}
{{- $controllerMigrationPlanWriteGuardName := include "ptah-operator.controllerMigrationPlanWriteGuardPolicyName" . -}}
{{- $certificateMutatingWriteGuardName := include "ptah-operator.certificateMutatingWriteGuardPolicyName" . -}}
{{- $certificateValidatingWriteGuardName := include "ptah-operator.certificateValidatingWriteGuardPolicyName" . -}}
{{- $namespaceGuardName := include "ptah-operator.namespaceDeletionGuardPolicyName" . -}}
{{- $parentReplicaSetGuardName := include "ptah-operator.parentReplicaSetGuardPolicyName" . -}}
{{- $parentHookPodOriginGuardName := include "ptah-operator.parentHookPodOriginGuardPolicyName" . -}}
{{- $parentHookJobOriginGuardName := include "ptah-operator.parentHookJobOriginGuardPolicyName" . -}}
{{- $parentHookJobContractGuardName := include "ptah-operator.parentHookJobContractPolicyName" . -}}
{{- $releaseDigest := printf "%s\n%s" .Release.Namespace .Release.Name | sha256sum | trunc 12 -}}
{{- $parentOriginReadyName := printf "ptah-operator-parent-origin-ready-v2-%s" $releaseDigest -}}
{{- $serviceAccountObjectGuardName := printf "ptah-operator-service-account-object-guard-v1-%s" $releaseDigest -}}
{{/*
The uninstall is one pre-delete Job. It stops the runtime and then deletes, by
exact name, what the release keeps outside Helm's own deletion: the admission
guards and their bindings, the ConfigMaps the release keeps across upgrades,
and the certificate staging Secret, whose own guard refuses a Helm deletion.
Helm deletes everything else in the release after the Job succeeds.

The Job keeps the name, identity and arguments of the quiesce step it began as,
because the retained guards admit exactly that Job while they still stand.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $hookServiceAccountName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-110"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-manager
automountServiceAccountToken: false
---
# The uninstall identity reads and deletes the exact admission guards the
# release keeps. It cannot change CRDs, and it reads nothing else
# cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $quiesceName }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-100"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-manager-teardown-quiesce
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    resourceNames:
      - {{ $rolloutGuardName }}
      - {{ $runtimeGuardName }}
      - {{ $runtimePodGuardName }}
      - {{ $hookIdentityGuardName }}
      - {{ $hookProbeGuardName }}
      - {{ $activationGuardName }}
      - {{ $serviceAccountObjectGuardName }}
      - {{ $serviceAccountOriginGuardName }}
      - {{ $controllerWriteGuardName }}
      - {{ $controllerJobWriteGuardName }}
      - {{ $controllerChunkWriteGuardName }}
      - {{ $controllerPlanWriteGuardName }}
      - {{ $controllerMigrationPlanWriteGuardName }}
      - {{ $certificateMutatingWriteGuardName }}
      - {{ $certificateValidatingWriteGuardName }}
      - {{ $namespaceGuardName }}
      - {{ $parentReplicaSetGuardName }}
      - {{ $parentHookPodOriginGuardName }}
      - {{ $parentHookJobOriginGuardName }}
      - {{ $parentHookJobContractGuardName }}
      {{- if $certificateRuntimeEnabled }}
      - {{ $stagingSecretGuardName }}
      {{- end }}
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $quiesceName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-100"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-manager-teardown-quiesce
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ $controllerName | quote }}, {{ $certificateName | quote }}]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  # The stop is recorded in the release activation before the runtime is
  # scaled to zero, and the parameter is the last object deleted.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $activationName | quote }}]
    verbs: ["get", "update", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $admissionConvergenceMarkerName | quote }}, {{ $probeObjectName | quote }}, {{ $parentOriginReadyName | quote }}]
    verbs: ["get", "delete"]
  {{- if $certificateRuntimeEnabled }}
  # Deleted by name and never read: the staging Secret holds a pending CA
  # private key.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $stagingSecretName | quote }}]
    verbs: ["delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $quiesceName }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-90"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-manager-teardown-quiesce
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $quiesceName }}
subjects:
  - kind: ServiceAccount
    name: {{ $hookServiceAccountName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $quiesceName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-90"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-manager-teardown-quiesce
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $quiesceName }}
subjects:
  - kind: ServiceAccount
    name: {{ $hookServiceAccountName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $quiesceName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-manager-teardown-quiesce
spec:
  activeDeadlineSeconds: 210
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "ptah-operator.labels" . | nindent 8 }}
        app.kubernetes.io/component: crd-manager-teardown-quiesce
    spec:
      serviceAccountName: {{ $hookServiceAccountName }}
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: crd-manager-teardown-quiesce
          image: {{ include "ptah-operator.managerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/ptah-crd-manager"]
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          args:
            {{- range (include "ptah-operator.crdManagerArgsJSON" (dict "root" . "mode" "teardown-quiesce" "timeout" "180s" "verifyControllerState" false) | fromJsonArray) }}
            - {{ . | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
