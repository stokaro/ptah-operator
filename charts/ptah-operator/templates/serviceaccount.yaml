{{- if .Values.serviceAccount.create }}
{{- $annotations := default (dict) .Values.serviceAccount.annotations -}}
{{- $enforceMountableSecrets := default "" (index $annotations "kubernetes.io/enforce-mountable-secrets") -}}
{{- if and (hasKey $annotations "kubernetes.io/enforce-mountable-secrets") (not (has $enforceMountableSecrets (list "1" "t" "T" "TRUE" "true" "True" "0" "f" "F" "FALSE" "false" "False"))) }}
{{- fail "serviceAccount.annotations kubernetes.io/enforce-mountable-secrets must be a boolean value" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ptah-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- if has $enforceMountableSecrets (list "1" "t" "T" "TRUE" "true" "True") }}
secrets:
  - name: {{ include "ptah-operator.webhookSecretName" . }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
