{{- $releaseDigest := printf "%s\n%s" .Release.Namespace .Release.Name | sha256sum | trunc 12 -}}
{{- $guardName := printf "ptah-operator-service-account-object-guard-v1-%s" $releaseDigest -}}
{{- $markerPattern := printf "^ptah-admission-convergence-v1-[1-9][0-9]*-%s$" $releaseDigest -}}
{{- $probeDigest := printf "1\n%s\n%s" $guardName $markerPattern | sha256sum -}}
{{- $probeFieldManager := printf "ptah-service-account-object-probe-v1-%s" $probeDigest -}}
{{- $probeMessage := printf "Ptah admission convergence confirmed exact service account object guard %s" $probeFieldManager -}}
{{- $probeExpression := printf `request.operation == "UPDATE" && request.resource.group == "" && request.resource.version == "v1" && request.resource.resource == "configmaps" && (!has(request.subResource) || request.subResource == "") && request.namespace == %q && request.name.matches(%q) && has(request.options) && has(request.options.fieldManager) && request.options.fieldManager == %q` .Release.Namespace $markerPattern $probeFieldManager -}}
{{- $namespaceGuardName := include "ptah-operator.namespaceDeletionGuardPolicyName" . -}}
{{- $sequence := include "ptah-operator.releaseSequence" . -}}
{{- $hookServiceAccount := include "ptah-operator.crdManagerServiceAccountName" . -}}
{{- $hookSuffix := printf "-crd-v%s-%s" $sequence (include "ptah-operator.hookIdentityDigest" . | trunc 12) -}}
{{- if not (hasSuffix $hookSuffix $hookServiceAccount) -}}
{{- fail "service account object guard hook ServiceAccount does not match the candidate release identity" -}}
{{- end -}}
{{- $hookBase := trimSuffix $hookSuffix $hookServiceAccount -}}
{{- if eq $hookBase "" -}}
{{- fail "service account object guard hook ServiceAccount has no stable name prefix" -}}
{{- end -}}
{{- $controllerServiceAccount := include "ptah-operator.serviceAccountName" . -}}
{{- $previousControllerServiceAccount := include "ptah-operator.previousControllerServiceAccountName" . -}}
{{- $previousControllerManaged := eq (include "ptah-operator.previousControllerServiceAccountManaged" .) "true" -}}
{{- $previousControllerSequence := include "ptah-operator.previousControllerReleaseSequence" . -}}
{{- if not (regexMatch "^(0|[1-9][0-9]*)$" $previousControllerSequence) -}}
{{- fail "predecessor controller release sequence is not canonical" -}}
{{- end -}}
{{- $controllerBase := "" -}}
{{- $controllerPattern := "" -}}
{{- $managedControllerTemplate := "false" -}}
{{- $externalControllerTemplate := "false" -}}
{{- if .Values.serviceAccount.create -}}
{{- $currentPattern := printf "^.+-v%s-[0-9a-f]{12}$" $sequence -}}
{{- if not (regexMatch $currentPattern $controllerServiceAccount) -}}
{{- fail "managed controller ServiceAccount does not encode the candidate release sequence" -}}
{{- end -}}
{{- $controllerBase = regexReplaceAll (printf "-v%s-[0-9a-f]{12}$" $sequence) $controllerServiceAccount "" -}}
{{- if or (eq $controllerBase "") (eq $controllerBase $controllerServiceAccount) -}}
{{- fail "managed controller ServiceAccount does not have a stable release prefix" -}}
{{- end -}}
{{- $controllerPattern = printf "^%s-v[1-9][0-9]*-[0-9a-f]{12}$" (regexQuoteMeta $controllerBase) -}}
{{- $managedControllerTemplate = `%s.matches(%q)` -}}
{{- else -}}
{{- $currentSuffix := printf "-v%s" $sequence -}}
{{- if not (hasSuffix $currentSuffix $controllerServiceAccount) -}}
{{- fail "external controller ServiceAccount does not encode the candidate release sequence" -}}
{{- end -}}
{{- $controllerBase = trimSuffix $currentSuffix $controllerServiceAccount -}}
{{- if eq $controllerBase "" -}}
{{- fail "external controller ServiceAccount has no stable release prefix" -}}
{{- end -}}
{{- $controllerPattern = printf "^%s-v[1-9][0-9]*$" (regexQuoteMeta $controllerBase) -}}
{{- $externalControllerTemplate = `%s.matches(%q)` -}}
{{- end -}}
{{- if and (eq $previousControllerServiceAccount "") (ne $previousControllerSequence "0") -}}
{{- fail "predecessor controller release sequence requires a ServiceAccount name" -}}
{{- end -}}
{{- if and $previousControllerServiceAccount (ne $previousControllerSequence "0") -}}
{{- if ne $previousControllerManaged .Values.serviceAccount.create -}}
{{- fail "candidate and predecessor controller ServiceAccounts must use the same managed identity mode" -}}
{{- end -}}
{{- $previousBase := "" -}}
{{- if $previousControllerManaged -}}
{{- $previousPattern := printf "^.+-v%s-[0-9a-f]{12}$" $previousControllerSequence -}}
{{- if not (regexMatch $previousPattern $previousControllerServiceAccount) -}}
{{- fail "managed predecessor controller ServiceAccount does not encode its release sequence" -}}
{{- end -}}
{{- $previousBase = regexReplaceAll (printf "-v%s-[0-9a-f]{12}$" $previousControllerSequence) $previousControllerServiceAccount "" -}}
{{- else -}}
{{- $previousSuffix := printf "-v%s" $previousControllerSequence -}}
{{- if not (hasSuffix $previousSuffix $previousControllerServiceAccount) -}}
{{- fail "external predecessor controller ServiceAccount does not encode its release sequence" -}}
{{- end -}}
{{- $previousBase = trimSuffix $previousSuffix $previousControllerServiceAccount -}}
{{- end -}}
{{- if ne $previousBase $controllerBase -}}
{{- fail "candidate and predecessor controller ServiceAccounts must share one stable identity base" -}}
{{- end -}}
{{- end -}}
{{- $managedControllerObject := "false" -}}
{{- $managedControllerOldObject := "false" -}}
{{- $managedControllerVariable := "false" -}}
{{- if .Values.serviceAccount.create -}}
{{- $managedControllerObject = printf $managedControllerTemplate "object.metadata.name" $controllerPattern -}}
{{- $managedControllerOldObject = printf $managedControllerTemplate "oldObject.metadata.name" $controllerPattern -}}
{{- $managedControllerVariable = printf $managedControllerTemplate "variables.name" $controllerPattern -}}
{{- end -}}
{{- $externalControllerObject := "false" -}}
{{- $externalControllerOldObject := "false" -}}
{{- $externalControllerVariable := "false" -}}
{{- if not .Values.serviceAccount.create -}}
{{- $externalControllerObject = printf $externalControllerTemplate "object.metadata.name" $controllerPattern -}}
{{- $externalControllerOldObject = printf $externalControllerTemplate "oldObject.metadata.name" $controllerPattern -}}
{{- $externalControllerVariable = printf $externalControllerTemplate "variables.name" $controllerPattern -}}
{{- end -}}
{{- $certificateServiceAccount := include "ptah-operator.certRotatorServiceAccountName" . -}}
{{- $hookPattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}$" (regexQuoteMeta (printf "%s-crd-v" $hookBase)) -}}
{{- $cleanupPattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}$" (regexQuoteMeta (printf "%s-cleanup-v" $hookBase)) -}}
{{- $quiescePattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}$" (regexQuoteMeta (printf "%s-quiesce-v" $hookBase)) -}}
{{- $bootstrapDigest := printf "1\n%s\n%s" .Release.Namespace .Release.Name | sha256sum | trunc 12 -}}
{{- $bootstrapServiceAccount := printf "ptah-teardown-bootstrap-v1-%s" $bootstrapDigest -}}
{{- $protectedObjectName := printf `(%s) || (%s) || object.metadata.name == %q || object.metadata.name.matches(%q) || object.metadata.name.matches(%q) || object.metadata.name.matches(%q) || object.metadata.name == %q` $managedControllerObject $externalControllerObject $certificateServiceAccount $hookPattern $cleanupPattern $quiescePattern $bootstrapServiceAccount -}}
{{- $protectedOldObjectName := printf `(%s) || (%s) || oldObject.metadata.name == %q || oldObject.metadata.name.matches(%q) || oldObject.metadata.name.matches(%q) || oldObject.metadata.name.matches(%q) || oldObject.metadata.name == %q` $managedControllerOldObject $externalControllerOldObject $certificateServiceAccount $hookPattern $cleanupPattern $quiescePattern $bootstrapServiceAccount -}}
{{- $managedControllerRequest := "false" -}}
{{- if .Values.serviceAccount.create -}}
{{- $managedControllerRequest = printf $managedControllerTemplate "request.name" $controllerPattern -}}
{{- end -}}
{{- $externalControllerRequest := "false" -}}
{{- if not .Values.serviceAccount.create -}}
{{- $externalControllerRequest = printf $externalControllerTemplate "request.name" $controllerPattern -}}
{{- end -}}
{{- $protectedRequestName := printf `(%s) || (%s) || request.name == %q || request.name.matches(%q) || request.name.matches(%q) || request.name.matches(%q) || request.name == %q` $managedControllerRequest $externalControllerRequest $certificateServiceAccount $hookPattern $cleanupPattern $quiescePattern $bootstrapServiceAccount -}}
{{- $protectedMatch := printf `request.namespace == %q && (!has(request.subResource) || request.subResource == "") && ((object != null && has(object.metadata) && has(object.metadata.name) && (%s)) || (oldObject != null && has(oldObject.metadata) && has(oldObject.metadata.name) && (%s)) || (request.operation == "DELETE" && request.name != "" && (%s)))` .Release.Namespace $protectedObjectName $protectedOldObjectName $protectedRequestName -}}
{{- $managedLabels := printf `has(object.metadata.labels) && object.metadata.labels[%q] == %q && object.metadata.labels[%q] == %q && object.metadata.labels[%q] != "" && object.metadata.labels[%q] != "" && object.metadata.labels[%q] != ""` "app.kubernetes.io/managed-by" "Helm" "app.kubernetes.io/instance" .Release.Name "helm.sh/chart" "app.kubernetes.io/version" "app.kubernetes.io/name" -}}
{{- $helmOwnership := printf `has(object.metadata.annotations) && object.metadata.annotations[%q] == %q && object.metadata.annotations[%q] == %q` "meta.helm.sh/release-name" .Release.Name "meta.helm.sh/release-namespace" .Release.Namespace -}}
{{- $hookInstallAnnotations := `object.metadata.annotations["helm.sh/hook"] == "pre-install,pre-upgrade" && object.metadata.annotations["helm.sh/hook-weight"] == "-110" && object.metadata.annotations["helm.sh/hook-delete-policy"] == "before-hook-creation,hook-succeeded,hook-failed"` -}}
{{- $hookDeleteAnnotations := `object.metadata.annotations["helm.sh/hook"] == "pre-delete" && object.metadata.annotations["helm.sh/hook-weight"] == "-110" && object.metadata.annotations["helm.sh/hook-delete-policy"] == "before-hook-creation,hook-succeeded"` -}}
{{- $cleanupAnnotations := `object.metadata.annotations["helm.sh/hook"] == "pre-delete" && object.metadata.annotations["helm.sh/hook-weight"] == "-109" && object.metadata.annotations["helm.sh/hook-delete-policy"] == "before-hook-creation,hook-succeeded"` -}}
{{- $bootstrapAnnotations := `object.metadata.annotations["helm.sh/hook"] == "pre-delete" && object.metadata.annotations["helm.sh/hook-weight"] == "-327" && object.metadata.annotations["helm.sh/hook-delete-policy"] == "before-hook-creation,hook-succeeded"` -}}
{{- $quiesceAnnotations := `object.metadata.annotations["helm.sh/hook"] == "pre-delete" && object.metadata.annotations["helm.sh/hook-weight"] == "-110" && object.metadata.annotations["helm.sh/hook-delete-policy"] == "before-hook-creation,hook-succeeded"` -}}
{{- $bootstrapOwnership := printf `has(object.metadata.annotations) && ((!(%q in object.metadata.annotations) && !(%q in object.metadata.annotations)) || (%s))` "meta.helm.sh/release-name" "meta.helm.sh/release-namespace" $helmOwnership -}}
{{- $annotations := printf `(variables.isExternalController && (!has(object.metadata.annotations) || !("helm.sh/hook" in object.metadata.annotations) && !("helm.sh/hook-weight" in object.metadata.annotations) && !("helm.sh/hook-delete-policy" in object.metadata.annotations))) || ((variables.isManagedController || variables.isCertificate) && (%s) && !("helm.sh/hook" in object.metadata.annotations) && !("helm.sh/hook-weight" in object.metadata.annotations) && !("helm.sh/hook-delete-policy" in object.metadata.annotations)) || (variables.isHook && (%s) && ((%s) || (%s))) || (variables.isCleanup && (%s) && (%s)) || (variables.isQuiesce && (%s) && (%s)) || (variables.isBootstrap && (%s) && (%s))` $helmOwnership $helmOwnership $hookInstallAnnotations $hookDeleteAnnotations $helmOwnership $cleanupAnnotations $helmOwnership $quiesceAnnotations $bootstrapOwnership $bootstrapAnnotations -}}
{{- $labels := printf `variables.isExternalController || ((%s) && ((!variables.isCertificate || object.metadata.labels[%q] == %q) && (!variables.isHook || object.metadata.labels[%q] == %q) && (!variables.isCleanup || object.metadata.labels[%q] == %q) && (!variables.isQuiesce || object.metadata.labels[%q] == %q) && (!variables.isBootstrap || object.metadata.labels[%q] == %q)))` $managedLabels "app.kubernetes.io/component" "certificate-rotation" "app.kubernetes.io/component" "crd-manager" "app.kubernetes.io/component" "crd-manager-teardown" "app.kubernetes.io/component" "crd-manager-teardown-quiesce" "app.kubernetes.io/component" "teardown-retirement-bootstrap" -}}
{{- $objectShape := printf `object != null && object.apiVersion == "v1" && object.kind == "ServiceAccount" && object.metadata.namespace == %q && object.metadata.name == variables.name && (!has(object.metadata.generateName) || object.metadata.generateName == "") && (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0) && (variables.isExternalController || !has(object.metadata.finalizers) || object.metadata.finalizers.size() == 0) && (!has(object.metadata.deletionTimestamp)) && (%s) && (%s) && (variables.isExternalController || ((variables.isManagedController || variables.isCertificate) ? (has(object.automountServiceAccountToken) && object.automountServiceAccountToken) : (has(object.automountServiceAccountToken) && !object.automountServiceAccountToken))) && ((variables.isManagedController || variables.isExternalController || variables.isCertificate) ? (!has(object.secrets) || object.secrets.all(secret, secret.name != "" && (!has(secret.namespace) || secret.namespace in ["", %q]) && (!has(secret.apiVersion) || secret.apiVersion in ["", "v1"]) && (!has(secret.kind) || secret.kind in ["", "Secret"]) && (!has(secret.uid) || secret.uid == "") && (!has(secret.resourceVersion) || secret.resourceVersion == "") && (!has(secret.fieldPath) || secret.fieldPath == ""))) : (!has(object.secrets) || object.secrets.size() == 0)) && ((variables.isManagedController || variables.isExternalController) ? (!has(object.imagePullSecrets) || object.imagePullSecrets.all(secret, secret.name != "")) : (!has(object.imagePullSecrets) || object.imagePullSecrets.size() == 0))` .Release.Namespace $labels $annotations .Release.Namespace -}}
{{- $oldIdentity := printf `oldObject != null && has(oldObject.apiVersion) && oldObject.apiVersion == "v1" && has(oldObject.kind) && oldObject.kind == "ServiceAccount" && has(oldObject.metadata) && has(oldObject.metadata.namespace) && oldObject.metadata.namespace == %q && has(oldObject.metadata.name) && oldObject.metadata.name == variables.name && has(oldObject.metadata.uid) && oldObject.metadata.uid != "" && has(oldObject.metadata.resourceVersion) && oldObject.metadata.resourceVersion != ""` .Release.Namespace -}}
{{- $updateIdentity := `object.metadata.name == oldObject.metadata.name && object.metadata.namespace == oldObject.metadata.namespace && has(object.metadata.uid) && object.metadata.uid == oldObject.metadata.uid && has(object.metadata.resourceVersion) && object.metadata.resourceVersion == oldObject.metadata.resourceVersion && has(object.metadata.creationTimestamp) == has(oldObject.metadata.creationTimestamp) && (!has(object.metadata.creationTimestamp) || object.metadata.creationTimestamp == oldObject.metadata.creationTimestamp)` -}}
{{- $helmAuthority := printf `(authorizer.group("admissionregistration.k8s.io").resource("validatingadmissionpolicies").check("create").allowed() && authorizer.group("admissionregistration.k8s.io").resource("validatingadmissionpolicybindings").check("create").allowed()) || (authorizer.group("admissionregistration.k8s.io").resource("validatingadmissionpolicies").name(%q).check("delete").allowed() && authorizer.group("admissionregistration.k8s.io").resource("validatingadmissionpolicybindings").name(%q).check("delete").allowed())` $namespaceGuardName $namespaceGuardName -}}
{{- $legacyNamespaceController := `request.userInfo.username == "system:kube-controller-manager" && request.userInfo.groups.size() == 1 && "system:authenticated" in request.userInfo.groups` -}}
{{- $serviceAccountNamespaceController := `request.userInfo.username == "system:serviceaccount:kube-system:namespace-controller" && request.userInfo.groups.size() == 3 && "system:serviceaccounts" in request.userInfo.groups && "system:serviceaccounts:kube-system" in request.userInfo.groups && "system:authenticated" in request.userInfo.groups` -}}
{{- $namespaceCleanup := printf `namespaceObject != null && namespaceObject.metadata.name == %q && has(namespaceObject.metadata.deletionTimestamp) && ((%s) || (%s))` .Release.Namespace $legacyNamespaceController $serviceAccountNamespaceController -}}
{{- $denialMessage := "Ptah service account object guard rejected an unsafe identity lifecycle request" -}}
{{- $matchResources := dict
      "matchPolicy" "Exact"
      "namespaceSelector" (dict)
      "objectSelector" (dict)
      "resourceRules" (list
        (dict
          "apiGroups" (list "")
          "apiVersions" (list "v1")
          "operations" (list "CREATE" "UPDATE" "DELETE")
          "resources" (list "serviceaccounts")
          "scope" "Namespaced")
        (dict
          "apiGroups" (list "")
          "apiVersions" (list "v1")
          "operations" (list "UPDATE")
          "resources" (list "configmaps")
          "scope" "Namespaced")) -}}
{{- $policySpec := dict
      "failurePolicy" "Fail"
      "matchConstraints" $matchResources
      "matchConditions" (list (dict
        "name" "protected-service-account-object"
        "expression" (printf `(%s) || (%s)` $probeExpression $protectedMatch)))
      "variables" (list
        (dict "name" "isServiceAccountObjectConvergenceProbe" "expression" $probeExpression)
        (dict "name" "isCreate" "expression" `request.operation == "CREATE"`)
        (dict "name" "isUpdate" "expression" `request.operation == "UPDATE"`)
        (dict "name" "isDelete" "expression" `request.operation == "DELETE"`)
        (dict "name" "name" "expression" `request.operation == "DELETE" ? (oldObject != null && has(oldObject.metadata) && has(oldObject.metadata.name) ? oldObject.metadata.name : request.name) : object.metadata.name`)
        (dict "name" "isManagedController" "expression" $managedControllerVariable)
        (dict "name" "isExternalController" "expression" $externalControllerVariable)
        (dict "name" "isCertificate" "expression" (printf `variables.name == %q` $certificateServiceAccount))
        (dict "name" "isHook" "expression" (printf `variables.name.matches(%q)` $hookPattern))
        (dict "name" "isCleanup" "expression" (printf `variables.name.matches(%q)` $cleanupPattern))
        (dict "name" "isQuiesce" "expression" (printf `variables.name.matches(%q)` $quiescePattern))
        (dict "name" "isBootstrap" "expression" (printf `variables.name == %q` $bootstrapServiceAccount)))
      "validations" (list
        (dict "expression" `variables.isServiceAccountObjectConvergenceProbe || (variables.isCreate || variables.isUpdate || variables.isDelete)` "message" $denialMessage)
        (dict "expression" `variables.isServiceAccountObjectConvergenceProbe || (variables.isManagedController || variables.isExternalController || variables.isCertificate || variables.isHook || variables.isCleanup || variables.isQuiesce || variables.isBootstrap)` "message" $denialMessage)
        (dict "expression" (printf `variables.isServiceAccountObjectConvergenceProbe || ((!variables.isDelete && (%s)) || (variables.isDelete && ((%s) || (%s))))` $helmAuthority $helmAuthority $namespaceCleanup) "message" $denialMessage)
        (dict "expression" `variables.isServiceAccountObjectConvergenceProbe || (!variables.isDelete || (request.name == "" || request.name == variables.name))` "message" $denialMessage)
        (dict "expression" (printf `variables.isServiceAccountObjectConvergenceProbe || (variables.isCreate || (%s))` $oldIdentity) "message" $denialMessage)
        (dict "expression" (printf `variables.isServiceAccountObjectConvergenceProbe || (variables.isDelete || (%s))` $objectShape) "message" $denialMessage)
        (dict "expression" (printf `variables.isServiceAccountObjectConvergenceProbe || (!variables.isUpdate || (%s))` $updateIdentity) "message" $denialMessage)
        (dict "expression" `!variables.isServiceAccountObjectConvergenceProbe || request.dryRun == true` "message" "Ptah admission convergence probe field manager is reserved for dry-run verification")
        (dict "expression" `!variables.isServiceAccountObjectConvergenceProbe` "message" $probeMessage)) -}}
{{- $bindingSpec := dict
      "policyName" $guardName
      "validationActions" (list "Deny")
      "matchResources" $matchResources -}}
{{- $policyAnnotations := dict
      "helm.sh/hook" "pre-install,pre-upgrade"
      "helm.sh/hook-weight" "-164"
      "helm.sh/resource-policy" "keep"
      "operator.ptah.dev/rollout-guard-version" "1"
      "operator.ptah.dev/release-name" .Release.Name
      "operator.ptah.dev/release-namespace" .Release.Namespace -}}
{{- $bindingAnnotations := dict
      "helm.sh/hook" "pre-install,pre-upgrade"
      "helm.sh/hook-weight" "-163"
      "helm.sh/resource-policy" "keep"
      "operator.ptah.dev/rollout-guard-version" "1"
      "operator.ptah.dev/release-name" .Release.Name
      "operator.ptah.dev/release-namespace" .Release.Namespace -}}
{{- $guardLabels := dict
      "app.kubernetes.io/managed-by" "ptah-operator"
      "app.kubernetes.io/instance" .Release.Name
      "app.kubernetes.io/component" "service-account-object-guard" -}}
{{- $policy := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicy" "" $guardName -}}
{{- $binding := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicyBinding" "" $guardName -}}
{{- if ne (empty $policy) (empty $binding) -}}
{{- fail (printf "retained service account object guard %s is sparse" $guardName) -}}
{{- end -}}
{{- range $entry := list
      (dict "kind" "ValidatingAdmissionPolicy" "object" $policy "annotations" $policyAnnotations "spec" $policySpec)
      (dict "kind" "ValidatingAdmissionPolicyBinding" "object" $binding "annotations" $bindingAnnotations "spec" $bindingSpec) -}}
{{- with $entry.object -}}
{{- $annotations := default (dict) .metadata.annotations -}}
{{- $labels := default (dict) .metadata.labels -}}
{{- if or
      (ne (default "" .apiVersion) "admissionregistration.k8s.io/v1")
      (ne (default "" .kind) $entry.kind)
      (ne (default "" .metadata.name) $guardName)
      (ne (default "" .metadata.namespace) "")
      (ne (default "" .metadata.generateName) "")
      (eq (default "" .metadata.uid) "")
      (eq (default "" .metadata.resourceVersion) "")
      (not (deepEqual $annotations $entry.annotations))
      (not (deepEqual $labels $guardLabels))
      (ne (len (default (list) .metadata.ownerReferences)) 0)
      (ne (len (default (list) .metadata.finalizers)) 0)
      (not (empty .metadata.deletionTimestamp))
      (not (empty .metadata.deletionGracePeriodSeconds))
      (not (deepEqual (default (dict) .spec) $entry.spec)) -}}
{{- fail (printf "retained %s %s differs from the exact service-account-object contract" $entry.kind $guardName) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not $policy }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $guardName }}
  annotations:
{{ toYaml $policyAnnotations | nindent 4 }}
  labels:
{{ toYaml $guardLabels | nindent 4 }}
spec:
{{ toYaml $policySpec | nindent 2 }}
---
{{- end }}
{{- if not $binding }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $guardName }}
  annotations:
{{ toYaml $bindingAnnotations | nindent 4 }}
  labels:
{{ toYaml $guardLabels | nindent 4 }}
spec:
{{ toYaml $bindingSpec | nindent 2 }}
{{- end }}
