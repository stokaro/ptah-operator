{{- include "ptah-operator.validateAdmissionSingleton" . -}}
{{- include "ptah-operator.validateReleaseNamespace" . -}}
{{- $secretName := include "ptah-operator.webhookSecretName" . -}}
{{- if and (not .Values.webhook.existingSecret) (not .Values.certificateRotation.enabled) -}}
{{- fail "certificateRotation.enabled must be true when webhook.existingSecret is empty" -}}
{{- end -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $material := include "ptah-operator.webhookCertificateMaterialJSON" (dict "root" . "existing" $existing) | fromJson -}}
{{- $caBundle := $material.caBundle -}}
{{- $caKey := $material.caKey -}}
{{- $tlsCrt := $material.tlsCrt -}}
{{- $tlsKey := $material.tlsKey -}}
{{- $configurationName := include "ptah-operator.approvalWebhookConfigurationName" . -}}
{{- $serviceName := include "ptah-operator.webhookServiceName" . -}}
{{- $existingMutating := lookup "admissionregistration.k8s.io/v1" "MutatingWebhookConfiguration" "" $configurationName -}}
{{- $existingValidating := lookup "admissionregistration.k8s.io/v1" "ValidatingWebhookConfiguration" "" $configurationName -}}
{{- $entryBundles := dict "mutating" $caBundle "migrationMutating" $caBundle "runAcknowledgmentMutating" $caBundle "schemaWriterMutating" $caBundle "migrationWriterMutating" $caBundle "approvalValidating" $caBundle "migrationApprovalValidating" $caBundle "runAcknowledgmentValidating" $caBundle "podValidating" $caBundle "controllerWriteValidating" $caBundle -}}
{{- if not .Values.webhook.existingSecret -}}
{{- if $existingMutating -}}
{{- range $existingMutating.webhooks -}}
{{- if and (eq .name "mapproval.operator.ptah.run") .clientConfig.service (eq .clientConfig.service.name $serviceName) (eq .clientConfig.service.namespace $.Release.Namespace) -}}
{{- $_ := set $entryBundles "mutating" (include "ptah-operator.webhookEntryCABundle" (dict "newBundle" $caBundle "existingBundle" .clientConfig.caBundle "secretExists" (not (empty $existing)))) -}}
{{- else if and (eq .name "mmigrationapproval.operator.ptah.run") .clientConfig.service (eq .clientConfig.service.name $serviceName) (eq .clientConfig.service.namespace $.Release.Namespace) -}}
{{- $_ := set $entryBundles "migrationMutating" (include "ptah-operator.webhookEntryCABundle" (dict "newBundle" $caBundle "existingBundle" .clientConfig.caBundle "secretExists" (not (empty $existing)))) -}}
{{- else if and (eq .name "mmigrationrunacknowledgment.operator.ptah.run") .clientConfig.service (eq .clientConfig.service.name $serviceName) (eq .clientConfig.service.namespace $.Release.Namespace) -}}
{{- $_ := set $entryBundles "runAcknowledgmentMutating" (include "ptah-operator.webhookEntryCABundle" (dict "newBundle" $caBundle "existingBundle" .clientConfig.caBundle "secretExists" (not (empty $existing)))) -}}
{{- else if and (eq .name "mschemawriter.operator.ptah.run") .clientConfig.service (eq .clientConfig.service.name $serviceName) (eq .clientConfig.service.namespace $.Release.Namespace) -}}
{{- $_ := set $entryBundles "schemaWriterMutating" (include "ptah-operator.webhookEntryCABundle" (dict "newBundle" $caBundle "existingBundle" .clientConfig.caBundle "secretExists" (not (empty $existing)))) -}}
{{- else if and (eq .name "mmigrationwriter.operator.ptah.run") .clientConfig.service (eq .clientConfig.service.name $serviceName) (eq .clientConfig.service.namespace $.Release.Namespace) -}}
{{- $_ := set $entryBundles "migrationWriterMutating" (include "ptah-operator.webhookEntryCABundle" (dict "newBundle" $caBundle "existingBundle" .clientConfig.caBundle "secretExists" (not (empty $existing)))) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if $existingValidating -}}
{{- range $existingValidating.webhooks -}}
{{- if and .clientConfig.service (eq .clientConfig.service.namespace $.Release.Namespace) -}}
{{- if and (eq .clientConfig.service.name $serviceName) (eq .name "vapproval.operator.ptah.run") -}}
{{- $_ := set $entryBundles "approvalValidating" (include "ptah-operator.webhookEntryCABundle" (dict "newBundle" $caBundle "existingBundle" .clientConfig.caBundle "secretExists" (not (empty $existing)))) -}}
{{- else if and (eq .clientConfig.service.name $serviceName) (eq .name "vmigrationapproval.operator.ptah.run") -}}
{{- $_ := set $entryBundles "migrationApprovalValidating" (include "ptah-operator.webhookEntryCABundle" (dict "newBundle" $caBundle "existingBundle" .clientConfig.caBundle "secretExists" (not (empty $existing)))) -}}
{{- else if and (eq .clientConfig.service.name $serviceName) (eq .name "vmigrationrunacknowledgment.operator.ptah.run") -}}
{{- $_ := set $entryBundles "runAcknowledgmentValidating" (include "ptah-operator.webhookEntryCABundle" (dict "newBundle" $caBundle "existingBundle" .clientConfig.caBundle "secretExists" (not (empty $existing)))) -}}
{{- else if and (eq .clientConfig.service.name $serviceName) (eq .name "vpodintent.operator.ptah.run") -}}
{{- $_ := set $entryBundles "podValidating" (include "ptah-operator.webhookEntryCABundle" (dict "newBundle" $caBundle "existingBundle" .clientConfig.caBundle "secretExists" (not (empty $existing)))) -}}
{{- else if and (eq .clientConfig.service.name $serviceName) (eq .name "vcontrollerwrite.operator.ptah.run") -}}
{{- $_ := set $entryBundles "controllerWriteValidating" (include "ptah-operator.webhookEntryCABundle" (dict "newBundle" $caBundle "existingBundle" .clientConfig.caBundle "secretExists" (not (empty $existing)))) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not .Values.webhook.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: Helm
    operator.ptah.run/generated-webhook-certificate: "true"
type: kubernetes.io/tls
data:
  ca.crt: {{ $caBundle }}
  ca.key: {{ $caKey }}
  tls.crt: {{ $tlsCrt }}
  tls.key: {{ $tlsKey }}
---
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ $configurationName }}
  annotations:
    operator.ptah.run/release-name: {{ .Release.Name | quote }}
    operator.ptah.run/release-namespace: {{ .Release.Namespace | quote }}
    operator.ptah.run/coordination-namespace: {{ include "ptah-operator.coordinationNamespace" . | quote }}
    operator.ptah.run/leader-election: {{ printf "%t" .Values.leaderElection | quote }}
    operator.ptah.run/leader-election-id: {{ include "ptah-operator.leaderElectionID" . | quote }}
    operator.ptah.run/webhook-service-name: {{ include "ptah-operator.webhookServiceName" . | quote }}
    operator.ptah.run/hook-service-account-name: {{ include "ptah-operator.crdManagerServiceAccountName" . | quote }}
    operator.ptah.run/controller-service-account-name: {{ include "ptah-operator.serviceAccountName" . | quote }}
    operator.ptah.run/controller-deployment-name: {{ include "ptah-operator.fullname" . | quote }}
    operator.ptah.run/certificate-deployment-name: {{ include "ptah-operator.certRotatorServiceAccountName" . | quote }}
    operator.ptah.run/controller-state-version: {{ include "ptah-operator.controllerStateVersion" . | quote }}
    operator.ptah.run/admission-contract-version: {{ include "ptah-operator.admissionContractVersion" . | quote }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
webhooks:
  - name: mapproval.operator.ptah.run
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    reinvocationPolicy: Never
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      caBundle: {{ index $entryBundles "mutating" }}
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ $serviceName }}
        path: /mutate-operator-ptah-run-v1alpha1-ptahschemaapproval
        port: 443
    rules:
      - apiGroups: ["operator.ptah.run"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE"]
        resources: ["ptahschemaapprovals"]
        scope: Namespaced
  - name: mmigrationapproval.operator.ptah.run
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    reinvocationPolicy: Never
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      caBundle: {{ index $entryBundles "migrationMutating" }}
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ $serviceName }}
        path: /mutate-operator-ptah-run-v1alpha1-ptahmigrationapproval
        port: 443
    rules:
      - apiGroups: ["operator.ptah.run"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE"]
        resources: ["ptahmigrationapprovals"]
        scope: Namespaced
  - name: mmigrationrunacknowledgment.operator.ptah.run
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    reinvocationPolicy: Never
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      caBundle: {{ index $entryBundles "runAcknowledgmentMutating" }}
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ $serviceName }}
        path: /mutate-operator-ptah-run-v1alpha1-ptahmigrationrunacknowledgment
        port: 443
    rules:
      - apiGroups: ["operator.ptah.run"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE"]
        resources: ["ptahmigrationrunacknowledgments"]
        scope: Namespaced
{{- if .Values.approvals.requireDistinctApprover }}
  - name: mschemawriter.operator.ptah.run
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    reinvocationPolicy: Never
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      caBundle: {{ index $entryBundles "schemaWriterMutating" }}
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ $serviceName }}
        path: /mutate-operator-ptah-run-v1alpha1-ptahschema
        port: 443
    rules:
      - apiGroups: ["operator.ptah.run"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ptahschemas"]
        scope: Namespaced
  - name: mmigrationwriter.operator.ptah.run
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    reinvocationPolicy: Never
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      caBundle: {{ index $entryBundles "migrationWriterMutating" }}
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ $serviceName }}
        path: /mutate-operator-ptah-run-v1alpha1-ptahmigration
        port: 443
    rules:
      - apiGroups: ["operator.ptah.run"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ptahmigrations"]
        scope: Namespaced
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $configurationName }}
  annotations:
    operator.ptah.run/release-name: {{ .Release.Name | quote }}
    operator.ptah.run/release-namespace: {{ .Release.Namespace | quote }}
    operator.ptah.run/coordination-namespace: {{ include "ptah-operator.coordinationNamespace" . | quote }}
    operator.ptah.run/leader-election: {{ printf "%t" .Values.leaderElection | quote }}
    operator.ptah.run/leader-election-id: {{ include "ptah-operator.leaderElectionID" . | quote }}
    operator.ptah.run/webhook-service-name: {{ include "ptah-operator.webhookServiceName" . | quote }}
    operator.ptah.run/hook-service-account-name: {{ include "ptah-operator.crdManagerServiceAccountName" . | quote }}
    operator.ptah.run/controller-service-account-name: {{ include "ptah-operator.serviceAccountName" . | quote }}
    operator.ptah.run/controller-deployment-name: {{ include "ptah-operator.fullname" . | quote }}
    operator.ptah.run/certificate-deployment-name: {{ include "ptah-operator.certRotatorServiceAccountName" . | quote }}
    operator.ptah.run/controller-state-version: {{ include "ptah-operator.controllerStateVersion" . | quote }}
    operator.ptah.run/admission-contract-version: {{ include "ptah-operator.admissionContractVersion" . | quote }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
webhooks:
  - name: vapproval.operator.ptah.run
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      caBundle: {{ index $entryBundles "approvalValidating" }}
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ $serviceName }}
        path: /validate-operator-ptah-run-v1alpha1-ptahschemaapproval
        port: 443
    rules:
      - apiGroups: ["operator.ptah.run"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ptahschemaapprovals"]
        scope: Namespaced
  - name: vmigrationapproval.operator.ptah.run
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      caBundle: {{ index $entryBundles "migrationApprovalValidating" }}
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ $serviceName }}
        path: /validate-operator-ptah-run-v1alpha1-ptahmigrationapproval
        port: 443
    rules:
      - apiGroups: ["operator.ptah.run"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ptahmigrationapprovals"]
        scope: Namespaced
  - name: vmigrationrunacknowledgment.operator.ptah.run
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      caBundle: {{ index $entryBundles "runAcknowledgmentValidating" }}
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ $serviceName }}
        path: /validate-operator-ptah-run-v1alpha1-ptahmigrationrunacknowledgment
        port: 443
    rules:
      - apiGroups: ["operator.ptah.run"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ptahmigrationrunacknowledgments"]
        scope: Namespaced
  - name: vpodintent.operator.ptah.run
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    matchConditions:
      - name: managed-or-operation-job-pod
        expression: >-
          (has(object.metadata.labels) &&
            'app.kubernetes.io/managed-by' in object.metadata.labels &&
            object.metadata.labels['app.kubernetes.io/managed-by'] == 'ptah-operator' &&
            'app.kubernetes.io/component' in object.metadata.labels &&
            object.metadata.labels['app.kubernetes.io/component'] in ['schema-operation', 'migration-operation']) ||
          (has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(ref,
            ref.apiVersion == 'batch/v1' && ref.kind == 'Job' && ref.controller == true &&
            ref.name.matches('^ptah-(m-)?(resolve|verify|observe|plan|history|apply)-'))) ||
          (request.operation == 'UPDATE' && oldObject != null && (
            (has(oldObject.metadata.labels) &&
              'app.kubernetes.io/managed-by' in oldObject.metadata.labels &&
              oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'ptah-operator' &&
              'app.kubernetes.io/component' in oldObject.metadata.labels &&
              oldObject.metadata.labels['app.kubernetes.io/component'] in ['schema-operation', 'migration-operation']) ||
            (has(oldObject.metadata.ownerReferences) && oldObject.metadata.ownerReferences.exists(ref,
              ref.apiVersion == 'batch/v1' && ref.kind == 'Job' && ref.controller == true &&
              ref.name.matches('^ptah-(m-)?(resolve|verify|observe|plan|history|apply)-')))))
          || {{ include "ptah-operator.resultCredentialReferences" "object" | nindent 10 }}
          || {{ include "ptah-operator.resultCredentialReferences" "oldObject" | nindent 10 }}
    clientConfig:
      caBundle: {{ index $entryBundles "podValidating" }}
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ $serviceName }}
        path: /validate-v1-pod-ptah-operation-intent
        port: 443
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers", "pods/resize"]
        scope: Namespaced
  - name: vcontrollerwrite.operator.ptah.run
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Exact
    timeoutSeconds: {{ .Values.webhook.controllerWriteTimeoutSeconds }}
    matchConditions:
      - name: controller-service-account
        expression: >-
          (request.resource.resource == 'ptahresultrecords') ||
          (request.resource.resource != 'secrets' && request.resource.resource != 'ptahresultrecords' && request.userInfo.username ==
          'system:serviceaccount:{{ .Release.Namespace }}:{{ include "ptah-operator.serviceAccountName" . }}') ||
          (request.resource.resource == 'secrets' && (
            (object != null && object.metadata.name.startsWith('ptah-result-key-')) ||
            (oldObject != null && oldObject.metadata.name.startsWith('ptah-result-key-'))))
    clientConfig:
      caBundle: {{ index $entryBundles "controllerWriteValidating" }}
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ $serviceName }}
        path: /validate-operator-controller-write
        port: 443
    rules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["configmaps"]
        scope: Namespaced
      - apiGroups: ["operator.ptah.run"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE"]
        resources: ["ptahschemaplans", "ptahschemaplanchunks", "ptahmigrationplans"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
        scope: Namespaced
      - apiGroups: ["operator.ptah.run"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["ptahresultrecords"]
        scope: Namespaced
