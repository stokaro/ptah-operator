{{- $fullname := include "ptah-operator.fullname" . -}}
{{- $secretName := default (printf "%s-webhook-cert" $fullname) .Values.webhook.existingSecret -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $caBundle := "" -}}
{{- $tlsCrt := "" -}}
{{- $tlsKey := "" -}}
{{- if .Values.webhook.existingSecret -}}
{{- if .Values.webhook.caBundle -}}
{{- $caBundle = .Values.webhook.caBundle | b64enc -}}
{{- else if $existing -}}
{{- $caBundle = required "webhook.existingSecret must contain ca.crt" (index $existing.data "ca.crt") -}}
{{- else -}}
{{- fail "webhook.caBundle is required when webhook.existingSecret cannot be read" -}}
{{- end -}}
{{- else if $existing -}}
{{- $caBundle = required "generated webhook Secret must contain ca.crt" (index $existing.data "ca.crt") -}}
{{- $tlsCrt = required "generated webhook Secret must contain tls.crt" (index $existing.data "tls.crt") -}}
{{- $tlsKey = required "generated webhook Secret must contain tls.key" (index $existing.data "tls.key") -}}
{{- else -}}
{{- $ca := genCA (printf "%s-ca" $fullname) 3650 -}}
{{- $service := printf "%s-webhook" $fullname -}}
{{- $dnsNames := list $service (printf "%s.%s" $service .Release.Namespace) (printf "%s.%s.svc" $service .Release.Namespace) (printf "%s.%s.svc.cluster.local" $service .Release.Namespace) -}}
{{- $cert := genSignedCert $service nil $dnsNames 825 $ca -}}
{{- $caBundle = $ca.Cert | b64enc -}}
{{- $tlsCrt = $cert.Cert | b64enc -}}
{{- $tlsKey = $cert.Key | b64enc -}}
{{- end -}}
{{- if not .Values.webhook.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $caBundle }}
  tls.crt: {{ $tlsCrt }}
  tls.key: {{ $tlsKey }}
---
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ $fullname }}-approval
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
webhooks:
  - name: mapproval.operator.ptah.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    reinvocationPolicy: Never
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      caBundle: {{ $caBundle }}
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ $fullname }}-webhook
        path: /mutate-operator-ptah-dev-v1alpha1-ptahschemaapproval
        port: 443
    rules:
      - apiGroups: ["operator.ptah.dev"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE"]
        resources: ["ptahschemaapprovals"]
        scope: Namespaced
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $fullname }}-approval
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
webhooks:
  - name: vapproval.operator.ptah.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      caBundle: {{ $caBundle }}
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ $fullname }}-webhook
        path: /validate-operator-ptah-dev-v1alpha1-ptahschemaapproval
        port: 443
    rules:
      - apiGroups: ["operator.ptah.dev"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ptahschemaapprovals"]
        scope: Namespaced
