{{- $fullname := include "ptah-operator.fullname" . -}}
{{- $secretName := include "ptah-operator.webhookSecretName" . -}}
{{- if and (not .Values.webhook.existingSecret) (not .Values.certificateRotation.enabled) -}}
{{- fail "certificateRotation.enabled must be true when webhook.existingSecret is empty" -}}
{{- end -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $caBundle := "" -}}
{{- $caKey := "" -}}
{{- $tlsCrt := "" -}}
{{- $tlsKey := "" -}}
{{- $configurationName := include "ptah-operator.approvalWebhookConfigurationName" . -}}
{{- $serviceName := include "ptah-operator.webhookServiceName" . -}}
{{- if .Values.webhook.existingSecret -}}
{{- if .Values.webhook.caBundle -}}
{{- $caBundle = .Values.webhook.caBundle | b64enc -}}
{{- else if $existing -}}
{{- $caBundle = required "webhook.existingSecret must contain ca.crt" (index $existing.data "ca.crt") -}}
{{- else -}}
{{- fail "webhook.caBundle is required when webhook.existingSecret cannot be read" -}}
{{- end -}}
{{- else if $existing -}}
{{- $caBundle = required "generated webhook Secret must contain ca.crt" (index $existing.data "ca.crt") -}}
{{- $caKey = default "" (index $existing.data "ca.key") -}}
{{- $tlsCrt = required "generated webhook Secret must contain tls.crt" (index $existing.data "tls.crt") -}}
{{- $tlsKey = required "generated webhook Secret must contain tls.key" (index $existing.data "tls.key") -}}
{{- else -}}
{{- /* Bootstrap material is deliberately short-lived. The rotator promptly replaces it with certificates matching the configured policy. */ -}}
{{- $ca := genCA (printf "%s-ca" $fullname) 2 -}}
{{- $service := include "ptah-operator.webhookServiceName" . -}}
{{- $dnsNames := list $service (printf "%s.%s" $service .Release.Namespace) (printf "%s.%s.svc" $service .Release.Namespace) (printf "%s.%s.svc.cluster.local" $service .Release.Namespace) -}}
{{- $cert := genSignedCert $service nil $dnsNames 1 $ca -}}
{{- $caBundle = $ca.Cert | b64enc -}}
{{- $caKey = $ca.Key | b64enc -}}
{{- $tlsCrt = $cert.Cert | b64enc -}}
{{- $tlsKey = $cert.Key | b64enc -}}
{{- end -}}
{{- $entryBundles := dict "mutating" $caBundle "approvalValidating" $caBundle "podValidating" $caBundle -}}
{{- if not .Values.webhook.existingSecret -}}
{{- $existingMutating := lookup "admissionregistration.k8s.io/v1" "MutatingWebhookConfiguration" "" $configurationName -}}
{{- if $existingMutating -}}
{{- range $existingMutating.webhooks -}}
{{- if and (eq .name "mapproval.operator.ptah.dev") .clientConfig.service (eq .clientConfig.service.name $serviceName) (eq .clientConfig.service.namespace $.Release.Namespace) -}}
{{- $_ := set $entryBundles "mutating" (include "ptah-operator.webhookEntryCABundle" (dict "newBundle" $caBundle "existingBundle" .clientConfig.caBundle "secretExists" (not (empty $existing)))) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $existingValidating := lookup "admissionregistration.k8s.io/v1" "ValidatingWebhookConfiguration" "" $configurationName -}}
{{- if $existingValidating -}}
{{- range $existingValidating.webhooks -}}
{{- if and .clientConfig.service (eq .clientConfig.service.name $serviceName) (eq .clientConfig.service.namespace $.Release.Namespace) -}}
{{- if eq .name "vapproval.operator.ptah.dev" -}}
{{- $_ := set $entryBundles "approvalValidating" (include "ptah-operator.webhookEntryCABundle" (dict "newBundle" $caBundle "existingBundle" .clientConfig.caBundle "secretExists" (not (empty $existing)))) -}}
{{- else if eq .name "vpodintent.operator.ptah.dev" -}}
{{- $_ := set $entryBundles "podValidating" (include "ptah-operator.webhookEntryCABundle" (dict "newBundle" $caBundle "existingBundle" .clientConfig.caBundle "secretExists" (not (empty $existing)))) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not .Values.webhook.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    operator.ptah.dev/generated-webhook-certificate: "true"
type: kubernetes.io/tls
data:
  ca.crt: {{ $caBundle }}
  {{- if $caKey }}
  ca.key: {{ $caKey }}
  {{- end }}
  tls.crt: {{ $tlsCrt }}
  tls.key: {{ $tlsKey }}
---
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ $configurationName }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
webhooks:
  - name: mapproval.operator.ptah.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    reinvocationPolicy: Never
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      caBundle: {{ index $entryBundles "mutating" }}
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ $serviceName }}
        path: /mutate-operator-ptah-dev-v1alpha1-ptahschemaapproval
        port: 443
    rules:
      - apiGroups: ["operator.ptah.dev"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE"]
        resources: ["ptahschemaapprovals"]
        scope: Namespaced
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $configurationName }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
webhooks:
  - name: vapproval.operator.ptah.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      caBundle: {{ index $entryBundles "approvalValidating" }}
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ $serviceName }}
        path: /validate-operator-ptah-dev-v1alpha1-ptahschemaapproval
        port: 443
    rules:
      - apiGroups: ["operator.ptah.dev"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ptahschemaapprovals"]
        scope: Namespaced
  - name: vpodintent.operator.ptah.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    objectSelector:
      matchLabels:
        app.kubernetes.io/managed-by: ptah-operator
        app.kubernetes.io/component: schema-operation
    matchConditions:
      - name: job-owned-pod
        expression: >-
          object.metadata.ownerReferences.exists(ref,
            ref.apiVersion == 'batch/v1' && ref.kind == 'Job' && ref.controller == true) ||
          (request.operation == 'UPDATE' && oldObject != null &&
            oldObject.metadata.ownerReferences.exists(ref,
              ref.apiVersion == 'batch/v1' && ref.kind == 'Job' && ref.controller == true))
    clientConfig:
      caBundle: {{ index $entryBundles "podValidating" }}
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ $serviceName }}
        path: /validate-v1-pod-ptah-operation-intent
        port: 443
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers", "pods/resize"]
        scope: Namespaced
