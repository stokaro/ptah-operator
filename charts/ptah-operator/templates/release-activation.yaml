{{- $sequence := include "ptah-operator.releaseSequence" . -}}
{{- $stateVersion := include "ptah-operator.controllerStateVersion" . -}}
{{- $admissionVersion := include "ptah-operator.admissionContractVersion" . -}}
{{- $managerImage := include "ptah-operator.managerImage" . -}}
{{- $existing := lookup "v1" "ConfigMap" .Release.Namespace "ptah-operator-release-activation" -}}
{{- with $existing -}}
{{- $annotations := default (dict) .metadata.annotations -}}
{{- $labels := default (dict) .metadata.labels -}}
{{- $data := default (dict) .data -}}
{{- $active := default "" (index $data "active-release-sequence") -}}
{{- $credentialPhase := default "" (index $data "controller-credentials") -}}
{{- $drainTarget := default "" (index $data "controller-credentials-target-release-sequence") -}}
{{- $drainAttempt := default "" (index $data "controller-credentials-attempt") -}}
{{- $state := default "" (index $annotations "operator.ptah.dev/controller-state-version") -}}
{{- $admission := default "" (index $annotations "operator.ptah.dev/admission-contract-version") -}}
{{- $release := default "" (index $annotations "operator.ptah.dev/release-sequence") -}}
{{- $image := default "" (index $annotations "operator.ptah.dev/manager-image") -}}
{{- if or
      (ne (len $annotations) 10)
      (ne (default "" .metadata.generateName) "")
      (eq (default "" .metadata.uid) "")
      (eq (default "" .metadata.resourceVersion) "")
      (not (empty .metadata.deletionTimestamp))
      (not (empty .metadata.deletionGracePeriodSeconds))
      (ne (default "" (index $annotations "helm.sh/hook")) "pre-install,pre-upgrade")
      (ne (default "" (index $annotations "helm.sh/hook-weight")) "-166")
      (ne (default "" (index $annotations "helm.sh/resource-policy")) "keep")
      (ne (default "" (index $annotations "operator.ptah.dev/rollout-guard-version")) "1")
      (ne (default "" (index $annotations "operator.ptah.dev/release-name")) $.Release.Name)
      (ne (default "" (index $annotations "operator.ptah.dev/release-namespace")) $.Release.Namespace)
      (not (regexMatch `^[1-9][0-9]*$` $state))
      (not (regexMatch `^[1-9][0-9]*$` $admission))
      (not (regexMatch `^[1-9][0-9]*$` $release))
      (not (regexMatch `^[^[:space:]]+$` $image))
      (ne (len $labels) 3)
      (ne (default "" (index $labels "app.kubernetes.io/managed-by")) "ptah-operator")
      (ne (default "" (index $labels "app.kubernetes.io/instance")) $.Release.Name)
      (ne (default "" (index $labels "app.kubernetes.io/component")) "rollout-guard")
      (not (regexMatch `^(0|[1-9][0-9]*)$` $active))
      (not (has $credentialPhase (list "active" "draining")))
      (and (eq $credentialPhase "active") (ne (len $data) 2))
      (and (eq $credentialPhase "draining") (or (ne (len $data) 4) (not (regexMatch `^[1-9][0-9]*$` $drainTarget)) (not (regexMatch `^[0-9a-f]{64}$` $drainAttempt))))
      (ne (len (default (dict) .binaryData)) 0)
      (default false .immutable)
      (ne (len (default (list) .metadata.ownerReferences)) 0)
      (ne (len (default (list) .metadata.finalizers)) 0)
      (and (ne $active "0") (ne $release $active))
      (and (eq $active "0") (ne $release $sequence))
      (gt (atoi $active) (atoi $sequence))
      (and (ne $active "0") (gt (atoi $sequence) (add 1 (atoi $active))))
      (gt (atoi $state) (atoi $stateVersion))
      (gt (atoi $admission) (atoi $admissionVersion))
      (gt (atoi $release) (atoi $sequence))
      (and (eq $release $sequence) (or (ne $state $stateVersion) (ne $admission $admissionVersion) (ne $image $managerImage)))
      (and (eq $credentialPhase "draining") (or (ne $drainTarget $sequence) (ne $drainAttempt (include "ptah-operator.hookIdentityDigest" $)))) -}}
{{- fail "retained release activation parameter has foreign, malformed, or future state" -}}
{{- end -}}
{{- end -}}
{{- if not $existing }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ptah-operator-release-activation
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-166"
    helm.sh/resource-policy: keep
    operator.ptah.dev/rollout-guard-version: "1"
    operator.ptah.dev/release-name: {{ .Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ .Release.Namespace | quote }}
    operator.ptah.dev/controller-state-version: {{ $stateVersion | quote }}
    operator.ptah.dev/admission-contract-version: {{ $admissionVersion | quote }}
    operator.ptah.dev/release-sequence: {{ $sequence | quote }}
    operator.ptah.dev/manager-image: {{ $managerImage | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rollout-guard
data:
  active-release-sequence: "0"
  controller-credentials: active
{{- end }}
