apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $imageCheckJobName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-130"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-manager-image-check
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "ptah-operator.labels" . | nindent 8 }}
        app.kubernetes.io/component: crd-manager-image-check
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: image-check
          image: {{ include "ptah-operator.managerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/ptah-crd-manager"]
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          args:
            - image-check
            - --release-sequence={{ include "ptah-operator.releaseSequence" . }}
            - --manager-image={{ include "ptah-operator.managerImage" . }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
