      {{- end }}
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["limitranges"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["ptah-operator-release-activation", {{ $admissionConvergenceMarkerName | quote }}]
    verbs: ["get", "update"]
  {{- if ne $previousSequence "0" }}
  # The predecessor attempt marker is retired only after candidate activation.
  # DELETE remains exact-name scoped and the manager supplies UID/resourceVersion
  # preconditions, so a replacement can never be removed by a stale retry.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $previousAdmissionConvergenceMarkerName | quote }}]
    verbs: ["get", "delete"]
  {{- end }}
---
