apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $identityBootstrapRoleName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-109"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: hook-identity-bootstrap
rules:
  # Before enforcement is proven, this identity can only dry-run an UPDATE of
  # its inert, candidate-specific marker. It has no workload mutation or schema
  # rights; the read-only inventory below cannot change a staged workload.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ include "ptah-operator.hookIdentityProbeObjectName" . }}]
    verbs: ["get", "update"]
  # Namespace-wide reads are required to detect Jobs and Pods that were
  # staged with any protected hook identity before the guards were installed.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
