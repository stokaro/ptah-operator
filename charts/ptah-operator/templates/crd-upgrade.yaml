{{- include "ptah-operator.validateAdmissionSingleton" . -}}
{{- include "ptah-operator.validateLifecycleResourceIdentities" . -}}
{{- $serviceAccountName := include "ptah-operator.crdManagerServiceAccountName" . -}}
{{- $clusterRoleName := include "ptah-operator.crdManagerClusterRoleName" . -}}
{{/*
One hook reconciles the CRDs before Helm touches anything else in the release.
It refuses a stored state or a CRD schema this release cannot read, and when
the manager image changes it stops the running release before it changes the
first CRD: an older manager serving a newer schema would drop the fields it
does not know from every object its webhooks mutate.

The hook runs on a rollback too. There it refuses what the release rolled back
to cannot read, before Helm replaces the running Pods with ones that would
refuse to start.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-110"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-manager
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterRoleName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-80"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-manager
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - ptahmigrationapprovals.operator.ptah.run
      - ptahmigrationplans.operator.ptah.run
      - ptahmigrationrunacknowledgments.operator.ptah.run
      - ptahmigrations.operator.ptah.run
      - ptahrealms.operator.ptah.run
      - ptahresultrecords.operator.ptah.run
      - ptahschemaapprovals.operator.ptah.run
      - ptahschemaplanchunks.operator.ptah.run
      - ptahschemaplans.operator.ptah.run
      - ptahschemas.operator.ptah.run
    verbs: ["get", "update"]
  # Kubernetes RBAC cannot scope LIST by resourceName. These read-only grants
  # cover every kind that can persist controller-written state and are required
  # to reject controller downgrades before changing any CRD schema.
  - apiGroups: ["operator.ptah.run"]
    resources: ["ptahschemas", "ptahschemaplans", "ptahschemaapprovals", "ptahmigrations", "ptahmigrationplans", "ptahmigrationapprovals"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterRoleName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-70"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterRoleName }}
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccountName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $clusterRoleName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-80"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-manager
rules:
  # Stopping the running release is scaling its two Deployments to zero and
  # waiting until their Pods are gone.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - {{ include "ptah-operator.fullname" . }}
      - {{ include "ptah-operator.certRotatorServiceAccountName" . }}
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $clusterRoleName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-70"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $clusterRoleName }}
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccountName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $clusterRoleName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
    # A failed hook is deleted, and its refusal with it. Helm prints the
    # hook's log before that, so the reason reaches whoever ran the command.
    helm.sh/hook-output-log-policy: hook-failed
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-manager
spec:
  activeDeadlineSeconds: 390
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "ptah-operator.labels" . | nindent 8 }}
        app.kubernetes.io/component: crd-manager
    spec:
      serviceAccountName: {{ $serviceAccountName }}
      automountServiceAccountToken: false
      restartPolicy: Never
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: crd-manager
          image: {{ include "ptah-operator.managerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/ptah-crd-manager"]
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          args:
            {{- range (include "ptah-operator.crdReconcileArgsJSON" . | fromJsonArray) }}
            - {{ . | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
