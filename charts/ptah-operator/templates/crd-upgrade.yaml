  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $probeRoleName }}
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccountName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $clusterRoleName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-manager
spec:
  activeDeadlineSeconds: 390
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "ptah-operator.labels" . | nindent 8 }}
        app.kubernetes.io/component: crd-manager
    spec:
      serviceAccountName: {{ $serviceAccountName }}
      automountServiceAccountToken: false
      restartPolicy: Never
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: crd-manager
          image: {{ include "ptah-operator.managerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/ptah-crd-manager"]
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          args:
            {{- range (include "ptah-operator.crdManagerArgsJSON" (dict "root" . "mode" "reconcile" "timeout" "360s" "verifyControllerState" false) | fromJsonArray) }}
            - {{ . | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
