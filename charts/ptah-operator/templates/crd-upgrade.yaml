apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterRoleName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-80"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-manager
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - ptahschemaapprovals.operator.ptah.dev
      - ptahschemaplans.operator.ptah.dev
      - ptahschemas.operator.ptah.dev
    verbs: ["get", "update"]
  # Kubernetes RBAC cannot scope LIST by resourceName. These read-only grants
  # cover every kind that can persist controller-written state and are required
  # to reject controller downgrades before changing any CRD schema.
  - apiGroups: ["operator.ptah.dev"]
    resources: ["ptahschemas", "ptahschemaplans", "ptahschemaapprovals"]
    verbs: ["list"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    resourceNames: ["ptah-operator-admission"]
    verbs: ["get", "update"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies"]
    resourceNames:
      - {{ include "ptah-operator.rolloutGuardPolicyName" . }}
      - {{ include "ptah-operator.runtimeGuardPolicyName" . }}
      - {{ include "ptah-operator.runtimePodGuardPolicyName" . }}
      - {{ include "ptah-operator.hookIdentityGuardPolicyName" . }}
      - {{ include "ptah-operator.hookIdentityProbeGuardPolicyName" . }}
      - {{ include "ptah-operator.releaseActivationGuardPolicyName" . }}
      - {{ $admissionConvergencePolicyName }}
      - {{ $serviceAccountObjectGuardName }}
      - {{ include "ptah-operator.serviceAccountOriginGuardPolicyName" . }}
      - {{ include "ptah-operator.controllerWriteGuardPolicyName" . }}
      - {{ include "ptah-operator.controllerJobWriteGuardPolicyName" . }}
      - {{ include "ptah-operator.controllerChunkWriteGuardPolicyName" . }}
      - {{ include "ptah-operator.controllerPlanWriteGuardPolicyName" . }}
      - {{ include "ptah-operator.certificateMutatingWriteGuardPolicyName" . }}
      - {{ include "ptah-operator.certificateValidatingWriteGuardPolicyName" . }}
      - {{ include "ptah-operator.namespaceDeletionGuardPolicyName" . }}
      - {{ include "ptah-operator.parentReplicaSetGuardPolicyName" . }}
      - {{ include "ptah-operator.parentHookPodOriginGuardPolicyName" . }}
      - {{ include "ptah-operator.parentHookJobOriginGuardPolicyName" . }}
      - {{ include "ptah-operator.parentHookJobContractPolicyName" . }}
    verbs: ["get"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicybindings"]
    resourceNames:
      - {{ include "ptah-operator.rolloutGuardPolicyName" . }}
      - {{ include "ptah-operator.runtimeGuardPolicyName" . }}
      - {{ include "ptah-operator.runtimePodGuardPolicyName" . }}
      - {{ include "ptah-operator.hookIdentityGuardPolicyName" . }}
      - {{ include "ptah-operator.hookIdentityProbeGuardPolicyName" . }}
      - {{ include "ptah-operator.releaseActivationGuardPolicyName" . }}
      - {{ $admissionConvergencePolicyName }}
      - {{ $serviceAccountObjectGuardName }}
      - {{ include "ptah-operator.serviceAccountOriginGuardPolicyName" . }}
      - {{ include "ptah-operator.controllerWriteGuardPolicyName" . }}
      - {{ include "ptah-operator.controllerJobWriteGuardPolicyName" . }}
      - {{ include "ptah-operator.controllerChunkWriteGuardPolicyName" . }}
      - {{ include "ptah-operator.controllerPlanWriteGuardPolicyName" . }}
      - {{ include "ptah-operator.certificateMutatingWriteGuardPolicyName" . }}
      - {{ include "ptah-operator.certificateValidatingWriteGuardPolicyName" . }}
      - {{ include "ptah-operator.namespaceDeletionGuardPolicyName" . }}
      - {{ include "ptah-operator.parentReplicaSetGuardPolicyName" . }}
      - {{ include "ptah-operator.parentHookPodOriginGuardPolicyName" . }}
      - {{ include "ptah-operator.parentHookJobOriginGuardPolicyName" . }}
      - {{ include "ptah-operator.parentHookJobContractPolicyName" . }}
    verbs: ["get"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list"]
  # Binding LIST is cluster-wide so the manager can reject every foreign grant
  # to either protected controller principal. GET/PATCH remains limited to the
  # three stable names; the hook has no RBAC binding CREATE permission.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    resourceNames: [{{ include "ptah-operator.fullname" . | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames:
      - {{ include "ptah-operator.fullname" . | quote }}
      - {{ printf "%s-runtime-admission" (include "ptah-operator.fullname" .) | quote }}
    verbs: ["get", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: [{{ include "ptah-operator.fullname" . | quote }}]
    verbs: ["get"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    resourceNames:
      - {{ include "ptah-operator.fullname" . | quote }}
      - {{ printf "%s-runtime-admission" (include "ptah-operator.fullname" .) | quote }}
    verbs: ["get"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
---
