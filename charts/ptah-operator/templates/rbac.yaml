{{- $coordinationNamespace := default .Release.Namespace .Values.coordination.namespace -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ptah-operator.fullname" . }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - ptahmigrationapprovals.operator.ptah.run
      - ptahmigrationplans.operator.ptah.run
      - ptahmigrations.operator.ptah.run
      - ptahrealms.operator.ptah.run
      - ptahschemaapprovals.operator.ptah.run
      - ptahschemaplanchunks.operator.ptah.run
      - ptahschemaplans.operator.ptah.run
      - ptahschemas.operator.ptah.run
    verbs: ["get"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    resourceNames: ["ptah-operator-admission"]
    verbs: ["get"]
  - apiGroups: ["operator.ptah.run"]
    resources: ["ptahschemas"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["operator.ptah.run"]
    resources: ["ptahschemas/finalizers", "ptahschemaplans/finalizers"]
    verbs: ["update"]
  - apiGroups: ["operator.ptah.run"]
    resources: ["ptahschemas/status", "ptahschemaplans/status", "ptahschemaapprovals/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["operator.ptah.run"]
    resources: ["ptahschemaplans"]
    verbs: ["get", "list", "watch", "create"]
  # A plan's bytes. The manager writes a plan's chunks when it publishes the
  # plan and reads them back by name, uncached, before an Apply; it never
  # lists or watches them, because each one holds up to 512 KiB of SQL.
  - apiGroups: ["operator.ptah.run"]
    resources: ["ptahschemaplanchunks"]
    verbs: ["get", "create"]
  - apiGroups: ["operator.ptah.run"]
    resources: ["ptahschemaapprovals"]
    verbs: ["get", "list", "watch"]
  # The migration resource is read by the controller write guard before it
  # admits a migration Job, and written by the migration controller.
  - apiGroups: ["operator.ptah.run"]
    resources: ["ptahmigrations"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["operator.ptah.run"]
    resources: ["ptahmigrations/finalizers"]
    verbs: ["update"]
  - apiGroups: ["operator.ptah.run"]
    resources: ["ptahmigrations/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["operator.ptah.run"]
    resources: ["ptahmigrationplans"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["operator.ptah.run"]
    resources: ["ptahmigrationapprovals"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["operator.ptah.run"]
    resources: ["ptahmigrationapprovals/status"]
    verbs: ["get", "update", "patch"]
  # The realm census reads which namespaces a PtahRealm admits. Realms are an
  # administrator's grant, so the manager reads them and never writes them.
  - apiGroups: ["operator.ptah.run"]
    resources: ["ptahrealms"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Admission snapshots are resolved in each PtahSchema namespace. These
  # resources contain scheduling metadata but no Secret payloads.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["limitranges"]
    verbs: ["list"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list"]
  # get, list and watch read the verification policies resources name, and
  # wake them when one changes. create is for one thing: an Apply Pod holds no
  # Kubernetes credential and the kubelet projects no custom resource, so the
  # manager writes the plan an Apply runs into immutable ConfigMaps the Pod
  # mounts, just before it creates the Job. They are deleted with the plan.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create"]
  # list is how a Job whose Pod the API server refuses is explained: the Job
  # controller's FailedCreate Event is the only record, and the manager reads
  # it for the Job it dispatched, by the Job's UID, to report the refusal as a
  # condition.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ptah-operator.fullname" . }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ptah-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ptah-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ptah-operator.fullname" $ }}
  namespace: {{ $coordinationNamespace }}
  labels:
    {{- include "ptah-operator.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ptah-operator.fullname" $ }}
  namespace: {{ $coordinationNamespace }}
  labels:
    {{- include "ptah-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ptah-operator.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ptah-operator.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- if .Values.approverClusterRole.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ptah-operator.fullname" . }}-approver
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
rules:
  # Both families. An approval names a resource and its plan, so an approver
  # reads both, the chunks that hold a schema plan's SQL, and the approvals
  # already made. No ConfigMap and no Pod log: neither is how a plan is read.
  - apiGroups: ["operator.ptah.run"]
    resources: ["ptahschemas", "ptahschemaplans", "ptahschemaplanchunks", "ptahschemaapprovals", "ptahmigrations", "ptahmigrationplans", "ptahmigrationapprovals"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["operator.ptah.run"]
    resources: ["ptahschemaapprovals", "ptahmigrationapprovals"]
    verbs: ["create"]
{{- end }}
