{{- $coordinationNamespace := default .Release.Namespace .Values.coordination.namespace -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ptah-operator.fullname" . }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - ptahschemaapprovals.operator.ptah.dev
      - ptahschemaplans.operator.ptah.dev
      - ptahschemas.operator.ptah.dev
    verbs: ["get"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    resourceNames: ["ptah-operator-admission"]
    verbs: ["get"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    resourceNames:
      - {{ include "ptah-operator.rolloutGuardPolicyName" . }}
      - {{ include "ptah-operator.runtimeGuardPolicyName" . }}
      - {{ include "ptah-operator.runtimePodGuardPolicyName" . }}
      - {{ include "ptah-operator.hookIdentityGuardPolicyName" . }}
      - {{ include "ptah-operator.hookIdentityProbeGuardPolicyName" . }}
      - {{ include "ptah-operator.releaseActivationGuardPolicyName" . }}
      - {{ include "ptah-operator.serviceAccountOriginGuardPolicyName" . }}
      - {{ include "ptah-operator.parentReplicaSetGuardPolicyName" . }}
      - {{ include "ptah-operator.parentHookPodOriginGuardPolicyName" . }}
      - {{ include "ptah-operator.parentHookJobOriginGuardPolicyName" . }}
      - {{ include "ptah-operator.parentHookJobContractPolicyName" . }}
    verbs: ["get"]
  - apiGroups: ["operator.ptah.dev"]
    resources: ["ptahschemas"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["operator.ptah.dev"]
    resources: ["ptahschemas/finalizers", "ptahschemaplans/finalizers"]
    verbs: ["update"]
  - apiGroups: ["operator.ptah.dev"]
    resources: ["ptahschemas/status", "ptahschemaplans/status", "ptahschemaapprovals/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["operator.ptah.dev"]
    resources: ["ptahschemaplans"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["operator.ptah.dev"]
    resources: ["ptahschemaapprovals"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ptah-operator.fullname" . }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ptah-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ptah-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ptah-operator.fullname" . }}-runtime-admission
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames:
      - {{ include "ptah-operator.serviceAccountName" . }}
      - {{ include "ptah-operator.certRotatorServiceAccountName" . }}
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["limitranges"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ptah-operator.fullname" . }}-runtime-admission
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ptah-operator.fullname" . }}-runtime-admission
subjects:
  - kind: ServiceAccount
    name: {{ include "ptah-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ptah-operator.fullname" $ }}
  namespace: {{ $coordinationNamespace }}
  labels:
    {{- include "ptah-operator.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ptah-operator.fullname" $ }}
  namespace: {{ $coordinationNamespace }}
  labels:
    {{- include "ptah-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ptah-operator.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ptah-operator.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- if .Values.approverClusterRole.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ptah-operator.fullname" . }}-approver
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["operator.ptah.dev"]
    resources: ["ptahschemas", "ptahschemaplans", "ptahschemaapprovals"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["operator.ptah.dev"]
    resources: ["ptahschemaapprovals"]
    verbs: ["create"]
{{- end }}
