{{- define "ptah-operator.hookBindingTransitionSubject" -}}
{{- printf `%[1]s.kind == "ServiceAccount" && %[1]s.name == %[2]q && %[1]s.namespace == %[3]q && (!has(%[1]s.apiGroup) || %[1]s.apiGroup == "")` .subject .name .namespace -}}
{{- end -}}
{{- define "ptah-operator.hookBindingTransitionTarget" -}}
{{- $resource := "rolebindings" -}}
{{- $roleKind := "Role" -}}
{{- if eq .kind "ClusterRoleBinding" -}}
{{- $resource = "clusterrolebindings" -}}
{{- $roleKind = "ClusterRole" -}}
{{- end -}}
{{- $parts := list
      (printf `request.resource.resource == %q && request.kind.group == "rbac.authorization.k8s.io" && request.kind.version == "v1" && request.kind.kind == %q && request.name == %q && object.metadata.name == %q` $resource .kind .name .name)
      (printf `dyn(object).roleRef == {"apiGroup": "rbac.authorization.k8s.io", "kind": %q, "name": %q} && dyn(oldObject).roleRef == dyn(object).roleRef` $roleKind .name) -}}
{{- if eq .namespace "" -}}
{{- $parts = append $parts `(!has(request.namespace) || request.namespace == "") && (!has(object.metadata.namespace) || object.metadata.namespace == "")` -}}
{{- else -}}
{{- $parts = append $parts (printf `has(request.namespace) && request.namespace == %q && has(object.metadata.namespace) && object.metadata.namespace == %q` .namespace .namespace) -}}
{{- end -}}
{{- $count := 1 -}}
{{- if .certificate -}}{{- $count = 2 -}}{{- end -}}
{{- $parts = append $parts (printf `has(dyn(object).subjects) && dyn(object).subjects.size() == %d && has(dyn(oldObject).subjects) && dyn(oldObject).subjects.size() == %d` $count $count) -}}
{{- $parts = append $parts (include "ptah-operator.hookBindingTransitionSubject" (dict "subject" "dyn(oldObject).subjects[0]" "namespace" .root.Release.Namespace "name" (include "ptah-operator.previousControllerServiceAccountName" .root))) -}}
{{- $parts = append $parts (include "ptah-operator.hookBindingTransitionSubject" (dict "subject" "dyn(object).subjects[0]" "namespace" .root.Release.Namespace "name" (include "ptah-operator.serviceAccountName" .root))) -}}
{{- if .certificate -}}
{{- $parts = append $parts (include "ptah-operator.hookBindingTransitionSubject" (dict "subject" "dyn(oldObject).subjects[1]" "namespace" .root.Release.Namespace "name" (include "ptah-operator.certRotatorServiceAccountName" .root))) -}}
{{- $parts = append $parts `dyn(object).subjects[1] == dyn(oldObject).subjects[1]` -}}
{{- end -}}
{{- printf "(%s)" (join " && " $parts) -}}
{{- end -}}
{{- $guardName := include "ptah-operator.serviceAccountOriginGuardPolicyName" . -}}
{{- $convergenceFieldManager := include "ptah-operator.admissionConvergenceProbeFieldManager" (dict "root" . "policyName" $guardName) -}}
{{- $convergenceRequest := include "ptah-operator.admissionConvergenceProbeRequest" (dict "root" . "fieldManager" $convergenceFieldManager) -}}
{{- $anyConvergenceRequest := include "ptah-operator.admissionConvergenceAnyProbeRequest" . -}}
{{- $convergenceMessage := include "ptah-operator.admissionConvergenceProbeMessage" (dict "fieldManager" $convergenceFieldManager) -}}
{{- $hookServiceAccount := include "ptah-operator.crdManagerServiceAccountName" . -}}
{{- $hookSuffix := printf "-crd-v%s-%s" (include "ptah-operator.releaseSequence" .) (include "ptah-operator.hookIdentityDigest" . | trunc 12) -}}
{{- if not (hasSuffix $hookSuffix $hookServiceAccount) -}}
{{- fail "hook ServiceAccount does not match the candidate release identity" -}}
{{- end -}}
{{- $hookBase := trimSuffix $hookSuffix $hookServiceAccount -}}
{{- if eq $hookBase "" -}}
{{- fail "hook ServiceAccount has no stable name prefix" -}}
{{- end -}}
{{- $controllerServiceAccount := include "ptah-operator.serviceAccountName" . -}}
{{- $previousControllerServiceAccount := include "ptah-operator.previousControllerServiceAccountName" . -}}
{{- $previousControllerReleaseSequence := include "ptah-operator.previousControllerReleaseSequence" . -}}
{{- $previousControllerManagerImage := include "ptah-operator.previousControllerManagerImage" . -}}
{{- $controllerDeployment := include "ptah-operator.fullname" . -}}
{{- $certificateServiceAccount := include "ptah-operator.certRotatorServiceAccountName" . -}}
{{- $certificateDeployment := include "ptah-operator.certRotatorServiceAccountName" . -}}
{{- if or
      (eq $hookServiceAccount $controllerServiceAccount)
      (eq $hookServiceAccount $certificateServiceAccount)
      (eq $controllerServiceAccount $certificateServiceAccount) -}}
{{- fail "service account origin guard protected ServiceAccount names must differ" -}}
{{- end -}}
{{- if eq $controllerDeployment $certificateDeployment -}}
{{- fail "service account origin guard workload names must differ" -}}
{{- end -}}
{{- $hookServiceAccountPattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}$" (regexQuoteMeta (printf "%s-crd-v" $hookBase)) -}}
{{- $hookUsernamePattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}$" (regexQuoteMeta (printf "system:serviceaccount:%s:%s-crd-v" .Release.Namespace $hookBase)) -}}
{{- $hookPodPattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}-" (regexQuoteMeta (printf "%s-crd-v" $hookBase)) -}}
{{- $teardownServiceAccountPattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}$" (regexQuoteMeta (printf "%s-cleanup-v" $hookBase)) -}}
{{- $teardownUsernamePattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}$" (regexQuoteMeta (printf "system:serviceaccount:%s:%s-cleanup-v" .Release.Namespace $hookBase)) -}}
{{- $teardownPodPattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}-" (regexQuoteMeta (printf "%s-cleanup-v" $hookBase)) -}}
{{- $quiescePodPattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}-" (regexQuoteMeta (printf "%s-quiesce-v" $hookBase)) -}}
{{- $hookIdentityPodPattern := `^ptah-hook-identity-v[1-9][0-9]*-[0-9a-f]{12}-` -}}
{{- $controllerUsername := printf "system:serviceaccount:%s:%s" .Release.Namespace $controllerServiceAccount -}}
{{- $controllerUsernameMatch := printf `request.userInfo.username in [%q]` $controllerUsername -}}
{{- $controllerNameMatch := printf `request.name in [%q]` $controllerServiceAccount -}}
{{- if and $previousControllerServiceAccount (ne $previousControllerServiceAccount $controllerServiceAccount) -}}
{{- $previousControllerUsername := printf "system:serviceaccount:%s:%s" .Release.Namespace $previousControllerServiceAccount -}}
{{- $controllerUsernameMatch = printf `request.userInfo.username in [%q, %q]` $controllerUsername $previousControllerUsername -}}
{{- $controllerNameMatch = printf `request.name in [%q, %q]` $controllerServiceAccount $previousControllerServiceAccount -}}
{{- end -}}
{{- $certificateUsername := printf "system:serviceaccount:%s:%s" .Release.Namespace $certificateServiceAccount -}}
{{- $denialMessage := "Ptah service account origin guard rejected a request without workload-bound identity" -}}
{{- $matchCondition := printf `(%s) || request.userInfo.username == %q || request.userInfo.username.matches(%q) || request.userInfo.username.matches(%q) || (request.operation == "CREATE" && request.resource.group == "" && request.resource.version == "v1" && request.resource.resource == "serviceaccounts" && has(request.subResource) && request.subResource == "token" && request.namespace == %q && ((%s) || request.name == %q || request.name.matches(%q) || request.name.matches(%q)))` $controllerUsernameMatch $certificateUsername $hookUsernamePattern $teardownUsernamePattern .Release.Namespace $controllerNameMatch $certificateServiceAccount $hookServiceAccountPattern $teardownServiceAccountPattern -}}
{{- $isProtectedTokenRequest := printf `variables.isTokenRequest && request.namespace == %q && ((%s) || request.name == %q || request.name.matches(%q) || request.name.matches(%q))` .Release.Namespace $controllerNameMatch $certificateServiceAccount $hookServiceAccountPattern $teardownServiceAccountPattern -}}
{{- $isControllerTokenRequest := printf `variables.isTokenRequest && request.namespace == %q && (%s)` .Release.Namespace $controllerNameMatch -}}
{{- $callerPodName := printf `has(request.userInfo.extra) && %q in request.userInfo.extra && request.userInfo.extra[%q].size() == 1 ? request.userInfo.extra[%q][0] : ""` "authentication.kubernetes.io/pod-name" "authentication.kubernetes.io/pod-name" "authentication.kubernetes.io/pod-name" -}}
{{- $callerPodUID := printf `has(request.userInfo.extra) && %q in request.userInfo.extra && request.userInfo.extra[%q].size() == 1 ? request.userInfo.extra[%q][0] : ""` "authentication.kubernetes.io/pod-uid" "authentication.kubernetes.io/pod-uid" "authentication.kubernetes.io/pod-uid" -}}
{{- $controllerCallerPodName := include "ptah-operator.runtimePodRequestNameExpression" (dict "nameExpression" "variables.callerPodName" "deploymentName" $controllerDeployment) -}}
{{- $certificateCallerPodName := include "ptah-operator.runtimePodRequestNameExpression" (dict "nameExpression" "variables.callerPodName" "deploymentName" $certificateDeployment) -}}
{{- $controllerBoundPodName := include "ptah-operator.runtimePodRequestNameExpression" (dict "nameExpression" "dyn(object).spec.boundObjectRef.name" "deploymentName" $controllerDeployment) -}}
{{- $certificateBoundPodName := include "ptah-operator.runtimePodRequestNameExpression" (dict "nameExpression" "dyn(object).spec.boundObjectRef.name" "deploymentName" $certificateDeployment) -}}
{{- $callerValidation := printf `!variables.isProtectedCaller || (variables.callerPodName != "" && variables.callerPodUID != "" && ((variables.isHookCaller && (variables.callerPodName.matches(%q) || variables.callerPodName.matches(%q) || variables.callerPodName.matches(%q) || variables.callerPodName.matches(%q))) || (variables.isControllerCaller && %s) || (variables.isCertificateCaller && %s)))` $hookPodPattern $hookIdentityPodPattern $teardownPodPattern $quiescePodPattern $controllerCallerPodName $certificateCallerPodName -}}
{{- $tokenValidation := printf `!variables.isProtectedTokenRequest || (request.userInfo.username.matches("^system:node:.+$") && request.userInfo.groups.filter(group, group == "system:nodes").size() == 1 && has(dyn(object).spec.boundObjectRef) && has(dyn(object).spec.boundObjectRef.apiVersion) && dyn(object).spec.boundObjectRef.apiVersion == "v1" && has(dyn(object).spec.boundObjectRef.kind) && dyn(object).spec.boundObjectRef.kind == "Pod" && has(dyn(object).spec.boundObjectRef.name) && dyn(object).spec.boundObjectRef.name != "" && has(dyn(object).spec.boundObjectRef.uid) && dyn(object).spec.boundObjectRef.uid != "" && (((%s) && %s) || (request.name == %q && %s) || (request.name.matches(%q) && (dyn(object).spec.boundObjectRef.name.matches(%q) || dyn(object).spec.boundObjectRef.name.matches(%q) || dyn(object).spec.boundObjectRef.name.matches(%q))) || (request.name.matches(%q) && dyn(object).spec.boundObjectRef.name.matches(%q))))` $controllerNameMatch $controllerBoundPodName $certificateServiceAccount $certificateBoundPodName $hookServiceAccountPattern $hookPodPattern $hookIdentityPodPattern $quiescePodPattern $teardownServiceAccountPattern $teardownPodPattern -}}
{{- $activationShape := include "ptah-operator.releaseActivationShape" (dict "object" "params" "namespace" .Release.Namespace "releaseName" .Release.Name) -}}
{{- $candidateSequence := include "ptah-operator.releaseSequence" . -}}
{{- $bindingCaller := printf `request.userInfo.username == %q && request.resource.group == "rbac.authorization.k8s.io" && request.resource.resource in ["clusterrolebindings", "rolebindings"]` (printf "system:serviceaccount:%s:%s" .Release.Namespace $hookServiceAccount) -}}
{{- $bindingTransition := printf "!(%s)" $bindingCaller -}}
{{- if $previousControllerServiceAccount -}}
{{- $targets := list
      (include "ptah-operator.hookBindingTransitionTarget" (dict "root" . "kind" "ClusterRoleBinding" "namespace" "" "name" $controllerDeployment "certificate" false))
      (include "ptah-operator.hookBindingTransitionTarget" (dict "root" . "kind" "RoleBinding" "namespace" (include "ptah-operator.coordinationNamespace" .) "name" $controllerDeployment "certificate" false)) -}}
{{- if gt (int $previousControllerReleaseSequence) 0 -}}
{{- $targets = append $targets (include "ptah-operator.hookBindingTransitionTarget" (dict "root" . "kind" "RoleBinding" "namespace" .Release.Namespace "name" (printf "%s-runtime-admission" $controllerDeployment) "certificate" true)) -}}
{{- if ne .Release.Namespace "default" -}}
{{- $targets = append $targets (include "ptah-operator.hookBindingTransitionTarget" (dict "root" . "kind" "RoleBinding" "namespace" "default" "name" (printf "%s-runtime-discovery" $controllerDeployment) "certificate" true)) -}}
{{- end -}}
{{- end -}}
{{- $reconcilePrefix := printf "%s-" $hookServiceAccount | trunc 58 -}}
{{- $drainTarget := `params != null && has(params.data) && "controller-credentials-target-release-sequence" in params.data && params.data["controller-credentials-target-release-sequence"].matches("^[1-9][0-9]*$") ? int(params.data["controller-credentials-target-release-sequence"]) : -1` -}}
{{- $drainAttempt := `params != null && has(params.data) && "controller-credentials-attempt" in params.data ? params.data["controller-credentials-attempt"] : ""` -}}
{{- $parts := list
      `request.operation == "UPDATE" && (!has(request.subResource) || request.subResource == "") && request.resource.version == "v1" && object != null && oldObject != null`
      (printf `(variables.callerPodName.startsWith(%q) && variables.callerPodName.size() == %d && variables.callerPodName.substring(%d).matches("^[a-z0-9]{5}$"))` $reconcilePrefix (add (len $reconcilePrefix) 5) (len $reconcilePrefix))
      `variables.callerPodUID != ""`
      (printf `variables.activeRelease == %s && variables.controllerCredentialPhase == "draining" && (%s) == %s && (%s) == %q` $previousControllerReleaseSequence $drainTarget $candidateSequence $drainAttempt (include "ptah-operator.hookIdentityDigest" .))
      `has(object.metadata.uid) && object.metadata.uid != "" && has(object.metadata.resourceVersion) && object.metadata.resourceVersion != ""`
      (printf `has(object.metadata.labels) && object.metadata.labels["app.kubernetes.io/managed-by"] == "Helm" && object.metadata.labels["app.kubernetes.io/instance"] == %q && has(object.metadata.annotations) && object.metadata.annotations["meta.helm.sh/release-name"] == %q && object.metadata.annotations["meta.helm.sh/release-namespace"] == %q` .Release.Name .Release.Name .Release.Namespace)
      `(!has(object.metadata.generateName) || object.metadata.generateName == "") && !has(object.metadata.deletionTimestamp) && !has(object.metadata.deletionGracePeriodSeconds) && (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0) && (!has(object.metadata.finalizers) || object.metadata.finalizers.size() == 0)` -}}
{{- range $field := list "name" "generateName" "namespace" "selfLink" "uid" "resourceVersion" "generation" "creationTimestamp" "deletionTimestamp" "deletionGracePeriodSeconds" "labels" "annotations" "ownerReferences" "finalizers" -}}
{{- $parts = append $parts (printf `has(%[1]s) == has(%[2]s) && (!has(%[1]s) || %[1]s == %[2]s)` (printf "object.metadata.%s" $field) (printf "oldObject.metadata.%s" $field)) -}}
{{- end -}}
{{- $parts = append $parts (printf "(%s)" (join " || " $targets)) -}}
{{- $bindingTransition = printf "!(%s) || (%s)" $bindingCaller (join " && " $parts) -}}
{{- end -}}
{{- $activationShape = printf "(%s) && (%s)" $activationShape $bindingTransition -}}
{{- $controllerAuthority := printf `request.userInfo.username == %q && variables.activeRelease == %s` $controllerUsername $candidateSequence -}}
{{- $controllerTokenAuthority := printf `request.name == %q && variables.activeRelease == %s` $controllerServiceAccount $candidateSequence -}}
{{- if and $previousControllerServiceAccount (ne $previousControllerServiceAccount $controllerServiceAccount) -}}
{{- $controllerAuthority = printf `(%s) || (request.userInfo.username == %q && variables.activeRelease == %s)` $controllerAuthority (printf "system:serviceaccount:%s:%s" .Release.Namespace $previousControllerServiceAccount) $previousControllerReleaseSequence -}}
{{- $controllerTokenAuthority = printf `(%s) || (request.name == %q && variables.activeRelease == %s)` $controllerTokenAuthority $previousControllerServiceAccount $previousControllerReleaseSequence -}}
{{- end -}}
{{- $policy := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicy" "" $guardName -}}
{{- $binding := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicyBinding" "" $guardName -}}
{{- range $entry := list
      (dict "kind" "ValidatingAdmissionPolicy" "object" $policy)
      (dict "kind" "ValidatingAdmissionPolicyBinding" "object" $binding) -}}
{{- with $entry.object -}}
{{- $annotations := default (dict) .metadata.annotations -}}
{{- $labels := default (dict) .metadata.labels -}}
{{- if or
      (ne (default "" (index $annotations "operator.ptah.dev/rollout-guard-version")) "1")
      (ne (default "" (index $annotations "operator.ptah.dev/release-name")) $.Release.Name)
      (ne (default "" (index $annotations "operator.ptah.dev/release-namespace")) $.Release.Namespace)
      (ne (default "" (index $labels "app.kubernetes.io/managed-by")) "ptah-operator")
      (ne (default "" (index $labels "app.kubernetes.io/instance")) $.Release.Name)
      (ne (default "" (index $labels "app.kubernetes.io/component")) "service-account-origin-guard") -}}
{{- fail (printf "retained %s %s has foreign or incomplete service-account-origin ownership" $entry.kind $guardName) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not $policy }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $guardName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-129"
    helm.sh/resource-policy: keep
    operator.ptah.dev/rollout-guard-version: "1"
    operator.ptah.dev/release-name: {{ .Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ .Release.Namespace | quote }}
    operator.ptah.dev/controller-state-version: {{ include "ptah-operator.controllerStateVersion" . | quote }}
    operator.ptah.dev/admission-contract-version: {{ include "ptah-operator.admissionContractVersion" . | quote }}
    operator.ptah.dev/release-sequence: {{ include "ptah-operator.releaseSequence" . | quote }}
    operator.ptah.dev/manager-image: {{ include "ptah-operator.managerImage" . | quote }}
    operator.ptah.dev/hook-service-account-name: {{ $hookServiceAccount | quote }}
    operator.ptah.dev/controller-service-account-name: {{ $controllerServiceAccount | quote }}
    operator.ptah.dev/controller-service-account-managed: {{ printf "%t" .Values.serviceAccount.create | quote }}
    operator.ptah.dev/previous-controller-service-account-name: {{ $previousControllerServiceAccount | quote }}
    operator.ptah.dev/previous-controller-service-account-uid: {{ include "ptah-operator.previousControllerServiceAccountUID" . | quote }}
    operator.ptah.dev/previous-controller-service-account-managed: {{ include "ptah-operator.previousControllerServiceAccountManaged" . | quote }}
    operator.ptah.dev/previous-controller-release-sequence: {{ $previousControllerReleaseSequence | quote }}
    operator.ptah.dev/previous-controller-manager-image: {{ $previousControllerManagerImage | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: service-account-origin-guard
spec:
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Exact
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE", "CONNECT"]
        resources: ["*/*"]
        scope: "*"
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["configmaps"]
        resourceNames: [{{ include "ptah-operator.admissionConvergenceMarkerName" $ | quote }}]
        scope: Namespaced
  matchConditions:
    - name: protected-service-account-origin
      expression: {{ printf `(%s) || (%s)` $anyConvergenceRequest $matchCondition | quote }}
  variables:
    - name: isAnyAdmissionConvergenceProbe
      expression: {{ $anyConvergenceRequest | quote }}
    - name: isAdmissionConvergenceProbe
      expression: {{ $convergenceRequest | quote }}
    - name: activeRelease
      expression: 'params != null && has(params.data) && "active-release-sequence" in params.data && params.data["active-release-sequence"].matches("^(0|[1-9][0-9]*)$") ? int(params.data["active-release-sequence"]) : -1'
    - name: controllerCredentialPhase
      expression: 'params != null && has(params.data) && "controller-credentials" in params.data ? params.data["controller-credentials"] : ""'
    - name: isTokenRequest
      expression: 'request.operation == "CREATE" && request.resource.group == "" && request.resource.version == "v1" && request.resource.resource == "serviceaccounts" && has(request.subResource) && request.subResource == "token"'
    - name: isControllerTokenRequest
      expression: {{ $isControllerTokenRequest | quote }}
    - name: isHookCaller
      expression: {{ printf `request.userInfo.username.matches(%q) || request.userInfo.username.matches(%q)` $hookUsernamePattern $teardownUsernamePattern | quote }}
    - name: isControllerCaller
      expression: {{ $controllerUsernameMatch | quote }}
    - name: isCertificateCaller
      expression: {{ printf `request.userInfo.username == %q` $certificateUsername | quote }}
    - name: isProtectedCaller
      expression: 'variables.isHookCaller || variables.isControllerCaller || variables.isCertificateCaller'
    - name: isProtectedTokenRequest
      expression: {{ $isProtectedTokenRequest | quote }}
    - name: callerPodName
      expression: {{ $callerPodName | quote }}
    - name: callerPodUID
      expression: {{ $callerPodUID | quote }}
  validations:
    - expression: {{ printf `variables.isAnyAdmissionConvergenceProbe || (%s)` $activationShape | quote }}
      message: {{ $denialMessage | quote }}
    - expression: {{ printf `variables.isAnyAdmissionConvergenceProbe || (!variables.isControllerCaller || (variables.controllerCredentialPhase == %q && (%s)))` "active" $controllerAuthority | quote }}
      message: "Ptah controller principal guard rejected an inactive release identity"
    - expression: {{ printf `variables.isAnyAdmissionConvergenceProbe || (!variables.isControllerTokenRequest || (variables.controllerCredentialPhase == %q && (%s)))` "active" $controllerTokenAuthority | quote }}
      message: "Ptah controller principal guard rejected an inactive release identity"
    - expression: {{ printf `variables.isAnyAdmissionConvergenceProbe || (%s)` $callerValidation | quote }}
      message: {{ $denialMessage | quote }}
    - expression: {{ printf `variables.isAnyAdmissionConvergenceProbe || (%s)` $tokenValidation | quote }}
      message: {{ $denialMessage | quote }}
    - expression: '!variables.isAnyAdmissionConvergenceProbe || request.dryRun == true'
      message: Ptah admission convergence probe field manager is reserved for dry-run verification
    - expression: '!variables.isAdmissionConvergenceProbe'
      message: {{ $convergenceMessage | quote }}
---
{{- end }}
{{- if not $binding }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $guardName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-128"
    helm.sh/resource-policy: keep
    operator.ptah.dev/rollout-guard-version: "1"
    operator.ptah.dev/release-name: {{ .Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ .Release.Namespace | quote }}
    operator.ptah.dev/controller-state-version: {{ include "ptah-operator.controllerStateVersion" . | quote }}
    operator.ptah.dev/admission-contract-version: {{ include "ptah-operator.admissionContractVersion" . | quote }}
    operator.ptah.dev/release-sequence: {{ include "ptah-operator.releaseSequence" . | quote }}
    operator.ptah.dev/manager-image: {{ include "ptah-operator.managerImage" . | quote }}
    operator.ptah.dev/hook-service-account-name: {{ $hookServiceAccount | quote }}
    operator.ptah.dev/controller-service-account-name: {{ $controllerServiceAccount | quote }}
    operator.ptah.dev/controller-service-account-managed: {{ printf "%t" .Values.serviceAccount.create | quote }}
    operator.ptah.dev/previous-controller-service-account-name: {{ $previousControllerServiceAccount | quote }}
    operator.ptah.dev/previous-controller-service-account-uid: {{ include "ptah-operator.previousControllerServiceAccountUID" . | quote }}
    operator.ptah.dev/previous-controller-service-account-managed: {{ include "ptah-operator.previousControllerServiceAccountManaged" . | quote }}
    operator.ptah.dev/previous-controller-release-sequence: {{ $previousControllerReleaseSequence | quote }}
    operator.ptah.dev/previous-controller-manager-image: {{ $previousControllerManagerImage | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: service-account-origin-guard
spec:
  policyName: {{ $guardName }}
  paramRef:
    name: ptah-operator-release-activation
    namespace: {{ .Release.Namespace }}
    parameterNotFoundAction: Deny
  validationActions: [Deny]
{{- end }}
