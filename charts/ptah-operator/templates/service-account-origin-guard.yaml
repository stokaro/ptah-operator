{{- define "ptah-operator.serviceAccountOriginGuardPolicyName" -}}
{{- printf "ptah-operator-service-account-origin-guard-v1-%s" (printf "%s\n%s" .Release.Namespace .Release.Name | sha256sum | trunc 12) -}}
{{- end -}}

{{- $guardName := include "ptah-operator.serviceAccountOriginGuardPolicyName" . -}}
{{- $hookServiceAccount := include "ptah-operator.crdManagerServiceAccountName" . -}}
{{- $hookSuffix := printf "-crd-v%s-%s" (include "ptah-operator.releaseSequence" .) (include "ptah-operator.hookIdentityDigest" . | trunc 12) -}}
{{- if not (hasSuffix $hookSuffix $hookServiceAccount) -}}
{{- fail "hook ServiceAccount does not match the candidate release identity" -}}
{{- end -}}
{{- $hookBase := trimSuffix $hookSuffix $hookServiceAccount -}}
{{- if eq $hookBase "" -}}
{{- fail "hook ServiceAccount has no stable name prefix" -}}
{{- end -}}
{{- $controllerServiceAccount := include "ptah-operator.serviceAccountName" . -}}
{{- $controllerDeployment := include "ptah-operator.fullname" . -}}
{{- $certificateServiceAccount := include "ptah-operator.certRotatorServiceAccountName" . -}}
{{- $certificateDeployment := include "ptah-operator.certRotatorServiceAccountName" . -}}
{{- if or
      (eq $hookServiceAccount $controllerServiceAccount)
      (eq $hookServiceAccount $certificateServiceAccount)
      (eq $controllerServiceAccount $certificateServiceAccount) -}}
{{- fail "service account origin guard protected ServiceAccount names must differ" -}}
{{- end -}}
{{- if eq $controllerDeployment $certificateDeployment -}}
{{- fail "service account origin guard workload names must differ" -}}
{{- end -}}
{{- $hookServiceAccountPattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}$" (regexQuoteMeta (printf "%s-crd-v" $hookBase)) -}}
{{- $hookUsernamePattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}$" (regexQuoteMeta (printf "system:serviceaccount:%s:%s-crd-v" .Release.Namespace $hookBase)) -}}
{{- $hookPodPattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}-" (regexQuoteMeta (printf "%s-crd-v" $hookBase)) -}}
{{- $teardownServiceAccountPattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}$" (regexQuoteMeta (printf "%s-cleanup-v" $hookBase)) -}}
{{- $teardownUsernamePattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}$" (regexQuoteMeta (printf "system:serviceaccount:%s:%s-cleanup-v" .Release.Namespace $hookBase)) -}}
{{- $teardownPodPattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}-" (regexQuoteMeta (printf "%s-cleanup-v" $hookBase)) -}}
{{- $hookIdentityPodPattern := `^ptah-hook-identity-v[1-9][0-9]*-[0-9a-f]{12}-` -}}
{{- $controllerUsername := printf "system:serviceaccount:%s:%s" .Release.Namespace $controllerServiceAccount -}}
{{- $certificateUsername := printf "system:serviceaccount:%s:%s" .Release.Namespace $certificateServiceAccount -}}
{{- $denialMessage := "Ptah service account origin guard rejected a request without workload-bound identity" -}}
{{- $matchCondition := printf `request.userInfo.username in [%q, %q] || request.userInfo.username.matches(%q) || request.userInfo.username.matches(%q) || (request.operation == "CREATE" && request.resource.group == "" && request.resource.version == "v1" && request.resource.resource == "serviceaccounts" && request.subResource == "token" && request.namespace == %q && (request.name in [%q, %q] || request.name.matches(%q) || request.name.matches(%q)))` $controllerUsername $certificateUsername $hookUsernamePattern $teardownUsernamePattern .Release.Namespace $controllerServiceAccount $certificateServiceAccount $hookServiceAccountPattern $teardownServiceAccountPattern -}}
{{- $isProtectedTokenRequest := printf `variables.isTokenRequest && request.namespace == %q && (request.name in [%q, %q] || request.name.matches(%q) || request.name.matches(%q))` .Release.Namespace $controllerServiceAccount $certificateServiceAccount $hookServiceAccountPattern $teardownServiceAccountPattern -}}
{{- $callerPodName := printf `has(request.userInfo.extra) && %q in request.userInfo.extra && request.userInfo.extra[%q].size() == 1 ? request.userInfo.extra[%q][0] : ""` "authentication.kubernetes.io/pod-name" "authentication.kubernetes.io/pod-name" "authentication.kubernetes.io/pod-name" -}}
{{- $callerPodUID := printf `has(request.userInfo.extra) && %q in request.userInfo.extra && request.userInfo.extra[%q].size() == 1 ? request.userInfo.extra[%q][0] : ""` "authentication.kubernetes.io/pod-uid" "authentication.kubernetes.io/pod-uid" "authentication.kubernetes.io/pod-uid" -}}
{{- $callerValidation := printf `!variables.isProtectedCaller || (variables.callerPodName != "" && variables.callerPodUID != "" && ((variables.isHookCaller && (variables.callerPodName.matches(%q) || variables.callerPodName.matches(%q) || variables.callerPodName.matches(%q))) || (variables.isControllerCaller && variables.callerPodName.startsWith(%q)) || (variables.isCertificateCaller && variables.callerPodName.startsWith(%q))))` $hookPodPattern $hookIdentityPodPattern $teardownPodPattern (printf "%s-" $controllerDeployment) (printf "%s-" $certificateDeployment) -}}
{{- $tokenValidation := printf `!variables.isProtectedTokenRequest || (request.userInfo.username.matches("^system:node:.+$") && request.userInfo.groups.filter(group, group == "system:nodes").size() == 1 && has(object.spec.boundObjectRef) && has(object.spec.boundObjectRef.apiVersion) && object.spec.boundObjectRef.apiVersion == "v1" && has(object.spec.boundObjectRef.kind) && object.spec.boundObjectRef.kind == "Pod" && has(object.spec.boundObjectRef.name) && object.spec.boundObjectRef.name != "" && has(object.spec.boundObjectRef.uid) && object.spec.boundObjectRef.uid != "" && ((request.name == %q && object.spec.boundObjectRef.name.startsWith(%q)) || (request.name == %q && object.spec.boundObjectRef.name.startsWith(%q)) || (request.name.matches(%q) && (object.spec.boundObjectRef.name.matches(%q) || object.spec.boundObjectRef.name.matches(%q))) || (request.name.matches(%q) && object.spec.boundObjectRef.name.matches(%q))))` $controllerServiceAccount (printf "%s-" $controllerDeployment) $certificateServiceAccount (printf "%s-" $certificateDeployment) $hookServiceAccountPattern $hookPodPattern $hookIdentityPodPattern $teardownServiceAccountPattern $teardownPodPattern -}}
{{- $policy := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicy" "" $guardName -}}
{{- $binding := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicyBinding" "" $guardName -}}
{{- range $entry := list
      (dict "kind" "ValidatingAdmissionPolicy" "object" $policy)
      (dict "kind" "ValidatingAdmissionPolicyBinding" "object" $binding) -}}
{{- with $entry.object -}}
{{- $annotations := default (dict) .metadata.annotations -}}
{{- $labels := default (dict) .metadata.labels -}}
{{- if or
      (ne (default "" (index $annotations "operator.ptah.dev/rollout-guard-version")) "1")
      (ne (default "" (index $annotations "operator.ptah.dev/release-name")) $.Release.Name)
      (ne (default "" (index $annotations "operator.ptah.dev/release-namespace")) $.Release.Namespace)
      (ne (default "" (index $labels "app.kubernetes.io/managed-by")) "ptah-operator")
      (ne (default "" (index $labels "app.kubernetes.io/instance")) $.Release.Name)
      (ne (default "" (index $labels "app.kubernetes.io/component")) "service-account-origin-guard") -}}
{{- fail (printf "retained %s %s has foreign or incomplete service-account-origin ownership" $entry.kind $guardName) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not $policy }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $guardName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-129"
    helm.sh/resource-policy: keep
    operator.ptah.dev/rollout-guard-version: "1"
    operator.ptah.dev/release-name: {{ .Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: service-account-origin-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Exact
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE", "CONNECT"]
        resources: ["*/*"]
        scope: "*"
  matchConditions:
    - name: protected-service-account-origin
      expression: {{ $matchCondition | quote }}
  variables:
    - name: isTokenRequest
      expression: 'request.operation == "CREATE" && request.resource.group == "" && request.resource.version == "v1" && request.resource.resource == "serviceaccounts" && request.subResource == "token"'
    - name: isHookCaller
      expression: {{ printf `request.userInfo.username.matches(%q) || request.userInfo.username.matches(%q)` $hookUsernamePattern $teardownUsernamePattern | quote }}
    - name: isControllerCaller
      expression: {{ printf `request.userInfo.username == %q` $controllerUsername | quote }}
    - name: isCertificateCaller
      expression: {{ printf `request.userInfo.username == %q` $certificateUsername | quote }}
    - name: isProtectedCaller
      expression: 'variables.isHookCaller || variables.isControllerCaller || variables.isCertificateCaller'
    - name: isProtectedTokenRequest
      expression: {{ $isProtectedTokenRequest | quote }}
    - name: callerPodName
      expression: {{ $callerPodName | quote }}
    - name: callerPodUID
      expression: {{ $callerPodUID | quote }}
  validations:
    - expression: {{ $callerValidation | quote }}
      message: {{ $denialMessage | quote }}
    - expression: {{ $tokenValidation | quote }}
      message: {{ $denialMessage | quote }}
---
{{- end }}
{{- if not $binding }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $guardName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-128"
    helm.sh/resource-policy: keep
    operator.ptah.dev/rollout-guard-version: "1"
    operator.ptah.dev/release-name: {{ .Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: service-account-origin-guard
spec:
  policyName: {{ $guardName }}
  validationActions: [Deny]
{{- end }}
