{{- if not $hookContractPolicy }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $hookContractName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-133"
    helm.sh/resource-policy: keep
    operator.ptah.dev/rollout-guard-version: "1"
    operator.ptah.dev/release-name: {{ .Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ .Release.Namespace | quote }}
    operator.ptah.dev/release-sequence: {{ $sequence | quote }}
    operator.ptah.dev/manager-image: {{ $managerImage | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: parent-workload-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Exact
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
        scope: Namespaced
  matchConditions:
    - name: candidate-hook-service-account
      expression: {{ printf `request.namespace == %q && ((has(object.spec.template.spec.serviceAccountName) && object.spec.template.spec.serviceAccountName in [%q, %q]) || (request.operation == "UPDATE" && has(oldObject.spec.template.spec.serviceAccountName) && oldObject.spec.template.spec.serviceAccountName in [%q, %q]))` .Release.Namespace $hookServiceAccount $teardownServiceAccount $hookServiceAccount $teardownServiceAccount | quote }}
  variables:
    - name: isIdentity
      expression: {{ printf `request.name == %q` $identityJob | quote }}
    - name: isPreflight
      expression: {{ printf `request.name == %q` $preflightJob | quote }}
    - name: isQuiesce
      expression: {{ printf `request.name == %q` $quiesceJob | quote }}
    - name: isTeardown
      expression: {{ printf `request.name == %q` $teardownJob | quote }}
  validations:
    {{- range $expression := $hookContractValidations }}
    - expression: {{ $expression | quote }}
      message: {{ $hookContractMessage | quote }}
    {{- end }}
---
{{- end }}
