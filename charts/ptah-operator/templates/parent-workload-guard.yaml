      (printf `!variables.isProtectedJob || !variables.isMainWrite || (%s)` $hookAuthority)
      (printf `!variables.isProtectedJob || !(variables.isStatusUpdate || variables.isDelete) || (oldObject != null && ((has(oldObject.spec.template.spec.serviceAccountName) && (oldObject.spec.template.spec.serviceAccountName.matches(%q) || oldObject.spec.template.spec.serviceAccountName.matches(%q))) || (oldObject.metadata.name.matches(%q) && (!has(oldObject.spec.template.spec.serviceAccountName) || oldObject.spec.template.spec.serviceAccountName in ["", "default"]) && (!has(oldObject.spec.template.spec.serviceAccount) || oldObject.spec.template.spec.serviceAccount in ["", "default"]))))` $hookPattern $teardownPattern $imageCheckPattern)
