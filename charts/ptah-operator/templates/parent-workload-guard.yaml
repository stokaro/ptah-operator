apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $hookOriginName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-137"
    helm.sh/resource-policy: keep
    operator.ptah.dev/rollout-guard-version: "1"
    operator.ptah.dev/release-name: {{ .Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: parent-workload-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Exact
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
        scope: Namespaced
  matchConditions:
    - name: release-hook-service-account-pattern
      expression: {{ $hookOriginMatch | quote }}
  validations:
    - expression: '!has(request.subResource) || request.subResource == ""'
      message: {{ $hookOriginMessage | quote }}
    - expression: {{ printf `has(object.spec.template.spec.serviceAccountName) && (object.spec.template.spec.serviceAccountName.matches(%q) || object.spec.template.spec.serviceAccountName.matches(%q))` $hookPattern $teardownPattern | quote }}
      message: {{ $hookOriginMessage | quote }}
    - expression: {{ $hookAuthority | quote }}
      message: {{ $hookOriginMessage | quote }}
---
{{- end }}
