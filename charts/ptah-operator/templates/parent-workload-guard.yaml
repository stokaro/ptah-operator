{{- define "ptah-operator.parentOriginReadyShapeExpression" -}}
{{- $object := .object -}}
{{- $parts := list
      (printf `%s != null` $object)
      (printf `%s.metadata.name == %q` $object .name)
      (printf `%s.metadata.namespace == %q` $object .root.Release.Namespace)
      (printf `(!has(%s.metadata.generateName) || %s.metadata.generateName == "")` $object $object)
      (printf `has(%s.metadata.annotations) && %s.metadata.annotations.size() == 4` $object $object)
      (printf `%s.metadata.annotations[%q] == %q` $object "helm.sh/resource-policy" "keep")
      (printf `%s.metadata.annotations[%q] == %q` $object "meta.helm.sh/release-name" .root.Release.Name)
      (printf `%s.metadata.annotations[%q] == %q` $object "meta.helm.sh/release-namespace" .root.Release.Namespace)
      (printf `%s.metadata.annotations[%q] == %q` $object "operator.ptah.dev/parent-origin-ready-version" "2")
      (printf `has(%s.metadata.labels) && %s.metadata.labels.size() == 3` $object $object)
      (printf `%s.metadata.labels[%q] == %q` $object "app.kubernetes.io/managed-by" "Helm")
      (printf `%s.metadata.labels[%q] == %q` $object "app.kubernetes.io/instance" .root.Release.Name)
      (printf `%s.metadata.labels[%q] == %q` $object "app.kubernetes.io/component" "parent-workload-guard-readiness")
      (printf `has(%s.data) && %s.data.size() == %d` $object $object (len .markerData))
      (printf `(!has(%s.binaryData) || %s.binaryData.size() == 0)` $object $object)
      (printf `has(%s.immutable) && %s.immutable` $object $object)
      (printf `(!has(%s.metadata.ownerReferences) || %s.metadata.ownerReferences.size() == 0)` $object $object)
      (printf `(!has(%s.metadata.finalizers) || %s.metadata.finalizers.size() == 0)` $object $object)
      (printf `!has(%s.metadata.deletionTimestamp)` $object)
      (printf `!has(%s.metadata.deletionGracePeriodSeconds)` $object) -}}
{{- range $key, $value := .markerData -}}
{{- $parts = append $parts (printf `%s.data[%q] == %q` $object $key $value) -}}
{{- end -}}
{{- if .persisted -}}
{{- $parts = append $parts (printf `has(%s.metadata.uid) && %s.metadata.uid != ""` $object $object) -}}
{{- $parts = append $parts (printf `has(%s.metadata.resourceVersion) && %s.metadata.resourceVersion != ""` $object $object) -}}
{{- end -}}
{{- join " && " $parts -}}
{{- end -}}

{{- define "ptah-operator.stableConvergenceMarkerShapeExpression" -}}
{{- $object := .object -}}
{{- $dataSize := 2 -}}
{{- if .sealed -}}
{{- $dataSize = 3 -}}
{{- end -}}
{{- $parts := list
      (printf `%s != null` $object)
      (printf `%s.metadata.name.matches(%q)` $object .markerPattern)
      (printf `%s.metadata.name == %q + %s.metadata.annotations[%q] + %q` $object "ptah-admission-convergence-v1-" $object "operator.ptah.dev/release-sequence" (printf "-%s" .releaseDigest))
      (printf `%s.metadata.namespace == %q` $object .root.Release.Namespace)
      (printf `(!has(%s.metadata.generateName) || %s.metadata.generateName == "")` $object $object)
      (printf `has(%s.metadata.annotations) && %s.metadata.annotations.size() == 10` $object $object)
      (printf `%s.metadata.annotations[%q] == %q` $object "helm.sh/hook" "pre-install,pre-upgrade")
      (printf `%s.metadata.annotations[%q] == %q` $object "helm.sh/hook-weight" "-165")
      (printf `%s.metadata.annotations[%q] == %q` $object "helm.sh/resource-policy" "keep")
      (printf `%s.metadata.annotations[%q] == %q` $object "operator.ptah.dev/admission-convergence-version" "1")
      (printf `%s.metadata.annotations[%q] == %q` $object "operator.ptah.dev/release-name" .root.Release.Name)
      (printf `%s.metadata.annotations[%q] == %q` $object "operator.ptah.dev/release-namespace" .root.Release.Namespace)
      (printf `%s.metadata.annotations[%q].matches(%q)` $object "operator.ptah.dev/release-sequence" "^[1-9][0-9]*$")
      (printf `%s.metadata.annotations[%q].matches(%q)` $object "operator.ptah.dev/manager-image" "^[^[:space:]@]+@sha256:[0-9a-f]{64}$")
      (printf `%s.metadata.annotations[%q].matches(%q)` $object "operator.ptah.dev/admission-convergence-cleanup-service-account" .teardownPattern)
      (printf `%s.metadata.annotations[%q] == %q` $object "operator.ptah.dev/predecessor-retirement-inventory-version" "1")
      (printf `has(%s.metadata.labels) && %s.metadata.labels.size() == 3` $object $object)
      (printf `%s.metadata.labels[%q] == %q` $object "app.kubernetes.io/managed-by" "ptah-operator")
      (printf `%s.metadata.labels[%q] == %q` $object "app.kubernetes.io/instance" .root.Release.Name)
      (printf `%s.metadata.labels[%q] == %q` $object "app.kubernetes.io/component" "admission-convergence")
      (printf `has(%s.data) && %s.data.size() == %d` $object $object $dataSize)
      (printf `%s.data[%q] == %s.metadata.annotations[%q]` $object "expected-active-release-sequence" $object "operator.ptah.dev/release-sequence")
      (printf `%s.data[%q].matches(%q)` $object "release-attempt" "^[0-9a-f]{64}$")
      (printf `(!has(%s.binaryData) || %s.binaryData.size() == 0)` $object $object) -}}
{{- if .sealed -}}
{{- $parts = append $parts (printf `has(%s.immutable) && %s.immutable == true` $object $object) -}}
{{- else -}}
{{- $parts = append $parts (printf `(!has(%s.immutable) || %s.immutable == false)` $object $object) -}}
{{- end -}}
{{- $parts = concat $parts (list
      (printf `(!has(%s.metadata.ownerReferences) || %s.metadata.ownerReferences.size() == 0)` $object $object)
      (printf `(!has(%s.metadata.finalizers) || %s.metadata.finalizers.size() == 0)` $object $object)
      (printf `!has(%s.metadata.deletionTimestamp)` $object)
      (printf `!has(%s.metadata.deletionGracePeriodSeconds)` $object)) -}}
{{- if .persisted -}}
{{- $parts = append $parts (printf `has(%s.metadata.uid) && %s.metadata.uid != ""` $object $object) -}}
{{- $parts = append $parts (printf `has(%s.metadata.resourceVersion) && %s.metadata.resourceVersion != ""` $object $object) -}}
{{- end -}}
{{- if .sealed -}}
{{- $parts = append $parts (printf `%q in %s.data && %s.data[%q].matches(%q)` "predecessor-retirement-inventory" $object $object "predecessor-retirement-inventory" `^\{"version":"1","entries":\[.+\]\}$`) -}}
{{- end -}}
{{- join " && " $parts -}}
{{- end -}}

{{- define "ptah-operator.validateParentOriginLifecycle" -}}
{{- if not .live -}}
{{- /* Client-only rendering cannot observe retained cluster state. */ -}}
{{- else -}}
{{- $currentCount := 0 -}}
{{- range .current -}}
{{- if .object -}}
{{- $currentCount = add1 $currentCount -}}
{{- end -}}
{{- end -}}
{{- $legacyCount := 0 -}}
{{- $legacyOriginalCount := 0 -}}
{{- range .legacy -}}
{{- if .object -}}
{{- $legacyCount = add1 $legacyCount -}}
{{- end -}}
{{- end -}}
{{- if and (ne $currentCount 0) (ne $currentCount (len .current)) -}}
{{- fail "retained v2 parent-origin boundary is sparse; refusing unsafe partial repair" -}}
{{- end -}}
{{- range $entry := .current -}}
{{- with $entry.object -}}
{{- $annotations := default (dict) .metadata.annotations -}}
{{- $labels := default (dict) .metadata.labels -}}
{{- if or
      (ne .apiVersion "admissionregistration.k8s.io/v1")
      (ne .kind $entry.kind)
      (ne .metadata.name $entry.name)
      (ne (default "" .metadata.namespace) "")
      (ne (len $annotations) 6)
      (ne (default "" (index $annotations "helm.sh/hook")) "pre-install,pre-upgrade")
      (ne (default "" (index $annotations "helm.sh/hook-weight")) $entry.weight)
      (ne (default "" (index $annotations "helm.sh/resource-policy")) "keep")
      (ne (default "" (index $annotations "operator.ptah.dev/rollout-guard-version")) "1")
      (ne (default "" (index $annotations "operator.ptah.dev/release-name")) $.root.Release.Name)
      (ne (default "" (index $annotations "operator.ptah.dev/release-namespace")) $.root.Release.Namespace)
      (ne (len $labels) 3)
      (ne (default "" (index $labels "app.kubernetes.io/managed-by")) "ptah-operator")
      (ne (default "" (index $labels "app.kubernetes.io/instance")) $.root.Release.Name)
      (ne (default "" (index $labels "app.kubernetes.io/component")) "parent-workload-guard")
      (gt (len (default (list) .metadata.ownerReferences)) 0)
      (gt (len (default (list) .metadata.finalizers)) 0)
      (not (deepEqual (default (dict) .spec) $entry.spec)) -}}
{{- fail (printf "retained %s %s differs from the exact parent-origin contract" $entry.kind $entry.name) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- range $entry := .legacy -}}
{{- with $entry.object -}}
{{- $annotations := default (dict) .metadata.annotations -}}
{{- $labels := default (dict) .metadata.labels -}}
{{- $isOriginal := and
      (eq .apiVersion "admissionregistration.k8s.io/v1")
      (eq .kind $entry.kind)
      (eq .metadata.name $entry.name)
      (eq (default "" .metadata.namespace) "")
      (eq (len $annotations) 6)
      (eq (default "" (index $annotations "helm.sh/hook")) "pre-install,pre-upgrade")
      (eq (default "" (index $annotations "helm.sh/hook-weight")) $entry.weight)
      (eq (default "" (index $annotations "helm.sh/resource-policy")) "keep")
      (eq (default "" (index $annotations "operator.ptah.dev/rollout-guard-version")) "1")
      (eq (default "" (index $annotations "operator.ptah.dev/release-name")) $.root.Release.Name)
      (eq (default "" (index $annotations "operator.ptah.dev/release-namespace")) $.root.Release.Namespace)
      (eq (len $labels) 3)
      (eq (default "" (index $labels "app.kubernetes.io/managed-by")) "ptah-operator")
      (eq (default "" (index $labels "app.kubernetes.io/instance")) $.root.Release.Name)
      (eq (default "" (index $labels "app.kubernetes.io/component")) "parent-workload-guard")
      (eq (len (default (list) .metadata.ownerReferences)) 0)
      (eq (len (default (list) .metadata.finalizers)) 0)
      (deepEqual (default (dict) .spec) $entry.spec) -}}
{{- $isRetired := and
      (eq .apiVersion "admissionregistration.k8s.io/v1")
      (eq .kind $entry.kind)
      (eq .metadata.name $entry.name)
      (eq (default "" .metadata.namespace) "")
      (eq (len $annotations) 6)
      (eq (default "" (index $annotations "helm.sh/hook")) "post-upgrade")
      (eq (default "" (index $annotations "helm.sh/hook-weight")) $entry.retiredWeight)
      (eq (default "" (index $annotations "helm.sh/hook-delete-policy")) "before-hook-creation,hook-succeeded")
      (eq (default "" (index $annotations "operator.ptah.dev/rollout-guard-version")) "1")
      (eq (default "" (index $annotations "operator.ptah.dev/release-name")) $.root.Release.Name)
      (eq (default "" (index $annotations "operator.ptah.dev/release-namespace")) $.root.Release.Namespace)
      (eq (len $labels) 3)
      (eq (default "" (index $labels "app.kubernetes.io/managed-by")) "ptah-operator")
      (eq (default "" (index $labels "app.kubernetes.io/instance")) $.root.Release.Name)
      (eq (default "" (index $labels "app.kubernetes.io/component")) "parent-workload-guard-retirement")
      (eq (len (default (list) .metadata.ownerReferences)) 0)
      (eq (len (default (list) .metadata.finalizers)) 0)
      (deepEqual (default (dict) .spec) $entry.retiredSpec) -}}
{{- if $isOriginal -}}
{{- $legacyOriginalCount = add1 $legacyOriginalCount -}}
{{- else if not $isRetired -}}
{{- fail (printf "retained %s %s differs from every crash-reachable v1 parent-origin state" $entry.kind $entry.name) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $markerPresent := not (empty .marker) -}}
{{- if $markerPresent -}}
{{- $marker := .marker -}}
{{- $annotations := default (dict) $marker.metadata.annotations -}}
{{- $labels := default (dict) $marker.metadata.labels -}}
{{- if or
      (ne $marker.apiVersion "v1")
      (ne $marker.kind "ConfigMap")
      (ne $marker.metadata.name .markerName)
      (ne (default "" $marker.metadata.namespace) .root.Release.Namespace)
      (ne (default "" $marker.metadata.generateName) "")
      (eq (default "" $marker.metadata.uid) "")
      (eq (default "" $marker.metadata.resourceVersion) "")
      (ne (len $annotations) 4)
      (ne (default "" (index $annotations "helm.sh/resource-policy")) "keep")
      (ne (default "" (index $annotations "meta.helm.sh/release-name")) .root.Release.Name)
      (ne (default "" (index $annotations "meta.helm.sh/release-namespace")) .root.Release.Namespace)
      (ne (default "" (index $annotations "operator.ptah.dev/parent-origin-ready-version")) "2")
      (ne (len $labels) 3)
      (ne (default "" (index $labels "app.kubernetes.io/managed-by")) "Helm")
      (ne (default "" (index $labels "app.kubernetes.io/instance")) .root.Release.Name)
      (ne (default "" (index $labels "app.kubernetes.io/component")) "parent-workload-guard-readiness")
      (not (deepEqual (default (dict) $marker.data) .markerData))
      (ne (len (default (dict) $marker.binaryData)) 0)
      (not (default false $marker.immutable))
      (ne (len (default (list) $marker.metadata.ownerReferences)) 0)
      (ne (len (default (list) $marker.metadata.finalizers)) 0)
      (not (empty $marker.metadata.deletionTimestamp))
      (not (empty $marker.metadata.deletionGracePeriodSeconds)) -}}
{{- fail "retained v2 parent-origin readiness marker differs from the exact stable contract" -}}
{{- end -}}
{{- end -}}
{{- if .root.Release.IsInstall -}}
{{- if ne $legacyCount 0 -}}
{{- fail "install unexpectedly found a retained v1 parent-origin boundary" -}}
{{- end -}}
{{- if $markerPresent -}}
{{- if ne $currentCount (len .current) -}}
{{- fail "readiness marker exists without the complete exact v2 parent-origin boundary" -}}
{{- end -}}
{{- else if and (ne $currentCount 0) (not .activationBootstrap) -}}
{{- fail "first-install retry found v2 parent-origin objects without exact bootstrap activation evidence" -}}
{{- end -}}
{{- else if .root.Release.IsUpgrade -}}
{{- if $markerPresent -}}
{{- if ne $currentCount (len .current) -}}
{{- fail "v2-aware upgrade is missing its complete exact parent-origin boundary" -}}
{{- end -}}
{{- else if or (ne $legacyOriginalCount (len .legacy)) (and (ne $currentCount 0) (ne $currentCount (len .current))) -}}
{{- fail "first v2 upgrade requires the complete exact v1 predecessor and no sparse v2 repair" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- include "ptah-operator.validateAdmissionSingleton" . -}}
{{- $sequence := include "ptah-operator.releaseSequence" . -}}
{{- $stateVersion := include "ptah-operator.controllerStateVersion" . -}}
{{- $admissionVersion := include "ptah-operator.admissionContractVersion" . -}}
{{- $managerImage := include "ptah-operator.managerImage" . -}}
{{- $replicaSetName := include "ptah-operator.parentReplicaSetGuardPolicyName" . -}}
{{- $hookOriginName := include "ptah-operator.parentHookJobOriginGuardPolicyName" . -}}
{{- $hookPodOriginName := include "ptah-operator.parentHookPodOriginGuardPolicyName" . -}}
{{- $hookContractName := include "ptah-operator.parentHookJobContractPolicyName" . -}}
{{- $hookServiceAccount := include "ptah-operator.crdManagerServiceAccountName" . -}}
{{- $hookSuffix := printf "-crd-v%s-%s" $sequence (include "ptah-operator.hookIdentityDigest" . | trunc 12) -}}
{{- if not (hasSuffix $hookSuffix $hookServiceAccount) -}}
{{- fail "parent workload guard hook ServiceAccount does not match the candidate release identity" -}}
{{- end -}}
{{- $hookBase := trimSuffix $hookSuffix $hookServiceAccount -}}
{{- if eq $hookBase "" -}}
{{- fail "parent workload guard hook ServiceAccount has no stable name prefix" -}}
{{- end -}}
{{- $hookPattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}$" (regexQuoteMeta (printf "%s-crd-v" $hookBase)) -}}
{{- $teardownPattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}$" (regexQuoteMeta (printf "%s-cleanup-v" $hookBase)) -}}
{{- $controllerServiceAccountBase := include "ptah-operator.serviceAccountBaseName" . -}}
{{- if .Values.serviceAccount.create -}}
{{- $controllerServiceAccountBase = $controllerServiceAccountBase | trunc 38 | trimSuffix "-" -}}
{{- end -}}
{{- $controllerServiceAccount := include "ptah-operator.serviceAccountName" . -}}
{{- $controllerDeployment := include "ptah-operator.fullname" . -}}
{{- $certificateServiceAccount := include "ptah-operator.certRotatorServiceAccountName" . -}}
{{- $certificateDeployment := include "ptah-operator.certRotatorServiceAccountName" . -}}
{{- $identityJob := include "ptah-operator.hookIdentityProbeJobName" . -}}
{{- $reconcileJob := include "ptah-operator.crdManagerClusterRoleName" . -}}
{{- $imageCheckJob := printf "%s-image-check" ($reconcileJob | trunc 51 | trimSuffix "-") -}}
{{- $preflightJob := printf "%s-preflight" ($reconcileJob | trunc 53 | trimSuffix "-") -}}
{{- $quiesceJob := include "ptah-operator.teardownQuiesceJobName" . -}}
{{- $teardownServiceAccount := include "ptah-operator.teardownServiceAccountName" . -}}
{{- $teardownJob := $teardownServiceAccount -}}
{{- $parentOriginReadyData := dict
      "contract-version" "2"
      "controller-service-account-base" $controllerServiceAccountBase
      "controller-service-account-managed" (printf "%t" .Values.serviceAccount.create)
      "hook-service-account-base" $hookBase
      "certificate-service-account-name" $certificateServiceAccount -}}
{{- $anyConvergenceRequest := include "ptah-operator.admissionConvergenceAnyProbeRequest" . -}}
{{- $replicaSetProbeFieldManager := include "ptah-operator.admissionConvergenceProbeFieldManager" (dict "root" . "policyName" $replicaSetName) -}}
{{- $replicaSetProbeRequest := include "ptah-operator.admissionConvergenceProbeRequest" (dict "root" . "fieldManager" $replicaSetProbeFieldManager) -}}
{{- $replicaSetProbeMessage := include "ptah-operator.admissionConvergenceProbeMessage" (dict "fieldManager" $replicaSetProbeFieldManager) -}}
{{- $hookOriginProbeFieldManager := include "ptah-operator.admissionConvergenceProbeFieldManager" (dict "root" . "policyName" $hookOriginName) -}}
{{- $hookOriginProbeRequest := include "ptah-operator.admissionConvergenceProbeRequest" (dict "root" . "fieldManager" $hookOriginProbeFieldManager) -}}
{{- $hookOriginProbeMessage := include "ptah-operator.admissionConvergenceProbeMessage" (dict "fieldManager" $hookOriginProbeFieldManager) -}}
{{- $hookPodProbeFieldManager := include "ptah-operator.admissionConvergenceProbeFieldManager" (dict "root" . "policyName" $hookPodOriginName) -}}
{{- $hookPodProbeRequest := include "ptah-operator.admissionConvergenceProbeRequest" (dict "root" . "fieldManager" $hookPodProbeFieldManager) -}}
{{- $hookPodProbeMessage := include "ptah-operator.admissionConvergenceProbeMessage" (dict "fieldManager" $hookPodProbeFieldManager) -}}
{{- $hookContractProbeFieldManager := include "ptah-operator.admissionConvergenceProbeFieldManager" (dict "root" . "policyName" $hookContractName) -}}
{{- $hookContractProbeRequest := include "ptah-operator.admissionConvergenceProbeRequest" (dict "root" . "fieldManager" $hookContractProbeFieldManager) -}}
{{- $hookContractProbeMessage := include "ptah-operator.admissionConvergenceProbeMessage" (dict "fieldManager" $hookContractProbeFieldManager) -}}
{{- $stableMarkerPattern := printf "^ptah-admission-convergence-v1-[1-9][0-9]*-%s$" (printf "%s\n%s" .Release.Namespace .Release.Name | sha256sum | trunc 12) -}}
{{- $stableMarkerReleaseDigest := printf "%s\n%s" .Release.Namespace .Release.Name | sha256sum | trunc 12 -}}
{{- $parentOriginReadyName := printf "ptah-operator-parent-origin-ready-v2-%s" (printf "%s\n%s" .Release.Namespace .Release.Name | sha256sum | trunc 12) -}}
{{- $serviceAccountObjectGuardName := printf "ptah-operator-service-account-object-guard-v1-%s" $stableMarkerReleaseDigest -}}
{{- $serviceAccountObjectProbeDigest := printf "1\n%s\n%s" $serviceAccountObjectGuardName $stableMarkerPattern | sha256sum -}}
{{- $serviceAccountObjectProbeFieldManager := printf "ptah-service-account-object-probe-v1-%s" $serviceAccountObjectProbeDigest -}}
{{- $serviceAccountObjectProbeRequest := printf `request.operation == "UPDATE" && request.resource.group == "" && request.resource.version == "v1" && request.resource.resource == "configmaps" && (!has(request.subResource) || request.subResource == "") && request.namespace == %q && request.name.matches(%q) && has(request.options) && has(request.options.fieldManager) && request.options.fieldManager == %q` .Release.Namespace $stableMarkerPattern $serviceAccountObjectProbeFieldManager -}}
{{- $parentOriginReadyMatch := printf `request.resource.group == "" && request.resource.version == "v1" && request.resource.resource == "configmaps" && (!has(request.subResource) || request.subResource == "") && request.namespace == %q && ((request.operation in ["CREATE", "UPDATE"] && request.name == %q) || (request.operation == "DELETE" && oldObject != null && oldObject.metadata.name == %q))` .Release.Namespace $parentOriginReadyName $parentOriginReadyName -}}
{{- $stableMarkerObjectMatch := printf `request.resource.group == "" && request.resource.version == "v1" && request.resource.resource == "configmaps" && (!has(request.subResource) || request.subResource == "") && request.namespace == %q && ((request.operation in ["CREATE", "UPDATE"] && request.name.matches(%q)) || (request.operation == "DELETE" && oldObject != null && oldObject.metadata.name.matches(%q)))` .Release.Namespace $stableMarkerPattern $stableMarkerPattern -}}
{{- $parentOriginReadyCreateShape := include "ptah-operator.parentOriginReadyShapeExpression" (dict "root" . "name" $parentOriginReadyName "markerData" $parentOriginReadyData "object" "object" "persisted" false) -}}
{{- $parentOriginReadyStoredShape := include "ptah-operator.parentOriginReadyShapeExpression" (dict "root" . "name" $parentOriginReadyName "markerData" $parentOriginReadyData "object" "object" "persisted" true) -}}
{{- $parentOriginReadyOldShape := include "ptah-operator.parentOriginReadyShapeExpression" (dict "root" . "name" $parentOriginReadyName "markerData" $parentOriginReadyData "object" "oldObject" "persisted" true) -}}
{{- $stableMarkerShapeContext := dict "root" . "markerPattern" $stableMarkerPattern "releaseDigest" $stableMarkerReleaseDigest "teardownPattern" $teardownPattern -}}
{{- $stableMarkerCreateShape := include "ptah-operator.stableConvergenceMarkerShapeExpression" (merge (dict "object" "object" "persisted" false "sealed" false) $stableMarkerShapeContext) -}}
{{- $stableMarkerNewSealedShape := include "ptah-operator.stableConvergenceMarkerShapeExpression" (merge (dict "object" "object" "persisted" true "sealed" true) $stableMarkerShapeContext) -}}
{{- $stableMarkerOldUnsealedShape := include "ptah-operator.stableConvergenceMarkerShapeExpression" (merge (dict "object" "oldObject" "persisted" true "sealed" false) $stableMarkerShapeContext) -}}
{{- $stableMarkerOldSealedShape := include "ptah-operator.stableConvergenceMarkerShapeExpression" (merge (dict "object" "oldObject" "persisted" true "sealed" true) $stableMarkerShapeContext) -}}
{{- $stableMarkerOldShape := printf `((%s) || (%s))` $stableMarkerOldUnsealedShape $stableMarkerOldSealedShape -}}
{{- $stableMarkerIdentity := `object.metadata.name == oldObject.metadata.name && object.metadata.namespace == oldObject.metadata.namespace && object.metadata.uid == oldObject.metadata.uid && object.metadata.resourceVersion == oldObject.metadata.resourceVersion && object.metadata.annotations == oldObject.metadata.annotations && object.metadata.labels == oldObject.metadata.labels` -}}
{{- $stableMarkerBaseData := `object.data["expected-active-release-sequence"] == oldObject.data["expected-active-release-sequence"] && object.data["release-attempt"] == oldObject.data["release-attempt"]` -}}
{{- $stableMarkerOldUnsealedTransition := printf `%s && %s` $stableMarkerOldUnsealedShape $stableMarkerBaseData -}}
{{- $stableMarkerUpdateShape := printf `(%s) && (%s) && ((%s) || ((%s) && object.data == oldObject.data))` $stableMarkerIdentity $stableMarkerNewSealedShape $stableMarkerOldUnsealedTransition $stableMarkerOldSealedShape -}}

