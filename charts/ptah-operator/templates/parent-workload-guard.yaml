metadata:
  name: {{ $hookOriginName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-137"
    helm.sh/resource-policy: keep
    operator.ptah.dev/rollout-guard-version: "1"
    operator.ptah.dev/release-name: {{ .Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: parent-workload-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Exact
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["jobs"]
        scope: Namespaced
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["jobs/status"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["configmaps"]
        scope: Namespaced
  matchConditions:
    - name: release-hook-service-account-pattern
      expression: {{ printf `(%s) || (%s) || (%s)` $hookOriginMatch $parentOriginReadyMatch $stableMarkerObjectMatch | quote }}
  variables:
    - name: isProtectedJob
      expression: 'request.resource.group == "batch" && request.resource.version == "v1" && request.resource.resource == "jobs"'
    - name: isMainWrite
      expression: 'request.operation in ["CREATE", "UPDATE"] && (!has(request.subResource) || request.subResource == "")'
    - name: isStatusUpdate
      expression: 'request.operation == "UPDATE" && has(request.subResource) && request.subResource == "status"'
    - name: isDelete
      expression: 'request.operation == "DELETE" && (!has(request.subResource) || request.subResource == "")'
    - name: effectiveName
      expression: 'request.operation == "DELETE" && oldObject != null ? oldObject.metadata.name : request.name'
    - name: isReadinessMarker
      expression: {{ printf `request.resource.group == "" && request.resource.resource == "configmaps" && variables.effectiveName == %q` $parentOriginReadyName | quote }}
    - name: isConvergenceMarker
      expression: {{ printf `request.resource.group == "" && request.resource.resource == "configmaps" && variables.effectiveName.matches(%q)` $stableMarkerPattern | quote }}
    - name: isMarker
      expression: 'variables.isReadinessMarker || variables.isConvergenceMarker'
    - name: isServiceAccountObjectConvergenceProbe
      expression: {{ $serviceAccountObjectProbeRequest | quote }}
  validations:
    - expression: '(variables.isProtectedJob || variables.isMarker) && (variables.isMainWrite || variables.isStatusUpdate || variables.isDelete)'
      message: {{ $hookOriginMessage | quote }}
    - expression: {{ printf `!variables.isProtectedJob || !variables.isMainWrite || ((has(object.spec.template.spec.serviceAccountName) && (object.spec.template.spec.serviceAccountName.matches(%q) || object.spec.template.spec.serviceAccountName.matches(%q))) || (request.name.matches(%q) && (!has(object.spec.template.spec.serviceAccountName) || object.spec.template.spec.serviceAccountName in ["", "default"]) && (!has(object.spec.template.spec.serviceAccount) || object.spec.template.spec.serviceAccount in ["", "default"])))` $hookPattern $teardownPattern $imageCheckPattern | quote }}
      message: {{ $hookOriginMessage | quote }}
    - expression: {{ printf `!variables.isProtectedJob || !variables.isMainWrite || (%s)` $hookAuthority | quote }}
      message: {{ $hookOriginMessage | quote }}
    - expression: {{ printf `!variables.isProtectedJob || !(variables.isStatusUpdate || variables.isDelete) || (oldObject != null && ((has(oldObject.spec.template.spec.serviceAccountName) && (oldObject.spec.template.spec.serviceAccountName.matches(%q) || oldObject.spec.template.spec.serviceAccountName.matches(%q))) || (oldObject.metadata.name.matches(%q) && (!has(oldObject.spec.template.spec.serviceAccountName) || oldObject.spec.template.spec.serviceAccountName in ["", "default"]) && (!has(oldObject.spec.template.spec.serviceAccount) || oldObject.spec.template.spec.serviceAccount in ["", "default"]))))` $hookPattern $teardownPattern $imageCheckPattern | quote }}
      message: {{ $hookOriginMessage | quote }}
    - expression: {{ printf `!variables.isProtectedJob || !variables.isStatusUpdate || (%s)` $jobControllerPrincipal | quote }}
      message: {{ $hookOriginMessage | quote }}
    - expression: {{ printf `!variables.isProtectedJob || !variables.isStatusUpdate || (%s)` $statusPreservesIdentity | quote }}
      message: {{ $hookOriginMessage | quote }}
    - expression: {{ printf `!variables.isProtectedJob || !variables.isDelete || (%s)` $terminalJob | quote }}
      message: {{ $hookOriginMessage | quote }}
    - expression: {{ printf `!variables.isProtectedJob || !variables.isDelete || (%s)` $hookAuthority | quote }}
      message: {{ $hookOriginMessage | quote }}
    - expression: {{ printf `!variables.isMarker || variables.isServiceAccountObjectConvergenceProbe || (%s)` $hookAuthority | quote }}
      message: {{ $hookOriginMessage | quote }}
    - expression: '!variables.isServiceAccountObjectConvergenceProbe || request.dryRun == true'
      message: {{ $hookOriginMessage | quote }}
    - expression: {{ printf `!variables.isReadinessMarker || !variables.isMainWrite || (request.operation == "CREATE" ? (%s) : (%s))` $parentOriginReadyCreateShape $parentOriginReadyStoredShape | quote }}
      message: {{ $hookOriginMessage | quote }}
    - expression: {{ printf `!variables.isReadinessMarker || !(request.operation in ["UPDATE", "DELETE"]) || (%s)` $parentOriginReadyOldShape | quote }}
      message: {{ $hookOriginMessage | quote }}
    - expression: {{ printf `!variables.isConvergenceMarker || !variables.isMainWrite || (request.operation == "CREATE" ? (%s) : (%s))` $stableMarkerCreateShape $stableMarkerUpdateShape | quote }}
      message: {{ $hookOriginMessage | quote }}
    - expression: {{ printf `!variables.isConvergenceMarker || !(request.operation in ["UPDATE", "DELETE"]) || (%s)` $stableMarkerOldShape | quote }}
      message: {{ $hookOriginMessage | quote }}
    - expression: '!variables.isMarker || request.operation != "UPDATE" || (object.metadata.uid == oldObject.metadata.uid && object.metadata.resourceVersion == oldObject.metadata.resourceVersion)'
      message: {{ $hookOriginMessage | quote }}
---
{{- end }}
