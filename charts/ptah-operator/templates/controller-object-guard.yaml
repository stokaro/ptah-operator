      (dict "expression" `has(object.metadata.labels) && object.metadata.labels.size() == 2 && ["operator.ptah.dev/plan", "operator.ptah.dev/schema"].all(key, key in object.metadata.labels && object.metadata.labels[key] != "") && object.metadata.name.matches("^ptah-plan-[0-9a-f]{24}-[0-9]{3}$") && object.metadata.name.startsWith(object.metadata.labels["operator.ptah.dev/plan"] + "-") && (!has(object.metadata.annotations) || object.metadata.annotations.size() == 0) && (!has(object.metadata.finalizers) || object.metadata.finalizers.size() == 0) && (!has(object.metadata.generateName) || object.metadata.generateName == "") && !has(object.metadata.deletionTimestamp) && has(object.metadata.ownerReferences) && object.metadata.ownerReferences.size() == 1 && object.metadata.ownerReferences[0].apiVersion == "operator.ptah.dev/v1alpha1" && object.metadata.ownerReferences[0].kind == "PtahSchemaPlan" && object.metadata.ownerReferences[0].name == object.metadata.labels["operator.ptah.dev/plan"] && object.metadata.ownerReferences[0].uid != "" && has(object.metadata.ownerReferences[0].controller) && object.metadata.ownerReferences[0].controller && has(object.metadata.ownerReferences[0].blockOwnerDeletion) && object.metadata.ownerReferences[0].blockOwnerDeletion` "message" $chunkMessage)
      (dict "expression" `has(dyn(object).immutable) && dyn(object).immutable && (!has(dyn(object).data) || dyn(object).data.size() == 0) && has(dyn(object).binaryData) && dyn(object).binaryData.size() == 1 && "chunk" in dyn(object).binaryData && dyn(object).binaryData["chunk"].size() >= 1 && dyn(object).binaryData["chunk"].size() <= 524288` "message" $chunkMessage) -}}
{{- /* Candidate-only v3 fields stay dynamic until the predecessor CRD has been upgraded. */ -}}
{{- $planCommon := `dyn(object).spec.fingerprint.matches("^sha256:[0-9a-f]{64}$") && dyn(object).spec.contentDigest.matches("^sha256:[0-9a-f]{64}$") && dyn(object).spec.artifactDigest.matches("^sha256:[0-9a-f]{64}$") && dyn(object).spec.coordinationDigest.matches("^sha256:[0-9a-f]{64}$") && dyn(object).spec.targetIdentityDigest.matches("^sha256:[0-9a-f]{64}$") && dyn(object).spec.actualStateFingerprint.matches("^sha256:[0-9a-f]{64}$") && dyn(object).spec.desiredStateFingerprint.matches("^sha256:[0-9a-f]{64}$") && dyn(object).spec.policyFingerprint.matches("^sha256:[0-9a-f]{64}$") && dyn(object).spec.verificationPolicyUID != "" && dyn(object).spec.verificationPolicyDigest.matches("^sha256:[0-9a-f]{64}$") && dyn(object).spec.executionBindingID.matches("^v1-[0-9a-f]{32}$") && dyn(object).spec.ptahVersion != "" && dyn(object).spec.executorImage.matches("^[^[:space:]@]+@sha256:[0-9a-f]{64}$") && dyn(object).spec.runnerImage.matches("^[^[:space:]@]+@sha256:[0-9a-f]{64}$") && dyn(object).spec.runnerProtocolVersion >= 1 && dyn(object).spec.dialect != "" && dyn(object).spec.statementCount >= 1 && dyn(object).spec.size >= 1 && dyn(object).spec.size <= 8388608` -}}
{{- $planLegacy := `variables.activeRelease == variables.previousRelease && dyn(object).spec.contractVersion == 2 && !has(dyn(dyn(object).spec).controllerImage) && !has(dyn(dyn(object).spec).controllerRevision) && !has(dyn(dyn(object).spec).controllerStateVersion)` -}}
{{- $planCurrent := `dyn(object).spec.contractVersion == 3 && has(dyn(dyn(object).spec).controllerImage) && dyn(dyn(object).spec).controllerImage.matches("^[^[:space:]@]+@sha256:[0-9a-f]{64}$") && dyn(dyn(object).spec).controllerImage == variables.activeControllerImage && has(dyn(dyn(object).spec).controllerRevision) && dyn(dyn(object).spec).controllerRevision != "" && has(dyn(dyn(object).spec).controllerStateVersion) && dyn(dyn(object).spec).controllerStateVersion >= 1 && dyn(dyn(object).spec).controllerStateVersion == variables.activeControllerState` -}}
{{- $planContract := printf `(%s) && ((%s) || (%s))` $planCommon $planLegacy $planCurrent -}}
{{- $planValidations := list
      (dict "expression" `has(object.metadata.labels) && object.metadata.labels.size() == 1 && "operator.ptah.dev/schema" in object.metadata.labels && object.metadata.labels["operator.ptah.dev/schema"] != "" && object.metadata.name.matches("^ptah-plan-[0-9a-f]{24}$") && (!has(object.metadata.annotations) || object.metadata.annotations.size() == 0) && (!has(object.metadata.finalizers) || object.metadata.finalizers.size() == 0) && (!has(object.metadata.generateName) || object.metadata.generateName == "") && !has(object.metadata.deletionTimestamp) && has(object.metadata.ownerReferences) && object.metadata.ownerReferences.size() == 1 && object.metadata.ownerReferences[0].apiVersion == "operator.ptah.dev/v1alpha1" && object.metadata.ownerReferences[0].kind == "PtahSchema" && object.metadata.ownerReferences[0].name == object.metadata.labels["operator.ptah.dev/schema"] && object.metadata.ownerReferences[0].uid != "" && has(object.metadata.ownerReferences[0].controller) && object.metadata.ownerReferences[0].controller && has(object.metadata.ownerReferences[0].blockOwnerDeletion) && object.metadata.ownerReferences[0].blockOwnerDeletion && dyn(object).spec.schemaRef.name == object.metadata.labels["operator.ptah.dev/schema"] && dyn(object).spec.schemaRef.uid == object.metadata.ownerReferences[0].uid` "message" $planMessage)
      (dict "expression" $planContract "message" $planMessage)
      (dict "expression" `dyn(object).spec.chunks.size() >= 1 && dyn(object).spec.chunks.size() <= 16 && dyn(object).spec.chunks.all(chunk, chunk.key == "chunk" && chunk.name.matches("^ptah-plan-[0-9a-f]{24}-[0-9]{3}$") && chunk.name.startsWith(object.metadata.name + "-") && chunk.index >= 0 && chunk.index < dyn(object).spec.chunks.size() && chunk.digest.matches("^sha256:[0-9a-f]{64}$") && chunk.size >= 1 && chunk.size <= 524288)` "message" $planMessage)
      (dict "expression" `!has(dyn(object).status)` "message" $planMessage) -}}
{{- $entries := list
      (dict "name" (include "ptah-operator.controllerJobWriteGuardPolicyName" .) "component" "controller-job-write-guard" "apiGroups" (list "batch") "apiVersions" (list "v1") "resource" "jobs" "operations" (list "CREATE" "UPDATE") "denialMessage" $jobMessage "validations" $jobValidations "parameterized" true)
      (dict "name" (include "ptah-operator.controllerChunkWriteGuardPolicyName" .) "component" "controller-chunk-write-guard" "apiGroups" (list "") "apiVersions" (list "v1") "resource" "configmaps" "operations" (list "CREATE") "denialMessage" $chunkMessage "validations" $chunkValidations "parameterized" true)
      (dict "name" (include "ptah-operator.controllerPlanWriteGuardPolicyName" .) "component" "controller-plan-write-guard" "apiGroups" (list "operator.ptah.dev") "apiVersions" (list "v1alpha1") "resource" "ptahschemaplans" "operations" (list "CREATE") "denialMessage" $planMessage "validations" $planValidations "parameterized" true) -}}
{{- range $entry := $entries -}}
{{- $probeFieldManager := include "ptah-operator.admissionConvergenceProbeFieldManager" (dict "root" $ "policyName" $entry.name) -}}
{{- $probeRequest := include "ptah-operator.admissionConvergenceProbeRequest" (dict "root" $ "fieldManager" $probeFieldManager) -}}
{{- $probeMessage := include "ptah-operator.admissionConvergenceProbeMessage" (dict "fieldManager" $probeFieldManager) -}}
{{- $policy := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicy" "" $entry.name -}}
{{- $binding := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicyBinding" "" $entry.name -}}
{{- range $object := list
      (dict "kind" "ValidatingAdmissionPolicy" "value" $policy)
      (dict "kind" "ValidatingAdmissionPolicyBinding" "value" $binding) -}}
{{- with $object.value -}}
{{- $annotations := default (dict) .metadata.annotations -}}
{{- $labels := default (dict) .metadata.labels -}}
{{- if or
      (ne (default "" (index $annotations "operator.ptah.dev/rollout-guard-version")) "1")
      (ne (default "" (index $annotations "operator.ptah.dev/release-name")) $.Release.Name)
      (ne (default "" (index $annotations "operator.ptah.dev/release-namespace")) $.Release.Namespace)
      (ne (default "" (index $labels "app.kubernetes.io/managed-by")) "ptah-operator")
      (ne (default "" (index $labels "app.kubernetes.io/instance")) $.Release.Name)
      (ne (default "" (index $labels "app.kubernetes.io/component")) $entry.component) -}}
{{- fail (printf "retained %s %s has foreign or incomplete controller-object ownership" $object.kind $entry.name) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not $policy }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $entry.name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-152"
    helm.sh/resource-policy: keep
    operator.ptah.dev/rollout-guard-version: "1"
    operator.ptah.dev/release-name: {{ $.Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ $.Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $entry.component }}
spec:
  failurePolicy: Fail
{{- if $entry.parameterized }}
  paramKind:
    apiVersion: v1
    kind: ConfigMap
{{- end }}
  matchConstraints:
    matchPolicy: Exact
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups: {{ $entry.apiGroups | toJson }}
        apiVersions: {{ $entry.apiVersions | toJson }}
        operations: {{ $entry.operations | toJson }}
        resources: [{{ $entry.resource | quote }}]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["configmaps"]
        scope: Namespaced
  matchConditions:
    - name: candidate-or-predecessor-controller-service-account
      expression: {{ printf `(%s) || (%s)` $anyConvergenceRequest $controllerUsernameMatch | quote }}
  variables:
    - name: isAnyAdmissionConvergenceProbe
      expression: {{ $anyConvergenceRequest | quote }}
    - name: isAdmissionConvergenceProbe
      expression: {{ $probeRequest | quote }}
    - name: activeRelease
      expression: 'params != null && has(params.data) && "active-release-sequence" in params.data && params.data["active-release-sequence"].matches("^(0|[1-9][0-9]*)$") ? int(params.data["active-release-sequence"]) : -1'
    - name: activeControllerStateString
      expression: 'params != null && has(params.metadata.annotations) && "operator.ptah.dev/controller-state-version" in params.metadata.annotations ? params.metadata.annotations["operator.ptah.dev/controller-state-version"] : ""'
    - name: activeControllerState
      expression: 'params != null && has(params.metadata.annotations) && "operator.ptah.dev/controller-state-version" in params.metadata.annotations && params.metadata.annotations["operator.ptah.dev/controller-state-version"].matches("^[1-9][0-9]*$") ? int(params.metadata.annotations["operator.ptah.dev/controller-state-version"]) : 0'
    - name: activeControllerImage
      expression: 'params != null && has(params.metadata.annotations) && "operator.ptah.dev/manager-image" in params.metadata.annotations ? params.metadata.annotations["operator.ptah.dev/manager-image"] : ""'
    - name: candidateRelease
      expression: {{ $candidateSequence | quote }}
    - name: previousRelease
      expression: {{ $previousSequence | quote }}
  validations:
    - expression: {{ printf `variables.isAnyAdmissionConvergenceProbe || (%s)` $activationShape | quote }}
      message: {{ $entry.denialMessage | quote }}
    - expression: {{ printf `variables.isAnyAdmissionConvergenceProbe || (%s)` $controllerAuthority | quote }}
      message: "Ptah controller principal guard rejected an inactive release identity"
{{- range $validation := $entry.validations }}
    - expression: {{ printf `variables.isAnyAdmissionConvergenceProbe || (%s)` $validation.expression | quote }}
      message: {{ $validation.message | quote }}
{{- end }}
    - expression: '!variables.isAnyAdmissionConvergenceProbe || request.dryRun == true'
      message: Ptah admission convergence probe field manager is reserved for dry-run verification
    - expression: '!variables.isAdmissionConvergenceProbe'
      message: {{ $probeMessage | quote }}
---
{{- end }}
{{- if not $binding }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $entry.name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: {{ ternary "-147" "-151" $entry.parameterized | quote }}
    helm.sh/resource-policy: keep
    operator.ptah.dev/rollout-guard-version: "1"
    operator.ptah.dev/release-name: {{ $.Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ $.Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $entry.component }}
spec:
  policyName: {{ $entry.name }}
  matchResources:
    matchPolicy: Exact
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups: {{ $entry.apiGroups | toJson }}
        apiVersions: {{ $entry.apiVersions | toJson }}
        operations: {{ $entry.operations | toJson }}
        resources: [{{ $entry.resource | quote }}]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["configmaps"]
        scope: Namespaced
{{- if $entry.parameterized }}
  paramRef:
    name: ptah-operator-release-activation
    namespace: {{ $.Release.Namespace }}
    parameterNotFoundAction: Deny
{{- end }}
  validationActions: [Deny]
---
{{- end }}
{{- end }}
