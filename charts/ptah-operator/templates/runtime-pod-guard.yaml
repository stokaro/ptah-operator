{{- $certificateMetadata := printf `object.metadata.name.startsWith(%q) && (!has(object.metadata.generateName) || object.metadata.generateName.startsWith(%q)) && has(object.metadata.labels) && %q in object.metadata.labels && object.metadata.labels[%q] == %q && %q in object.metadata.labels && object.metadata.labels[%q] == %q && has(object.metadata.ownerReferences) && object.metadata.ownerReferences.size() == 1 && object.metadata.ownerReferences[0].apiVersion == "apps/v1" && object.metadata.ownerReferences[0].kind == "ReplicaSet" && object.metadata.ownerReferences[0].name.startsWith(%q) && object.metadata.ownerReferences[0].uid != "" && has(object.metadata.ownerReferences[0].controller) && object.metadata.ownerReferences[0].controller && has(object.metadata.ownerReferences[0].blockOwnerDeletion) && object.metadata.ownerReferences[0].blockOwnerDeletion` (printf "%s-" $certificateDeployment) (printf "%s-" $certificateDeployment) "app.kubernetes.io/instance" "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/component" "app.kubernetes.io/component" "certificate-rotation" (printf "%s-" $certificateDeployment) -}}
{{- $probeFormat := `has(%[1]s) && has(%[1]s.httpGet) && %[1]s.httpGet.path == %[2]q && %[1]s.httpGet.port == "health" && %[1]s.httpGet.scheme == "HTTP" && (!has(%[1]s.httpGet.host) || %[1]s.httpGet.host == "") && (!has(%[1]s.httpGet.httpHeaders) || %[1]s.httpGet.httpHeaders.size() == 0) && !has(%[1]s.exec) && !has(%[1]s.tcpSocket) && !has(%[1]s.grpc) && %[1]s.initialDelaySeconds == %[3]d && %[1]s.periodSeconds == %[4]d && %[1]s.timeoutSeconds == %[5]d && %[1]s.successThreshold == 1 && %[1]s.failureThreshold == %[6]d` -}}
