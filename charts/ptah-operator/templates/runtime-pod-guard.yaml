{{- if not $policy }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-50"
    helm.sh/resource-policy: keep
    operator.ptah.dev/rollout-guard-version: "1"
    operator.ptah.dev/release-name: {{ .Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ .Release.Namespace | quote }}
    operator.ptah.dev/release-sequence: {{ $sequence | quote }}
    operator.ptah.dev/controller-state-version: {{ $stateVersion | quote }}
    operator.ptah.dev/manager-image: {{ $managerImage | quote }}
    operator.ptah.dev/runtime-pod-contract-digest: {{ $contractDigest | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rollout-guard
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    matchPolicy: Exact
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers", "pods/resize"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CONNECT"]
        resources: ["pods/exec", "pods/attach", "pods/portforward", "pods/proxy"]
        scope: Namespaced
  matchConditions:
    - name: runtime-service-account-or-pod
      expression: {{ printf `request.namespace == %q && ((request.subResource == "" && object.spec.serviceAccountName in [%q, %q]) || (request.subResource != "" && (request.name.startsWith(%q) || request.name.startsWith(%q))))` .Release.Namespace $controllerServiceAccount $certificateDeployment (printf "%s-" $controllerDeployment) (printf "%s-" $certificateDeployment) | quote }}
  variables:
    - name: isPod
      expression: 'request.subResource == ""'
    - name: isController
      expression: {{ printf `request.subResource == "" && object.spec.serviceAccountName == %q` $controllerServiceAccount | quote }}
    - name: isCertificate
      expression: {{ printf `request.subResource == "" && object.spec.serviceAccountName == %q` $certificateDeployment | quote }}
    - name: newState
      expression: {{ printf `request.subResource == "" && has(object.metadata.annotations) && %q in object.metadata.annotations && object.metadata.annotations[%q].matches("^[1-9][0-9]*$") ? int(object.metadata.annotations[%q]) : -1` "operator.ptah.dev/controller-state-version" "operator.ptah.dev/controller-state-version" "operator.ptah.dev/controller-state-version" | quote }}
    - name: newRelease
      expression: {{ printf `request.subResource == "" && has(object.metadata.annotations) && %q in object.metadata.annotations && object.metadata.annotations[%q].matches("^[1-9][0-9]*$") ? int(object.metadata.annotations[%q]) : -1` "operator.ptah.dev/release-sequence" "operator.ptah.dev/release-sequence" "operator.ptah.dev/release-sequence" | quote }}
    - name: activeRelease
      expression: {{ printf `params != null && has(params.data) && %q in params.data && params.data[%q].matches("^(0|[1-9][0-9]*)$") ? int(params.data[%q]) : -1` "active-release-sequence" "active-release-sequence" "active-release-sequence" | quote }}
    - name: apiVolumes
      expression: 'request.subResource == "" && has(object.spec.volumes) ? object.spec.volumes.filter(v, v.name == "api-access") : []'
  validations:
    - expression: 'request.subResource == ""'
      message: {{ $message | quote }}
    - expression: 'request.operation != "CREATE" || request.userInfo.username in ["system:kube-controller-manager", "system:serviceaccount:kube-system:replicaset-controller"]'
      message: {{ $message | quote }}
    - expression: {{ printf `!variables.isPod || variables.newRelease >= %s` $sequence | quote }}
      message: {{ $message | quote }}
    - expression: '!variables.isPod || variables.activeRelease >= variables.newRelease'
      message: {{ $message | quote }}
    {{- range $index, $controllerExpression := $controllerContract }}
    - expression: {{ printf `!variables.isPod || variables.newRelease > %s || (variables.newRelease == %s && variables.newState == %s && ((variables.isController && (%s)) || (variables.isCertificate && (%s))))` $sequence $sequence $stateVersion $controllerExpression (index $certificateContract $index) | quote }}
      message: {{ $message | quote }}
    {{- end }}
    {{- range $expression := ($podConfigExpressions | fromJsonArray) }}
    - expression: {{ printf `!variables.isPod || variables.newRelease > %s || (variables.newRelease == %s && variables.newState == %s && (%s))` $sequence $sequence $stateVersion $expression | quote }}
      message: {{ $message | quote }}
    {{- end }}
---
{{- end }}
{{- if not $binding }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-40"
    helm.sh/resource-policy: keep
    operator.ptah.dev/rollout-guard-version: "1"
    operator.ptah.dev/release-name: {{ .Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ .Release.Namespace | quote }}
    operator.ptah.dev/release-sequence: {{ $sequence | quote }}
    operator.ptah.dev/controller-state-version: {{ $stateVersion | quote }}
    operator.ptah.dev/manager-image: {{ $managerImage | quote }}
    operator.ptah.dev/runtime-pod-contract-digest: {{ $contractDigest | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rollout-guard
spec:
  policyName: {{ $name }}
  matchResources:
    matchPolicy: Exact
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
    objectSelector: {}
  paramRef:
    name: ptah-operator-release-activation
    namespace: {{ .Release.Namespace }}
    parameterNotFoundAction: Deny
  validationActions: [Deny]
{{- end }}
