{{- if and .Values.certificateRotation.enabled (not .Values.webhook.existingSecret) }}
{{- $rotatorName := include "ptah-operator.certRotatorServiceAccountName" . -}}
{{- $secretName := include "ptah-operator.webhookSecretName" . -}}
{{- $leaseName := include "ptah-operator.certRotationLeaseName" . -}}
{{- $configurationName := include "ptah-operator.approvalWebhookConfigurationName" . -}}
{{- $serviceName := include "ptah-operator.webhookServiceName" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $rotatorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
automountServiceAccountToken: true
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: {{ $leaseName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
spec: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $rotatorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secretName | quote }}]
    verbs: ["get", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ $leaseName | quote }}]
    verbs: ["get", "update"]
  # EndpointSlice names are assigned by Kubernetes, and RBAC cannot combine
  # list with resourceNames or enforce the Service label selector used by the
  # rotator. This read-only namespace rule is the narrowest stable grant.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $rotatorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $rotatorName }}
subjects:
  - kind: ServiceAccount
    name: {{ $rotatorName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $rotatorName }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    resourceNames: [{{ $configurationName | quote }}]
    verbs: ["get", "update"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    resourceNames: [{{ $configurationName | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $rotatorName }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $rotatorName }}
subjects:
  - kind: ServiceAccount
    name: {{ $rotatorName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $rotatorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ptah-operator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: certificate-rotation
  template:
    metadata:
      labels:
        {{- include "ptah-operator.labels" . | nindent 8 }}
        app.kubernetes.io/component: certificate-rotation
    spec:
      serviceAccountName: {{ $rotatorName }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: certificate-rotator
          image: {{ include "ptah-operator.managerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/ptah-cert-rotator"]
          args:
            - --namespace={{ .Release.Namespace }}
            - --secret-name={{ $secretName }}
            - --lease-name={{ $leaseName }}
            - --mutating-webhook-configuration={{ $configurationName }}
            - --mutating-webhook-names=mapproval.operator.ptah.dev
            - --validating-webhook-configuration={{ $configurationName }}
            - --validating-webhook-names=vapproval.operator.ptah.dev,vpodintent.operator.ptah.dev
            - --service-name={{ $serviceName }}
            - --service-namespace={{ .Release.Namespace }}
            - --endpoint-port-name=https
            - --holder-identity=$(POD_NAME)/$(POD_UID)
            - --run-interval={{ .Values.certificateRotation.interval }}
            - --operation-timeout={{ .Values.certificateRotation.operationTimeout }}
            - --retry-initial={{ .Values.certificateRotation.retryInitial }}
            - --retry-max={{ .Values.certificateRotation.retryMax }}
            - --health-bind-address=:{{ .Values.certificateRotation.healthPort }}
            - --renewal-threshold={{ .Values.certificateRotation.renewalThreshold }}
            - --serving-certificate-validity={{ .Values.certificateRotation.servingCertificateValidity }}
            - --ca-certificate-validity={{ .Values.certificateRotation.caCertificateValidity }}
            - --probe-timeout={{ .Values.certificateRotation.probeTimeout }}
            - --probe-interval={{ .Values.certificateRotation.probeInterval }}
            - --lease-duration={{ .Values.certificateRotation.leaseDuration }}
            - --lease-acquire-timeout={{ .Values.certificateRotation.leaseAcquireTimeout }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - name: health
              containerPort: {{ .Values.certificateRotation.healthPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.certificateRotation.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
{{- end }}
