{{- if and .Values.certificateRotation.enabled (not .Values.webhook.existingSecret) }}
{{- $rotatorName := include "ptah-operator.certRotatorServiceAccountName" . -}}
{{- $secretName := include "ptah-operator.webhookSecretName" . -}}
{{- $stagingSecretName := include "ptah-operator.certRotationStagingSecretName" . -}}
{{- $leaseName := include "ptah-operator.certRotationLeaseName" . -}}
{{- $configurationName := include "ptah-operator.approvalWebhookConfigurationName" . -}}
{{- $serviceName := include "ptah-operator.webhookServiceName" . -}}
{{- $legacyParentOriginDigest := printf "%s\n%s" .Release.Namespace .Release.Name | sha256sum | trunc 12 -}}
{{- $serviceAccountObjectGuardName := printf "ptah-operator-service-account-object-guard-v1-%s" $legacyParentOriginDigest -}}
{{- if .Values.certificateRotation.recreateMissingSecret }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $rotatorName }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
        scope: Namespaced
  matchConditions:
    - name: exact-certificate-rotator-service-account
      expression: >-
        request.userInfo.username ==
        'system:serviceaccount:{{ .Release.Namespace }}:{{ $rotatorName }}'
  validations:
    - expression: >-
        object.metadata.name == '{{ $secretName }}' &&
        object.metadata.namespace == '{{ .Release.Namespace }}' &&
        (!has(object.metadata.generateName) || object.metadata.generateName == '') &&
        has(object.metadata.labels) &&
        object.metadata.labels ==
          {'operator.ptah.dev/generated-webhook-certificate': 'true'} &&
        (!has(object.metadata.annotations) || object.metadata.annotations.size() == 0) &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0) &&
        (!has(object.metadata.finalizers) || object.metadata.finalizers.size() == 0) &&
        object.type == 'kubernetes.io/tls' &&
        !has(object.immutable) &&
        (!has(object.stringData) || object.stringData.size() == 0) &&
        object.data.size() == 4 &&
        'ca.crt' in object.data && object.data['ca.crt'].size() > 0 &&
        'ca.key' in object.data && object.data['ca.key'].size() > 0 &&
        'tls.crt' in object.data && object.data['tls.crt'].size() > 0 &&
        'tls.key' in object.data && object.data['tls.key'].size() > 0
      message: "certificate rotator Secret CREATE is outside its exact recovery contract"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $rotatorName }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
spec:
  policyName: {{ $rotatorName }}
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $rotatorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
automountServiceAccountToken: true
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: {{ $leaseName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
spec: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $stagingSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    operator.ptah.dev/certificate-rotation-staging: "true"
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $rotatorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ $secretName | quote }}
      - {{ $stagingSecretName | quote }}
    verbs: ["get", "update"]
  {{- if .Values.certificateRotation.recreateMissingSecret }}
  # Kubernetes RBAC cannot scope CREATE by resourceName. The fail-closed
  # ValidatingAdmissionPolicy above narrows this grant to one exact object and
  # the rotator verifies that enforcement with server-side dry runs before use.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  {{- end }}
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ $leaseName | quote }}]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames:
      - {{ include "ptah-operator.serviceAccountName" . }}
      - {{ $rotatorName }}
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["limitranges"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $rotatorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $rotatorName }}
subjects:
  - kind: ServiceAccount
    name: {{ $rotatorName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $rotatorName }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - ptahschemaapprovals.operator.ptah.dev
      - ptahschemaplans.operator.ptah.dev
      - ptahschemas.operator.ptah.dev
    verbs: ["get"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    resourceNames: [{{ $configurationName | quote }}]
    verbs: ["get", "update"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    resourceNames: [{{ $configurationName | quote }}]
    verbs: ["get", "update"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    resourceNames:
      - {{ include "ptah-operator.rolloutGuardPolicyName" . }}
      - {{ include "ptah-operator.runtimeGuardPolicyName" . }}
      - {{ include "ptah-operator.runtimePodGuardPolicyName" . }}
      - {{ include "ptah-operator.hookIdentityGuardPolicyName" . }}
      - {{ include "ptah-operator.hookIdentityProbeGuardPolicyName" . }}
      - {{ include "ptah-operator.releaseActivationGuardPolicyName" . }}
      - {{ include "ptah-operator.admissionConvergencePolicyName" . }}
      - {{ $serviceAccountObjectGuardName }}
      - {{ include "ptah-operator.serviceAccountOriginGuardPolicyName" . }}
      - {{ include "ptah-operator.controllerWriteGuardPolicyName" . }}
      - {{ include "ptah-operator.controllerJobWriteGuardPolicyName" . }}
      - {{ include "ptah-operator.controllerChunkWriteGuardPolicyName" . }}
      - {{ include "ptah-operator.controllerPlanWriteGuardPolicyName" . }}
      - {{ include "ptah-operator.certificateMutatingWriteGuardPolicyName" . }}
      - {{ include "ptah-operator.certificateValidatingWriteGuardPolicyName" . }}
      - {{ include "ptah-operator.namespaceDeletionGuardPolicyName" . }}
      - {{ include "ptah-operator.parentReplicaSetGuardPolicyName" . }}
      - {{ include "ptah-operator.parentHookPodOriginGuardPolicyName" . }}
      - {{ include "ptah-operator.parentHookJobOriginGuardPolicyName" . }}
      - {{ include "ptah-operator.parentHookJobContractPolicyName" . }}
      - {{ printf "ptah-operator-hook-pod-origin-guard-v1-%s" $legacyParentOriginDigest }}
      - {{ printf "ptah-operator-hook-parent-origin-guard-v1-%s" $legacyParentOriginDigest }}
    verbs: ["get"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list"]
  {{- if .Values.certificateRotation.recreateMissingSecret }}
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    resourceNames: [{{ $rotatorName | quote }}]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $rotatorName }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $rotatorName }}
subjects:
  - kind: ServiceAccount
    name: {{ $rotatorName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $rotatorName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    operator.ptah.dev/controller-state-version: {{ include "ptah-operator.controllerStateVersion" . | quote }}
    operator.ptah.dev/release-sequence: {{ include "ptah-operator.releaseSequence" . | quote }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ptah-operator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: certificate-rotation
  template:
    metadata:
      annotations:
        operator.ptah.dev/controller-state-version: {{ include "ptah-operator.controllerStateVersion" . | quote }}
        operator.ptah.dev/release-sequence: {{ include "ptah-operator.releaseSequence" . | quote }}
      labels:
        {{- include "ptah-operator.labels" . | nindent 8 }}
        app.kubernetes.io/component: certificate-rotation
    spec:
      serviceAccountName: {{ $rotatorName }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: verify-candidate-runtime
          image: {{ include "ptah-operator.managerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/ptah-crd-manager"]
          args:
            {{- range (include "ptah-operator.crdManagerArgsJSON" (dict "root" . "mode" "runtime-verify" "timeout" "60s" "verifyControllerState" false) | fromJsonArray) }}
            - {{ . | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: certificate-rotator
          image: {{ include "ptah-operator.managerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/ptah-cert-rotator"]
          args:
            {{- range (include "ptah-operator.certificateRuntimeArgsJSON" . | fromJsonArray) }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - name: health
              containerPort: {{ .Values.certificateRotation.healthPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            {{- toYaml .Values.certificateRotation.resources | nindent 12 }}
      volumes:
        - name: api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
{{- end }}
