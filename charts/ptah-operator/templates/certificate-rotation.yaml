{{- if and .Values.certificateRotation.enabled (not .Values.webhook.existingSecret) }}
{{- include "ptah-operator.validateCertificateRenewalThreshold" . -}}
{{- $rotatorName := include "ptah-operator.certRotatorServiceAccountName" . -}}
{{- $secretName := include "ptah-operator.webhookSecretName" . -}}
{{- $stagingSecretName := include "ptah-operator.certRotationStagingSecretName" . -}}
{{- $leaseName := include "ptah-operator.certRotationLeaseName" . -}}
{{- $configurationName := include "ptah-operator.approvalWebhookConfigurationName" . -}}
{{- $serviceName := include "ptah-operator.webhookServiceName" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $rotatorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
automountServiceAccountToken: true
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: {{ $leaseName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
spec: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $stagingSecretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: Helm
    operator.ptah.run/certificate-rotation-staging: "true"
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $rotatorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ $secretName | quote }}
      - {{ $stagingSecretName | quote }}
    verbs: ["get", "update"]
  {{- if .Values.certificateRotation.recreateMissingSecret }}
  # Kubernetes RBAC cannot scope CREATE by resourceName. The fail-closed
  # ValidatingAdmissionPolicy in certificate-secret-guard.yaml narrows this
  # grant to one exact object.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  {{- end }}
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ $leaseName | quote }}]
    verbs: ["get", "update"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $rotatorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $rotatorName }}
subjects:
  - kind: ServiceAccount
    name: {{ $rotatorName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $rotatorName }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - ptahmigrationapprovals.operator.ptah.run
      - ptahmigrationplans.operator.ptah.run
      - ptahmigrationrunacknowledgments.operator.ptah.run
      - ptahmigrations.operator.ptah.run
      - ptahrealms.operator.ptah.run
      - ptahschemaapprovals.operator.ptah.run
      - ptahschemaplanchunks.operator.ptah.run
      - ptahschemaplans.operator.ptah.run
      - ptahschemas.operator.ptah.run
    verbs: ["get"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    resourceNames: [{{ $configurationName | quote }}]
    verbs: ["get", "update"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    resourceNames: [{{ $configurationName | quote }}]
    verbs: ["get", "update"]
  {{- if .Values.certificateRotation.recreateMissingSecret }}
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    resourceNames: [{{ $rotatorName | quote }}]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $rotatorName }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $rotatorName }}
subjects:
  - kind: ServiceAccount
    name: {{ $rotatorName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $rotatorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ptah-operator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: certificate-rotation
  template:
    metadata:
      labels:
        {{- include "ptah-operator.labels" . | nindent 8 }}
        app.kubernetes.io/component: certificate-rotation
    spec:
      serviceAccountName: {{ $rotatorName }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: verify-candidate-runtime
          image: {{ include "ptah-operator.managerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/ptah-crd-manager"]
          args:
            {{- range (include "ptah-operator.runtimeVerifyArgsJSON" (dict "root" . "verifyControllerState" false) | fromJsonArray) }}
            - {{ . | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: certificate-rotator
          image: {{ include "ptah-operator.managerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/ptah-cert-rotator"]
          args:
            {{- range (include "ptah-operator.certificateRuntimeArgsJSON" . | fromJsonArray) }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - name: health
              containerPort: {{ .Values.certificateRotation.healthPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            {{- toYaml .Values.certificateRotation.resources | nindent 12 }}
      volumes:
        - name: api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
{{- end }}
