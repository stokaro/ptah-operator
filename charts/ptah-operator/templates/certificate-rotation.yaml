{{- if and .Values.certificateRotation.enabled (not .Values.webhook.existingSecret) }}
{{- $rotatorName := include "ptah-operator.certRotatorServiceAccountName" . -}}
{{- $secretName := include "ptah-operator.webhookSecretName" . -}}
{{- $leaseName := include "ptah-operator.certRotationLeaseName" . -}}
{{- $configurationName := include "ptah-operator.approvalWebhookConfigurationName" . -}}
{{- $serviceName := include "ptah-operator.webhookServiceName" . -}}
{{- if .Values.certificateRotation.recreateMissingSecret }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $rotatorName }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
        scope: Namespaced
  matchConditions:
    - name: exact-certificate-rotator-service-account
      expression: >-
        request.userInfo.username ==
        'system:serviceaccount:{{ .Release.Namespace }}:{{ $rotatorName }}'
  validations:
    - expression: >-
        object.metadata.name == '{{ $secretName }}' &&
        object.metadata.namespace == '{{ .Release.Namespace }}' &&
        object.metadata.generateName == '' &&
        has(object.metadata.labels) &&
        object.metadata.labels ==
          {'operator.ptah.dev/generated-webhook-certificate': 'true'} &&
        (!has(object.metadata.annotations) || object.metadata.annotations.size() == 0) &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0) &&
        (!has(object.metadata.finalizers) || object.metadata.finalizers.size() == 0) &&
        object.type == 'kubernetes.io/tls' &&
        !has(object.immutable) &&
        (!has(object.stringData) || object.stringData.size() == 0) &&
        object.data.size() == 4 &&
        'ca.crt' in object.data && object.data['ca.crt'].size() > 0 &&
        'ca.key' in object.data && object.data['ca.key'].size() > 0 &&
        'tls.crt' in object.data && object.data['tls.crt'].size() > 0 &&
        'tls.key' in object.data && object.data['tls.key'].size() > 0
      message: "certificate rotator Secret CREATE is outside its exact recovery contract"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $rotatorName }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
spec:
  policyName: {{ $rotatorName }}
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $rotatorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
automountServiceAccountToken: true
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: {{ $leaseName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
spec: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $rotatorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secretName | quote }}]
    verbs: ["get", "update"]
  {{- if .Values.certificateRotation.recreateMissingSecret }}
  # Kubernetes RBAC cannot scope CREATE by resourceName. The fail-closed
  # ValidatingAdmissionPolicy above narrows this grant to one exact object and
  # the rotator verifies that enforcement with server-side dry runs before use.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  {{- end }}
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ $leaseName | quote }}]
    verbs: ["get", "update"]
  # EndpointSlice names are assigned by Kubernetes, and RBAC cannot combine
  # list with resourceNames or enforce the Service label selector used by the
  # rotator. This read-only namespace rule is the narrowest stable grant.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $rotatorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $rotatorName }}
subjects:
  - kind: ServiceAccount
    name: {{ $rotatorName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $rotatorName }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    resourceNames: [{{ $configurationName | quote }}]
    verbs: ["get", "update"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    resourceNames: [{{ $configurationName | quote }}]
    verbs: ["get", "update"]
  {{- if .Values.certificateRotation.recreateMissingSecret }}
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    resourceNames: [{{ $rotatorName | quote }}]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $rotatorName }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $rotatorName }}
subjects:
  - kind: ServiceAccount
    name: {{ $rotatorName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $rotatorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate-rotation
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ptah-operator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: certificate-rotation
  template:
    metadata:
      labels:
        {{- include "ptah-operator.labels" . | nindent 8 }}
        app.kubernetes.io/component: certificate-rotation
    spec:
      serviceAccountName: {{ $rotatorName }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: certificate-rotator
          image: {{ include "ptah-operator.managerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/ptah-cert-rotator"]
          args:
            - --namespace={{ .Release.Namespace }}
            - --secret-name={{ $secretName }}
            {{- if .Values.certificateRotation.recreateMissingSecret }}
            - --recreate-missing-secret=true
            - --secret-create-policy-name={{ $rotatorName }}
            - --secret-create-policy-binding-name={{ $rotatorName }}
            - --secret-create-service-account-name={{ $rotatorName }}
            {{- end }}
            - --lease-name={{ $leaseName }}
            - --mutating-webhook-configuration={{ $configurationName }}
            - --mutating-webhook-names=mapproval.operator.ptah.dev
            - --validating-webhook-configuration={{ $configurationName }}
            - --validating-webhook-names=vapproval.operator.ptah.dev,vpodintent.operator.ptah.dev
            - --service-name={{ $serviceName }}
            - --service-namespace={{ .Release.Namespace }}
            - --endpoint-port-name=https
            - --holder-identity=$(POD_NAME)/$(POD_UID)
            - --run-interval={{ .Values.certificateRotation.interval }}
            - --operation-timeout={{ .Values.certificateRotation.operationTimeout }}
            - --retry-initial={{ .Values.certificateRotation.retryInitial }}
            - --retry-max={{ .Values.certificateRotation.retryMax }}
            - --health-bind-address=:{{ .Values.certificateRotation.healthPort }}
            - --renewal-threshold={{ .Values.certificateRotation.renewalThreshold }}
            - --serving-certificate-validity={{ .Values.certificateRotation.servingCertificateValidity }}
            - --ca-certificate-validity={{ .Values.certificateRotation.caCertificateValidity }}
            - --probe-timeout={{ .Values.certificateRotation.probeTimeout }}
            - --probe-interval={{ .Values.certificateRotation.probeInterval }}
            - --lease-duration={{ .Values.certificateRotation.leaseDuration }}
            - --lease-acquire-timeout={{ .Values.certificateRotation.leaseAcquireTimeout }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - name: health
              containerPort: {{ .Values.certificateRotation.healthPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.certificateRotation.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
{{- end }}
