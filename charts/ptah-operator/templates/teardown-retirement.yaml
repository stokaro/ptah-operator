{{/*
Helm owns every admission mutation in this uninstall protocol. The manager
binary receives read/probe access and, only in the final phase, exact
ConfigMap deletion. In particular, no Pod credential can create, update,
patch, or delete ValidatingAdmissionPolicy resources.
*/}}
{{- define "ptah-operator.teardownRetirementMarkerShape" -}}
{{- $object := .object -}}
{{- $parts := list
      (printf `%s.metadata.name == %q` $object .name)
      (printf `%s.metadata.namespace == %q` $object .namespace)
      (printf `(!has(%s.metadata.generateName) || %s.metadata.generateName == "")` $object $object)
      (printf `has(%s.metadata.uid) && %s.metadata.uid != ""` $object $object)
      (printf `has(%s.metadata.resourceVersion) && %s.metadata.resourceVersion != ""` $object $object)
      (printf `has(%s.metadata.annotations) && %s.metadata.annotations.size() == 9` $object $object)
      (printf `%s.metadata.annotations[%q] == %q` $object "helm.sh/hook" "pre-delete")
      (printf `%s.metadata.annotations[%q] == %q` $object "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded")
      (printf `%s.metadata.annotations[%q] == %q` $object "helm.sh/hook-weight" "-330")
      (printf `%s.metadata.annotations[%q] == %q` $object "operator.ptah.dev/manager-image" .managerImage)
      (printf `%s.metadata.annotations[%q] == %q` $object "operator.ptah.dev/release-name" .releaseName)
      (printf `%s.metadata.annotations[%q] == %q` $object "operator.ptah.dev/release-namespace" .namespace)
      (printf `%s.metadata.annotations[%q] == %q` $object "operator.ptah.dev/release-sequence" .sequence)
      (printf `%s.metadata.annotations[%q] == %q` $object "operator.ptah.dev/teardown-retirement-attempt" .attempt)
      (printf `%s.metadata.annotations[%q] == %q` $object "operator.ptah.dev/teardown-retirement-version" "1")
      (printf `has(%s.metadata.labels) && %s.metadata.labels.size() == 3` $object $object)
      (printf `%s.metadata.labels[%q] == %q` $object "app.kubernetes.io/managed-by" "ptah-operator")
      (printf `%s.metadata.labels[%q] == %q` $object "app.kubernetes.io/instance" .releaseName)
      (printf `%s.metadata.labels[%q] == %q` $object "app.kubernetes.io/component" "teardown-retirement")
      (printf `has(%s.data) && %s.data.size() == 2` $object $object)
      (printf `%s.data[%q] == %q` $object "release-attempt" .attempt)
      (printf `%s.data[%q] == %q` $object "release-sequence" .sequence)
      (printf `(!has(%s.binaryData) || %s.binaryData.size() == 0)` $object $object)
      (printf `has(%s.immutable) && %s.immutable == true` $object $object)
      (printf `(!has(%s.metadata.ownerReferences) || %s.metadata.ownerReferences.size() == 0)` $object $object)
      (printf `(!has(%s.metadata.finalizers) || %s.metadata.finalizers.size() == 0)` $object $object)
      (printf `!has(%s.metadata.deletionTimestamp)` $object)
      (printf `!has(%s.metadata.deletionGracePeriodSeconds)` $object) -}}
{{- join " && " $parts -}}
{{- end -}}

{{- define "ptah-operator.teardownRetirementPolicy" -}}
{{- $root := .root -}}
{{- $fieldManager := printf "ptah-teardown-v1-%s" (printf "1\n%s\n%s" .name .attempt | sha256sum) -}}
{{- $message := printf "Ptah teardown retirement confirmed exact policy %s with %s" .name $fieldManager -}}
{{- $shape := dict "name" .markerName "namespace" $root.Release.Namespace "releaseName" $root.Release.Name "sequence" .sequence "managerImage" .managerImage "attempt" .attempt -}}
{{- $objectShape := include "ptah-operator.teardownRetirementMarkerShape" (merge (dict "object" "object") $shape) -}}
{{- $oldObjectShape := include "ptah-operator.teardownRetirementMarkerShape" (merge (dict "object" "oldObject") $shape) -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ .name }}
  annotations:
    {{ if not .ordinary }}
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: {{ .weight | quote }}
    helm.sh/hook-delete-policy: {{ .deletePolicy | quote }}
    {{ end }}
    operator.ptah.dev/teardown-retirement-version: "1"
    operator.ptah.dev/teardown-retirement-attempt: {{ .attempt | quote }}
    operator.ptah.dev/teardown-retirement-target: {{ .name | quote }}
    operator.ptah.dev/release-name: {{ $root.Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ $root.Release.Namespace | quote }}
    operator.ptah.dev/release-sequence: {{ .sequence | quote }}
    operator.ptah.dev/manager-image: {{ .managerImage | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: teardown-retirement
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Exact
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - operations: ["UPDATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["configmaps"]
        scope: Namespaced
  matchConditions:
    - name: exact-retirement-probe
      expression: {{ printf `request.operation == "UPDATE" && request.resource.group == "" && request.resource.version == "v1" && request.resource.resource == "configmaps" && (!has(request.subResource) || request.subResource == "") && request.namespace == %q && request.name == %q && has(request.options) && has(request.options.fieldManager) && request.options.fieldManager == %q` $root.Release.Namespace .markerName $fieldManager | quote }}
  validations:
    - expression: {{ printf `request.dryRun == true && oldObject != null && (%s) && (%s) && object.metadata.uid == oldObject.metadata.uid && object.metadata.resourceVersion == oldObject.metadata.resourceVersion` $objectShape $oldObjectShape | quote }}
      message: Ptah teardown retirement probe differs from the exact immutable marker contract
    - expression: "false"
      message: {{ $message | quote }}
{{- end -}}

{{- define "ptah-operator.teardownRetirementBinding" -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ .name }}
  annotations:
    {{ if not .ordinary }}
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: {{ .weight | quote }}
    helm.sh/hook-delete-policy: {{ .deletePolicy | quote }}
    {{ end }}
    operator.ptah.dev/teardown-retirement-version: "1"
    operator.ptah.dev/teardown-retirement-attempt: {{ .attempt | quote }}
    operator.ptah.dev/teardown-retirement-target: {{ .name | quote }}
    operator.ptah.dev/release-name: {{ .root.Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ .root.Release.Namespace | quote }}
    operator.ptah.dev/release-sequence: {{ .sequence | quote }}
    operator.ptah.dev/manager-image: {{ .managerImage | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ .root.Release.Name }}
    app.kubernetes.io/component: teardown-retirement
spec:
  policyName: {{ .name }}
  validationActions: [Deny]
{{- end -}}

{{- define "ptah-operator.teardownRetirementForwardArgs" -}}
{{- $args := printf "%s.args" .container -}}
{{- $mode := printf `%s == %q ? "teardown-retirement-probe-a" : "teardown-retirement-gate"` .selector .probeJob -}}
{{- $timeout := printf `%s == %q ? "--timeout=60s" : "--timeout=90s"` .selector .probeJob -}}
{{- $parts := list
      (printf `has(%[1]s.args) && %[2]s.size() == 29` .container $args)
      (printf `%s[0] == (%s)` $args $mode)
      (printf `%s[1] == (%s)` $args $timeout)
      (printf `%s[2] == %q` $args (printf "--release-name=%s" .releaseName))
      (printf `%s[3] == %q` $args (printf "--release-namespace=%s" .namespace))
      (printf `%s[4].matches("^--coordination-namespace=[a-z0-9]([-a-z0-9]*[a-z0-9])?$")` $args)
      (printf `%s[5].matches("^--leader-election=(true|false)$")` $args)
      (printf `%s[6].matches("^--leader-election-id=[a-z0-9]([-a-z0-9.]*[a-z0-9])?$")` $args)
      (printf `%s[7].matches("^--webhook-service-name=[a-z0-9]([-a-z0-9]*[a-z0-9])?$")` $args)
      (printf `%s[8].matches("^--webhook-timeout-seconds=[1-9][0-9]*$")` $args)
      (printf `%s[9].matches("^--webhook-secret-name=[a-z0-9]([-a-z0-9.]*[a-z0-9])?$")` $args)
      (printf `%s[10].matches("^--webhook-port=[1-9][0-9]*$")` $args)
      (printf `%s[11].matches("^--certificate-health-port=[1-9][0-9]*$")` $args)
      (printf `%s[12].matches("^--hook-service-account-name=[a-z0-9]([-a-z0-9]*[a-z0-9])?-crd-v[1-9][0-9]*-[0-9a-f]{12}$")` $args)
      (printf `%s[13].matches("^--controller-service-account-name=[a-z0-9]([-a-z0-9]*[a-z0-9])?$")` $args)
      (printf `%s[14].matches("^--controller-service-account-managed=(true|false)$")` $args)
      (printf `%s[15].startsWith("--previous-controller-service-account-name=")` $args)
      (printf `%s[16].startsWith("--previous-controller-service-account-uid=")` $args)
      (printf `%s[17].matches("^--previous-controller-service-account-managed=(true|false)$")` $args)
      (printf `%s[18].matches("^--previous-controller-release-sequence=(0|[1-9][0-9]*)$")` $args)
      (printf `%s[19].matches("^--controller-deployment-name=[a-z0-9]([-a-z0-9]*[a-z0-9])?$")` $args)
      (printf `%s[20].matches("^--controller-replicas=[1-9][0-9]*$")` $args)
      (printf `%s[21].matches("^--certificate-deployment-name=[a-z0-9]([-a-z0-9]*[a-z0-9])?$")` $args)
      (printf `%s[22].matches("^--release-sequence=[1-9][0-9]*$")` $args)
      (printf `%s[23] == "--manager-image=" + %s.image` $args .container)
      (printf `%s[24].matches("^--controller-runtime-args-b64=[A-Za-z0-9+/]+={0,2}$")` $args)
      (printf `%s[25].matches("^--certificate-runtime-args-b64=[A-Za-z0-9+/]+={0,2}$")` $args)
      (printf `%s[26].matches("^--runtime-deployment-config-expressions-b64=[A-Za-z0-9+/]+={0,2}$")` $args)
      (printf `%s[27].matches("^--runtime-pod-config-expressions-b64=[A-Za-z0-9+/]+={0,2}$")` $args)
      (printf `%s[28].matches("^--runtime-admission-contract-b64=[A-Za-z0-9+/]+={0,2}$")` $args) -}}
{{- join " && " $parts -}}
{{- end -}}

{{- define "ptah-operator.teardownRetirementFencePolicy" -}}
{{- $root := .root -}}
{{- $sequence := .sequence -}}
{{- $attempt := .attempt -}}
{{- $managerImage := .managerImage -}}
{{- $hookServiceAccount := .hookServiceAccount -}}
{{- $cleanupServiceAccount := .cleanupServiceAccount -}}
{{- $controllerServiceAccount := .controllerServiceAccount -}}
{{- $previousControllerServiceAccount := .previousControllerServiceAccount -}}
{{- $previousSequence := .previousSequence -}}
{{- $controllerDeployment := .controllerDeployment -}}
{{- $certificateServiceAccount := .certificateServiceAccount -}}
{{- $bootstrapServiceAccount := .bootstrapServiceAccount -}}
{{- $quiesceJob := .quiesceJob -}}
{{- $cleanupJob := .cleanupJob -}}
{{- $finalJob := .finalJob -}}
{{- $probeAJob := .probeAJob -}}
{{- $gateJob := .gateJob -}}
{{- $hookSuffix := printf "-crd-v%s-%s" $sequence (trunc 12 $attempt) -}}
{{- $hookBase := trimSuffix $hookSuffix $hookServiceAccount -}}
{{- $hookNamePattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}$" (regexQuoteMeta (printf "%s-crd-v" $hookBase)) -}}
{{- $cleanupNamePattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}$" (regexQuoteMeta (printf "%s-cleanup-v" $hookBase)) -}}
{{- $hookUsernamePattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}$" (regexQuoteMeta (printf "system:serviceaccount:%s:%s-crd-v" $root.Release.Namespace $hookBase)) -}}
{{- $cleanupUsernamePattern := printf "^%s[1-9][0-9]*-[0-9a-f]{12}$" (regexQuoteMeta (printf "system:serviceaccount:%s:%s-cleanup-v" $root.Release.Namespace $hookBase)) -}}
{{- $controllerUsername := printf "system:serviceaccount:%s:%s" $root.Release.Namespace $controllerServiceAccount -}}
{{- $certificateUsername := printf "system:serviceaccount:%s:%s" $root.Release.Namespace $certificateServiceAccount -}}
{{- $bootstrapUsername := printf "system:serviceaccount:%s:%s" $root.Release.Namespace $bootstrapServiceAccount -}}
{{- $hookUsername := printf "system:serviceaccount:%s:%s" $root.Release.Namespace $hookServiceAccount -}}
{{- $cleanupUsername := printf "system:serviceaccount:%s:%s" $root.Release.Namespace $cleanupServiceAccount -}}
{{- $controllerUsernames := list $controllerUsername -}}
{{- $controllerNames := list $controllerServiceAccount -}}
{{- if $previousControllerServiceAccount -}}
{{- $previousUsername := printf "system:serviceaccount:%s:%s" $root.Release.Namespace $previousControllerServiceAccount -}}
{{- $controllerUsernames = append $controllerUsernames $previousUsername -}}
{{- $controllerNames = append $controllerNames $previousControllerServiceAccount -}}
{{- end -}}
{{- $controllerCallerMatch := printf `request.userInfo.username in %s` ($controllerUsernames | toJson) -}}
{{- $controllerNameMatch := printf `request.name in %s` ($controllerNames | toJson) -}}
{{- $markerContext := dict "name" .markerName "namespace" $root.Release.Namespace "releaseName" $root.Release.Name "sequence" $sequence "managerImage" $managerImage "attempt" $attempt -}}
{{- $objectMarkerShape := include "ptah-operator.teardownRetirementMarkerShape" (merge (dict "object" "object") $markerContext) -}}
{{- $oldMarkerShape := include "ptah-operator.teardownRetirementMarkerShape" (merge (dict "object" "oldObject") $markerContext) -}}
{{- $markerRequest := printf `request.operation == "UPDATE" && request.resource.group == "" && request.resource.version == "v1" && request.resource.resource == "configmaps" && (!has(request.subResource) || request.subResource == "") && request.namespace == %q && request.name == %q && has(request.options) && has(request.options.fieldManager) && request.options.fieldManager == %q` $root.Release.Namespace .markerName .fieldManager -}}
{{- $tokenRequest := `request.operation == "CREATE" && request.resource.group == "" && request.resource.version == "v1" && request.resource.resource == "serviceaccounts" && has(request.subResource) && request.subResource == "token"` -}}
{{- $bootstrapJobs := list $probeAJob $gateJob | toJson -}}
{{- $allJobNames := list $quiesceJob $cleanupJob $finalJob $probeAJob $gateJob | toJson -}}
{{- $protectedCaller := printf `request.userInfo.username == %q` $bootstrapUsername -}}
{{- $protectedToken := printf `(%s) && request.namespace == %q && request.name == %q` $tokenRequest $root.Release.Namespace $bootstrapServiceAccount -}}
{{- $protectedJobNames := $bootstrapJobs -}}
{{- if not .ordinary -}}
{{- $protectedCaller = printf `(%s) || request.userInfo.username == %q || request.userInfo.username == %q || request.userInfo.username.matches(%q) || request.userInfo.username.matches(%q)` $controllerCallerMatch $certificateUsername $bootstrapUsername $hookUsernamePattern $cleanupUsernamePattern -}}
{{- $protectedToken = printf `(%s) && request.namespace == %q && ((%s) || request.name == %q || request.name == %q || request.name.matches(%q) || request.name.matches(%q))` $tokenRequest $root.Release.Namespace $controllerNameMatch $certificateServiceAccount $bootstrapServiceAccount $hookNamePattern $cleanupNamePattern -}}
{{- $protectedJobNames = $allJobNames -}}
{{- end -}}
{{- $protectedJobMain := printf `request.resource.group == "batch" && request.resource.version == "v1" && request.resource.resource == "jobs" && (!has(request.subResource) || request.subResource == "") && request.namespace == %q` $root.Release.Namespace -}}
{{- $protectedJob := printf `%s && request.name in %s && request.operation in ["CREATE", "UPDATE"]` $protectedJobMain $protectedJobNames -}}
{{- $protectedJobDelete := printf `%s && request.operation == "DELETE" && oldObject != null && oldObject.metadata.name in %s` $protectedJobMain $protectedJobNames -}}
{{- $protectedJobStatus := printf `request.resource.group == "batch" && request.resource.version == "v1" && request.resource.resource == "jobs" && has(request.subResource) && request.subResource == "status" && request.namespace == %q && request.operation == "UPDATE" && oldObject != null && oldObject.metadata.name in %s` $root.Release.Namespace $protectedJobNames -}}
{{- $quiescePodPrefix := printf "%s-" $quiesceJob | trunc 58 -}}
{{- $cleanupPodPrefix := printf "%s-" $cleanupJob | trunc 58 -}}
{{- $finalPodPrefix := printf "%s-" $finalJob | trunc 58 -}}
{{- $probeAPodPrefix := printf "%s-" $probeAJob | trunc 58 -}}
{{- $gatePodPrefix := printf "%s-" $gateJob | trunc 58 -}}
{{- $quiescePod := printf `(%[1]s.startsWith(%[2]q) && %[1]s.size() == %[3]d && %[1]s.substring(%[4]d).matches("^[a-z0-9]{5}$"))` "request.name" $quiescePodPrefix (add (len $quiescePodPrefix) 5) (len $quiescePodPrefix) -}}
{{- $cleanupPod := printf `(%[1]s.startsWith(%[2]q) && %[1]s.size() == %[3]d && %[1]s.substring(%[4]d).matches("^[a-z0-9]{5}$"))` "request.name" $cleanupPodPrefix (add (len $cleanupPodPrefix) 5) (len $cleanupPodPrefix) -}}
{{- $finalPod := printf `(%[1]s.startsWith(%[2]q) && %[1]s.size() == %[3]d && %[1]s.substring(%[4]d).matches("^[a-z0-9]{5}$"))` "request.name" $finalPodPrefix (add (len $finalPodPrefix) 5) (len $finalPodPrefix) -}}
{{- $probeAPod := printf `(%[1]s.startsWith(%[2]q) && %[1]s.size() == %[3]d && %[1]s.substring(%[4]d).matches("^[a-z0-9]{5}$"))` "request.name" $probeAPodPrefix (add (len $probeAPodPrefix) 5) (len $probeAPodPrefix) -}}
{{- $gatePod := printf `(%[1]s.startsWith(%[2]q) && %[1]s.size() == %[3]d && %[1]s.substring(%[4]d).matches("^[a-z0-9]{5}$"))` "request.name" $gatePodPrefix (add (len $gatePodPrefix) 5) (len $gatePodPrefix) -}}
{{- $podNames := printf `%s || %s` $probeAPod $gatePod -}}
{{- if not .ordinary -}}
{{- $podNames = printf `%s || %s || %s || %s || %s` $quiescePod $cleanupPod $finalPod $probeAPod $gatePod -}}
{{- end -}}
{{- $oldPodNames := replace "request.name" "oldObject.metadata.name" $podNames -}}
{{- $protectedPodWrite := printf `request.resource.group == "" && request.resource.version == "v1" && request.resource.resource == "pods" && (!has(request.subResource) || request.subResource == "") && request.namespace == %q && (%s) && request.operation in ["CREATE", "UPDATE"]` $root.Release.Namespace $podNames -}}
{{- $protectedPodDelete := printf `request.resource.group == "" && request.resource.version == "v1" && request.resource.resource == "pods" && (!has(request.subResource) || request.subResource == "") && request.namespace == %q && request.operation == "DELETE" && oldObject != null && (%s)` $root.Release.Namespace $oldPodNames -}}
{{- $protectedPodStatus := printf `request.resource.group == "" && request.resource.version == "v1" && request.resource.resource == "pods" && has(request.subResource) && request.subResource == "status" && request.namespace == %q && request.operation == "UPDATE" && oldObject != null && (%s)` $root.Release.Namespace $oldPodNames -}}
{{- $dangerousPodSubresource := printf `request.resource.group == "" && request.resource.version == "v1" && request.resource.resource == "pods" && has(request.subResource) && request.subResource in ["exec", "attach", "portforward", "proxy", "ephemeralcontainers", "resize"] && request.namespace == %q && (%s)` $root.Release.Namespace $podNames -}}
{{- $retainedMarkers := list
      "ptah-operator-release-activation"
      (include "ptah-operator.admissionConvergenceMarkerName" $root)
      (printf "ptah-operator-parent-origin-ready-v2-%s" (printf "%s\n%s" $root.Release.Namespace $root.Release.Name | sha256sum | trunc 12)) -}}
{{- if gt (atoi $previousSequence) 0 -}}
{{- $retainedMarkers = append $retainedMarkers (printf "ptah-admission-convergence-v1-%s-%s" $previousSequence (printf "%s\n%s" $root.Release.Namespace $root.Release.Name | sha256sum | trunc 12)) -}}
{{- end -}}
{{- $protectedRetainedMarkerDelete := printf `request.operation == "DELETE" && request.resource.group == "" && request.resource.version == "v1" && request.resource.resource == "configmaps" && (!has(request.subResource) || request.subResource == "") && request.namespace == %q && oldObject != null && oldObject.metadata.name in %s` $root.Release.Namespace ($retainedMarkers | toJson) -}}
{{- $match := printf `(%s) || (%s) || (%s) || (%s) || (%s) || (%s) || (%s) || (%s) || (%s)` $protectedCaller $protectedToken $protectedJob $protectedJobDelete $protectedJobStatus $protectedPodWrite $protectedPodDelete $protectedPodStatus $dangerousPodSubresource -}}
{{- if not .ordinary -}}
{{- $match = printf `(%s) || (%s) || (%s) || (%s) || (%s) || (%s) || (%s) || (%s) || (%s) || (%s) || (%s)` $markerRequest $protectedRetainedMarkerDelete $protectedCaller $protectedToken $protectedJob $protectedJobDelete $protectedJobStatus $protectedPodWrite $protectedPodDelete $protectedPodStatus $dangerousPodSubresource -}}
{{- end -}}
{{- $callerPodName := printf `has(request.userInfo.extra) && %q in request.userInfo.extra && request.userInfo.extra[%q].size() == 1 ? request.userInfo.extra[%q][0] : ""` "authentication.kubernetes.io/pod-name" "authentication.kubernetes.io/pod-name" "authentication.kubernetes.io/pod-name" -}}
{{- $callerPodUID := printf `has(request.userInfo.extra) && %q in request.userInfo.extra && request.userInfo.extra[%q].size() == 1 ? request.userInfo.extra[%q][0] : ""` "authentication.kubernetes.io/pod-uid" "authentication.kubernetes.io/pod-uid" "authentication.kubernetes.io/pod-uid" -}}
{{- $quiesceCallerPod := replace "request.name" "variables.callerPodName" $quiescePod -}}
{{- $cleanupCallerPod := replace "request.name" "variables.callerPodName" $cleanupPod -}}
{{- $finalCallerPod := replace "request.name" "variables.callerPodName" $finalPod -}}
{{- $probeACallerPod := replace "request.name" "variables.callerPodName" $probeAPod -}}
{{- $gateCallerPod := replace "request.name" "variables.callerPodName" $gatePod -}}
{{- $quiesceBoundPod := replace "request.name" "object.spec.boundObjectRef.name" $quiescePod -}}
{{- $cleanupBoundPod := replace "request.name" "object.spec.boundObjectRef.name" $cleanupPod -}}
{{- $finalBoundPod := replace "request.name" "object.spec.boundObjectRef.name" $finalPod -}}
{{- $probeABoundPod := replace "request.name" "object.spec.boundObjectRef.name" $probeAPod -}}
{{- $gateBoundPod := replace "request.name" "object.spec.boundObjectRef.name" $gatePod -}}
{{- $finalArgs := include "ptah-operator.crdManagerArgsJSON" (dict "root" $root "mode" "teardown-retirement-final" "timeout" "240s" "verifyControllerState" false) | fromJsonArray -}}
{{- $probeAArgs := include "ptah-operator.crdManagerArgsJSON" (dict "root" $root "mode" "teardown-retirement-probe-a" "timeout" "60s" "verifyControllerState" false) | fromJsonArray -}}
{{- $gateArgs := include "ptah-operator.crdManagerArgsJSON" (dict "root" $root "mode" "teardown-retirement-gate" "timeout" "90s" "verifyControllerState" false) | fromJsonArray -}}
{{- $finalArgs = without $finalArgs "--verify-certificate-recovery=true" -}}
{{- $probeAArgs = without $probeAArgs "--verify-certificate-recovery=true" -}}
{{- $gateArgs = without $gateArgs "--verify-certificate-recovery=true" -}}
{{- $quiesceArgs := include "ptah-operator.crdManagerArgsJSON" (dict "root" $root "mode" "teardown-quiesce" "timeout" "180s" "verifyControllerState" false) | fromJsonArray -}}
{{- $cleanupArgs := include "ptah-operator.crdManagerArgsJSON" (dict "root" $root "mode" "teardown" "timeout" "180s" "verifyControllerState" false) | fromJsonArray -}}
{{- $quiesceArgs = without $quiesceArgs "--verify-certificate-recovery=true" -}}
