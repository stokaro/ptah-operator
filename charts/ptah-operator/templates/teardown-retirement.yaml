      $podGateArgsValidation
      $podNoSideChannels
      (printf `has(%[1]s.securityContext) && has(%[1]s.securityContext.allowPrivilegeEscalation) && !%[1]s.securityContext.allowPrivilegeEscalation && has(%[1]s.securityContext.readOnlyRootFilesystem) && %[1]s.securityContext.readOnlyRootFilesystem && (!has(%[1]s.securityContext.privileged) || !%[1]s.securityContext.privileged) && !has(%[1]s.securityContext.runAsUser) && !has(%[1]s.securityContext.runAsGroup) && !has(%[1]s.securityContext.runAsNonRoot) && !has(%[1]s.securityContext.procMount) && has(%[1]s.securityContext.capabilities) && (!has(%[1]s.securityContext.capabilities.add) || %[1]s.securityContext.capabilities.add.size() == 0) && has(%[1]s.securityContext.capabilities.drop) && %[1]s.securityContext.capabilities.drop == ["ALL"]` $podContainer)
      (printf `has(%[1]s.volumeMounts) && %[1]s.volumeMounts.size() == 1 && %[1]s.volumeMounts[0].name == "api-access" && %[1]s.volumeMounts[0].mountPath == "/var/run/secrets/kubernetes.io/serviceaccount" && has(%[1]s.volumeMounts[0].readOnly) && %[1]s.volumeMounts[0].readOnly` $podContainer)
      (printf `has(%[1]s.volumes) && %[1]s.volumes.size() == 1 && %[2]s.name == "api-access" && has(%[2]s.projected) && has(%[2]s.projected.defaultMode) && %[2]s.projected.defaultMode == 420 && %[3]s.size() == 3 && %[3]s.exists(s, has(s.serviceAccountToken) && s.serviceAccountToken.path == "token" && has(s.serviceAccountToken.expirationSeconds) && s.serviceAccountToken.expirationSeconds == 3600 && !has(s.serviceAccountToken.audience)) && %[3]s.exists(s, has(s.configMap) && s.configMap.name == "kube-root-ca.crt") && %[3]s.exists(s, has(s.downwardAPI))` $podSpec $podVolume $podSources) -}}
{{- $podStatusFields := list "observedGeneration" "phase" "conditions" "message" "reason" "nominatedNodeName" "hostIP" "hostIPs" "podIP" "podIPs" "startTime" "initContainerStatuses" "containerStatuses" "qosClass" "ephemeralContainerStatuses" "resize" "resourceClaimStatuses" "extendedResourceClaimStatus" "allocatedResources" "resources" "nodeAllocatableResourceClaimStatuses" -}}
{{- $schedulerStatusParts := list -}}
{{- range $field := $podStatusFields -}}
{{- if ne $field "nominatedNodeName" -}}
{{- $schedulerStatusParts = append $schedulerStatusParts (printf `((!has(dyn(object.status).%[1]s) && !has(dyn(oldObject.status).%[1]s)) || (has(dyn(object.status).%[1]s) && has(dyn(oldObject.status).%[1]s) && dyn(object.status).%[1]s == dyn(oldObject.status).%[1]s))` $field) -}}
{{- end -}}
{{- end -}}
{{- $schedulerStatusDelta := join " && " $schedulerStatusParts -}}
{{- $podStatusValidations := list (printf `(%s) || ((%s) && (%s))` $nodePrincipal $schedulerPrincipal $schedulerStatusDelta) $statusIdentity -}}
{{- range $expression := rest $podValidations -}}
{{- $podStatusValidations = append $podStatusValidations (replace "object." "oldObject." $expression) -}}
{{- end -}}
{{- $oldPodJobLabel := `oldObject.metadata.labels["batch.kubernetes.io/job-name"]` -}}
{{- $oldPodOwner := "oldObject.metadata.ownerReferences[0]" -}}
{{- $podDeletionValidations := list
      `oldObject != null && (!has(request.subResource) || request.subResource == "")`
      (printf `has(oldObject.metadata.labels) && "batch.kubernetes.io/job-name" in oldObject.metadata.labels && %s in %s` $oldPodJobLabel $allJobNames)
      (printf `has(oldObject.metadata.ownerReferences) && oldObject.metadata.ownerReferences.size() == 1 && %[1]s.apiVersion == "batch/v1" && %[1]s.kind == "Job" && %[1]s.name == %[2]s && has(%[1]s.uid) && %[1]s.uid != "" && has(%[1]s.controller) && %[1]s.controller && has(%[1]s.blockOwnerDeletion) && %[1]s.blockOwnerDeletion` $oldPodOwner $oldPodJobLabel)
      (printf `has(oldObject.spec.serviceAccountName) && oldObject.spec.serviceAccountName == (%[1]s in %[2]s ? %[3]q : (%[1]s == %[4]q ? %[5]q : %[6]q))` $oldPodJobLabel $bootstrapJobs $bootstrapServiceAccount $quiesceJob $hookServiceAccount $cleanupServiceAccount) -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ .name }}
  annotations:
    {{ if not .ordinary }}
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: {{ .weight | quote }}
    helm.sh/hook-delete-policy: before-hook-creation
    {{ end }}
    operator.ptah.dev/teardown-retirement-version: "1"
    operator.ptah.dev/teardown-retirement-attempt: {{ $attempt | quote }}
    operator.ptah.dev/teardown-retirement-target: {{ .name | quote }}
    operator.ptah.dev/release-name: {{ $root.Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ $root.Release.Namespace | quote }}
    operator.ptah.dev/release-sequence: {{ $sequence | quote }}
    operator.ptah.dev/manager-image: {{ $managerImage | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: teardown-retirement
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Exact
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - operations: ["CREATE", "UPDATE", "DELETE", "CONNECT"]
        apiGroups: ["*"]
        apiVersions: ["*"]
        resources: ["*/*"]
        scope: "*"
  matchConditions:
    - name: teardown-probe-or-protected-identity
      expression: {{ $match | quote }}
  variables:
    - name: isMarkerProbe
      expression: {{ $markerRequest | quote }}
    - name: isControllerCaller
      expression: {{ $controllerCallerMatch | quote }}
    - name: isCertificateCaller
      expression: {{ printf `request.userInfo.username == %q` $certificateUsername | quote }}
    - name: isBootstrapCaller
      expression: {{ printf `request.userInfo.username == %q` $bootstrapUsername | quote }}
    - name: isHookCaller
      expression: {{ printf `request.userInfo.username.matches(%q)` $hookUsernamePattern | quote }}
    - name: isCleanupCaller
      expression: {{ printf `request.userInfo.username.matches(%q)` $cleanupUsernamePattern | quote }}
    - name: isControllerTokenRequest
      expression: {{ printf `(%s) && (%s)` $tokenRequest $controllerNameMatch | quote }}
    - name: isCertificateTokenRequest
      expression: {{ printf `(%s) && request.name == %q` $tokenRequest $certificateServiceAccount | quote }}
    - name: isBootstrapTokenRequest
      expression: {{ printf `(%s) && request.name == %q` $tokenRequest $bootstrapServiceAccount | quote }}
    - name: isHookTokenRequest
      expression: {{ printf `(%s) && request.name.matches(%q)` $tokenRequest $hookNamePattern | quote }}
    - name: isCleanupTokenRequest
      expression: {{ printf `(%s) && request.name.matches(%q)` $tokenRequest $cleanupNamePattern | quote }}
    - name: callerPodName
      expression: {{ $callerPodName | quote }}
    - name: callerPodUID
      expression: {{ $callerPodUID | quote }}
    - name: boundPod
      expression: 'request.userInfo.username.matches("^system:node:.+$") && request.userInfo.groups.size() == 2 && "system:nodes" in request.userInfo.groups && "system:authenticated" in request.userInfo.groups && has(object.spec.boundObjectRef) && has(object.spec.boundObjectRef.apiVersion) && object.spec.boundObjectRef.apiVersion == "v1" && has(object.spec.boundObjectRef.kind) && object.spec.boundObjectRef.kind == "Pod" && has(object.spec.boundObjectRef.name) && object.spec.boundObjectRef.name != "" && has(object.spec.boundObjectRef.uid) && object.spec.boundObjectRef.uid != ""'
    - name: isProtectedJob
      expression: {{ $protectedJob | quote }}
    - name: isProtectedJobDelete
      expression: {{ $protectedJobDelete | quote }}
    - name: isProtectedJobStatus
      expression: {{ $protectedJobStatus | quote }}
    - name: isProtectedPodWrite
      expression: {{ $protectedPodWrite | quote }}
    - name: isProtectedPodDelete
      expression: {{ $protectedPodDelete | quote }}
    - name: isProtectedPodStatus
      expression: {{ $protectedPodStatus | quote }}
    - name: isDangerousPodSubresource
      expression: {{ $dangerousPodSubresource | quote }}
    - name: isProtectedRetainedMarkerDelete
      expression: {{ $protectedRetainedMarkerDelete | quote }}
  validations:
    - expression: {{ printf `!variables.isMarkerProbe || (request.dryRun == true && oldObject != null && (%s) && (%s) && object.metadata.uid == oldObject.metadata.uid && object.metadata.resourceVersion == oldObject.metadata.resourceVersion)` $objectMarkerShape $oldMarkerShape | quote }}
      message: Ptah teardown retirement probe differs from the exact immutable marker contract
    - expression: '!variables.isMarkerProbe || (false)'
      message: {{ printf "Ptah teardown retirement confirmed exact policy %s with %s" .name .fieldManager | quote }}
    - expression: variables.isMarkerProbe || !variables.isControllerCaller
      message: Ptah teardown fence rejected a controller caller after uninstall fencing
    - expression: variables.isMarkerProbe || !variables.isCertificateCaller
      message: Ptah teardown fence rejected a certificate caller after uninstall fencing
    - expression: {{ printf `variables.isMarkerProbe || !variables.isBootstrapCaller || (request.userInfo.username == %q && variables.callerPodName != "" && variables.callerPodUID != "" && ((%s) || (%s)))` $bootstrapUsername $probeACallerPod $gateCallerPod | quote }}
      message: Ptah teardown fence rejected a bootstrap caller outside the exact probe or gate Pod
    - expression: {{ printf `variables.isMarkerProbe || !variables.isHookCaller || (request.userInfo.username == %q && variables.callerPodName != "" && variables.callerPodUID != "" && (%s))` $hookUsername $quiesceCallerPod | quote }}
      message: Ptah teardown fence rejected a hook caller outside the exact quiesce Pod
    - expression: {{ printf `variables.isMarkerProbe || !variables.isCleanupCaller || (request.userInfo.username == %q && variables.callerPodName != "" && variables.callerPodUID != "" && ((%s) || (%s)))` $cleanupUsername $cleanupCallerPod $finalCallerPod | quote }}
      message: Ptah teardown fence rejected a cleanup caller outside the exact cleanup or final Pod
    - expression: variables.isMarkerProbe || !variables.isControllerTokenRequest
      message: Ptah teardown fence rejected a controller TokenRequest after uninstall fencing
    - expression: variables.isMarkerProbe || !variables.isCertificateTokenRequest
      message: Ptah teardown fence rejected a certificate TokenRequest after uninstall fencing
    - expression: {{ printf `variables.isMarkerProbe || !variables.isBootstrapTokenRequest || (request.name == %q && variables.boundPod && ((%s) || (%s)))` $bootstrapServiceAccount $probeABoundPod $gateBoundPod | quote }}
      message: Ptah teardown fence rejected a bootstrap TokenRequest outside the exact probe or gate Pod
    - expression: {{ printf `variables.isMarkerProbe || !variables.isHookTokenRequest || (request.name == %q && variables.boundPod && (%s))` $hookServiceAccount $quiesceBoundPod | quote }}
      message: Ptah teardown fence rejected a hook TokenRequest outside the exact quiesce Pod
    - expression: {{ printf `variables.isMarkerProbe || !variables.isCleanupTokenRequest || (request.name == %q && variables.boundPod && ((%s) || (%s)))` $cleanupServiceAccount $cleanupBoundPod $finalBoundPod | quote }}
      message: Ptah teardown fence rejected a cleanup TokenRequest outside the exact cleanup or final Pod
    - expression: '!variables.isDangerousPodSubresource'
      message: Ptah teardown fence rejects interactive and mutable Pod subresources
    - expression: {{ printf `!variables.isProtectedRetainedMarkerDelete || (variables.isCleanupCaller && variables.callerPodName != "" && variables.callerPodUID != "" && (%s))` $finalCallerPod | quote }}
      message: Ptah teardown fence rejected retained marker deletion outside the exact final Pod
    {{- if .ordinary }}
    - expression: {{ printf `!variables.isProtectedJob || (%s)` $helmAuthorizer | quote }}
      message: Ptah teardown bootstrap Job requires cluster admission-management authority
    {{- end }}
    {{- range $expression := $jobValidations }}
    - expression: {{ printf `!variables.isProtectedJob || (%s)` $expression | quote }}
      message: Ptah teardown fence rejected a Job outside the exact uninstall contract
    {{- end }}
    {{- range $expression := $jobStatusValidations }}
    - expression: {{ printf `!variables.isProtectedJobStatus || (%s)` $expression | quote }}
      message: Ptah teardown fence rejected forged Job completion
    {{- end }}
    - expression: {{ printf `!variables.isProtectedJobDelete || (%s)` $helmAuthorizer | quote }}
      message: Ptah teardown Job deletion requires cluster admission-management authority
    {{- range $expression := $jobDeletionValidations }}
    - expression: {{ printf `!variables.isProtectedJobDelete || (%s)` $expression | quote }}
      message: Ptah teardown fence rejected deletion of a nonterminal or foreign Job
    {{- end }}
    {{- range $expression := $podValidations }}
    - expression: {{ printf `!variables.isProtectedPodWrite || (%s)` $expression | quote }}
      message: Ptah teardown fence rejected a Pod outside the exact uninstall contract
    {{- end }}
    {{- range $expression := $podStatusValidations }}
    - expression: {{ printf `!variables.isProtectedPodStatus || (%s)` $expression | quote }}
      message: Ptah teardown fence rejected forged Pod completion
    {{- end }}
    {{- range $expression := $podDeletionValidations }}
    - expression: {{ printf `!variables.isProtectedPodDelete || (%s)` $expression | quote }}
      message: Ptah teardown fence rejected deletion of a foreign uninstall Pod
    {{- end }}
{{- end -}}

{{- $sequence := include "ptah-operator.releaseSequence" . -}}
{{- if ne $sequence "1" -}}
{{- fail (printf "teardown retirement sequence %s has no explicit append-only predecessor inventory" $sequence) -}}
{{- end -}}
{{- $managerImage := include "ptah-operator.managerImage" . -}}
{{- $attempt := printf "%s\n%s\n%s\n%s" .Release.Namespace .Release.Name $sequence $managerImage | sha256sum -}}
{{- $attempt12 := trunc 12 $attempt -}}
{{- $markerName := printf "ptah-teardown-probe-v1-%s-%s" $sequence $attempt12 -}}
{{- $fenceDigest := printf "1\n%s\n%s" .Release.Namespace .Release.Name | sha256sum | trunc 12 -}}
{{- $fenceA := printf "ptah-operator-teardown-fence-a-v1-%s" $fenceDigest -}}
{{- $fenceB := printf "ptah-operator-teardown-fence-b-v1-%s" $fenceDigest -}}
{{- $bootstrapName := printf "ptah-teardown-bootstrap-v1-%s" $fenceDigest -}}
{{- $probeAJob := printf "ptah-teardown-probe-a-v1-%s" $fenceDigest -}}
{{- $jointGateJob := printf "ptah-teardown-gate-v1-%s" $fenceDigest -}}
{{- $hookServiceAccount := include "ptah-operator.crdManagerServiceAccountName" . -}}
{{- $cleanupServiceAccount := include "ptah-operator.teardownServiceAccountName" . -}}
{{- $hookSuffix := printf "-crd-v%s-%s" $sequence $attempt12 -}}
{{- if not (hasSuffix $hookSuffix $hookServiceAccount) -}}
{{- fail "teardown retirement hook ServiceAccount differs from the exact attempt identity" -}}
{{- end -}}
{{- $hookBase := trimSuffix $hookSuffix $hookServiceAccount -}}
{{- $finalJob := printf "%s-retire-v%s-%s" $hookBase $sequence $attempt12 -}}
{{- if gt (len $finalJob) 63 -}}
{{- fail "teardown retirement final Job name exceeds the Kubernetes DNS label limit" -}}
{{- end -}}
{{- $controllerName := include "ptah-operator.fullname" . -}}
{{- $controllerServiceAccount := include "ptah-operator.serviceAccountName" . -}}
{{- $previousControllerServiceAccount := include "ptah-operator.previousControllerServiceAccountName" . -}}
{{- $previousSequence := include "ptah-operator.previousControllerReleaseSequence" . -}}
{{- $certificateName := include "ptah-operator.certRotatorServiceAccountName" . -}}
{{- $quiesceJob := include "ptah-operator.teardownQuiesceJobName" . -}}
{{- $cleanupJob := $cleanupServiceAccount -}}
{{- $markerContext := dict "name" $markerName "namespace" .Release.Namespace "releaseName" .Release.Name "sequence" $sequence "managerImage" $managerImage "attempt" $attempt -}}
{{- $objectMarkerShape := include "ptah-operator.teardownRetirementMarkerShape" (merge (dict "object" "object") $markerContext) -}}
{{- $oldMarkerShape := include "ptah-operator.teardownRetirementMarkerShape" (merge (dict "object" "oldObject") $markerContext) -}}
{{- $fenceAFieldManager := printf "ptah-teardown-v1-%s" (printf "1\n%s\n%s" $fenceA $attempt | sha256sum) -}}
{{- $fenceBFieldManager := printf "ptah-teardown-v1-%s" (printf "1\n%s\n%s" $fenceB $attempt | sha256sum) -}}
{{- $legacyDigest := printf "%s\n%s" .Release.Namespace .Release.Name | sha256sum | trunc 12 -}}
{{- $guardNames := list
      (include "ptah-operator.releaseActivationGuardPolicyName" .)
      (include "ptah-operator.rolloutGuardPolicyName" .)
      (include "ptah-operator.runtimeGuardPolicyName" .)
      (include "ptah-operator.runtimePodGuardPolicyName" .)
      (include "ptah-operator.hookIdentityGuardPolicyName" .)
      (include "ptah-operator.hookIdentityProbeGuardPolicyName" .)
      (include "ptah-operator.parentReplicaSetGuardPolicyName" .)
      (include "ptah-operator.parentHookJobOriginGuardPolicyName" .)
      (include "ptah-operator.parentHookPodOriginGuardPolicyName" .)
      (include "ptah-operator.parentHookJobContractPolicyName" .)
      (printf "ptah-operator-hook-parent-origin-guard-v1-%s" $legacyDigest)
      (printf "ptah-operator-hook-pod-origin-guard-v1-%s" $legacyDigest)
      (printf "ptah-operator-service-account-object-guard-v1-%s" $legacyDigest)
      (include "ptah-operator.serviceAccountOriginGuardPolicyName" .)
      (include "ptah-operator.controllerWriteGuardPolicyName" .)
      (include "ptah-operator.controllerJobWriteGuardPolicyName" .)
      (include "ptah-operator.controllerChunkWriteGuardPolicyName" .)
      (include "ptah-operator.controllerPlanWriteGuardPolicyName" .)
      (printf "ptah-operator-controller-write-guard-v1-%s" $legacyDigest)
      (printf "ptah-operator-job-write-guard-v1-%s" $legacyDigest)
      (printf "ptah-operator-chunk-write-guard-v1-%s" $legacyDigest)
      (printf "ptah-operator-plan-write-guard-v1-%s" $legacyDigest)
      (printf "ptah-operator-service-account-origin-guard-v1-%s" $legacyDigest)
      (printf "ptah-operator-runtime-parent-guard-v1-%s" $legacyDigest)
      (include "ptah-operator.certificateMutatingWriteGuardPolicyName" .)
      (include "ptah-operator.certificateValidatingWriteGuardPolicyName" .)
      (include "ptah-operator.namespaceDeletionGuardPolicyName" .)
      (include "ptah-operator.admissionConvergencePolicyName" .) -}}
{{- $certificateRecoveryEnabled := and .Values.certificateRotation.enabled (not .Values.webhook.existingSecret) .Values.certificateRotation.recreateMissingSecret -}}
{{- if $certificateRecoveryEnabled -}}
{{- $guardNames = append $guardNames $certificateName -}}
{{- end -}}
{{- $guardNames = $guardNames | uniq | sortAlpha -}}
{{- if gt (len $guardNames) 45 -}}
{{- fail (printf "teardown retirement inventory of %d pairs exceeds hook weights 10..99" (len $guardNames)) -}}
{{- end -}}
{{- $fenceContext := dict
      "root" .
      "sequence" $sequence
      "attempt" $attempt
      "managerImage" $managerImage
      "markerName" $markerName
      "hookServiceAccount" $hookServiceAccount
      "cleanupServiceAccount" $cleanupServiceAccount
      "controllerServiceAccount" $controllerServiceAccount
      "previousControllerServiceAccount" $previousControllerServiceAccount
      "previousSequence" $previousSequence
      "controllerDeployment" $controllerName
      "certificateServiceAccount" $certificateName
      "bootstrapServiceAccount" $bootstrapName
      "quiesceJob" $quiesceJob
      "cleanupJob" $cleanupJob
      "finalJob" $finalJob
      "probeAJob" $probeAJob
      "gateJob" $jointGateJob -}}

{{/*
The stable A/B identities are ordinary release resources that protect only the
bootstrap credential and proof Job/Pod boundary. They do not match runtime
callers or the marker probe. Pre-delete replaces these anchors with the broad
static fence forms below; deleteRelease consequently owns their final removal
without a non-retriable post-delete hook.
*/}}
{{ include "ptah-operator.teardownRetirementFencePolicy" (merge (dict "name" $fenceA "ordinary" true "fieldManager" $fenceAFieldManager) $fenceContext) }}
---
{{ include "ptah-operator.teardownRetirementBinding" (dict "root" . "name" $fenceA "ordinary" true "attempt" $attempt "sequence" $sequence "managerImage" $managerImage) }}
---
{{ include "ptah-operator.teardownRetirementFencePolicy" (merge (dict "name" $fenceB "ordinary" true "fieldManager" $fenceBFieldManager) $fenceContext) }}
---
{{ include "ptah-operator.teardownRetirementBinding" (dict "root" . "name" $fenceB "ordinary" true "attempt" $attempt "sequence" $sequence "managerImage" $managerImage) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $markerName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-330"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    operator.ptah.dev/teardown-retirement-version: "1"
    operator.ptah.dev/teardown-retirement-attempt: {{ $attempt | quote }}
    operator.ptah.dev/release-name: {{ .Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ .Release.Namespace | quote }}
    operator.ptah.dev/release-sequence: {{ $sequence | quote }}
    operator.ptah.dev/manager-image: {{ $managerImage | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: teardown-retirement
immutable: true
data:
  release-attempt: {{ $attempt | quote }}
  release-sequence: {{ $sequence | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-327"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: teardown-retirement-bootstrap
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-326"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: teardown-retirement-bootstrap
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $markerName | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $bootstrapName }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-326"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: teardown-retirement-bootstrap
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-325"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: teardown-retirement-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $bootstrapName }}
subjects:
  - kind: ServiceAccount
    name: {{ $bootstrapName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $bootstrapName }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-324"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: teardown-retirement-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $bootstrapName }}
subjects:
  - kind: ServiceAccount
    name: {{ $bootstrapName }}
    namespace: {{ .Release.Namespace }}
---
{{ include "ptah-operator.teardownRetirementFencePolicy" (merge (dict "name" $fenceA "weight" "-329" "fieldManager" $fenceAFieldManager) $fenceContext) }}
---
{{ include "ptah-operator.teardownRetirementBinding" (dict "root" . "name" $fenceA "weight" "-328" "deletePolicy" "before-hook-creation" "attempt" $attempt "sequence" $sequence "managerImage" $managerImage) }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $probeAJob }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-315"
