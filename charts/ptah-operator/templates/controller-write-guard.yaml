{{- $guardName := include "ptah-operator.controllerWriteGuardPolicyName" . -}}
{{- $controllerUsername := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "ptah-operator.serviceAccountName" .) -}}
{{- $policy := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicy" "" $guardName -}}
{{- $binding := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicyBinding" "" $guardName -}}
{{- range $entry := list
      (dict "kind" "ValidatingAdmissionPolicy" "object" $policy)
      (dict "kind" "ValidatingAdmissionPolicyBinding" "object" $binding) -}}
{{- with $entry.object -}}
{{- $annotations := default (dict) .metadata.annotations -}}
{{- $labels := default (dict) .metadata.labels -}}
{{- if or
      (ne (default "" (index $annotations "operator.ptah.dev/rollout-guard-version")) "1")
      (ne (default "" (index $annotations "operator.ptah.dev/release-name")) $.Release.Name)
      (ne (default "" (index $annotations "operator.ptah.dev/release-namespace")) $.Release.Namespace)
      (ne (default "" (index $labels "app.kubernetes.io/managed-by")) "ptah-operator")
      (ne (default "" (index $labels "app.kubernetes.io/instance")) $.Release.Name)
      (ne (default "" (index $labels "app.kubernetes.io/component")) "controller-write-guard") -}}
{{- fail (printf "retained %s %s has foreign or incomplete controller-write ownership" $entry.kind $guardName) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not $policy }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $guardName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-158"
    helm.sh/resource-policy: keep
    operator.ptah.dev/rollout-guard-version: "1"
    operator.ptah.dev/release-name: {{ .Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: controller-write-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Exact
    resourceRules:
      - apiGroups: ["operator.ptah.dev"]
        apiVersions: ["v1alpha1"]
        operations: ["UPDATE"]
        resources: ["ptahschemas"]
        scope: Namespaced
  matchConditions:
    - name: exact-controller-service-account
      expression: {{ printf `request.userInfo.username == %q` $controllerUsername | quote }}
  variables:
    - name: oldFinalizers
      expression: 'has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : []'
    - name: newFinalizers
      expression: 'has(object.metadata.finalizers) ? object.metadata.finalizers : []'
    - name: activeFinalizer
      expression: '"operator.ptah.dev/active-operation"'
    - name: oldActiveCount
      expression: 'variables.oldFinalizers.filter(value, value == variables.activeFinalizer).size()'
    - name: newActiveCount
      expression: 'variables.newFinalizers.filter(value, value == variables.activeFinalizer).size()'
  validations:
    - expression: 'object.spec == oldObject.spec'
      message: "Ptah controller write guard rejected a desired-state mutation"
    - expression: 'has(object.status) == has(oldObject.status) && (!has(object.status) || object.status == oldObject.status)'
      message: "Ptah controller write guard rejected a desired-state mutation"
    - expression: 'has(object.metadata.labels) == has(oldObject.metadata.labels) && (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels) && has(object.metadata.annotations) == has(oldObject.metadata.annotations) && (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations) && has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) && (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences)'
      message: "Ptah controller write guard rejected a desired-state mutation"
    - expression: '(variables.oldActiveCount <= 1 && variables.newActiveCount <= 1) && ((variables.oldActiveCount == variables.newActiveCount && variables.oldFinalizers == variables.newFinalizers) || (variables.oldActiveCount == 0 && variables.newActiveCount == 1 && variables.newFinalizers.filter(value, value != variables.activeFinalizer) == variables.oldFinalizers) || (variables.oldActiveCount == 1 && variables.newActiveCount == 0 && variables.newFinalizers == variables.oldFinalizers.filter(value, value != variables.activeFinalizer)))'
      message: "Ptah controller write guard rejected a desired-state mutation"
---
{{- end }}
{{- if not $binding }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $guardName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-157"
    helm.sh/resource-policy: keep
    operator.ptah.dev/rollout-guard-version: "1"
    operator.ptah.dev/release-name: {{ .Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: controller-write-guard
spec:
  policyName: {{ $guardName }}
  matchResources:
    matchPolicy: Exact
    resourceRules:
      - apiGroups: ["operator.ptah.dev"]
        apiVersions: ["v1alpha1"]
        operations: ["UPDATE"]
        resources: ["ptahschemas"]
        scope: Namespaced
  validationActions: [Deny]
{{- end }}
