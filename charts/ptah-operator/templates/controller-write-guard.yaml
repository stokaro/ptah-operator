{{- $guardName := include "ptah-operator.controllerWriteGuardPolicyName" . -}}
{{- $controllerUsername := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "ptah-operator.serviceAccountName" .) -}}
{{- $controllerUsernameMatch := printf `request.userInfo.username == %q` $controllerUsername -}}
{{- $candidateSequence := include "ptah-operator.releaseSequence" . -}}
{{- /* Every release runs the controller as the same ServiceAccount, so the
      predecessor's runtime writes under this name until the cutover stops it,
      and this release's once the cutover activates it. */ -}}
{{- $controllerAuthority := printf `request.userInfo.username == %q && variables.activeRelease == %s` $controllerUsername $candidateSequence -}}
{{- if gt (atoi $candidateSequence) 1 -}}
{{- $controllerAuthority = printf `request.userInfo.username == %q && (variables.activeRelease == %s || variables.activeRelease == %s)` $controllerUsername $candidateSequence (include "ptah-operator.predecessorReleaseSequence" .) -}}
{{- end -}}
{{- $activationShape := include "ptah-operator.releaseActivationShape" (dict "object" "params" "namespace" .Release.Namespace "releaseName" .Release.Name) -}}
{{- $policy := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicy" "" $guardName -}}
{{- $binding := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicyBinding" "" $guardName -}}
{{- range $entry := list
      (dict "kind" "ValidatingAdmissionPolicy" "object" $policy)
      (dict "kind" "ValidatingAdmissionPolicyBinding" "object" $binding) -}}
{{- with $entry.object -}}
{{- $annotations := default (dict) .metadata.annotations -}}
{{- $labels := default (dict) .metadata.labels -}}
{{- if or
      (ne (default "" (index $annotations "operator.ptah.run/rollout-guard-version")) "1")
      (ne (default "" (index $annotations "operator.ptah.run/release-name")) $.Release.Name)
      (ne (default "" (index $annotations "operator.ptah.run/release-namespace")) $.Release.Namespace)
      (ne (default "" (index $labels "app.kubernetes.io/managed-by")) "ptah-operator")
      (ne (default "" (index $labels "app.kubernetes.io/instance")) $.Release.Name)
      (ne (default "" (index $labels "app.kubernetes.io/component")) "controller-write-guard") -}}
{{- fail (printf "retained %s %s has foreign or incomplete controller-write ownership" $entry.kind $guardName) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not $policy }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $guardName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-158"
    helm.sh/resource-policy: keep
    operator.ptah.run/rollout-guard-version: "1"
    operator.ptah.run/release-name: {{ .Release.Name | quote }}
    operator.ptah.run/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: controller-write-guard
spec:
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Exact
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups: ["operator.ptah.run"]
        apiVersions: ["v1alpha1"]
        operations: ["UPDATE"]
        resources: ["ptahschemas", "ptahmigrations"]
        scope: Namespaced
  matchConditions:
    - name: controller-service-account
      expression: {{ $controllerUsernameMatch | quote }}
  variables:
    - name: activeRelease
      expression: 'params != null && has(params.data) && "active-release-sequence" in params.data && params.data["active-release-sequence"].matches("^(0|[1-9][0-9]*)$") ? int(params.data["active-release-sequence"]) : -1'
    - name: oldFinalizers
      expression: 'has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : []'
    - name: newFinalizers
      expression: 'has(object.metadata.finalizers) ? object.metadata.finalizers : []'
    # Each family has its own finalizer, so the one the controller may add and
    # remove follows the resource being written.
    - name: activeFinalizer
      expression: 'request.resource.resource == "ptahmigrations" ? "operator.ptah.run/migration-operation" : "operator.ptah.run/active-operation"'
    - name: oldActiveCount
      expression: 'variables.oldFinalizers.filter(value, value == variables.activeFinalizer).size()'
    - name: newActiveCount
      expression: 'variables.newFinalizers.filter(value, value == variables.activeFinalizer).size()'
  validations:
    - expression: {{ $activationShape | quote }}
      message: "Ptah controller write guard rejected a desired-state mutation"
    - expression: {{ $controllerAuthority | quote }}
      message: "Ptah controller principal guard rejected an inactive release identity"
    - expression: 'dyn(object).spec == dyn(oldObject).spec'
      message: "Ptah controller write guard rejected a desired-state mutation"
    - expression: 'has(dyn(object).status) == has(dyn(oldObject).status) && (!has(dyn(object).status) || dyn(object).status == dyn(oldObject).status)'
      message: "Ptah controller write guard rejected a desired-state mutation"
    - expression: 'has(object.metadata.labels) == has(oldObject.metadata.labels) && (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels) && has(object.metadata.annotations) == has(oldObject.metadata.annotations) && (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations) && has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) && (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences)'
      message: "Ptah controller write guard rejected a desired-state mutation"
    - expression: '(variables.oldActiveCount <= 1 && variables.newActiveCount <= 1) && ((variables.oldActiveCount == variables.newActiveCount && variables.oldFinalizers == variables.newFinalizers) || (variables.oldActiveCount == 0 && variables.newActiveCount == 1 && variables.newFinalizers.filter(value, value != variables.activeFinalizer) == variables.oldFinalizers) || (variables.oldActiveCount == 1 && variables.newActiveCount == 0 && variables.newFinalizers == variables.oldFinalizers.filter(value, value != variables.activeFinalizer)))'
      message: "Ptah controller write guard rejected a desired-state mutation"
---
{{- end }}
{{- if not $binding }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $guardName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-157"
    helm.sh/resource-policy: keep
    operator.ptah.run/rollout-guard-version: "1"
    operator.ptah.run/release-name: {{ .Release.Name | quote }}
    operator.ptah.run/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: controller-write-guard
spec:
  policyName: {{ $guardName }}
  matchResources:
    matchPolicy: Exact
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups: ["operator.ptah.run"]
        apiVersions: ["v1alpha1"]
        operations: ["UPDATE"]
        resources: ["ptahschemas", "ptahmigrations"]
        scope: Namespaced
  paramRef:
    name: ptah-operator-release-activation
    namespace: {{ .Release.Namespace }}
    parameterNotFoundAction: Deny
  validationActions: [Deny]
{{- end }}
