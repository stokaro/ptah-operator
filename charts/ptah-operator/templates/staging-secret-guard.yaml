{{- if and .Values.certificateRotation.enabled (not .Values.webhook.existingSecret) -}}
{{- $guardName := include "ptah-operator.stagingSecretGuardPolicyName" . -}}
{{- $stagingSecretName := include "ptah-operator.certRotationStagingSecretName" . -}}
{{- $rotatorServiceAccount := include "ptah-operator.certRotatorServiceAccountName" . -}}
{{- $sequence := include "ptah-operator.releaseSequence" . -}}
{{- $hookServiceAccount := include "ptah-operator.crdManagerServiceAccountName" . -}}
{{- $hookSuffix := printf "-crd-v%s-%s" $sequence (include "ptah-operator.hookIdentityDigest" . | trunc 12) -}}
{{- if not (hasSuffix $hookSuffix $hookServiceAccount) -}}
{{- fail "staging Secret guard hook ServiceAccount does not match the candidate release identity" -}}
{{- end -}}
{{- $hookBase := trimSuffix $hookSuffix $hookServiceAccount -}}
{{- if eq $hookBase "" -}}
{{- fail "staging Secret guard hook ServiceAccount has no stable name prefix" -}}
{{- end -}}
{{- $releaseDigest := printf "%s\n%s" .Release.Namespace .Release.Name | sha256sum | trunc 12 -}}
{{- $markerPattern := printf "^ptah-admission-convergence-v1-[1-9][0-9]*-%s$" $releaseDigest -}}
{{- $probePolicyDigest := printf "1\n%s" $guardName | sha256sum | trunc 32 -}}
{{- $probeFieldManagerPattern := printf "^ptah-admission-stable-v1-%s-[0-9a-f]{64}$" $probePolicyDigest -}}
{{- $probeExpression := printf `request.operation == "UPDATE" && request.resource.group == "" && request.resource.version == "v1" && request.resource.resource == "configmaps" && (!has(request.subResource) || request.subResource == "") && request.namespace == %q && request.name.matches(%q) && has(request.options) && has(request.options.fieldManager) && request.options.fieldManager.matches(%q)` .Release.Namespace $markerPattern $probeFieldManagerPattern -}}
{{- $rotatorPrincipal := printf `(request.userInfo.username == %q) && request.userInfo.groups.size() == 3 && "system:serviceaccounts" in request.userInfo.groups && %q in request.userInfo.groups && "system:authenticated" in request.userInfo.groups` (printf "system:serviceaccount:%s:%s" .Release.Namespace $rotatorServiceAccount) (printf "system:serviceaccounts:%s" .Release.Namespace) -}}
{{- $activationName := "ptah-operator-release-activation" -}}
{{- $activationShape := printf `params != null && has(params.metadata) && has(params.metadata.name) && params.metadata.name == %q && has(params.metadata.namespace) && params.metadata.namespace == %q && has(params.metadata.uid) && params.metadata.uid != "" && has(params.metadata.resourceVersion) && params.metadata.resourceVersion != "" && has(params.data) && params.data.size() == 4 && %q in params.data && params.data[%q].matches("^(0|[1-9][0-9]*)$") && %q in params.data && params.data[%q] == "draining" && %q in params.data && params.data[%q].matches("^[1-9][0-9]*$") && %q in params.data && params.data[%q].matches("^[0-9a-f]{64}$")` $activationName .Release.Namespace "active-release-sequence" "active-release-sequence" "controller-credentials" "controller-credentials" "controller-credentials-target-release-sequence" "controller-credentials-target-release-sequence" "controller-credentials-attempt" "controller-credentials-attempt" -}}
{{- $cleanupUsername := printf `request.userInfo.username == %q + params.data[%q] + "-" + params.data[%q].substring(0, 12)` (printf "system:serviceaccount:%s:%s-cleanup-v" .Release.Namespace $hookBase) "controller-credentials-target-release-sequence" "controller-credentials-attempt" -}}
{{- $cleanupPrincipal := printf `(%s) && ((%s) && request.userInfo.groups.size() == 3 && "system:serviceaccounts" in request.userInfo.groups && %q in request.userInfo.groups && "system:authenticated" in request.userInfo.groups)` $activationShape $cleanupUsername (printf "system:serviceaccounts:%s" .Release.Namespace) -}}
{{- $secretShapeTemplate := `%[1]s != null && has(%[1]s.apiVersion) && %[1]s.apiVersion == "v1" && has(%[1]s.kind) && %[1]s.kind == "Secret" && has(%[1]s.metadata) && has(%[1]s.metadata.name) && %[1]s.metadata.name == %[2]q && has(%[1]s.metadata.namespace) && %[1]s.metadata.namespace == %[3]q && (!has(%[1]s.metadata.generateName) || %[1]s.metadata.generateName == "") && has(%[1]s.metadata.uid) && %[1]s.metadata.uid != "" && has(%[1]s.metadata.resourceVersion) && %[1]s.metadata.resourceVersion != "" && has(%[1]s.metadata.labels) && %[1]s.metadata.labels == {%[4]q: %[5]q, "app.kubernetes.io/managed-by": "Helm"} && has(%[1]s.metadata.annotations) && %[1]s.metadata.annotations == {"meta.helm.sh/release-name": %[6]q, "meta.helm.sh/release-namespace": %[7]q} && (!has(%[1]s.metadata.ownerReferences) || %[1]s.metadata.ownerReferences.size() == 0) && (!has(%[1]s.metadata.finalizers) || %[1]s.metadata.finalizers.size() == 0) && !has(%[1]s.metadata.deletionTimestamp) && !has(%[1]s.metadata.deletionGracePeriodSeconds) && has(%[1]s.type) && %[1]s.type == "Opaque" && !has(%[1]s.immutable) && (!has(%[1]s.stringData) || %[1]s.stringData.size() == 0)` -}}
{{- $oldShape := printf $secretShapeTemplate "oldObject" $stagingSecretName .Release.Namespace "operator.ptah.dev/certificate-rotation-staging" "true" .Release.Name .Release.Namespace -}}
{{- $newShape := printf $secretShapeTemplate "object" $stagingSecretName .Release.Namespace "operator.ptah.dev/certificate-rotation-staging" "true" .Release.Name .Release.Namespace -}}
{{- $createShape := printf `%s && (!has(object.metadata.uid) || object.metadata.uid == "") && (!has(object.metadata.resourceVersion) || object.metadata.resourceVersion == "") && !has(object.metadata.creationTimestamp)` (printf $secretShapeTemplate "object" $stagingSecretName .Release.Namespace "operator.ptah.dev/certificate-rotation-staging" "true" .Release.Name .Release.Namespace | replace ` && has(object.metadata.uid) && object.metadata.uid != "" && has(object.metadata.resourceVersion) && object.metadata.resourceVersion != ""` "") -}}
{{- $updateIdentity := `object.metadata.uid == oldObject.metadata.uid && object.metadata.resourceVersion == oldObject.metadata.resourceVersion && has(object.metadata.creationTimestamp) == has(oldObject.metadata.creationTimestamp) && (!has(object.metadata.creationTimestamp) || object.metadata.creationTimestamp == oldObject.metadata.creationTimestamp)` -}}
{{- $dataPreserved := `has(dyn(object).data) == has(dyn(oldObject).data) && (!has(dyn(object).data) || dyn(object).data == dyn(oldObject).data)` -}}
{{- $message := "Ptah certificate staging Secret guard rejected an unsafe lifecycle request" -}}
{{- $matchResources := dict
      "matchPolicy" "Exact"
      "namespaceSelector" (dict)
      "objectSelector" (dict)
      "resourceRules" (list
        (dict
          "apiGroups" (list "")
          "apiVersions" (list "v1")
          "operations" (list "CREATE" "UPDATE" "DELETE")
          "resourceNames" (list $stagingSecretName)
          "resources" (list "secrets")
          "scope" "Namespaced")
        (dict
          "apiGroups" (list "")
          "apiVersions" (list "v1")
          "operations" (list "UPDATE")
          "resources" (list "configmaps")
          "scope" "Namespaced")) -}}
{{- $secretMatch := printf `request.namespace == %q && request.name == %q && (!has(request.subResource) || request.subResource == "")` .Release.Namespace $stagingSecretName -}}
{{- $policySpec := dict
      "failurePolicy" "Fail"
      "paramKind" (dict "apiVersion" "v1" "kind" "ConfigMap")
      "matchConstraints" $matchResources
      "matchConditions" (list (dict
        "name" "exact-certificate-staging-secret"
        "expression" (printf `(%s) || (%s)` $probeExpression $secretMatch)))
      "variables" (list
        (dict "name" "isAnyAdmissionConvergenceProbe" "expression" $probeExpression)
        (dict "name" "isAdmissionConvergenceProbe" "expression" $probeExpression)
        (dict "name" "isCreate" "expression" `request.operation == "CREATE"`)
        (dict "name" "isUpdate" "expression" `request.operation == "UPDATE"`)
        (dict "name" "isDelete" "expression" `request.operation == "DELETE"`)
        (dict "name" "isRotator" "expression" $rotatorPrincipal)
        (dict "name" "isCleanup" "expression" $cleanupPrincipal))
      "validations" (list
        (dict "expression" `variables.isAnyAdmissionConvergenceProbe || (variables.isCreate || variables.isUpdate || variables.isDelete)` "message" $message)
        (dict "expression" (printf `variables.isAnyAdmissionConvergenceProbe || (variables.isCreate || (%s))` $oldShape) "message" $message)
        (dict "expression" (printf `variables.isAnyAdmissionConvergenceProbe || (variables.isDelete || (variables.isCreate && (%s)) || (variables.isUpdate && (%s)))` $createShape $newShape) "message" $message)
        (dict "expression" `variables.isAnyAdmissionConvergenceProbe || (!variables.isCreate || (!has(dyn(object).data) || dyn(object).data.size() == 0))` "message" $message)
        (dict "expression" (printf `variables.isAnyAdmissionConvergenceProbe || (!variables.isUpdate || (%s))` $updateIdentity) "message" $message)
        (dict "expression" (printf `variables.isAnyAdmissionConvergenceProbe || (!variables.isUpdate || (variables.isRotator || (variables.isCleanup && (!has(dyn(object).data) || dyn(object).data.size() == 0)) || ((!variables.isRotator && !variables.isCleanup) && (%s))))` $dataPreserved) "message" $message)
        (dict "expression" `variables.isAnyAdmissionConvergenceProbe || (!variables.isDelete || (variables.isCleanup && (!has(dyn(oldObject).data) || dyn(oldObject).data.size() == 0)))` "message" $message)
        (dict "expression" `!variables.isAnyAdmissionConvergenceProbe || request.dryRun == true` "message" "Ptah admission convergence probe field manager is reserved for dry-run verification")
        (dict "expression" `!variables.isAdmissionConvergenceProbe` "messageExpression" `"Ptah admission convergence confirmed exact workload guard " + request.options.fieldManager`)) -}}
{{- $bindingSpec := dict
      "policyName" $guardName
      "validationActions" (list "Deny")
      "matchResources" $matchResources
      "paramRef" (dict
        "name" $activationName
        "namespace" .Release.Namespace
        "parameterNotFoundAction" "Deny") -}}
{{- $policyAnnotations := dict
      "helm.sh/hook" "pre-install,pre-upgrade"
      "helm.sh/hook-weight" "-162"
      "helm.sh/resource-policy" "keep"
      "operator.ptah.dev/rollout-guard-version" "1"
      "operator.ptah.dev/release-name" .Release.Name
      "operator.ptah.dev/release-namespace" .Release.Namespace -}}
{{- $bindingAnnotations := dict
      "helm.sh/hook" "pre-install,pre-upgrade"
      "helm.sh/hook-weight" "-161"
      "helm.sh/resource-policy" "keep"
      "operator.ptah.dev/rollout-guard-version" "1"
      "operator.ptah.dev/release-name" .Release.Name
      "operator.ptah.dev/release-namespace" .Release.Namespace -}}
{{- $guardLabels := dict
      "app.kubernetes.io/managed-by" "ptah-operator"
      "app.kubernetes.io/instance" .Release.Name
      "app.kubernetes.io/component" "certificate-staging-secret-guard" -}}
{{- $policy := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicy" "" $guardName -}}
{{- $binding := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicyBinding" "" $guardName -}}
{{- if ne (empty $policy) (empty $binding) -}}
{{- fail (printf "retained staging Secret guard %s is sparse" $guardName) -}}
{{- end -}}
{{- range $entry := list
      (dict "kind" "ValidatingAdmissionPolicy" "object" $policy "annotations" $policyAnnotations "spec" $policySpec)
      (dict "kind" "ValidatingAdmissionPolicyBinding" "object" $binding "annotations" $bindingAnnotations "spec" $bindingSpec) -}}
{{- with $entry.object -}}
{{- $annotations := default (dict) .metadata.annotations -}}
{{- $labels := default (dict) .metadata.labels -}}
{{- if or
      (ne (default "" .apiVersion) "admissionregistration.k8s.io/v1")
      (ne (default "" .kind) $entry.kind)
      (ne (default "" .metadata.name) $guardName)
      (ne (default "" .metadata.namespace) "")
      (ne (default "" .metadata.generateName) "")
      (eq (default "" .metadata.uid) "")
      (eq (default "" .metadata.resourceVersion) "")
      (not (deepEqual $annotations $entry.annotations))
      (not (deepEqual $labels $guardLabels))
      (ne (len (default (list) .metadata.ownerReferences)) 0)
      (ne (len (default (list) .metadata.finalizers)) 0)
      (not (empty .metadata.deletionTimestamp))
      (not (empty .metadata.deletionGracePeriodSeconds))
      (not (deepEqual (default (dict) .spec) $entry.spec)) -}}
{{- fail (printf "retained staging Secret guard %s %s differs from the exact live contract" $guardName $entry.kind) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if empty $policy }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $guardName }}
  annotations:
    {{- toYaml $policyAnnotations | nindent 4 }}
  labels:
    {{- toYaml $guardLabels | nindent 4 }}
spec:
  {{- toYaml $policySpec | nindent 2 }}
---
{{- end }}
{{- if empty $binding }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $guardName }}
  annotations:
    {{- toYaml $bindingAnnotations | nindent 4 }}
  labels:
    {{- toYaml $guardLabels | nindent 4 }}
spec:
  {{- toYaml $bindingSpec | nindent 2 }}
{{- end }}
{{- end -}}
