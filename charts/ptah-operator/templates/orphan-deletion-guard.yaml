apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "ptah-operator.orphanDeletionGuardPolicyName" . }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: orphan-deletion-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups: ["operator.ptah.run"]
        apiVersions: ["*"]
        operations: ["DELETE"]
        resources: ["ptahschemas", "ptahmigrations"]
        scope: Namespaced
  variables:
    - name: orphanRequested
      expression: {{ `has(request.options.orphanDependents) ? request.options.orphanDependents : has(request.options.propagationPolicy) && request.options.propagationPolicy == "Orphan"` | quote }}
    - name: propagationNamed
      expression: "has(request.options.orphanDependents) || has(request.options.propagationPolicy)"
    - name: orphanFinalizer
      expression: {{ `has(oldObject.metadata.finalizers) && "orphan" in oldObject.metadata.finalizers` | quote }}
  validations:
    - expression: "!variables.orphanRequested"
      message: "A PtahSchema or PtahMigration deletion cannot orphan its dependents: the garbage collector would have to take the resource's owner reference off the PtahResultRecords it owns, which admission keeps immutable, so the resource would stay Terminating. Delete it with the default propagation, Background, which kubectl delete sends unless --cascade names another"
      reason: Forbidden
    - expression: "variables.propagationNamed || !variables.orphanFinalizer"
      message: "This resource carries the orphan finalizer, so a deletion that names no propagation would orphan its dependents and stay Terminating on the PtahResultRecords it owns. Delete it with propagationPolicy: Background, which kubectl delete sends by default and which takes the finalizer off"
      reason: Forbidden
