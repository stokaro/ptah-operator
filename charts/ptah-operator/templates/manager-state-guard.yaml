{{- $controllerServiceAccount := include "ptah-operator.serviceAccountName" . -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "ptah-operator.statusWriteGuardPolicyName" . }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager-state-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups: ["operator.ptah.run"]
        apiVersions: ["*"]
        operations: ["UPDATE"]
        resources: ["*/status"]
        scope: "*"
  variables:
    - name: manager
      expression: {{ printf `"system:serviceaccount:%s:%s"` .Release.Namespace $controllerServiceAccount | quote }}
  validations:
    - expression: "request.userInfo.username == variables.manager"
      message: "Ptah status is written only by the operator's manager; settle an unresolved migration run with a PtahMigrationRunAcknowledgment"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "ptah-operator.statusWriteGuardPolicyName" . }}
  labels:
    {{- include "ptah-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager-state-guard
spec:
  policyName: {{ include "ptah-operator.statusWriteGuardPolicyName" . }}
  matchResources:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups: ["operator.ptah.run"]
        apiVersions: ["*"]
        operations: ["UPDATE"]
        resources: ["*/status"]
        scope: "*"
  validationActions: [Deny]
