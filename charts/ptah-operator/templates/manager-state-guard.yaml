    resourceRules:
      - apiGroups: ["operator.ptah.run"]
        apiVersions: ["*"]
        operations: ["UPDATE"]
        resources: ["ptahmigrations"]
        scope: Namespaced
  variables:
    - name: manager
      expression: {{ printf `"system:serviceaccount:%s:%s"` .Release.Namespace $controllerServiceAccount | quote }}
    - name: oldCopy
      expression: {{ `has(oldObject.metadata.annotations) && "operator.ptah.run/unresolved-run" in oldObject.metadata.annotations ? [oldObject.metadata.annotations["operator.ptah.run/unresolved-run"]] : []` | quote }}
    - name: newCopy
      expression: {{ `has(object.metadata.annotations) && "operator.ptah.run/unresolved-run" in object.metadata.annotations ? [object.metadata.annotations["operator.ptah.run/unresolved-run"]] : []` | quote }}
  validations:
    - expression: "request.userInfo.username == variables.manager || variables.newCopy == variables.oldCopy"
      message: "The operator.ptah.run/unresolved-run annotation is the manager's copy of an unresolved run; only the manager changes it, and a PtahMigrationRunAcknowledgment is how a person settles the run"
