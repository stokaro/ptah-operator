{{- $mutatingName := include "ptah-operator.certificateMutatingWriteGuardPolicyName" . -}}
{{- $validatingName := include "ptah-operator.certificateValidatingWriteGuardPolicyName" . -}}
{{- $configurationName := include "ptah-operator.approvalWebhookConfigurationName" . -}}
{{- $serviceName := include "ptah-operator.webhookServiceName" . -}}
{{- $candidateServiceName := include "ptah-operator.certificateTransitionServiceName" . -}}
{{- $certificateUsername := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "ptah-operator.certRotatorServiceAccountName" .) -}}
{{- $releaseDigest := printf "%s\n%s" .Release.Namespace .Release.Name | sha256sum | trunc 12 -}}
{{- $markerPattern := printf "^ptah-admission-convergence-v1-[1-9][0-9]*-%s$" $releaseDigest -}}
{{- $mutatingProbePolicyDigest := printf "1\n%s" $mutatingName | sha256sum | trunc 32 -}}
{{- $mutatingProbeFieldManagerPattern := printf "^ptah-admission-stable-v1-%s-[0-9a-f]{64}$" $mutatingProbePolicyDigest -}}
{{- $mutatingProbeExpression := printf `request.operation == "UPDATE" && request.resource.group == "" && request.resource.version == "v1" && request.resource.resource == "configmaps" && (!has(request.subResource) || request.subResource == "") && request.namespace == %q && request.name.matches(%q) && has(request.options) && has(request.options.fieldManager) && request.options.fieldManager.matches(%q)` .Release.Namespace $markerPattern $mutatingProbeFieldManagerPattern -}}
{{- $validatingProbePolicyDigest := printf "1\n%s" $validatingName | sha256sum | trunc 32 -}}
{{- $validatingProbeFieldManagerPattern := printf "^ptah-admission-stable-v1-%s-[0-9a-f]{64}$" $validatingProbePolicyDigest -}}
{{- $validatingProbeExpression := printf `request.operation == "UPDATE" && request.resource.group == "" && request.resource.version == "v1" && request.resource.resource == "configmaps" && (!has(request.subResource) || request.subResource == "") && request.namespace == %q && request.name.matches(%q) && has(request.options) && has(request.options.fieldManager) && request.options.fieldManager.matches(%q)` .Release.Namespace $markerPattern $validatingProbeFieldManagerPattern -}}
{{- /* Every probe family aimed at the marker: the runtime verifier under the
      certificate principal probes every policy, and this guard matches that
      principal, so recognizing only its own probe would judge the others by
      the certificate validations. The union stays release-stable through the
      marker pattern. crdupgrade compiles the same selector. */ -}}
{{- $anyProbeExpression := printf `request.operation == "UPDATE" && request.resource.group == "" && request.resource.version == "v1" && request.resource.resource == "configmaps" && (!has(request.subResource) || request.subResource == "") && request.namespace == %q && request.name.matches(%q) && has(request.options) && has(request.options.fieldManager) && request.options.fieldManager.matches(%q)` .Release.Namespace $markerPattern (include "ptah-operator.admissionConvergenceAnyProbeFieldManagerPattern" .) -}}
{{- $mutatingPolicy := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicy" "" $mutatingName -}}
{{- $mutatingBinding := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicyBinding" "" $mutatingName -}}
{{- $validatingPolicy := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicy" "" $validatingName -}}
{{- $validatingBinding := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicyBinding" "" $validatingName -}}
{{- range $entry := list
      (dict "kind" "ValidatingAdmissionPolicy" "name" $mutatingName "component" "certificate-mutating-write-guard" "object" $mutatingPolicy)
      (dict "kind" "ValidatingAdmissionPolicyBinding" "name" $mutatingName "component" "certificate-mutating-write-guard" "object" $mutatingBinding)
      (dict "kind" "ValidatingAdmissionPolicy" "name" $validatingName "component" "certificate-validating-write-guard" "object" $validatingPolicy)
      (dict "kind" "ValidatingAdmissionPolicyBinding" "name" $validatingName "component" "certificate-validating-write-guard" "object" $validatingBinding) -}}
{{- with $entry.object -}}
{{- $annotations := default (dict) .metadata.annotations -}}
{{- $labels := default (dict) .metadata.labels -}}
{{- if or
      (ne (default "" (index $annotations "operator.ptah.dev/rollout-guard-version")) "1")
      (ne (default "" (index $annotations "operator.ptah.dev/release-name")) $.Release.Name)
      (ne (default "" (index $annotations "operator.ptah.dev/release-namespace")) $.Release.Namespace)
      (ne (default "" (index $labels "app.kubernetes.io/managed-by")) "ptah-operator")
      (ne (default "" (index $labels "app.kubernetes.io/instance")) $.Release.Name)
      (ne (default "" (index $labels "app.kubernetes.io/component")) $entry.component) -}}
{{- fail (printf "retained %s %s has foreign or incomplete certificate-write ownership" $entry.kind $entry.name) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not $mutatingPolicy }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $mutatingName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-156"
    helm.sh/resource-policy: keep
    operator.ptah.dev/rollout-guard-version: "1"
    operator.ptah.dev/release-name: {{ .Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: certificate-mutating-write-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Exact
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups: ["admissionregistration.k8s.io"]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["mutatingwebhookconfigurations"]
        resourceNames: [{{ $configurationName | quote }}]
        scope: Cluster
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["configmaps"]
        scope: Namespaced
  matchConditions:
    - name: exact-certificate-service-account
      expression: {{ printf `(%s) || (request.userInfo.username == %q)` $anyProbeExpression $certificateUsername | quote }}
  variables:
    - name: isAnyAdmissionConvergenceProbe
      expression: {{ $anyProbeExpression | quote }}
    - name: isAdmissionConvergenceProbe
      expression: {{ $mutatingProbeExpression | quote }}
  validations:
    - expression: {{ printf `variables.isAnyAdmissionConvergenceProbe || (%s)` (include "ptah-operator.certificateMetadataValidation" .) | quote }}
      message: "Ptah certificate mutating write guard rejected an unsafe mutation"
    - expression: {{ printf `variables.isAnyAdmissionConvergenceProbe || (%s)` (include "ptah-operator.certificateWebhookNamesValidation" .) | quote }}
      message: "Ptah certificate mutating write guard rejected an unsafe mutation"
    - expression: {{ printf `variables.isAnyAdmissionConvergenceProbe || (%s)` (include "ptah-operator.certificateWebhookEntriesValidation" (dict "includeReinvocation" true "serviceNamespace" .Release.Namespace "serviceName" $serviceName "candidateServiceName" $candidateServiceName "canaryName" "certificate-rotation-canary-mutate.operator.ptah.dev")) | quote }}
      message: "Ptah certificate mutating write guard rejected an unsafe mutation"
    - expression: '!variables.isAnyAdmissionConvergenceProbe || request.dryRun == true'
      message: "Ptah admission convergence probe field manager is reserved for dry-run verification"
    - expression: '!variables.isAdmissionConvergenceProbe'
      messageExpression: '"Ptah admission convergence confirmed exact workload guard " + request.options.fieldManager'
---
{{- end }}
{{- if not $mutatingBinding }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $mutatingName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-155"
    helm.sh/resource-policy: keep
    operator.ptah.dev/rollout-guard-version: "1"
    operator.ptah.dev/release-name: {{ .Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: certificate-mutating-write-guard
spec:
  policyName: {{ $mutatingName }}
  matchResources:
    matchPolicy: Exact
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups: ["admissionregistration.k8s.io"]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["mutatingwebhookconfigurations"]
        resourceNames: [{{ $configurationName | quote }}]
        scope: Cluster
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["configmaps"]
        scope: Namespaced
  validationActions: [Deny]
---
{{- end }}
{{- if not $validatingPolicy }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $validatingName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-154"
    helm.sh/resource-policy: keep
    operator.ptah.dev/rollout-guard-version: "1"
    operator.ptah.dev/release-name: {{ .Release.Name | quote }}
    operator.ptah.dev/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: ptah-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: certificate-validating-write-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Exact
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups: ["admissionregistration.k8s.io"]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["validatingwebhookconfigurations"]
        resourceNames: [{{ $configurationName | quote }}]
        scope: Cluster
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["configmaps"]
        scope: Namespaced
  matchConditions:
    - name: exact-certificate-service-account
      expression: {{ printf `(%s) || (request.userInfo.username == %q)` $anyProbeExpression $certificateUsername | quote }}
  variables:
    - name: isAnyAdmissionConvergenceProbe
      expression: {{ $anyProbeExpression | quote }}
    - name: isAdmissionConvergenceProbe
      expression: {{ $validatingProbeExpression | quote }}
  validations:
    - expression: {{ printf `variables.isAnyAdmissionConvergenceProbe || (%s)` (include "ptah-operator.certificateMetadataValidation" .) | quote }}
      message: "Ptah certificate validating write guard rejected an unsafe mutation"
    - expression: {{ printf `variables.isAnyAdmissionConvergenceProbe || (%s)` (include "ptah-operator.certificateWebhookNamesValidation" .) | quote }}
      message: "Ptah certificate validating write guard rejected an unsafe mutation"
    - expression: {{ printf `variables.isAnyAdmissionConvergenceProbe || (%s)` (include "ptah-operator.certificateWebhookEntriesValidation" (dict "includeReinvocation" false "serviceNamespace" .Release.Namespace "serviceName" $serviceName "candidateServiceName" $candidateServiceName "canaryName" "certificate-rotation-canary-validate.operator.ptah.dev")) | quote }}
      message: "Ptah certificate validating write guard rejected an unsafe mutation"
    - expression: '!variables.isAnyAdmissionConvergenceProbe || request.dryRun == true'
      message: "Ptah admission convergence probe field manager is reserved for dry-run verification"
    - expression: '!variables.isAdmissionConvergenceProbe'
      messageExpression: '"Ptah admission convergence confirmed exact workload guard " + request.options.fieldManager'
---
