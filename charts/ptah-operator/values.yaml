replicaCount: 2

image:
  repository: ghcr.io/stokaro/ptah-operator
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

execution:
  # Both execution images are required and must include @sha256:<64 hex>.
  executorImage: ""
  runnerImage: ""
  ptahVersion: "v0.3.0"

leaderElection: true

coordination:
  # Leave empty to use the Helm release namespace. Every operator instance
  # that can reach the same databases must use the same namespace.
  namespace: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

metrics:
  bindAddress: ":8080"
  service:
    enabled: true
    port: 8080

webhook:
  port: 9443
  timeoutSeconds: 5
  failurePolicy: Fail
  # Name of a pre-provisioned kubernetes.io/tls Secret. The Secret must also
  # contain ca.crt. Set caBundle to render the chart without cluster lookup.
  existingSecret: ""
  # PEM-encoded CA certificate for existingSecret. Leave empty during a
  # connected Helm install to read ca.crt from that Secret.
  caBundle: ""

approverClusterRole:
  create: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1
