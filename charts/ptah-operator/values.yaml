# Manager replicas. Scaling this release is how the operator runs highly
# available; a second release in the same cluster is not supported. More than
# one replica requires leaderElection.
replicaCount: 2

# The image every runtime component runs from: the manager, the certificate
# rotator and the CRD manager are three commands in one image.
image:
  # Repository the manager image is pulled from.
  repository: ghcr.io/stokaro/ptah-operator
  # Recorded for a reader. The digest below is what is actually pulled.
  tag: "0.1.0"
  # Required registry manifest digest, including for local development.
  # A Docker image ID is not a registry manifest digest.
  digest: ""
  # Pull policy for the manager image. AlwaysPullImages in the cluster
  # rewrites this, which is what admission.alwaysPullImagesEnabled declares.
  pullPolicy: IfNotPresent

# Pull Secrets added to every Pod this chart creates.
imagePullSecrets: []
# Replaces the chart name in generated object names.
nameOverride: ""
# Replaces the complete generated name, release prefix included.
fullnameOverride: ""

# The data plane: the images a database operation runs in, and the Ptah build
# they carry. The manager dispatches Jobs from these and runs no SQL itself.
execution:
  # Both execution images are required and must include @sha256:<64 hex>.
  # ptahVersion is also required, is limited to 128 bytes, and must identify
  # the Ptah build verified for the exact executorImage digest; the chart
  # deliberately has no default.
  executorImage: ""
  # The runner image, built from this operator's source, which supervises the
  # executor inside a task Pod and returns its result frame.
  runnerImage: ""
  # The Ptah build the executorImage digest carries. A plan records it, and an
  # apply is refused when it no longer matches.
  ptahVersion: ""

# What the cluster's own admission plugins do to the Pods this operator
# creates. The chart's guards assert the resulting Pod rather than the intent,
# so these declare what the API server is configured to do.
admission:
  # These values must match kube-apiserver's enabled admission plugins and
  # DefaultTolerationSeconds flags. Zero means an exact zero-second NoExecute
  # toleration; it does not disable the plugin.
  defaultTolerationsEnabled: true
  # The DefaultTolerationSeconds value for node.kubernetes.io/not-ready.
  defaultNotReadyTolerationSeconds: 300
  # The DefaultTolerationSeconds value for node.kubernetes.io/unreachable.
  defaultUnreachableTolerationSeconds: 300
  # Whether ExtendedResourceToleration is enabled, which adds a toleration for
  # every extended resource a Pod requests.
  extendedResourceTolerationEnabled: false
  # Whether AlwaysPullImages is enabled, which rewrites every imagePullPolicy
  # to Always. The guards accept that rewrite only when this says so.
  alwaysPullImagesEnabled: false

# Approval policy the installer owns rather than any PtahSchema or
# PtahMigration author.
approvals:
  # The four-eyes control: refuse an approval whose approver is exactly the
  # identity that last created or last changed the spec of the resource it
  # approves, or refuse it outright when no such identity was recorded. A
  # desired-state author cannot reach this from their own resource's spec, so
  # turning it on binds every approval this installation admits rather than
  # binding one resource an author could edit back off. It defaults to false,
  # so an existing installation that never sets it keeps admitting the
  # approvals it always did.
  #
  # The mutating webhook that records the identity exists only while this is
  # on. Off, a PtahSchema or PtahMigration write never depends on the manager
  # being reachable for it; a webhook with failurePolicy Fail would otherwise
  # block every write, including across an upgrade under Recreate, to pay for
  # a record nothing reads. A resource written before this was turned on
  # carries no recorded writer, so its approvals are refused until its spec is
  # next changed and the now-installed webhook has a write to stamp.
  requireDistinctApprover: false

# Who may turn the approval requirement off. spec.policy.apply: Always applies
# plans with no approval, and the field is on the desired-state resource, so
# whoever may edit a PtahSchema or a PtahMigration may select it. RBAC on
# approvals does not decide that, because the bypass is not an approval; this
# ValidatingAdmissionPolicy does. It refuses a create that sets Always and an
# update that moves apply to Always unless the requester is in one of the
# groups below. A write that leaves Always where it already was is admitted,
# so the operator's own finalizer patches and an author's ordinary edits of a
# resource an administrator set to Always keep working, and so is a move back
# to OnApproval or Never.
applyPolicyGuard:
  # Whether to install the guard. On by default: an installation that wants
  # unattended apply for everyone turns it off knowingly, and the security
  # model says what that gives up. Off, the policy and its binding are not
  # rendered, and an upgrade that turns it off removes them.
  enabled: true
  # The groups whose members may select Always. The default is system:masters
  # alone: it is the one group Kubernetes itself puts beyond authorization, its
  # members could delete this policy anyway, so exempting them opens nothing,
  # and it keeps a way to choose Always that needs no Helm upgrade. No other
  # group is guessed. cluster-admin is a ClusterRole, bound to whichever groups
  # a distribution chose, and a chart that named one of them would exempt a
  # different set of people on every distribution. Add the group that owns
  # apply policy in this cluster, and the group of a GitOps controller that
  # creates resources with Always (for a ServiceAccount in namespace flux,
  # system:serviceaccounts:flux). An empty list exempts nobody.
  # system:authenticated is refused: exempting every authenticated identity is
  # turning the guard off, which is enabled: false.
  exemptGroups: ["system:masters"]

# Required whenever replicaCount is greater than one. Disable only for an
# isolated single-replica installation. Exactly one Helm release is supported
# per cluster; scale this release for high availability.
leaderElection: true

# Where the operator's Leases live.
coordination:
  # Leave empty to use the Helm release namespace. This namespace contains
  # both database target Leases and the manager leader-election Lease for the
  # cluster's one supported operator release.
  namespace: ""

# The release namespace is part of the operator's trusted computing base:
# whoever can create a workload there can run it as the operator's
# ServiceAccounts. When Helm can read the cluster, the chart refuses to install
# into default or a kube-* namespace, or into one that runs Pods or workload
# controllers without this release's app.kubernetes.io/instance label.
# helm template, and a GitOps tool that renders with it, cannot read the
# cluster and skip the check.
releaseNamespace:
  # Install into such a namespace anyway. Set it only when everyone who can
  # create workloads there is trusted to administer Ptah.
  allowSharedNamespace: false

# The identity the runtime components run as.
serviceAccount:
  # The controller runs as one ServiceAccount in every release. With
  # create=false, pre-create the ServiceAccount named below; the chart binds
  # its roles to it and never deletes it.
  create: true
  # The controller ServiceAccount's name. Empty means the generated release
  # name.
  name: ""
  # Annotations added to the ServiceAccount the chart creates, which is where
  # a cloud identity binding goes.
  annotations: {}

# Annotations added to the manager Pods.
podAnnotations: {}
# Labels added to the manager and rotator Pods, beside the chart's own.
podLabels: {}

# Manager container resources. The manager reconciles and dispatches; the
# database work happens in task Pods with resources of their own.
resources:
  # What the manager container is guaranteed.
  requests:
    # CPU request for the manager container.
    cpu: 50m
    # Memory request for the manager container.
    memory: 96Mi
  # The ceiling. CPU is deliberately unlimited: throttling a leader is how a
  # Lease is lost.
  limits:
    # Memory limit for the manager container.
    memory: 256Mi

# Node labels the manager and rotator Pods are scheduled onto.
nodeSelector: {}
# Taints the manager and rotator Pods tolerate, beside the ones
# admission.defaultTolerations describes.
tolerations: []
# Affinity for the manager and rotator Pods. Replicas already spread across
# nodes by default; this is for anything narrower.
affinity: {}
# Assign this class to the runtime Deployments and to the CRD reconcile hook.
priorityClassName: ""

# The manager's metrics endpoint.
metrics:
  # Address the manager serves metrics on. The manager Pod declares port 8080,
  # so change the Service below rather than this.
  bindAddress: ":8080"
  # A Service in front of the metrics port, for a scraper that needs one.
  service:
    # Whether to create the metrics Service.
    enabled: true
    # Port the metrics Service listens on.
    port: 8080

# Objects for a Prometheus run by the Prometheus Operator: how it scrapes the
# manager, and the rules it alerts on.
monitoring:
  # A ServiceMonitor, which is how Prometheus reaches each manager Pod behind
  # the metrics Service rather than one replica behind its address.
  serviceMonitor:
    # Whether to create a ServiceMonitor. Off by default: the object needs the
    # Prometheus Operator CRDs, and an install into a cluster without them fails
    # on a kind the API server does not serve.
    enabled: false
    # Labels the Prometheus instance selects ServiceMonitors by. Empty means the
    # object is created and selected by nothing, which is why a deployment that
    # turns this on usually has to set them.
    labels: {}
    # How often to scrape. Unset leaves the interval to the Prometheus
    # configuration rather than pinning it here.
    interval: ""
    # How long a scrape may take. Unset leaves it to Prometheus.
    scrapeTimeout: ""
  # Alerting rules for Apply runs nobody accounted for. Off by default for the
  # same reason as the ServiceMonitor: the object needs the Prometheus Operator
  # CRDs.
  prometheusRule:
    # Whether to create the PrometheusRule. When on, viewUnsyncedFor below has
    # to be set as well.
    enabled: false
    # Labels the Prometheus instance selects rules by.
    labels: {}
    # How long the view behind the unresolved counts may report itself
    # unsynchronized before that is an alert. Required when the rules are on,
    # and deliberately without a default: how long a manager takes to
    # synchronize after a restart or a leader change depends on the cluster it
    # runs in. The operations guide says how to measure it there.
    viewUnsyncedFor: ""
    # Where each rule's runbook_url points. The page and its anchor are fixed;
    # this is the guide they are read from.
    runbookBaseURL: "https://operator.ptah.run/edge/use/operations/"
    # The rules below render only where their threshold is set. Each one is a
    # number about a particular cluster -- its intervals, its Job start times,
    # its tolerance -- so the chart ships none; the operations guide says how
    # to read each one off a running installation.
    #
    # Seconds a resource may be past its own status.nextReconciliationTime.
    overdueAfterSeconds: null
    # Seconds one operation may stay in flight.
    operationStalledAfterSeconds: null
    # How long a database-realm Lease release may stay owed.
    lockReleaseOwedFor: ""
    # Seconds before the admission serving certificate expires that are too few.
    certificateExpiresWithinSeconds: null
    # Bytes of retained schema plans that are too many. The operator prunes no
    # plan, so this is the budget the installation set for them in etcd.
    planStoreBytesAbove: null
    # Operation failures in a window that are too many. Set both or neither.
    failures:
      # The window, as a duration.
      window: ""
      # The count in that window.
      count: null
    # How long the API server may fail to reach the admission webhooks. The
    # alert reads the API server's metrics, so it needs the API server scraped.
    admissionFailingFor: ""

# The admission webhook server inside the manager, which is what refuses an
# approval that does not name an exact plan.
webhook:
  # Port the manager serves admission on.
  port: 9443
  # Timeout the API server applies to the fast admission paths.
  timeoutSeconds: 5
  # The manager-write validator may read one schema, one plan, and up to 16
  # immutable plan projections of 512 KiB each. Kubernetes caps admission
  # timeouts at 30 seconds; keep this fail-closed path at that bound
  # independently of the fast paths.
  controllerWriteTimeoutSeconds: 30
  # Name of a pre-provisioned kubernetes.io/tls Secret. The Secret must also
  # contain ca.crt. Set caBundle to render the chart without cluster lookup.
  existingSecret: ""
  # PEM-encoded CA certificate for existingSecret. Leave empty during a
  # connected Helm install to read ca.crt from that Secret.
  caBundle: ""

# The serving certificates the webhook presents, and the component that issues
# and replaces them without anybody holding a private key.
certificateRotation:
  # Built-in management is automatically omitted when webhook.existingSecret
  # is set. The manager never receives Secret-read permission.
  enabled: true
  # Opt in to recreating a deleted chart-generated Secret. This necessarily
  # grants the rotator namespace-wide Secret CREATE in RBAC; a fail-closed
  # admission policy narrows its use to the exact generated TLS Secret.
  recreateMissingSecret: false
  # How long the rotator waits after a reconciliation that changed nothing.
  interval: "6h"
  # How long every webhook entry trusts both the old and the new CA before a
  # planned CA renewal moves the serving certificate to the new one. At least
  # 1m; empty means the interval.
  caSwitchDelay: ""
  # Ceiling on one reconciliation, including the probes that prove every
  # endpoint serves the new certificate.
  operationTimeout: "15m"
  # First backoff delay after a failed reconciliation.
  retryInitial: "5s"
  # Ceiling on the backoff after repeated failures.
  retryMax: "5m"
  # Port the rotator serves its own health and readiness probes on.
  healthPort: 8081
  # Rotate a certificate once no more than this much validity remains. At
  # least 48h, the life of the bootstrap CA the chart renders.
  renewalThreshold: "720h"
  # Validity of a newly issued serving certificate.
  servingCertificateValidity: "2160h"
  # Validity of a newly issued CA certificate.
  caCertificateValidity: "26280h"
  # Ceiling on waiting for every webhook endpoint to serve a replacement
  # certificate before the rotation is abandoned.
  probeTimeout: "5m"
  # How often those endpoints are probed while waiting.
  probeInterval: "2s"
  # Duration of the Lease that makes one rotator the one doing the work.
  leaseDuration: "10m"
  # How long a rotator waits for that Lease before giving up this pass.
  leaseAcquireTimeout: "30s"
  # Rotator container resources. It sleeps between passes and does a few
  # seconds of work in each.
  resources:
    # What the rotator container is guaranteed.
    requests:
      # CPU request for the rotator container.
      cpu: 10m
      # Memory request for the rotator container.
      memory: 32Mi
    # The ceiling, memory only, for the same reason as the manager.
    limits:
      # Memory limit for the rotator container.
      memory: 64Mi

# A ClusterRole for the people who approve changes: read schemas, migrations,
# their plans, the chunks a schema plan's SQL is stored in, and approvals,
# create an approval of either kind, and create the acknowledgment that settles
# a migration run nobody accounted for. It reads no ConfigMap and no Pod log.
# Bind it yourself; the chart binds nobody.
approverClusterRole:
  # Whether to create that ClusterRole.
  create: true

# A PodDisruptionBudget for the manager, so a drain cannot take every replica
# at once.
podDisruptionBudget:
  # Whether to create the PodDisruptionBudget.
  enabled: true
  # Replicas that must stay available during a voluntary disruption.
  minAvailable: 1
