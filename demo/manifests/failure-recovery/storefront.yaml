# The storefront schema, twice: storefront-unreachable.yaml names a Secret
# whose database does not answer, and storefront.yaml the one that does. The
# two files differ in that one line, which is the whole of the repair.
apiVersion: operator.ptah.run/v1alpha1
kind: PtahSchema
metadata:
  name: storefront
spec:
  target:
    engine: PostgreSQL
    coordinationKey: demo/storefront/primary
    urlFrom:
      name: demo-database
      key: url
  desired:
    configMap:
      name: storefront-v1
      items:
        - key: schema.sql
          path: schema.sql
  policy:
    apply: Always
    allowDestructive: false
    driftSeverity: all
  interval: 1m
  execution:
    activeDeadlineSeconds: 300
    failureRetryInterval: 10s
    connectTimeout: 30s
