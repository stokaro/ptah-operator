# Ptah's own baseline, as a Job, for a database the cluster can reach and a
# workstation cannot.
#
# It replays the migration files into an empty shadow database and compares
# the schema they produce with the target's, through the version below. Only
# when the two agree does it write the history; otherwise it writes nothing.
# The image is a name to replace: kubectl set image puts in the executor image
# the chart runs, its executorImage value.
apiVersion: batch/v1
kind: Job
metadata:
  name: baseline-v2
  labels:
    app.kubernetes.io/name: demo-adopt
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-adopt
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: baseline
          image: ptah-executor
          command: ["/usr/local/bin/ptah"]
          args:
            - migrations
            - baseline
            - --migrations-dir=/migrations
            - --dir-format=ptah
            - --db-url=$(TARGET_URL)
            - --shadow-db=$(SHADOW_URL)
            - --version=2
          env:
            - {name: HOME, value: /work}
            - {name: TMPDIR, value: /work}
            # The database to adopt, and a shadow that holds nothing else:
            # baseline empties it before it replays anything.
            - name: TARGET_URL
              valueFrom: {secretKeyRef: {name: demo-database, key: url}}
            - name: SHADOW_URL
              valueFrom: {secretKeyRef: {name: demo-shadow-database, key: url}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          # One mount per file: a ConfigMap volume is a directory of symlinks,
          # and a reader that walks into it finds every file twice.
          volumeMounts:
            - {name: migrations, mountPath: /migrations/0000000001_create_shipments.up.sql, subPath: 0000000001_create_shipments.up.sql}
            - {name: migrations, mountPath: /migrations/0000000001_create_shipments.down.sql, subPath: 0000000001_create_shipments.down.sql}
            - {name: migrations, mountPath: /migrations/0000000002_add_carrier.up.sql, subPath: 0000000002_add_carrier.up.sql}
            - {name: migrations, mountPath: /migrations/0000000002_add_carrier.down.sql, subPath: 0000000002_add_carrier.down.sql}
            - {name: work, mountPath: /work}
      volumes:
        - name: migrations
          configMap: {name: shipments-migrations}
        - name: work
          emptyDir: {sizeLimit: 64Mi}
