id: mysql-partial-failure
title: Recover a MySQL migration that stopped halfway
tagline: DDL that committed, a run nobody can retry, and a repair decided by what the database holds.
learn: How to find out what a partial MySQL migration left behind before choosing how to repair it.
start: >-
  The lab's MySQL, empty, with its URL in the Secret demo-mysql-database. Three releases of one
  sequence sit in demo/mysql: 1 creates the table, 2 adds a migration whose last statement fails, and
  3 carries it corrected. Each becomes a ConfigMap, and a manifest per release selects its files.
tags: [Operations]

reset:
  - demo/bin/lab reset

steps:
  - note: Each release becomes a ConfigMap. The resource reads release 1; every run waits for a person.
    run: |
      for release in 1 2 3; do
        kubectl -n "$NAMESPACE" create configmap "deliveries-release-$release" --from-file="demo/mysql/release-$release"
      done
      kubectl -n "$NAMESPACE" apply -f demo/manifests/mysql-partial-failure/deliveries-release-1.yaml
    sync: release 1
    expect:
      exit: 0
      # Each ConfigMap by name: the loop's status is the last command's, so a
      # create that failed earlier shows only in what it did not print.
      stdout_contains:
        - configmap/deliveries-release-1 created
        - configmap/deliveries-release-2 created
        - configmap/deliveries-release-3 created
        - deliveries created

  - note: The operator reads the history and plans release 1.
    run: kubectl ptah wait migration/deliveries -n "$NAMESPACE" --for approval
    expect:
      exit: 0
      stdout_contains: [reached approval]
      resource:
        kind: ptahmigration
        name: deliveries
        generation: current
        condition:
          type: ApprovalRequired
          status: "True"
          reason: AwaitingApproval

  - note: Approve it, and wait for the table.
    run: kubectl ptah approve migration/deliveries -n "$NAMESPACE" --name deliveries-release-1 --wait
    answers:
      - prompt: "Type yes to approve: "
        type: "yes"
    expect:
      exit: 0
      stdout_contains: [Create Deliveries, "Type yes to approve: yes", "Approved: PtahMigrationApproval", reached applied]

  - note: Three deliveries arrive. The next release has to keep them.
    run: |
      kubectl -n "$NAMESPACE" exec deploy/demo-mysql-client -- mysql demo -e \
        "INSERT INTO deliveries VALUES (1, 'D-100'), (2, 'D-200'), (3, 'D-300'); SELECT * FROM deliveries"
    expect:
      exit: 0
      stdout_contains: ["1\tD-100", "2\tD-200", "3\tD-300"]

  - note: Release 2 adds a status, fills it, then constrains it, naming a column that is not there.
    run: cat demo/mysql/release-2/0000000002_add_status.up.sql
    expect:
      exit: 0
      stdout_contains: [ADD COLUMN status, "UPDATE deliveries", "CHECK (statuz"]

  - note: Point the resource at release 2. The manifest names the next ConfigMap and its new files.
    run: |
      diff -u demo/manifests/mysql-partial-failure/deliveries-release-1.yaml demo/manifests/mysql-partial-failure/deliveries-release-2.yaml
      kubectl -n "$NAMESPACE" apply -f demo/manifests/mysql-partial-failure/deliveries-release-2.yaml
    sync: release 2
    expect:
      exit: 0
      stdout_contains: ["+      name: deliveries-release-2", deliveries configured]

  - note: The plan holds version 2 alone.
    run: kubectl ptah wait migration/deliveries -n "$NAMESPACE" --for approval
    expect:
      exit: 0
      stdout_contains: [reached approval]
      resource:
        kind: ptahmigration
        name: deliveries
        generation: current
        condition:
          type: ApprovalRequired
          status: "True"
          reason: AwaitingApproval

  # The wait ends at once when the run ends partway: a run that committed some
  # of a migration's statements cannot be retried, and nothing runs until the
  # database has been read again or a person has accounted for it.
  - note: Approve it. The run stops partway, and the wait says it will not end applied.
    run: kubectl ptah approve migration/deliveries -n "$NAMESPACE" --name deliveries-release-2 --wait
    answers:
      - prompt: "Type yes to approve: "
        type: "yes"
    sync: stopped
    expect:
      exit: 8
      stdout_contains: [Add Status, "Type yes to approve: yes", "Approved: PtahMigrationApproval", will not reach applied, Partial]

  # Two records, deliberately apart. The last run is the history of what
  # happened; the unresolved run is a hold that stands until a reading of the
  # database or a person settles it.
  - note: The last run ended Partial, and an unresolved run holds the resource. Two different records.
    run: kubectl ptah migration deliveries -n "$NAMESPACE"
    expect:
      exit: 0
      stdout_contains: ["Last run:             Partial", "Unresolved run:       Partial", "no Apply is dispatched"]
      resource:
        kind: ptahmigration
        name: deliveries
        condition:
          type: Blocked
          status: "True"
          reason: ApplyOutcomeUnknown

  - note: First, what committed. The column exists and every row was filled.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-mysql-client -- mysql demo -e "SELECT id, reference, status FROM deliveries ORDER BY id"
    expect:
      exit: 0
      stdout_contains: ["1\tD-100\topen", "3\tD-300\topen"]

  - note: The revision table agrees. Version 2 stopped after two of its three statements.
    run: |
      kubectl -n "$NAMESPACE" exec deploy/demo-mysql-client -- mysql demo -e \
        "SELECT version, applied, total, state FROM schema_migrations ORDER BY version"
    expect:
      exit: 0
      stdout_contains: ["version\tapplied\ttotal\tstate", "1\t1\t1\tapplied", "2\t2\t3\t"]

  # The repair this run demonstrates, on a disposable database: undo the two
  # statements that committed and the history row that recorded them. It is
  # not a general recovery. A real database needs its changes judged first,
  # and Operations, "A migration run nobody accounted for", is the procedure.
  - note: "Disposable lab only: undo both statements by hand. A real database needs them judged first."
    run: |
      kubectl -n "$NAMESPACE" exec deploy/demo-mysql-client -- mysql demo -e \
        "ALTER TABLE deliveries DROP COLUMN status; DELETE FROM schema_migrations WHERE version = 2"
    sync: repaired
    expect:
      exit: 0

  - note: Point the resource at release 1, which ends before the migration that failed.
    run: kubectl -n "$NAMESPACE" apply -f demo/manifests/mysql-partial-failure/deliveries-release-1.yaml
    expect:
      exit: 0
      stdout_contains: [deliveries configured]

  # Only a reading that began after the change counts, and the record clears
  # on the first one that finds nothing of the artifact left to apply.
  - note: Its next reading of the history finds nothing to apply, and that reading clears the record.
    run: kubectl ptah wait migration/deliveries -n "$NAMESPACE" --for in-sync
    sync: cleared
    expect:
      exit: 0
      stdout_contains: [reached in-sync]
      resource:
        kind: ptahmigration
        name: deliveries
        generation: current
        condition:
          type: Ready
          status: "True"
          reason: HistoryMatched

  - note: The hold is gone, and the resource says what settled it.
    run: kubectl ptah migration deliveries -n "$NAMESPACE"
    expect:
      exit: 0
      stdout_contains: ["Settled run:", "by a history read", "Last run:             Partial"]
      stdout_absent: ["Unresolved run:"]

  - note: Release 3 carries the corrected migration. Point the resource at it.
    run: |
      diff -u demo/manifests/mysql-partial-failure/deliveries-release-2.yaml demo/manifests/mysql-partial-failure/deliveries-release-3.yaml
      kubectl -n "$NAMESPACE" apply -f demo/manifests/mysql-partial-failure/deliveries-release-3.yaml
    sync: release 3
    expect:
      exit: 0
      stdout_contains: ["+      name: deliveries-release-3", deliveries configured]

  - note: Its plan holds the corrected version 2.
    run: kubectl ptah wait migration/deliveries -n "$NAMESPACE" --for approval
    expect:
      exit: 0
      stdout_contains: [reached approval]
      resource:
        kind: ptahmigration
        name: deliveries
        generation: current
        condition:
          type: ApprovalRequired
          status: "True"
          reason: AwaitingApproval

  - note: Approve it the same way.
    run: kubectl ptah approve migration/deliveries -n "$NAMESPACE" --name deliveries-release-3 --wait
    answers:
      - prompt: "Type yes to approve: "
        type: "yes"
    sync: approved
    expect:
      exit: 0
      stdout_contains: [Add Status, "Type yes to approve: yes", "Approved: PtahMigrationApproval", reached applied]

  - note: All three statements ran this time, and the three deliveries are still there.
    run: |
      kubectl -n "$NAMESPACE" exec deploy/demo-mysql-client -- mysql demo -e \
        "SELECT version, applied, total, state FROM schema_migrations ORDER BY version;
         SELECT id, reference, status FROM deliveries ORDER BY id"
    sync: converged
    expect:
      exit: 0
      stdout_contains: ["2\t3\t3\tapplied", "1\tD-100\topen", "2\tD-200\topen", "3\tD-300\topen"]
      resource:
        kind: ptahmigration
        name: deliveries
        fields:
          - path: status.lastRun.outcome
            equals: Applied
