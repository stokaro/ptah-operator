id: manual-approval
title: Approve a plan
tagline: With apply set to OnApproval, nothing runs until a person approves that exact plan.
learn: What an approval is bound to, and how much of that binding you never type.
tags: [Safety]

# Scope, because this scenario is easy to read as more than it is: the lab
# creates the resource and its approval under one identity, so what it shows is
# the approval object, its bindings and the admission stamp -- not that an
# author and an approver were two different people. Separation of those two is
# an RBAC question, and keeping an author from making the approval unnecessary
# is an admission question: examples/approval-policy-guard.yaml, and the
# security model's "Who may turn the approval requirement off".

reset:
  - demo/bin/lab reset
  # The lab generates the registry's credentials and address, and says what
  # they are. What publishes the artifact is `ptah schema push`, the product's
  # own command, run the way a reader or a CI job runs it.
  - |
    eval "$(demo/bin/lab credentials)"
    export PTAH_OCI_USERNAME PTAH_OCI_PASSWORD PTAH_OCI_REGISTRY
    ptah schema push "oci://$PTAH_OCI_REGISTRY/schemas/demo:v1-$$" \
      --schema-file demo/schemas/v1.sql --dialect postgres --plain-http \
      | sed -n 's/^Digest: //p' > demo/.lab/digest

steps:
  - note: Same resource, one field different -- apply is OnApproval, which is the default.
    run: APPLY=OnApproval demo/bin/lab manifest storefront "$(cat demo/.lab/digest)" | tee demo/.lab/storefront.yaml
    sync: applying
    expect:
      exit: 0
      stdout_contains: ["apply: OnApproval"]

  - note: Apply it, and the operator plans but stops.
    run: kubectl apply -f demo/.lab/storefront.yaml
    expect:
      exit: 0
      stdout_contains: [created]

  - note: It has a plan and it is waiting. The database has not been touched.
    await:
      kind: ptahschema
      name: storefront
      timeout: 6m
      condition:
        # Waiting, not PlanReady. PlanReady is the moment the plan was
        # published; Waiting is the state the operator stays in until someone
        # decides, and a demonstration that watched the moment would be racing
        # the controller.
        type: ApprovalRequired
        status: "True"
        reason: Waiting
    run: |
      kubectl -n "$NAMESPACE" get ptahschema storefront -o json \
        | jq -r '.status.phase, (.status.conditions[] | select(.type == "ApprovalRequired") | .message)'
    sync: awaiting approval
    expect:
      exit: 0
      # AwaitingApproval is the phase the command printed, not a phrase from a
      # message. What the condition says is read as fields in the await above.
      stdout_contains: [AwaitingApproval]

  - note: Nothing was created. This is what waiting looks like from the database.
    # psql says so on stderr, so that is the stream this step shows.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "\dt"
    show: [stderr]
    expect:
      exit: 0
      stderr_contains: ["Did not find any relations"]

  - note: Read the plan before approving it. This is what would run.
    # The current plan, because nothing has been applied yet. -o json is the
    # stored plan document, so the severity beside each statement is the
    # plan's own rather than a reading of the SQL.
    run: |
      kubectl ptah plan storefront --current -n "$NAMESPACE" -o json \
        | jq -r '.statements[] | "\(.severity)\t\(.sql)"'
    expect:
      exit: 0
      stdout_contains: ['CREATE TABLE "customers"', safe]

  - note: An approval names the schema, the plan, and the fingerprint of that plan.
    run: |
      kubectl -n "$NAMESPACE" get ptahschema storefront -o json > demo/.lab/schema.json
      kubectl -n "$NAMESPACE" get ptahschemaplan \
        "$(jq -r .status.plan.name demo/.lab/schema.json)" -o json > demo/.lab/plan.json
      jq -n --slurpfile schema demo/.lab/schema.json --slurpfile plan demo/.lab/plan.json '
        {
          apiVersion: "operator.ptah.run/v1alpha1", kind: "PtahSchemaApproval",
          metadata: {name: "storefront-v1"},
          spec: {
            schemaRef: {name: $schema[0].metadata.name, uid: $schema[0].metadata.uid},
            planRef:   {name: $plan[0].metadata.name,   uid: $plan[0].metadata.uid},
            planFingerprint: $plan[0].spec.fingerprint
          }
        }' | tee demo/.lab/approval.json | jq -c .spec
    expect:
      exit: 0
      stdout_contains: ['"planFingerprint":"sha256:']

  - note: Create it. The webhook stamps who you are and binds the rest of the plan's identity.
    run: kubectl -n "$NAMESPACE" create -f demo/.lab/approval.json
    sync: approved
    expect:
      exit: 0
      stdout_contains: [created]

  - note: None of this was typed. The webhook read it off the plan being approved.
    run: |
      kubectl -n "$NAMESPACE" get ptahschemaapproval storefront-v1 -o json \
        | jq -r '.spec | {approver: .approver.username, ptahVersion, executorImage, artifactDigest, executionBindingID}'
    expect:
      exit: 0
      stdout_contains: [approver, ptahVersion, executorImage]
      resource:
        kind: ptahschemaapproval
        name: storefront-v1
        fields:
          - path: spec.approver.username
            notEmpty: true
          - path: spec.artifactDigest
            notEmpty: true
          - path: spec.executorImage
            notEmpty: true
          - path: spec.mutationRequestUID
            notEmpty: true

  - note: With the decision recorded, the plan runs and convergence is proved.
    await:
      kind: ptahschema
      name: storefront
      timeout: 6m
      condition:
        type: InSync
        status: "True"
        reason: ScopedConverged
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "\dt"
    sync: converged
    expect:
      exit: 0
      stdout_contains: [customers]

  - note: It was dispatched once, and is already stale. Retiring a used approval shows why.
    run: |
      kubectl -n "$NAMESPACE" get ptahschemaapproval storefront-v1 -o json \
        | jq -r '.status.conditions[] | "\(.type)\t\(.status)\t\(.reason)"'
    expect:
      exit: 0
      stdout_contains: [Consumed, DispatchCommitted]
      resource:
        kind: ptahschemaapproval
        name: storefront-v1
        condition:
          type: Consumed
          status: "True"
          reason: DispatchCommitted
