id: manual-approval
title: Approve a plan
tagline: With apply set to OnApproval, nothing runs until a person approves that exact plan.
learn: What an approval is bound to, and how much of that binding you never type.
start: >-
  An empty database and a namespace with the lab's Secrets. The schema is read from a ConfigMap, the
  delivery a team uses when its manifests already carry the files; Apply a schema shows the same
  resource reading an artifact.
tags: [Safety]

# Scope, because this scenario is easy to read as more than it is: the lab
# creates the resource and its approval under one identity, so what it shows is
# the approval object, its bindings and the admission stamp -- not that an
# author and an approver were two different people. Separation of those two is
# an RBAC question, and keeping an author from making the approval unnecessary
# is an admission question: the chart's applyPolicyGuard, and the security
# model's "Who may turn the approval requirement off".

reset:
  - demo/bin/lab reset

steps:
  - note: The resource reads its schema from a ConfigMap, and asks for a person -- apply OnApproval.
    run: cat demo/manifests/manual-approval/storefront.yaml
    sync: applying
    expect:
      exit: 0
      stdout_contains: ["apply: OnApproval", "name: storefront-v1"]

  - note: Put the SQL in the ConfigMap it names, and apply it.
    run: |
      kubectl -n "$NAMESPACE" create configmap storefront-v1 --from-file=schema.sql=demo/schemas/v1.sql
      kubectl -n "$NAMESPACE" apply -f demo/manifests/manual-approval/storefront.yaml
    expect:
      exit: 0
      stdout_contains: [configmap/storefront-v1 created, storefront created]

  # The wait ends when a plan computed from a reading of the database waits
  # for a decision: not the moment the plan is published, but the state the
  # operator stays in until someone decides.
  - note: The operator plans, and stops. Wait until it does.
    run: kubectl ptah wait schema/storefront -n "$NAMESPACE" --for approval
    sync: awaiting approval
    expect:
      exit: 0
      stdout_contains: [reached approval]
      resource:
        kind: ptahschema
        name: storefront
        generation: current
        condition:
          type: ApprovalRequired
          status: "True"
          reason: Waiting

  - note: It has a plan and it is waiting, and the condition says what it is waiting for.
    run: kubectl ptah schema storefront -n "$NAMESPACE"
    expect:
      exit: 0
      stdout_contains: [AwaitingApproval, not approved, "ApprovalRequired: True, Waiting"]

  - note: Nothing was created. This is what waiting looks like from the database.
    # psql says so on stderr, so that is the stream this step shows.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "\dt"
    show: [stderr]
    expect:
      exit: 0
      stderr_contains: ["Did not find any relations"]

  # approve reads the schema and its current plan, prints the plan with each
  # statement's severity and the identities the approval will carry, and asks.
  # Typed yes, it creates the approval as you; admission stamps who and when.
  # It reads the schema again first and sends nothing if the plan was
  # replaced meanwhile. --wait stays until that plan has been applied and the
  # database read afterwards.
  - note: Approve it. It shows the exact plan, asks, and creates the approval bound to it.
    run: kubectl ptah approve schema/storefront -n "$NAMESPACE" --name storefront-v1 --wait
    answers:
      - prompt: "Type yes to approve: "
        type: "yes"
    sync: approved
    expect:
      exit: 0
      stdout_contains: ['CREATE TABLE "customers"', "safe", "Fingerprint:", "Type yes to approve: yes",
        "Approved: PtahSchemaApproval", reached applied]
      resource:
        kind: ptahschemaapproval
        name: storefront-v1
        fields:
          - path: spec.approver.username
            notEmpty: true
          - path: spec.approvedAt
            notEmpty: true
          - path: spec.mutationRequestUID
            notEmpty: true

  - note: With the decision recorded, the plan ran and convergence was proved.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "\dt"
    sync: converged
    expect:
      exit: 0
      stdout_contains: [customers]
      resource:
        kind: ptahschema
        name: storefront
        condition:
          type: InSync
          status: "True"
          reason: ScopedConverged

  # The approval stays listed with the schema, with the identity admission
  # stamped and the controller's conditions: Consumed is the dispatch it
  # authorized, and Stale that the plan it names is no longer current.
  # kubectl describe ptahschemaapproval storefront-v1 shows the one object whole.
  - note: Who approved, when, which plan, and what became of it. Used once, and already stale.
    run: kubectl ptah schema storefront -n "$NAMESPACE"
    expect:
      exit: 0
      stdout_contains: [storefront-v1, approved by, the applied plan, Consumed, DispatchCommitted]
      resource:
        kind: ptahschemaapproval
        name: storefront-v1
        condition:
          type: Consumed
          status: "True"
          reason: DispatchCommitted
