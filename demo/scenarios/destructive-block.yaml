id: destructive-block
title: Refuse a destructive change
tagline: The third revision drops a column. The policy says no, and says so before anything runs.
learn: How a policy stops a plan, and where to read what it stopped.
start: >-
  Where Change the schema ends: storefront converged on schemas/v2.sql, published as an artifact,
  under apply Always with allowDestructive false.
tags: [Safety]

reset:
  - demo/bin/lab reset
  - |
    ptah schema push "oci://$PTAH_OCI_REGISTRY/schemas/demo:v2-$$" \
      --schema-file demo/schemas/v2.sql --dialect postgres --plain-http \
      | sed -n 's/^Digest: //p' > demo/.lab/digest
  - APPLY=Always demo/bin/lab manifest storefront "$(cat demo/.lab/digest)" | kubectl apply -f -
  - kubectl -n "$NAMESPACE" wait --for=condition=InSync --timeout=360s ptahschema/storefront

steps:
  - note: Converged on v2, and the email column holds data.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "INSERT INTO customers (id, email) VALUES (1, 'a@example.test') RETURNING id, email"
    sync: converged
    expect:
      exit: 0
      stdout_contains: ["a@example.test"]

  - note: The next revision removes that column. Someone meant it; the database does not know that.
    run: diff -u demo/schemas/v2.sql demo/schemas/v3.sql || true
    expect:
      exit: 0
      stdout_contains: ["-  email text NOT NULL"]

  - note: The policy in force allows nothing destructive, and the schema says so.
    run: kubectl ptah schema storefront -n "$NAMESPACE"
    expect:
      exit: 0
      stdout_contains: ["apply Always, allowDestructive false"]
      resource:
        kind: ptahschema
        name: storefront
        fields:
          - path: spec.policy.allowDestructive
            equals: "false"

  # Without --wait: set-source --wait waits for a plan that asks for an
  # approval or for the resource in sync, and a plan the policy refuses is
  # neither. The wait below is for the phase the refusal puts it in.
  - note: Publish v3 and point the resource at it.
    run: |
      DIGEST=$(ptah schema push "oci://$PTAH_OCI_REGISTRY/schemas/demo:v3-$$" \
        --schema-file demo/schemas/v3.sql --dialect postgres --plain-http | sed -n 's/^Digest: //p')
      kubectl ptah set-source schema/storefront -n "$NAMESPACE" \
        --oci "oci://$REGISTRY_IN_CLUSTER/schemas/demo@$DIGEST"
    sync: planning
    expect:
      exit: 0
      stdout_contains: [Source set for]

  - note: It plans, and stops there. Wait until it says so.
    run: kubectl -n "$NAMESPACE" wait ptahschema/storefront --for=jsonpath='{.status.phase}'=Blocked --timeout=6m
    sync: blocked
    expect:
      exit: 0
      stdout_contains: [condition met]
      resource:
        kind: ptahschema
        name: storefront
        generation: current
        condition:
          type: Ready
          status: "False"
          reason: PolicyBlocked

  # The message on ApprovalRequired is the refusal in the controller's words,
  # and it names the two ways forward.
  - note: Why. The plan is destructive, and allowDestructive is false.
    run: kubectl ptah schema storefront -n "$NAMESPACE"
    expect:
      exit: 0
      stdout_contains: [PolicyBlocked, destructive, DestructiveChangesDisabled]
      resource:
        kind: ptahschema
        name: storefront
        condition:
          type: ApprovalRequired
          status: "False"
          reason: DestructiveChangesDisabled

  - note: And this is the statement the policy refused to run, with the reason Ptah gave.
    # The plan is stored whether or not it may run, so a refusal is a thing a
    # reader can look at rather than infer from a log.
    run: kubectl ptah plan storefront --current -n "$NAMESPACE"
    expect:
      exit: 0
      stdout_contains: ["DROP COLUMN", "Destructive:    true", "destructive"]

  - note: The column and its data are still there. A refusal that let it run would not be one.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "SELECT id, email FROM customers"
    expect:
      exit: 0
      stdout_contains: ["a@example.test"]
      resource:
        kind: ptahschema
        name: storefront
        condition:
          type: Ready
          status: "False"
          reason: PolicyBlocked
