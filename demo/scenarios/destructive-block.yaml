id: destructive-block
title: Refuse a destructive change
tagline: The third revision drops a column. The policy says no, and says so before anything runs.
learn: How a policy stops a plan, and where to read what it stopped.
tags: [Safety]

reset:
  - demo/bin/lab reset
  # The lab generates the registry's credentials and address, and says what
  # they are. What publishes the artifact is `ptah schema push`, the product's
  # own command, run the way a reader or a CI job runs it.
  - |
    eval "$(demo/bin/lab credentials)"
    export PTAH_OCI_USERNAME PTAH_OCI_PASSWORD PTAH_OCI_REGISTRY
    export PATH="$(demo/bin/lab ptah):$PATH"
    ptah schema push "oci://$PTAH_OCI_REGISTRY/schemas/demo:v2-$$" \
      --schema-file demo/schemas/v2.sql --dialect postgres --plain-http \
      | sed -n 's/^Digest: //p' > demo/.lab/digest
  - APPLY=Always demo/bin/lab manifest storefront "$(cat demo/.lab/digest)" | kubectl apply -f -
  - kubectl -n "$NAMESPACE" wait --for=condition=InSync --timeout=360s ptahschema/storefront

steps:
  - note: Converged on v2, and the email column holds data.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "INSERT INTO customers (id, email) VALUES (1, 'a@example.test') RETURNING id, email"
    sync: converged
    expect:
      exit: 0
      stdout_contains: ["a@example.test"]

  - note: The next revision removes that column. Someone meant it; the database does not know that.
    run: diff -u demo/schemas/v2.sql demo/schemas/v3.sql || true
    expect:
      exit: 0
      stdout_contains: ["-  email text NOT NULL"]

  - note: The policy in force allows nothing destructive.
    run: kubectl -n "$NAMESPACE" get ptahschema storefront -o jsonpath='{.spec.policy}{"\n"}'
    expect:
      exit: 0
      stdout_contains: ['"allowDestructive":false']

  - note: Publish v3 and point the resource at it.
    run: |
      eval "$(demo/bin/lab credentials)"
      export PTAH_OCI_USERNAME PTAH_OCI_PASSWORD PTAH_OCI_REGISTRY
      export PATH="$(demo/bin/lab ptah):$PATH"
      DIGEST=$(ptah schema push "oci://$PTAH_OCI_REGISTRY/schemas/demo:v3-$$" \
        --schema-file demo/schemas/v3.sql --dialect postgres --plain-http \
        | sed -n 's/^Digest: //p')
      kubectl -n "$NAMESPACE" patch ptahschema storefront --type=merge \
        -p "{\"spec\":{\"desired\":{\"ociRef\":\"oci://$REGISTRY_IN_CLUSTER/schemas/demo@$DIGEST\"}}}"
    sync: planning
    expect:
      exit: 0
      stdout_contains: [patched]

  - note: It plans, marks the plan destructive, and stops there.
    await:
      kind: ptahschema
      name: storefront
      timeout: 6m
      generation: current
      condition:
        type: Ready
        status: "False"
        reason: PolicyBlocked
    run: |
      kubectl -n "$NAMESPACE" get ptahschema storefront -o json \
        | jq -r '.status.phase, (.status.conditions[] | select(.type == "Ready") | .message)'
    sync: blocked
    expect:
      exit: 0
      stdout_contains: [Blocked]

  - note: The plan exists and says what it is. Destructive is a property of the plan, not a guess.
    run: kubectl -n "$NAMESPACE" get ptahschemaplan
    expect:
      exit: 0
      stdout_contains: [storefront, "true"]

  - note: And this is the statement the policy refused to run.
    run: |
      PLAN=$(kubectl -n "$NAMESPACE" get ptahschema storefront -o jsonpath='{.status.plan.name}')
      for CHUNK in $(kubectl -n "$NAMESPACE" get ptahschemaplan "$PLAN" \
        -o jsonpath='{range .spec.chunks[*]}{.name}{"\n"}{end}'); do
        kubectl -n "$NAMESPACE" get configmap "$CHUNK" -o jsonpath='{.binaryData.chunk}' \
          | base64 -d | jq -r '.statements[] | "\(.severity)  \(.sql)  -- \(.reason)"'
      done
    expect:
      exit: 0
      stdout_contains: ["DROP COLUMN"]

  - note: The column and its data are still there. A refusal that let it run would not be one.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "SELECT id, email FROM customers"
    expect:
      exit: 0
      stdout_contains: ["a@example.test"]
      resource:
        kind: ptahschema
        name: storefront
        fields:
          - path: status.phase
            equals: Blocked
