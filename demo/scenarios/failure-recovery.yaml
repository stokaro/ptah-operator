id: failure-recovery
title: Fail, then recover
tagline: Point it at a database that is not there. It says so, keeps trying, and converges when it is.
learn: What a failure looks like in the status, and that recovery needs no intervention beyond the fix.
tags: [Operations]

reset:
  - demo/bin/lab reset
  # The lab generates the registry's credentials and address, and says what
  # they are. What publishes the artifact is `ptah schema push`, the product's
  # own command, run the way a reader or a CI job runs it.
  - |
    eval "$(demo/bin/lab credentials)"
    export PTAH_OCI_USERNAME PTAH_OCI_PASSWORD PTAH_OCI_REGISTRY
    ptah schema push "oci://$PTAH_OCI_REGISTRY/schemas/demo:v1-$$" \
      --schema-file demo/schemas/v1.sql --dialect postgres --plain-http \
      | sed -n 's/^Digest: //p' > demo/.lab/digest
  - kubectl -n "$NAMESPACE" delete secret demo-database-broken --ignore-not-found
  - kubectl -n "$NAMESPACE" create secret generic demo-database-broken --from-literal=url='postgres://nobody:nobody@no-such-database.demo.svc.cluster.local:5432/storefront?sslmode=disable' 

steps:
  - note: The same resource, pointed at a database that does not answer.
    run: |
      APPLY=Always demo/bin/lab manifest storefront "$(cat demo/.lab/digest)" \
        | sed 's/name: demo-database/name: demo-database-broken/' \
        | kubectl apply -f -
    sync: applying
    expect:
      exit: 0
      stdout_contains: [created]

  - note: It reports the database as unreachable, with a reason a machine can read.
    await:
      kind: ptahschema
      name: storefront
      timeout: 6m
      generation: current
      condition:
        type: ReconciliationFailed
        status: "True"
        reason: OperationFailed
    run: |
      kubectl -n "$NAMESPACE" get ptahschema storefront -o json \
        | jq -r '.status.phase, (.status.conditions[] | select(.type == "ReconciliationFailed") | .message)'
    sync: failed
    expect:
      exit: 0
      stdout_contains: [Failed]

  - note: A failure is an event too, so it is in the record rather than only in a log.
    run: kubectl -n "$NAMESPACE" get events --field-selector involvedObject.name=storefront --sort-by=.lastTimestamp | tail -5
    expect:
      exit: 0
      stdout_contains: [storefront]

  # The check reads the whole status rather than a prefix of it, and it looks
  # for the credential this scenario planted rather than only for the ones the
  # lab generated and the recorder scans for. What it prints afterwards is two
  # fields, so the transcript stays short; the fields are not the check, and a
  # reader is told so.
  - note: No credential in any of it, and the check reads all of it.
    run: |
      status=$(kubectl -n "$NAMESPACE" get ptahschema storefront -o json | jq -c '.status')
      for planted in 'nobody:nobody' 'no-such-database.demo.svc.cluster.local'; do
        if printf '%s' "$status" | grep -qF "$planted"; then
          printf 'the status carries the credential this scenario planted\n' >&2
          exit 1
        fi
      done
      printf 'checked the whole status, %s bytes, no credential in it\n' \
        "$(printf '%s' "$status" | wc -c | tr -d ' ')"
      printf '%s' "$status" | jq -r '
        "phase   " + .phase,
        "reason  " + (.conditions[] | select(.type == "ReconciliationFailed") | .reason)'
    expect:
      exit: 0
      stdout_contains: ["checked the whole status", "no credential in it", OperationFailed]
      stdout_absent: ["nobody:nobody"]

  - note: Now fix the one thing that was wrong.
    run: |
      kubectl -n "$NAMESPACE" patch ptahschema storefront --type=merge \
        -p '{"spec":{"target":{"urlFrom":{"name":"demo-database","key":"url"}}}}'
    sync: applying
    expect:
      exit: 0
      stdout_contains: [patched]

  - note: It retries on its own interval and converges. Nothing was restarted by hand.
    await:
      kind: ptahschema
      name: storefront
      timeout: 6m
      generation: current
      condition:
        type: InSync
        status: "True"
        reason: ScopedConverged
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "\dt"
    sync: converged
    expect:
      exit: 0
      stdout_contains: [customers]
      resource:
        kind: ptahschema
        name: storefront
        condition:
          type: ReconciliationFailed
          status: "False"
          reason: Succeeded
