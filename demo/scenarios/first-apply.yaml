id: first-apply
title: Apply a schema
tagline: Publish a schema as an artifact, point the operator at it, and watch it converge.
learn: What the operator does between a desired state and a database, and how it says it is done.
start: >-
  An empty database and a namespace with the lab's Secrets, as Stand up the lab leaves them. Ptah reads
  the registry credentials from PTAH_OCI_USERNAME and PTAH_OCI_PASSWORD, the way a CI job passes them;
  on a workstation, ptah oci login stores them once instead.
tags: [Lifecycle]

reset:
  - demo/bin/lab reset

steps:
  - note: The desired state is SQL. This is the whole of it.
    run: cat demo/schemas/v1.sql
    sync: publishing
    expect:
      exit: 0
      stdout_contains: [CREATE TABLE customers]

  # Publishing is ptah's own command, run the way a reader or a CI job runs it.
  # The tag ends in $$ because a tag in this registry is written once; what
  # the resource names is the digest, never the tag. The push goes to the
  # registry's address on this machine, and the resource names the address
  # the cluster pulls from, with the same repository and digest.
  - note: Publish it, then create the resource that names that artifact by digest.
    run: |
      DIGEST=$(ptah schema push "oci://$PTAH_OCI_REGISTRY/schemas/demo:v1-$$" \
        --schema-file demo/schemas/v1.sql --dialect postgres --plain-http | sed -n 's/^Digest: //p')
      kubectl apply -n "$NAMESPACE" -f - <<EOF
      apiVersion: operator.ptah.run/v1alpha1
      kind: PtahSchema
      metadata:
        name: storefront
      spec:
        target:
          engine: PostgreSQL
          coordinationKey: demo/storefront/primary
          urlFrom: {name: demo-database, key: url}
        desired:
          ociRef: oci://$REGISTRY_IN_CLUSTER/schemas/demo@$DIGEST
          registryAuthFrom: {name: demo-registry}
          verificationPolicyFrom: {name: demo-verification-policy, key: policy.yaml}
          transport: {plainHTTP: true}
        policy:
          apply: Always
          allowDestructive: false
          driftSeverity: all
        interval: 1m
      EOF
    sync: applying
    expect:
      exit: 0
      stdout_contains: [storefront created]
      resource:
        kind: ptahschema
        name: storefront
        fields:
          - path: spec.desired.ociRef
            notEmpty: true
          - path: spec.policy.apply
            equals: Always

  # The wait counts only a reading of the database that began after it did,
  # so the schema it reports in sync is one the operator read after the
  # resource existed.
  - note: Resolve, verify, observe, plan, apply, and prove. Nothing else is typed until it is done.
    run: kubectl ptah wait schema/storefront -n "$NAMESPACE" --for in-sync
    sync: converged
    expect:
      exit: 0
      stdout_contains: [reached in-sync]
      resource:
        kind: ptahschema
        name: storefront
        generation: current
        condition:
          type: InSync
          status: "True"
          reason: ScopedConverged
        fields:
          - path: status.applied.artifactDigest
            notEmpty: true

  - note: Each step is a condition. Applying False, JobCompleted is a finished Job, not convergence.
    run: kubectl ptah schema storefront -n "$NAMESPACE"
    expect:
      exit: 0
      stdout_contains: ["Phase:", InSync, ScopedConverged, JobCompleted]
      resource:
        kind: ptahschema
        name: storefront
        condition:
          type: Applying
          status: "False"
          reason: JobCompleted

  - note: What it ran is stored, and one read-only command prints it.
    # The plan lives in immutable PtahSchemaPlanChunk objects that a manifest
    # binds by index, size and digest. This reads it the way the operator
    # does: every chunk, checked against its binding, joined in order and
    # checked as a whole before a line of it is printed.
    run: kubectl ptah plan storefront --applied -n "$NAMESPACE" -o sql
    expect:
      exit: 0
      stdout_contains: ['CREATE TABLE "customers"']

  - note: And the database has it.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "\d customers"
    expect:
      exit: 0
      stdout_contains: [customers_pkey]
