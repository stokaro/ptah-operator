id: first-apply
title: Apply a schema
tagline: Publish a schema as an artifact, point the operator at it, and watch it converge.
learn: What the operator does between a desired state and a database, and how it says it is done.
tags: [Lifecycle]

reset:
  - demo/bin/lab reset

steps:
  - note: The desired state is SQL. This is the whole of it.
    run: cat demo/schemas/v1.sql
    sync: publishing
    expect:
      exit: 0
      stdout_contains: [CREATE TABLE customers]

  - note: The lab tells you where its registry is and what it generated for you.
    run: |
      eval "$(demo/bin/lab credentials)"
      export PTAH_OCI_USERNAME PTAH_OCI_PASSWORD PTAH_OCI_REGISTRY
      echo "registry: $PTAH_OCI_REGISTRY"
    sync: publishing
    expect:
      exit: 0
      stdout_contains: ["registry: "]
      stdout_absent: ["PTAH_OCI_PASSWORD"]

  - note: Publish the schema. This is ptah's own command, run as you or CI would.
    run: |
      eval "$(demo/bin/lab credentials)"
      export PTAH_OCI_USERNAME PTAH_OCI_PASSWORD PTAH_OCI_REGISTRY
      ptah schema push "oci://$PTAH_OCI_REGISTRY/schemas/demo:v1-$$" \
        --schema-file demo/schemas/v1.sql --dialect postgres --plain-http \
        | tee /dev/stderr | sed -n 's/^Digest: //p' > demo/.lab/digest
    show: [stderr]
    expect:
      exit: 0
      stderr_contains: ["Pushed schema as oci://", "Digest: sha256:"]

  - note: The resource names the artifact by digest, and the credentials by Secret.
    run: APPLY=Always demo/bin/lab manifest storefront "$(cat demo/.lab/digest)" | tee demo/.lab/storefront.yaml
    sync: applying
    expect:
      exit: 0
      stdout_contains: ["kind: PtahSchema", "ociRef: oci://", "urlFrom"]
      stdout_absent: ["password:"]

  - note: Apply it. Nothing else is typed after this; the operator does the rest.
    run: kubectl apply -f demo/.lab/storefront.yaml
    expect:
      exit: 0
      stdout_contains: [created]

  - note: Resolve, verify, observe, plan, apply, and prove. Each is a condition.
    await:
      kind: ptahschema
      name: storefront
      timeout: 6m
      condition:
        type: InSync
        status: "True"
        reason: ScopedConverged
    run: |
      kubectl -n "$NAMESPACE" get ptahschema storefront -o json \
        | jq -r '.status.conditions[] | "\(.type)\t\(.status)\t\(.reason)"' | column -t -s "$(printf '\t')"
    sync: converged
    expect:
      exit: 0
      # The claim is the condition, read as fields in the resource block below.
      # What stdout is asked for is only that the reader was shown it.
      stdout_contains: [InSync, ScopedConverged, JobCompleted]
      resource:
        kind: ptahschema
        name: storefront
        condition:
          type: Ready
          status: "True"
          reason: InSync
        fields:
          - path: status.phase
            equals: InSync
          - path: status.applied.artifactDigest
            notEmpty: true

  - note: Applying says False, reason JobCompleted. A finished Job is not a converged database.
    run: |
      kubectl -n "$NAMESPACE" get ptahschema storefront -o json \
        | jq -r '.status.conditions[] | select(.type == "Applying" or .type == "InSync") | "\(.type): \(.message)"'
    expect:
      exit: 0
      # A message is prose and will be reworded. What this step claims is in
      # the resource block: the reason on Applying is JobCompleted, and that is
      # not the same thing as converged.
      stdout_contains: ["Applying:", "InSync:"]
      resource:
        kind: ptahschema
        name: storefront
        condition:
          type: Applying
          status: "False"
          reason: JobCompleted

  - note: The plan it derived, and the SQL that plan carried.
    run: kubectl -n "$NAMESPACE" get ptahschemaplan
    expect:
      exit: 0
      stdout_contains: [storefront]

  - note: What it ran is stored, and one read-only command prints it.
    # The plan lives in immutable ConfigMaps that a manifest binds by index,
    # size and digest. This reads it the way the operator does: every chunk,
    # checked against its binding, joined in order and checked as a whole
    # before a line of it is printed.
    run: kubectl ptah plan storefront --applied -n "$NAMESPACE" -o sql
    expect:
      exit: 0
      stdout_contains: ['CREATE TABLE "customers"']

  - note: And the database has it.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "\d customers"
    expect:
      exit: 0
      stdout_contains: [customers_pkey]
