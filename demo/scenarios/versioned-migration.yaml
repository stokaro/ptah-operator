id: versioned-migration
title: Run a prepared migration sequence
tagline: Numbered SQL files in an artifact, matched against the database's own record of what has run.
learn: How the versioned workflow differs from the declarative one, and what the database is asked before anything executes.
start: >-
  An empty database and a namespace with the lab's Secrets, as Stand up the lab leaves them, with no
  migration history.
tags: [Lifecycle]

reset:
  - demo/bin/lab reset

steps:
  - note: The sequence is files. Numbered, with a direction, and written by a person.
    run: ls demo/migrations
    expect:
      exit: 0
      stdout_contains: [0000000001_create_shipments.up.sql, 0000000002_add_carrier.up.sql]

  - note: The second one adds a column, fills it, and only then constrains it. Order is the point.
    run: cat demo/migrations/0000000002_add_carrier.up.sql
    expect:
      exit: 0
      stdout_contains: [ADD COLUMN carrier, "UPDATE shipments", SET NOT NULL]

  # ptah migrations push is the product's own command, run the way a reader or
  # a CI job runs it. The resource names the database, the artifact by digest,
  # and what may be done about the difference: apply OnApproval.
  - note: Publish the directory, and create the resource that names it and asks for a person.
    run: |
      REF=$(ptah migrations push "oci://$PTAH_OCI_REGISTRY/migrations/demo:v1-$$" \
        --migrations-dir demo/migrations --dir-format ptah --version "v1-$$" --plain-http --format reference)
      PULL="oci://$REGISTRY_IN_CLUSTER/${REF#"oci://$PTAH_OCI_REGISTRY/"}"
      kubectl apply -n "$NAMESPACE" -f - <<EOF
      apiVersion: operator.ptah.run/v1alpha1
      kind: PtahMigration
      metadata:
        name: shipments
      spec:
        target:
          engine: PostgreSQL
          coordinationKey: demo/storefront/primary
          urlFrom: {name: demo-database, key: url}
        artifact:
          ociRef: $PULL
          registryAuthFrom: {name: demo-registry}
          verificationPolicyFrom: {name: demo-migration-verification-policy, key: policy.yaml}
          transport: {plainHTTP: true}
        policy:
          apply: OnApproval
          lockTimeout: 30s
        interval: 1m
      EOF
    sync: publishing
    expect:
      exit: 0
      stdout_contains: [shipments created]
      resource:
        kind: ptahmigration
        name: shipments
        fields:
          - path: spec.policy.apply
            equals: OnApproval

  - note: The operator resolves the artifact, verifies it, and reads the database's history.
    run: kubectl ptah wait migration/shipments -n "$NAMESPACE" --for approval
    sync: awaiting approval
    expect:
      exit: 0
      stdout_contains: [reached approval]
      resource:
        kind: ptahmigration
        name: shipments
        generation: current
        condition:
          type: ApprovalRequired
          status: "True"
          reason: AwaitingApproval

  - note: Two migrations pending against an empty history, and a plan waiting for a decision.
    run: kubectl ptah migration shipments -n "$NAMESPACE"
    expect:
      exit: 0
      # The order and the descriptions, and no statement anywhere: a published
      # plan records versions and checksums, and the SQL stays in the artifact.
      stdout_contains: [AwaitingApproval, "Current version:      0", "Pending:              2", Create Shipments, Add Carrier]
      stdout_absent: ["CREATE TABLE", "ALTER TABLE"]

  - note: No migration has run, and reading the history wrote nothing. The database is still empty.
    # Ptah reads the history without creating its revision table, so a
    # database nobody has migrated reads as an empty history. \dt says so on
    # stderr, so that is the stream this step shows.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "\dt"
    show: [stderr]
    expect:
      exit: 0
      stderr_contains: ["Did not find any relations"]

  # A migration plan records versions and checksums; its SQL stays in the
  # artifact, and approve says so rather than claiming to have shown it.
  - note: Approve it. The plan is versions and checksums, and the approval names its fingerprint.
    run: kubectl ptah approve migration/shipments -n "$NAMESPACE" --name shipments-v1 --wait
    answers:
      - prompt: "Type yes to approve: "
        type: "yes"
    sync: approved
    expect:
      exit: 0
      stdout_contains: ["Fingerprint:", "checksum", "not shown here", "Type yes to approve: yes",
        "Approved: PtahMigrationApproval", reached applied]
      resource:
        kind: ptahmigrationapproval
        name: shipments-v1
        fields:
          - path: spec.approver.username
            notEmpty: true
          - path: spec.planFingerprint
            notEmpty: true
          - path: spec.mutationRequestUID
            notEmpty: true

  - note: The sequence ran, and the column is constrained the way migration 2 left it.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "\d shipments"
    sync: converged
    expect:
      exit: 0
      stdout_contains: [carrier, "not null"]

  # The verdict comes from the revision table, read back after the run, not
  # from the Job's exit code; the approval is listed with the run it allowed.
  - note: The verdict is the database's, read from the revision table and not from the Job's exit code.
    run: kubectl ptah migration shipments -n "$NAMESPACE"
    expect:
      exit: 0
      stdout_contains: [InSync, "Current version:      2", "Pending:              0", "Last run:             Applied",
        "Versions:           1, 2", "No plan is published.", shipments-v1]
      stdout_absent: ["CREATE TABLE", "ALTER TABLE"]
      resource:
        kind: ptahmigration
        name: shipments
        condition:
          type: Ready
          status: "True"
          reason: HistoryMatched
        fields:
          - path: status.lastRun.jobUID
            keep: the-run

  # A read request asks for a reading of the history now rather than at the
  # interval, and starts no Apply. The wait counts only the read it asked for.
  - note: Read the history again. There is nothing pending, so nothing runs.
    run: kubectl ptah refresh migration/shipments -n "$NAMESPACE" --wait
    expect:
      exit: 0
      stdout_contains: [Read requested for, reached read]
      resource:
        kind: ptahmigration
        name: shipments
        fields:
          - path: status.history.pendingCount
            equals: "0"
          # The last run is still the one above: the read started no other.
          - path: status.lastRun.jobUID
            sameAs: the-run
