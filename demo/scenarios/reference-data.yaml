id: reference-data
title: Manage reference data
tagline: Rows declared beside the tables that hold them, reconciled through the same plan.
learn: What a declared row set owns, how a change to rows alone reaches the database, and why removing a declaration is not a delete.
start: >-
  An empty database and a namespace with the lab's Secrets, as Stand up the lab leaves them. The rows
  are declared in Go source, which ptah schema push publishes from its directory.
tags: [Lifecycle]

reset:
  - demo/bin/lab reset

steps:
  - note: A declaration names the table, the column that identifies a row, and the file the rows live in.
    run: cat demo/reference/v1/catalog.go
    expect:
      exit: 0
      stdout_contains: ['ptah:schema:data table="regions"', 'key="code"', 'file="regions.yaml"']

  - note: The rows themselves are a list, each one a map from column name to value.
    run: cat demo/reference/v1/regions.yaml
    expect:
      exit: 0
      stdout_contains: [emea, amer]

  # Declared rows travel in the schema artifact, so publishing is the command
  # the other runs use. What differs is the source: --root-dir reads the Go
  # annotations and the files they name, and the rows are covered by the
  # digest, so nothing later reads the author's working copy.
  - note: Publish the directory, and create a resource that names it by digest.
    run: |
      REF=$(ptah schema push "oci://$PTAH_OCI_REGISTRY/schemas/catalog:v1-$$" \
        --root-dir demo/reference/v1 --dialect postgres --plain-http --format reference)
      PULL="oci://$REGISTRY_IN_CLUSTER/${REF#"oci://$PTAH_OCI_REGISTRY/"}"
      kubectl apply -n "$NAMESPACE" -f - <<EOF
      apiVersion: operator.ptah.run/v1alpha1
      kind: PtahSchema
      metadata:
        name: catalog
      spec:
        target:
          engine: PostgreSQL
          coordinationKey: demo/storefront/primary
          urlFrom: {name: demo-database, key: url}
        desired:
          ociRef: $PULL
          registryAuthFrom: {name: demo-registry}
          verificationPolicyFrom: {name: demo-verification-policy, key: policy.yaml}
          transport: {plainHTTP: true}
        policy:
          apply: Always
          allowDestructive: false
          driftSeverity: all
        interval: 1m
      EOF
    sync: publishing
    expect:
      exit: 0
      stdout_contains: [catalog created]

  - note: The tables are created and the declared rows are put in them.
    run: kubectl ptah wait schema/catalog -n "$NAMESPACE" --for in-sync
    sync: converged
    expect:
      exit: 0
      stdout_contains: [reached in-sync]
      resource:
        kind: ptahschema
        name: catalog
        generation: current
        condition:
          type: InSync
          status: "True"
          reason: ScopedConverged

  - note: The declared rows are in the table.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "SELECT code, name FROM regions ORDER BY code"
    expect:
      exit: 0
      stdout_contains: [amer, Americas, emea]

  - note: The child table exists and holds nothing. Its rows come in the next revision.
    # Ptah groups declared rows by table in an order that ignores the dependency
    # order it uses for the tables themselves, so a child row can be offered
    # before the parent row it references (stokaro/ptah#3252). The parent's rows
    # land first, and the child's once they exist.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "SELECT count(*) FROM countries"
    expect:
      exit: 0
      stdout_contains: ["     0\n(1 row)"]

  - note: The second revision adds rows and no column. One marker, nothing else.
    run: diff -u demo/reference/v1/catalog.go demo/reference/v2/catalog.go || true
    expect:
      exit: 0
      stdout_contains: ['+//ptah:schema:data table="countries"']

  # An empty schema diff is no reason to skip the rest: the rows are planned
  # and applied, and under apply Always the wait ends with them in place.
  - note: Publish it, and point the resource at it. The rows are planned and applied.
    run: |
      REF=$(ptah schema push "oci://$PTAH_OCI_REGISTRY/schemas/catalog:v2-$$" \
        --root-dir demo/reference/v2 --dialect postgres --plain-http --format reference)
      kubectl ptah set-source schema/catalog -n "$NAMESPACE" --wait \
        --oci "oci://$REGISTRY_IN_CLUSTER/${REF#"oci://$PTAH_OCI_REGISTRY/"}"
    sync: planning
    expect:
      exit: 0
      stdout_contains: [Source set for, reached in-sync]
      resource:
        kind: ptahschema
        name: catalog
        generation: current
        condition:
          type: InSync
          status: "True"
          reason: ScopedConverged

  - note: The countries are there.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "SELECT code, name FROM countries ORDER BY code"
    sync: converged
    expect:
      exit: 0
      stdout_contains: [CZ, Czech Republic, US, CA]

  - note: "Fault injection: a value edited outside the operator is drift, not a new declaration."
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "UPDATE countries SET name = 'Edited by hand' WHERE code = 'US'"
    sync: drift
    expect:
      exit: 0
      stdout_contains: [UPDATE 1]

  # The schema stays InSync until the operator reads the database again, so
  # this wait counts only a reading that began after it did: the one that
  # finds the edited row, plans the difference and applies it, and the one
  # after that proves the declared value is back.
  - note: The next reading sees it, plans the difference, and the apply puts the declared value back.
    run: kubectl ptah wait schema/catalog -n "$NAMESPACE" --for in-sync
    sync: converged
    expect:
      exit: 0
      stdout_contains: [reached in-sync]
      resource:
        kind: ptahschema
        name: catalog
        condition:
          type: DriftDetected
          status: "False"
          reason: ScopedConverged

  - note: The declared value is back.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "SELECT code, name FROM countries WHERE code = 'US'"
    expect:
      exit: 0
      stdout_contains: [United States]
      stdout_absent: [Edited by hand]

  - note: The third revision removes the declaration on countries and keeps the table.
    run: diff -u demo/reference/v2/catalog.go demo/reference/v3/catalog.go || true
    expect:
      exit: 0
      stdout_contains: ['-//ptah:schema:data table="countries"']

  - note: Publish it, and point the resource at it.
    run: |
      REF=$(ptah schema push "oci://$PTAH_OCI_REGISTRY/schemas/catalog:v3-$$" \
        --root-dir demo/reference/v3 --dialect postgres --plain-http --format reference)
      kubectl ptah set-source schema/catalog -n "$NAMESPACE" --wait \
        --oci "oci://$REGISTRY_IN_CLUSTER/${REF#"oci://$PTAH_OCI_REGISTRY/"}"
    sync: planning
    expect:
      exit: 0
      stdout_contains: [Source set for, reached in-sync]
      resource:
        kind: ptahschema
        name: catalog
        generation: current
        condition:
          type: InSync
          status: "True"
          reason: ScopedConverged

  - note: Ending management is not deleting rows. They stay exactly as they were.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "SELECT code, name FROM countries ORDER BY code"
    sync: converged
    expect:
      exit: 0
      stdout_contains: ["(3 rows)", United States]
