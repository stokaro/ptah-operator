id: stale-approval
title: Retire a stale approval
tagline: An approval names one plan. Change the desired state and it stops applying to anything.
learn: Why an approval cannot be reused, and what the operator does with one that no longer fits.
tags: [Safety]

reset:
  - demo/bin/lab reset
  - demo/bin/lab publish v1 > demo/.lab/digest
  - APPLY=OnApproval demo/bin/lab manifest storefront "$(cat demo/.lab/digest)" | kubectl apply -f -
  - kubectl -n "$NAMESPACE" wait --for=condition=ApprovalRequired --timeout=360s ptahschema/storefront

steps:
  - note: A plan is waiting for a decision.
    run: kubectl -n "$NAMESPACE" get ptahschema storefront -o jsonpath='{.status.phase}{"\n"}{.status.plan.fingerprint}{"\n"}'
    sync: awaiting approval
    expect:
      exit: 0
      stdout_contains: [AwaitingApproval, "sha256:"]

  - note: Approve it, bound to that plan and that fingerprint.
    run: |
      kubectl -n "$NAMESPACE" get ptahschema storefront -o json > demo/.lab/schema.json
      kubectl -n "$NAMESPACE" get ptahschemaplan \
        "$(jq -r .status.plan.name demo/.lab/schema.json)" -o json > demo/.lab/plan.json
      jq -n --slurpfile schema demo/.lab/schema.json --slurpfile plan demo/.lab/plan.json '
        {
          apiVersion: "operator.ptah.dev/v1alpha1", kind: "PtahSchemaApproval",
          metadata: {name: "storefront-v1"},
          spec: {
            schemaRef: {name: $schema[0].metadata.name, uid: $schema[0].metadata.uid},
            planRef:   {name: $plan[0].metadata.name,   uid: $plan[0].metadata.uid},
            planFingerprint: $plan[0].spec.fingerprint
          }
        }' | kubectl -n "$NAMESPACE" create -f -
    sync: approved
    expect:
      exit: 0
      stdout_contains: [created]

  - note: It converges, and the approval is marked used rather than left lying around.
    await:
      kind: ptahschema
      name: storefront
      timeout: 6m
      generation: current
      condition:
        type: InSync
        status: "True"
        reason: ScopedConverged
    run: |
      kubectl -n "$NAMESPACE" get ptahschemaapproval storefront-v1 -o json \
        | jq -r '.status.conditions[] | "\(.type)\t\(.status)\t\(.reason)"'
    sync: converged
    expect:
      exit: 0
      stdout_contains: [Consumed, ApprovedPlan]

  - note: Now someone changes the desired state. The approved plan describes a world that moved.
    run: |
      DIGEST=$(demo/bin/lab publish v2)
      kubectl -n "$NAMESPACE" patch ptahschema storefront --type=merge \
        -p "{\"spec\":{\"desired\":{\"ociRef\":\"oci://$E2E_REGISTRY_HOST/schemas/demo@$DIGEST\"}}}"
    sync: planning
    expect:
      exit: 0
      stdout_contains: [patched]

  - note: A new plan, and the operator waits again. The old approval is not reused.
    await:
      kind: ptahschema
      name: storefront
      timeout: 6m
      generation: current
      condition:
        type: ApprovalRequired
        status: "True"
        reason: AwaitingApproval
    run: |
      kubectl -n "$NAMESPACE" get ptahschema storefront -o json \
        | jq -r '.status.phase, .status.plan.fingerprint'
    sync: awaiting approval
    expect:
      exit: 0
      stdout_contains: [AwaitingApproval]

  - note: The approval says why it no longer applies, by reason and not by prose.
    run: |
      kubectl -n "$NAMESPACE" get ptahschemaapproval storefront-v1 -o json \
        | jq -r '.status.conditions[] | "\(.type)\t\(.status)\t\(.reason)"'
    sync: stale
    expect:
      exit: 0
      stdout_contains: [Stale]
      resource:
        kind: ptahschemaapproval
        name: storefront-v1
        condition:
          type: Stale
          status: "True"
          reason: PlanNoLongerCurrent

  - note: And the change it was never approved for has not run.
    run: demo/bin/lab psql "\d customers"
    expect:
      exit: 0
      stdout_absent: [signed_up_at]
