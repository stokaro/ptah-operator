id: stale-approval
title: Retire a used approval
tagline: An approval describes one plan against one observed state. Applying it moves that state.
learn: Why a signature cannot authorize twice, and what the operator does with one that no longer fits.
start: >-
  Where Approve a plan stops to ask: storefront, from demo/manifests/manual-approval, reading
  schemas/v1.sql from the ConfigMap storefront-v1 under apply OnApproval, with its first plan waiting
  for a decision.
tags: [Safety]

# The same commands as the first steps of manual-approval.
reset:
  - demo/bin/lab reset
  - kubectl -n "$NAMESPACE" create configmap storefront-v1 --from-file=schema.sql=demo/schemas/v1.sql
  - kubectl -n "$NAMESPACE" apply -f demo/manifests/manual-approval/storefront.yaml
  - kubectl -n "$NAMESPACE" wait --for=condition=ApprovalRequired --timeout=360s ptahschema/storefront

steps:
  - note: A plan is waiting for a decision, and nothing has approved it.
    run: kubectl ptah schema storefront -n "$NAMESPACE"
    sync: awaiting approval
    expect:
      exit: 0
      stdout_contains: [AwaitingApproval, not approved]
      resource:
        kind: ptahschema
        name: storefront
        condition:
          type: ApprovalRequired
          status: "True"
          reason: Waiting

  # approve shows the plan with the schema's UID, the plan's UID and its
  # fingerprint, asks, and creates the approval bound to all three. With
  # --wait it stays until the operator has applied that plan and read the
  # database afterwards.
  - note: Approve it. The approval is bound to that schema, that plan and that fingerprint.
    run: kubectl ptah approve schema/storefront -n "$NAMESPACE" --name storefront-v1 --wait
    answers:
      - prompt: "Type yes to approve: "
        type: "yes"
    sync: converged
    expect:
      exit: 0
      stdout_contains: ["Fingerprint:", "Type yes to approve: yes", Approved, reached applied]
      resource:
        kind: ptahschema
        name: storefront
        condition:
          type: InSync
          status: "True"
          reason: ScopedConverged

  # The approval's own conditions, listed with the schema: Consumed says it
  # was the one dispatched, and Stale that the plan it names is not the
  # current one. The apply moved the database it described.
  - note: It was the one dispatched, and it is already stale. It described the database before.
    run: kubectl ptah schema storefront -n "$NAMESPACE"
    sync: stale
    expect:
      exit: 0
      stdout_contains: [storefront-v1, Consumed, DispatchCommitted, Stale, PlanNoLongerCurrent]
      resource:
        kind: ptahschemaapproval
        name: storefront-v1
        condition:
          type: Stale
          status: "True"
          reason: PlanNoLongerCurrent

  # The new SQL goes into a ConfigMap of its own, and the manifest names it:
  # the ConfigMap the first plan was made from stays what it was.
  - note: So it cannot authorize a second time. Change the desired state and see.
    run: |
      kubectl -n "$NAMESPACE" create configmap storefront-v2 --from-file=schema.sql=demo/schemas/v2.sql
      diff -u demo/manifests/manual-approval/storefront.yaml demo/manifests/stale-approval/storefront-v2.yaml
      kubectl -n "$NAMESPACE" apply -f demo/manifests/stale-approval/storefront-v2.yaml
    sync: planning
    expect:
      exit: 0
      stdout_contains: [configmap/storefront-v2 created, "+      name: storefront-v2", storefront configured]

  # Under OnApproval the new plan waits for a person, so the wait ends when it
  # does.
  - note: The operator plans again, and stops again.
    run: kubectl ptah wait schema/storefront -n "$NAMESPACE" --for approval
    expect:
      exit: 0
      stdout_contains: [reached approval]
      resource:
        kind: ptahschema
        name: storefront
        generation: current
        condition:
          type: ApprovalRequired
          status: "True"
          reason: Waiting

  # The approval is still listed, with its conditions, beside a plan it does
  # not name: the spec changed, so the schema no longer reports the plan that
  # ran as its applied one, and the approval's plan is neither.
  - note: A new plan, waiting again. The old approval names a plan that is not the current one.
    run: kubectl ptah schema storefront -n "$NAMESPACE"
    sync: awaiting approval
    expect:
      exit: 0
      stdout_contains: [AwaitingApproval, not approved, storefront-v1, not the current plan]
      resource:
        kind: ptahschemaapproval
        name: storefront-v1
        condition:
          type: Stale
          status: "True"
          reason: PlanNoLongerCurrent

  - note: And the change nobody approved has not run.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "\d customers"
    expect:
      exit: 0
      stdout_absent: [signed_up_at]
