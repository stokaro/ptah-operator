id: suspend-resume
title: Suspend and resume
tagline: One field stops reconciliation without deleting anything, and resuming picks up where it stopped.
learn: How to take a database out of the operator's hands during an incident, and give it back.
tags: [Operations]

reset:
  - demo/bin/lab reset
  # The lab generates the registry's credentials and address, and says what
  # they are. What publishes the artifact is `ptah schema push`, the product's
  # own command, run the way a reader or a CI job runs it.
  - |
    eval "$(demo/bin/lab credentials)"
    export PTAH_OCI_USERNAME PTAH_OCI_PASSWORD PTAH_OCI_REGISTRY
    ptah schema push "oci://$PTAH_OCI_REGISTRY/schemas/demo:v1-$$" \
      --schema-file demo/schemas/v1.sql --dialect postgres --plain-http \
      | sed -n 's/^Digest: //p' > demo/.lab/digest
  - APPLY=Always demo/bin/lab manifest storefront "$(cat demo/.lab/digest)" | kubectl apply -f -
  - kubectl -n "$NAMESPACE" wait --for=condition=InSync --timeout=360s ptahschema/storefront

steps:
  - note: Converged, and reconciliation is active.
    run: |
      kubectl -n "$NAMESPACE" get ptahschema storefront -o json \
        | jq -r '.status.conditions[] | select(.type == "Suspended") | "\(.type)\t\(.status)\t\(.reason)"'
    sync: converged
    expect:
      exit: 0
      stdout_contains: [Suspended, "False", Active]

  - note: Suspend it. One boolean, and the resource stays exactly where it is.
    run: kubectl -n "$NAMESPACE" patch ptahschema storefront --type=merge -p '{"spec":{"suspend":true}}'
    sync: suspended
    expect:
      exit: 0
      stdout_contains: [patched]

  - note: The operator says it is suspended, with the reason on the condition.
    await:
      kind: ptahschema
      name: storefront
      timeout: 3m
      generation: current
      condition:
        type: Suspended
        status: "True"
        reason: Requested
    run: kubectl -n "$NAMESPACE" get ptahschema storefront -o jsonpath='{.status.phase}{"\n"}'
    expect:
      exit: 0
      stdout_contains: [Suspended]

  - note: Now publish a change it would otherwise pick up, and point the resource at it.
    run: |
      eval "$(demo/bin/lab credentials)"
      export PTAH_OCI_USERNAME PTAH_OCI_PASSWORD PTAH_OCI_REGISTRY
      DIGEST=$(ptah schema push "oci://$PTAH_OCI_REGISTRY/schemas/demo:v2-$$" \
        --schema-file demo/schemas/v2.sql --dialect postgres --plain-http \
        | sed -n 's/^Digest: //p')
      kubectl -n "$NAMESPACE" patch ptahschema storefront --type=merge \
        -p "{\"spec\":{\"desired\":{\"ociRef\":\"oci://$REGISTRY_IN_CLUSTER/schemas/demo@$DIGEST\"}}}"
    expect:
      exit: 0
      stdout_contains: [patched]

  - note: Nothing happens, which is the point. The database is untouched.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "\dt"
    expect:
      exit: 0
      stdout_absent: [orders]
      resource:
        kind: ptahschema
        name: storefront
        condition:
          type: Suspended
          status: "True"
          reason: Requested

  - note: Resume, and it starts from what is actually there rather than from what it remembered.
    run: kubectl -n "$NAMESPACE" patch ptahschema storefront --type=merge -p '{"spec":{"suspend":false}}'
    sync: applying
    expect:
      exit: 0
      stdout_contains: [patched]

  - note: It plans against the live database and converges on the revision it was given.
    await:
      kind: ptahschema
      name: storefront
      timeout: 6m
      generation: current
      condition:
        type: InSync
        status: "True"
        reason: ScopedConverged
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "\dt"
    sync: converged
    expect:
      exit: 0
      stdout_contains: [customers, orders]
