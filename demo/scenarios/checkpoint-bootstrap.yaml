id: checkpoint-bootstrap
title: Start a new database from a checkpoint
tagline: A fresh database runs the snapshot and what came after it, and ends up where the long way ends.
learn: What a checkpoint replaces, who selects it, and how the operator proves the shortcut arrived at the same place.
start: >-
  An empty database with no migration history, and a namespace with the lab's Secrets, as Stand up the
  lab leaves them.
tags: [Lifecycle]

reset:
  - demo/bin/lab reset

steps:
  - note: Four versions, each with its down file, and one is not a migration. The name is the contract.
    run: ls demo/migrations-checkpoint
    expect:
      exit: 0
      stdout_contains: [0000000003_snapshot.checkpoint.up.sql, 0000000004_add_delivered_at.up.sql]

  - note: The checkpoint records where migration 2 left the column, not where migration 1 created it.
    run: cat demo/migrations-checkpoint/0000000003_snapshot.checkpoint.up.sql
    expect:
      exit: 0
      stdout_contains: ["carrier TEXT NOT NULL"]

  # The same ptah migrations push the versioned run uses, over a directory that
  # carries a checkpoint. Nothing about publishing changes: what changes is one
  # file's name. Nothing in the resource names the checkpoint either:
  # selecting one is Ptah's job, from the history the database has.
  - note: Publish it, and point a resource at the whole artifact. Nothing in it names the checkpoint.
    run: |
      REF=$(ptah migrations push "oci://$PTAH_OCI_REGISTRY/migrations/demo:ckpt-$$" \
        --migrations-dir demo/migrations-checkpoint --dir-format ptah --version "ckpt-$$" --plain-http --format reference)
      PULL="oci://$REGISTRY_IN_CLUSTER/${REF#"oci://$PTAH_OCI_REGISTRY/"}"
      kubectl apply -n "$NAMESPACE" -f - <<EOF
      apiVersion: operator.ptah.run/v1alpha1
      kind: PtahMigration
      metadata:
        name: shipments
      spec:
        target:
          engine: PostgreSQL
          coordinationKey: demo/storefront/primary
          urlFrom: {name: demo-database, key: url}
        artifact:
          ociRef: $PULL
          registryAuthFrom: {name: demo-registry}
          verificationPolicyFrom: {name: demo-migration-verification-policy, key: policy.yaml}
          transport: {plainHTTP: true}
        policy:
          apply: Always
          lockTimeout: 30s
        interval: 1m
      EOF
    sync: publishing
    expect:
      exit: 0
      stdout_contains: [shipments created]
      resource:
        kind: ptahmigration
        name: shipments
        fields:
          - path: spec.policy.apply
            equals: Always

  - note: Against a database with no history, under apply Always, it runs without waiting for anyone.
    run: kubectl ptah wait migration/shipments -n "$NAMESPACE" --for in-sync
    sync: converged
    expect:
      exit: 0
      stdout_contains: [reached in-sync]
      resource:
        kind: ptahmigration
        name: shipments
        generation: current
        condition:
          type: Ready
          status: "True"
          reason: HistoryMatched

  - note: An empty history let the checkpoint stand in for 1 and 2, and 4 ran after it. Nothing is left.
    run: kubectl ptah migration shipments -n "$NAMESPACE"
    expect:
      exit: 0
      stdout_contains: [InSync, "Current version:      4", "Pending:              0", "Versions:           3, 4",
        "No plan is published."]
      stdout_absent: ["CREATE TABLE", "ALTER TABLE"]

  - note: The table is what replaying all four would have built, down to the constraint.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "\d shipments"
    expect:
      exit: 0
      stdout_contains: [carrier, delivered_at, "not null"]
