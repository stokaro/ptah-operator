id: drift
title: Close the drift
tagline: Someone changes the database by hand. The operator notices and puts it back.
learn: What drift detection reads, and what it does about what it finds.
start: >-
  Where Change the schema ends: storefront converged on schemas/v2.sql, published as an artifact,
  under apply Always, reading the database every minute.
tags: [Operations]

reset:
  - demo/bin/lab reset
  - |
    REF=$(ptah schema push "oci://$PTAH_OCI_REGISTRY/schemas/demo:v2-$$" \
      --schema-file demo/schemas/v2.sql --dialect postgres --plain-http --format reference)
    APPLY=Always demo/bin/lab manifest storefront "${REF##*@}" | kubectl apply -f -
  - kubectl -n "$NAMESPACE" wait --for=condition=InSync --timeout=360s ptahschema/storefront

steps:
  - note: Converged, and the operator says so with a reason and the time it last read the database.
    run: kubectl ptah schema storefront -n "$NAMESPACE"
    sync: converged
    expect:
      exit: 0
      stdout_contains: ["Observed:", "Drift:", ScopedConverged]
      resource:
        kind: ptahschema
        name: storefront
        condition:
          type: DriftDetected
          status: "False"
          reason: ScopedConverged

  - note: "Fault injection: change the database behind the operator's back, the way an incident does."
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "ALTER TABLE customers DROP COLUMN signed_up_at"
    sync: drift
    expect:
      exit: 0
      stdout_contains: [ALTER TABLE]

  - note: The column is gone. The declaration still asks for it.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "\d customers"
    expect:
      exit: 0
      stdout_absent: [signed_up_at]

  # The schema was InSync before the edit and stays InSync until the operator
  # reads the database again, so a wait that accepted the condition as it
  # stands would return at once. This one counts only a reading that began
  # after it did: the one that finds the drift, plans, applies, and reads
  # again to prove the column is back. Nobody asks for that reading; the
  # operator takes it at its interval.
  - note: Nobody is asked. The next reading finds the drift, plans, applies, and reads again.
    run: kubectl ptah wait schema/storefront -n "$NAMESPACE" --for in-sync
    sync: converged
    expect:
      exit: 0
      stdout_contains: [reached in-sync]
      resource:
        kind: ptahschema
        name: storefront
        condition:
          type: DriftDetected
          status: "False"
          reason: ScopedConverged

  - note: The column is back.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "\d customers"
    expect:
      exit: 0
      stdout_contains: [signed_up_at]

  - note: It closed the drift with a plan, the same way it does everything else.
    run: kubectl ptah plan storefront --applied -n "$NAMESPACE" -o sql
    expect:
      exit: 0
      stdout_contains: [ADD COLUMN, signed_up_at]
