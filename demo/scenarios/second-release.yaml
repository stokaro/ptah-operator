id: second-release
title: Ship a second release onto rows that already exist
tagline: A backfill that runs against real data, and a history that says it ran once.
learn: What a release adds when the database already has a history, and how to tell it did not run twice.
start: >-
  An empty database and a namespace with the lab's Secrets. Each release is a ConfigMap of migration
  files and a manifest that selects them, the delivery a team uses when its manifests already carry the
  files; Run a prepared migration sequence shows the same resource reading an artifact.
tags: [Lifecycle]

reset:
  - demo/bin/lab reset

steps:
  - note: The first release carries one migration, and this resource applies it on its own.
    run: |
      kubectl -n "$NAMESPACE" create configmap shipments-release-1 \
        --from-file=demo/migrations/0000000001_create_shipments.up.sql \
        --from-file=demo/migrations/0000000001_create_shipments.down.sql
      kubectl -n "$NAMESPACE" apply -f demo/manifests/second-release/shipments-release-1.yaml
    sync: first release
    expect:
      exit: 0
      stdout_contains: [configmap/shipments-release-1 created, shipments created]

  - note: Under apply Always it runs without waiting for anyone.
    run: kubectl ptah wait migration/shipments -n "$NAMESPACE" --for in-sync
    expect:
      exit: 0
      stdout_contains: [reached in-sync]
      resource:
        kind: ptahmigration
        name: shipments
        generation: current
        condition:
          type: Ready
          status: "True"
          reason: HistoryMatched

  - note: The table exists and the history records version 1.
    run: kubectl ptah migration shipments -n "$NAMESPACE"
    expect:
      exit: 0
      stdout_contains: [InSync, "Current version:      1", "Last run:             Applied"]

  - note: The application writes rows. These are what the next release has to keep.
    run: |
      kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c \
        "INSERT INTO shipments (id, reference) VALUES (1, 'EU-1001'), (2, 'US-2002'), (3, 'EU-1003')"
      kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "SELECT * FROM shipments ORDER BY id"
    expect:
      exit: 0
      stdout_contains: [INSERT 0 3, EU-1001, US-2002, EU-1003, "(3 rows)"]

  - note: The second release keeps migration 1 and adds 2, which fills the new column from each row.
    run: cat demo/migrations/0000000002_add_carrier.up.sql
    expect:
      exit: 0
      stdout_contains: [ADD COLUMN carrier, "UPDATE shipments", "LIKE 'EU-%'", SET NOT NULL]

  # The resource is the same manifest at the next release: another ConfigMap,
  # the files it adds, and apply OnApproval. In an editor it is the same edit.
  - note: Point the resource at the second release, and ask for a decision this time.
    run: |
      diff -u demo/manifests/second-release/shipments-release-1.yaml demo/manifests/second-release/shipments-release-2.yaml
      kubectl -n "$NAMESPACE" create configmap shipments-release-2 --from-file=demo/migrations
      kubectl -n "$NAMESPACE" apply -f demo/manifests/second-release/shipments-release-2.yaml
    sync: second release
    expect:
      exit: 0
      stdout_contains: ["+      name: shipments-release-2", "+    apply: OnApproval", shipments configured]

  - note: The operator reads the history and plans what it does not hold yet.
    run: kubectl ptah wait migration/shipments -n "$NAMESPACE" --for approval
    sync: awaiting approval
    expect:
      exit: 0
      stdout_contains: [reached approval]
      resource:
        kind: ptahmigration
        name: shipments
        generation: current
        condition:
          type: ApprovalRequired
          status: "True"
          reason: AwaitingApproval

  - note: The plan holds only version 2. Version 1 is in the history, so it is not offered again.
    run: kubectl ptah migration shipments -n "$NAMESPACE"
    expect:
      exit: 0
      stdout_contains: ["Pending:              1", "1 migration from version 1", Add Carrier]
      stdout_absent: [Create Shipments]

  - note: Approve that plan. The command shows it again, asks, and waits for the run.
    run: kubectl ptah approve migration/shipments -n "$NAMESPACE" --name shipments-release-2 --wait
    answers:
      - prompt: "Type yes to approve: "
        type: "yes"
    sync: approved
    expect:
      exit: 0
      stdout_contains: ["From version 1", Add Carrier, "Type yes to approve: yes", "Approved: PtahMigrationApproval", reached applied]

  - note: The same three rows, each with a carrier its reference decided.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "SELECT id, reference, carrier FROM shipments ORDER BY id"
    sync: converged
    expect:
      exit: 0
      stdout_contains: ["EU-1001   | dhl", "US-2002   | ups", "EU-1003   | dhl", "(3 rows)"]

  # The Job's name and UID identify the run. The recorder keeps the UID here
  # and compares it after the next read: a transcript prints every UID the
  # same way, so the comparison is the recorder's rather than the reader's.
  - note: The run applied version 2 alone, and the resource names the Job that ran it.
    run: kubectl ptah migration shipments -n "$NAMESPACE"
    expect:
      exit: 0
      stdout_contains: ["Last run:             Applied", "Versions:           2", "Pending:              0"]
      resource:
        kind: ptahmigration
        name: shipments
        condition:
          type: Ready
          status: "True"
          reason: HistoryMatched
        fields:
          - path: status.lastRun.jobUID
            keep: release-2-run

  # A read request asks the operator to read the history now rather than at
  # its interval. It starts no Apply and approves nothing, and the wait counts
  # only the read it asked for.
  - note: Ask for another reading of the history, and wait for it.
    run: kubectl ptah refresh migration/shipments -n "$NAMESPACE" --wait
    expect:
      exit: 0
      stdout_contains: [Read requested for, reached read]

  - note: That reading found nothing pending, and the last run is still the one above.
    run: kubectl ptah migration shipments -n "$NAMESPACE"
    expect:
      exit: 0
      stdout_contains: ["Last run:             Applied", "Versions:           2", "Pending:              0"]
      resource:
        kind: ptahmigration
        name: shipments
        fields:
          - path: status.lastRun.jobUID
            sameAs: release-2-run
          - path: status.history.pendingCount
            equals: "0"
