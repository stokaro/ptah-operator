id: schema-update
title: Change the schema
tagline: A second revision, a new digest, and the difference applied as one plan.
learn: How a change reaches a database, and why the plan is the thing to review.
start: >-
  Where Apply a schema ends: storefront converged on schemas/v1.sql, published as an artifact,
  under apply Always.
tags: [Lifecycle]

reset:
  - demo/bin/lab reset
  # The starting point is first-apply's end. The lab publishes v1 and creates
  # the resource from its template, which is preparation and not published.
  - |
    ptah schema push "oci://$PTAH_OCI_REGISTRY/schemas/demo:v1-$$" \
      --schema-file demo/schemas/v1.sql --dialect postgres --plain-http \
      | sed -n 's/^Digest: //p' > demo/.lab/digest
  - APPLY=Always demo/bin/lab manifest storefront "$(cat demo/.lab/digest)" | kubectl apply -f -
  - kubectl -n "$NAMESPACE" wait --for=condition=InSync --timeout=360s ptahschema/storefront

steps:
  - note: Where it starts -- one table, converged.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "\dt"
    sync: converged
    expect:
      exit: 0
      stdout_contains: [customers]
      stdout_absent: [orders]

  - note: The next revision adds a column and a table that references the first.
    run: diff -u demo/schemas/v1.sql demo/schemas/v2.sql || true
    expect:
      exit: 0
      stdout_contains: ["+  signed_up_at timestamptz", "+CREATE TABLE orders"]

  # set-source changes spec.desired.ociRef and nothing else: the verification
  # policy, the registry credential, the transport and the apply policy stay,
  # and its report names them. --wait stays until the operator has planned
  # from the new reference; under apply Always that plan runs, so the wait
  # ends with the resource in sync from it. The same change in an editor is
  # the ociRef line under spec.desired, through kubectl edit.
  - note: Publish the next revision, and point the same resource at it. One field changes.
    run: |
      DIGEST=$(ptah schema push "oci://$PTAH_OCI_REGISTRY/schemas/demo:v2-$$" \
        --schema-file demo/schemas/v2.sql --dialect postgres --plain-http | sed -n 's/^Digest: //p')
      kubectl ptah set-source schema/storefront -n "$NAMESPACE" --wait \
        --oci "oci://$REGISTRY_IN_CLUSTER/schemas/demo@$DIGEST"
    sync: planning
    expect:
      exit: 0
      stdout_contains: [Source set for, "Kept:", demo-verification-policy, reached in-sync]
      resource:
        kind: ptahschema
        name: storefront
        generation: current
        condition:
          type: InSync
          status: "True"
          reason: ScopedConverged

  - note: The SQL it applied. An ALTER and a CREATE, not a second CREATE TABLE customers.
    # --applied, because a converged schema carries no current plan: there is
    # nothing left to do. The two are different questions, and this scenario is
    # about what ran.
    run: kubectl ptah plan storefront --applied -n "$NAMESPACE" -o sql
    sync: converged
    expect:
      exit: 0
      stdout_contains: ['ALTER TABLE "customers"', 'CREATE TABLE "orders"']

  - note: And the database has both, with the foreign key the declaration asked for.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "\d orders"
    expect:
      exit: 0
      # The constraint by what it does, not by the name the renderer chose.
      stdout_contains: ["FOREIGN KEY (customer_id) REFERENCES customers"]
      resource:
        kind: ptahschema
        name: storefront
        fields:
          - path: status.applied.artifactDigest
            notEmpty: true
