id: adopt-existing-database
title: Adopt a database that already has a schema
tagline: Record the history a database already earned, and let the operator carry on from there.
learn: How baseline proves a database matches its migrations before recording anything, and what it refuses.
start: >-
  A database an application created before Ptah: a shipments table with three rows, the state
  migration 1 produces, and no record that it ran. The lab inserted them as setup. Beside it, an empty
  PostgreSQL the lab stood up as the shadow baseline replays into, with its URL in the Secret
  demo-shadow-database.
tags: [Lifecycle]

reset:
  - demo/bin/lab reset
  # Setup, not part of the lesson: the table and the rows an application
  # created before Ptah was in the picture, with nothing recording that
  # migration 1 ran.
  - |
    kubectl -n "$(demo/bin/lab namespace)" exec deploy/demo-psql -- psql -qc \
      "CREATE TABLE shipments (id INTEGER PRIMARY KEY, reference TEXT NOT NULL);
       INSERT INTO shipments VALUES (1, 'EU-1001'), (2, 'US-2002'), (3, 'EU-1003')"

steps:
  - note: This database already has a shipments table and three rows. An application put them there.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "SELECT * FROM shipments ORDER BY id"
    expect:
      exit: 0
      stdout_contains: [EU-1001, US-2002, EU-1003, "(3 rows)"]

  - note: It has no Ptah history. There is no revision table at all.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "\dt"
    expect:
      exit: 0
      stdout_contains: [shipments]
      stdout_absent: [schema_migrations]

  - note: The sequence the operator will run holds two migrations, in these files.
    run: ls demo/migrations
    expect:
      exit: 0
      stdout_contains: [0000000001_create_shipments.up.sql, 0000000002_add_carrier.up.sql]

  # Baseline and the resource read the same files, so what baseline proves is
  # about the files the operator runs.
  - note: Hand the files to the cluster. Baseline reads them, and so will the resource.
    run: kubectl -n "$NAMESPACE" create configmap shipments-migrations --from-file=demo/migrations
    sync: baseline
    expect:
      exit: 0
      stdout_contains: [configmap/shipments-migrations created]

  # The database is reachable from the cluster and not from this machine, so
  # baseline runs there, as a Job with the executor image the operator runs.
  - note: Baseline runs in the cluster. The target, a disposable shadow, and the version to record up to.
    run: cat demo/manifests/adopt-existing-database/baseline-v2.yaml
    expect:
      exit: 0
      stdout_contains: [migrations, baseline, PTAH_DB_URL, PTAH_SHADOW_DB, "--version=2"]

  # kubectl set image puts the executor image in place of the name the file
  # carries, and prints the Job without sending it; apply sends it.
  - note: Run it through version 2.
    run: |
      kubectl set image --local -f demo/manifests/adopt-existing-database/baseline-v2.yaml \
        baseline="$EXECUTOR_IMAGE" -o yaml | kubectl -n "$NAMESPACE" apply -f -
    expect:
      exit: 0
      stdout_contains: [job.batch/baseline-v2 created]

  # The log is baseline replaying the files into the shadow, then its verdict:
  # the migrations it says it applied ran in the shadow, not in the target.
  - note: Refused. Replayed into the shadow, the files make a carrier column this database lacks.
    run: |
      kubectl -n "$NAMESPACE" wait --for=condition=Failed job/baseline-v2 --timeout=3m
      kubectl -n "$NAMESPACE" logs job/baseline-v2
    expect:
      exit: 0
      # The engine names the column; the check and the column are what the
      # step is about.
      stdout_contains: [condition met, "baseline shadow check failed", "missing column", "carrier"]

  - note: A refused baseline records nothing. There is still no revision table.
    run: kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "\dt"
    expect:
      exit: 0
      stdout_absent: [schema_migrations]

  - note: The database is at release 1, so baseline through version 1. The name and version change.
    run: |
      diff -u demo/manifests/adopt-existing-database/baseline-v2.yaml demo/manifests/adopt-existing-database/baseline-v1.yaml
      kubectl set image --local -f demo/manifests/adopt-existing-database/baseline-v1.yaml \
        baseline="$EXECUTOR_IMAGE" -o yaml | kubectl -n "$NAMESPACE" apply -f -
    expect:
      exit: 0
      stdout_contains: ["+  name: baseline-v1", "+            - --version=1", job.batch/baseline-v1 created]

  - note: The replay matches this time, so it records version 1, and says so.
    run: |
      kubectl -n "$NAMESPACE" wait --for=condition=Complete job/baseline-v1 --timeout=3m
      kubectl -n "$NAMESPACE" logs job/baseline-v1
    sync: baselined
    expect:
      exit: 0
      stdout_contains: [condition met, "Baselined 1 migration(s) through version 1"]

  - note: The history records version 1, and the rows are the rows it had.
    run: |
      kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "SELECT version, state FROM schema_migrations ORDER BY version"
      kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "SELECT * FROM shipments ORDER BY id"
    expect:
      exit: 0
      stdout_contains: [applied, "(1 row)", EU-1001, US-2002, EU-1003, "(3 rows)"]

  # Created after baseline, never before: a resource that existed during
  # adoption could have an approved plan dispatch the whole sequence against
  # a database that already has the schema.
  - note: Now the resource, which reads the same ConfigMap. It asks for a person.
    run: |
      cat demo/manifests/adopt-existing-database/shipments.yaml
      kubectl -n "$NAMESPACE" apply -f demo/manifests/adopt-existing-database/shipments.yaml
    sync: adopted
    expect:
      exit: 0
      stdout_contains: ["apply: OnApproval", "name: shipments-migrations", shipments created]

  - note: It reads the history, and plans what the history does not hold.
    run: kubectl ptah wait migration/shipments -n "$NAMESPACE" --for approval
    expect:
      exit: 0
      stdout_contains: [reached approval]
      resource:
        kind: ptahmigration
        name: shipments
        generation: current
        condition:
          type: ApprovalRequired
          status: "True"
          reason: AwaitingApproval

  - note: Version 1 is history, so it is not offered. The plan is version 2 alone.
    run: kubectl ptah migration shipments -n "$NAMESPACE"
    expect:
      exit: 0
      stdout_contains: ["Current version:      1", "1 migration from version 1", Add Carrier]
      stdout_absent: [Create Shipments]

  - note: Approve it. The command shows the plan again, asks, and waits for the run.
    run: kubectl ptah approve migration/shipments -n "$NAMESPACE" --name shipments-adopted --wait
    answers:
      - prompt: "Type yes to approve: "
        type: "yes"
    sync: approved
    expect:
      exit: 0
      stdout_contains: ["From version 1", Add Carrier, "Type yes to approve: yes", "Approved: PtahMigrationApproval", reached applied]
      resource:
        kind: ptahmigration
        name: shipments
        fields:
          - path: status.lastRun.outcome
            equals: Applied

  - note: Version 2 ran on the rows the application wrote, and the history carries on from there.
    run: |
      kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "SELECT version, state FROM schema_migrations ORDER BY version"
      kubectl -n "$NAMESPACE" exec deploy/demo-psql -- psql -c "SELECT id, reference, carrier FROM shipments ORDER BY id"
    sync: converged
    expect:
      exit: 0
      stdout_contains: ["(2 rows)", "EU-1001   | dhl", "US-2002   | ups", "EU-1003   | dhl"]
